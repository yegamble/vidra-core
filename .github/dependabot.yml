version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Covers docker-compose.yml, including the digest-pinned `rtmp` ingest
  # (alfg/nginx-rtmp). The tag is kept beside the digest there precisely so this
  # ecosystem can follow it — a bare `repo@sha256:...` has nothing to bump, and
  # an unpinned `:latest` on a launch-required component is a silent change
  # under a running instance.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # otel publishes per-architecture tags (0.162.0-386 is the i386 image).
      # Dependabot reads the "-386" suffix as a newer version than 0.162.0 and
      # proposed it in #435, which would run a 32-bit x86 collector. Ignore
      # that exact tag only; the collector itself still gets updates.
      - dependency-name: "otel/opentelemetry-collector-contrib"
        versions: ["0.162.0-386"]
