name: ipfs-integration

# REQUIRED lane: the LOCAL-kubo half of the `-tags=ipfs_integration` proofs,
# against a REAL ipfs/kubo node brought up by this repo's own compose file. It
# exercises the actual Kubo RPC add→pin→cat round trip and a directory
# (HLS-tree) add resolved through the node's HTTP gateway — coverage the fast
# `make ci` gate (unit tests against FakeIPFSClient) deliberately does not have.
#
# The third proof in that build tag, TestIntegrationPublicVideoRoundTrip, is NOT
# here (A39): it fetches a fresh CID back through an INDEPENDENTLY OPERATED
# public gateway with a five-minute budget. That is a real and valuable proof of
# provider reachability, but a third party's availability must not decide whether
# a pull request can merge — it made this lane the flakiest required check in the
# repo. It moved to ipfs-public-gateway.yml, which runs on a schedule and on
# demand, with IPFS_PUBLIC_PROOFS_REQUIRED set so it cannot pass by skipping.
#
# Kept SEPARATE from backend-ci.yml on purpose: the canonical `make ci` gate must
# stay fast and runnable on hosts WITHOUT a kubo node, so these tests live behind
# their own `ipfs_integration` build tag + make target + this job. Each test
# self-skips when IPFS_TEST_API_URL is unset, so the target is safe to run
# locally — and this lane asserts, over its own verbose log, that none of them
# actually did.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipfs-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # Start in the safe default first, then transition the SAME persisted repo
      # to live mode. This catches peerstore/config residue that a fresh live-only
      # container would miss.
      - name: Bring up Kubo in local-only mode
        run: docker compose --profile ipfs up -d ipfs

      - name: Assert local-only node configuration
        run: |
          set -eux
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{ .State.Health.Status }}' "$(docker compose ps -q ipfs)" 2>/dev/null || echo starting)
            if [ "$health" = healthy ]; then break; fi
            sleep 3
          done
          test "$(docker inspect -f '{{ .State.Health.Status }}' "$(docker compose ps -q ipfs)")" = healthy
          test -z "$(docker compose exec -T ipfs ipfs bootstrap list)"
          test -z "$(docker compose exec -T ipfs ipfs swarm peers)"
          test "$(docker compose exec -T ipfs ipfs config AutoConf.Enabled)" = false
          test "$(docker compose exec -T ipfs ipfs config Routing.Type)" = none
          test "$(docker compose exec -T ipfs ipfs config Provide.Enabled)" = false
          test "$(docker compose exec -T ipfs ipfs config Swarm.RelayClient.Enabled)" = false
          filters=$(docker compose exec -T ipfs ipfs config --json Swarm.AddrFilters)
          case "$filters" in *'/ip4/0.0.0.0/ipcidr/0'*) ;; *) exit 1 ;; esac

      # Use the repository's actual compose service + init hook so CI proves the
      # IPFS_PUBLIC_NETWORK transition operators run, including DHT providing and
      # NAT traversal.
      - name: Transition Kubo to live public mode
        env:
          IPFS_PUBLIC_NETWORK: "true"
        run: docker compose --profile ipfs up -d --force-recreate ipfs

      - name: Assert live-mode node configuration
        run: |
          set -eux
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{ .State.Health.Status }}' "$(docker compose ps -q ipfs)" 2>/dev/null || echo starting)
            if [ "$health" = healthy ]; then break; fi
            sleep 3
          done
          test "$(docker inspect -f '{{ .State.Health.Status }}' "$(docker compose ps -q ipfs)")" = healthy
          test -n "$(docker compose exec -T ipfs ipfs bootstrap list)"
          test "$(docker compose exec -T ipfs ipfs config Provide.Enabled)" = true
          test "$(docker compose exec -T ipfs ipfs config AutoConf.Enabled)" = true
          test "$(docker compose exec -T ipfs ipfs config Swarm.RelayClient.Enabled)" = true
          test "$(docker compose exec -T ipfs ipfs config Swarm.EnableHolePunching)" = true
          filters=$(docker compose exec -T ipfs ipfs config --json Swarm.AddrFilters)
          case "$filters" in *'/ip4/0.0.0.0/ipcidr/0'*) exit 1 ;; *) ;; esac

      - name: Run the local-kubo IPFS proofs (make test-ipfs-integration-local)
        env:
          # Point the tests at the kubo service above so they execute (and can fail
          # the job) instead of self-skipping. No public-gateway variables here:
          # the -run selection excludes that proof entirely, so it cannot even be
          # reached, let alone skipped.
          IPFS_TEST_API_URL: http://localhost:5001
          IPFS_TEST_GATEWAY_URL: http://localhost:9090
        run: |
          mkdir -p ci-report
          set -o pipefail
          make test-ipfs-integration-local 2>&1 | tee ci-report/ipfs-local.log

      - name: No silent skips in the local IPFS proofs
        # Empty allowlist: nothing here is allowed to skip. If the kubo node is
        # not reachable the tests must fail, not quietly pass.
        run: bash scripts/ci/assert-no-silent-skips.sh ci-report/ipfs-local.log scripts/ci/allowed-skips-none.txt

      - name: Collect kubo logs
        if: always()
        run: |
          mkdir -p ci-report
          docker compose --profile ipfs logs --no-color ipfs > ci-report/kubo.log 2>&1 || true

      - name: Upload IPFS lane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-ipfs-local-log
          path: ci-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Tear down
        if: always()
        run: docker compose --profile ipfs down -v
