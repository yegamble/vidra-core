name: schema-compat

# Executable proof of the one-release schema-compat policy (documented in the
# vidra meta repo, deploy/README.md, "Release policy: schema changes stay
# backward-compatible for one release"):
# release N-1's CODE must keep running against release N's SCHEMA. That property
# is the whole reason `rollback.sh` is a DB-untouched tag flip instead of a
# restore-from-backup, so it is enforced here rather than trusted.
#
# WHAT THIS PROVES: HEAD's migrations are applied to a fresh database, then the
# PREVIOUS RELEASE TAG's tree runs its own integration suite against that
# already-migrated database. sqlc emits explicit column lists, so a column this
# PR drops, renames, narrows, or makes NOT NULL fails N-1's store tests hard —
# exactly the breakage an operator would hit mid-rollback.
#
# BLIND SPOT: this only checks the FIRST half of a two-release drop cycle. It
# cannot verify that writes to a column were actually stopped one release
# earlier, because it never runs N-1 code against N-1 schema with N-1 traffic —
# it proves N-1 still READS/WRITES fine, not that release N-1 had already
# stopped depending on whatever release N removes. Staged drops still need the
# reviewer to confirm the write path went away in the prior release.
#
# SECOND BLIND SPOT, found by A38's rehearsal on 2026-09-07 and closed
# elsewhere: this lane runs N-1's TESTS, never N-1's MIGRATOR — which is the
# process `deploy/rollback.sh` actually starts first, and the one that used to
# die on a ledger newer than anything it embeds, taking the site down. That is
# rollback-floor.yml's job. The two are complementary and deliberately separate:
# this one is expensive and path-filtered to migrations/, that one is cheap and
# also watches internal/dbmigrate/.
#
# `make migrate-lint` (in the canonical `make ci` gate) is the cheap static half
# of the same policy; this job is the expensive dynamic half, so it is
# path-filtered to migration changes only.
on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/schema-compat.yml"
  pull_request:
    paths:
      - "migrations/**"
      - ".github/workflows/schema-compat.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prev-release-against-new-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same service matrix as backend-integration.yml so the N-1 tree can run its
    # FULL `make test-integration` with nothing silently self-skipping. Versions
    # are the ones production runs (docker-compose.yml pins postgres:18-alpine /
    # redis:8-alpine) — do NOT copy the stale 16/7 blocks from the other
    # workflows; a rollback proof on the wrong major proves the wrong thing.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vidra
          POSTGRES_PASSWORD: vidra
          POSTGRES_DB: vidra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Mirrors backend-integration.yml: without clamd the EICAR tests self-skip,
      # and a suite that skips proves nothing. See that workflow for why the
      # non-"_base" tag + CLAMAV_NO_FRESHCLAM keeps startup fast and offline.
      clamav:
        image: clamav/clamav:1.5
        env:
          CLAMAV_NO_FRESHCLAM: "true"
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s

    steps:
      # Full history + tags: the job has to check out the previous release tag,
      # which a shallow default clone does not carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: go.sum

      # The N-1 media integration tests shell out to the real binary, same as
      # backend-integration.yml.
      - name: Install ffmpeg (media integration tests use the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # `sort -V` is GNU coreutils, present on ubuntu-latest runners.
      - name: Resolve the previous release tag (N-1)
        id: prev
        run: |
          if [ -z "$(git tag -l 'v*')" ]; then
            # Defensive: public repo, so an unauthenticated re-fetch is fine if
            # checkout's fetch-tags ever stops delivering them.
            git fetch --tags --force origin || true
          fi
          prev=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -z "$prev" ]; then
            echo "::error::no v* release tag found — schema compat is measured against the previous RELEASE, so this job cannot prove anything without one." >&2
            exit 1
          fi
          echo "previous release tag: $prev ($(git rev-parse --short "$prev"))"
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      # Runs from the HEAD checkout on purpose: the database must carry THIS
      # branch's schema. Embedded-migration path (`api migrate up`), same as the
      # published image — no golang-migrate CLI to keep pinned in lock-step.
      - name: Apply HEAD migrations to a fresh database (the N schema)
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
        run: go run ./cmd/api migrate up

      - name: Check out the previous release into a worktree
        run: git worktree add ../n-1 "${{ steps.prev.outputs.tag }}"

      # The actual proof. No `migrate up` here — the N-1 tree deliberately runs
      # against the schema the step above left behind. Every service the N-1
      # suite knows about is provided, and DATABASE_URL is set, so nothing
      # self-skips its way to a false green.
      #
      # A green suite is still the only unqualified pass. The one qualification —
      # a TIGHTENING, which cannot satisfy an additive-only policy by
      # construction — goes through the same shape rollback-floor.yml already
      # uses for its own known break: a CAPABILITY PROBE of the N-1 tree decides
      # whether the accepted-break register applies at all, and
      # scripts/ci/assert-prev-release-failures.sh does the asserting. An
      # unregistered failure is still a hard failure, a registered one that
      # passed is a hard failure, and the whole arrangement self-clears the
      # moment N-1 carries the migration.
      #
      # The probe is the MIGRATION, not a version string: a tag comparison would
      # need editing on every release and would lie on a backport.
      - name: Run the previous release's integration suite against the new schema
        working-directory: ${{ github.workspace }}/../n-1
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          CLAMAV_TEST_ADDR: localhost:3310
        run: |
          set -euo pipefail
          rc=0
          make test-integration 2>&1 | tee /tmp/prev-release.log || rc=${PIPESTATUS[0]}

          if ls migrations/*actor_handles* >/dev/null 2>&1 \
             || grep -rqs 'actor_handles' migrations/; then
            # N-1 carries migration 0142, so it shares the handle namespace and
            # the accepted break cannot apply. Nothing is tolerated here.
            if [ "$rc" -ne 0 ]; then
              echo "::error::${{ steps.prev.outputs.tag }} carries the one-handle-namespace migration, so its suite must pass against this schema with no expectations. Delete the stale entries in scripts/ci/expected-prev-release-failures.txt only after reading the failures above." >&2
              exit 1
            fi
            echo "::notice::${{ steps.prev.outputs.tag }} carries migration 0142 — the accepted-break register does not apply, and the suite passed clean."
            exit 0
          fi

          if [ "$rc" -eq 0 ]; then
            echo "::error::${{ steps.prev.outputs.tag }} predates migration 0142 but its suite PASSED — the probe above is wrong, or the register in scripts/ci/expected-prev-release-failures.txt is stale. Fix that before trusting this lane." >&2
            exit 1
          fi

          echo "::notice::${{ steps.prev.outputs.tag }} predates migration 0142 (one handle namespace, A29 parity), an ACCEPTED tightening. Auditing which tests failed against the written register."
          "${{ github.workspace }}/scripts/ci/assert-prev-release-failures.sh" \
            /tmp/prev-release.log \
            "${{ github.workspace }}/scripts/ci/expected-prev-release-failures.txt"

      # The log is the evidence for the audit above, and for anyone re-reading a
      # tolerated break months later.
      - name: Upload the previous release's integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prev-release-integration-log
          path: /tmp/prev-release.log
          retention-days: 14
          if-no-files-found: ignore
