name: backend-ci

# Standalone vidra-core repo: the project lives at the repo root, so this builds
# and tests directly (no working-directory / path filters — that scoping was only
# needed while core was a subdirectory of the vidra monorepo).
#
# Local/CI parity: run the SAME canonical gate developers run locally
# (`make ci` = fmt-check + vet + openapi-verify + test-race). Do not add checks
# here that aren't in `make ci`, or the two will drift (ci-guard.yml enforces this).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vidra
          POSTGRES_PASSWORD: vidra
          POSTGRES_DB: vidra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      # Pinned to the Makefile's SQLC_VERSION so `make ci`'s sqlc-verify takes
      # the fast binary path instead of compiling sqlc via `go run` each run.
      - name: Install sqlc (used by make ci's sqlc-verify)
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin sqlc

      # Applies the migrations EMBEDDED in the api binary (migrations/embed.go) via
      # its `migrate up` subcommand — the exact code path the published image runs
      # in production. That is why no golang-migrate CLI is downloaded here any
      # more: a separately pinned CLI could (and did) drift from the library
      # version the binary links against.
      - name: Run migrations against fresh database
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
        run: go run ./cmd/api migrate up

      - name: Run canonical gate (make ci)
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: make ci
