name: backend-integration

# Runs the integration-tagged backend tests (`-tags=integration`) against REAL
# Postgres + Redis + ffmpeg. These exercise the actual sqlc SQL, the Redis
# rate-limiter/dedupe, and the ffprobe/thumbnail media paths — coverage the fast
# `make ci` gate (unit tests against in-memory fakes) deliberately does not have.
#
# Kept SEPARATE from backend-ci.yml on purpose: the canonical `make ci` gate must
# stay fast and runnable on hosts without a DB/ffmpeg, so integration tests live
# behind their own `make test-integration` target + this job. Each integration
# test self-skips when its dependency is absent, so `make test-integration` is
# safe locally too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vidra
          POSTGRES_PASSWORD: vidra
          POSTGRES_DB: vidra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real clamd for the EICAR virus-scan integration tests
      # (internal/media/clamav_integration_test.go +
      # internal/messaging/eicar_integration_test.go). Without this service they
      # self-skip because CLAMAV_TEST_ADDR is unset; with it they scan the real
      # daemon and fail loudly on a regression.
      clamav:
        # Non-"_base" tag: the signature databases are baked into the image, so
        # clamd loads them from disk and needs NO network download to become
        # ready. Combined with CLAMAV_NO_FRESHCLAM below this makes startup fast
        # and reliable in CI (no dependency on the freshclam mirror). clamd holds
        # the whole DB resident (~1.5-2 GiB RAM), which the runner has.
        image: clamav/clamav:1.5
        env:
          # Skip the freshclam signature-DB update on boot. The bundled DB is
          # enough to detect EICAR, and a live download would add a slow, flaky
          # network dependency to every CI run. clamd starts on the baked-in DB.
          CLAMAV_NO_FRESHCLAM: "true"
        ports:
          - 3310:3310
        # clamdcheck.sh (shipped in the image) pings clamd and only succeeds once
        # the daemon has loaded its databases and accepts connections. Generous
        # budget: clamd is typically ready in well under a minute on an amd64
        # runner, but loading the full signature DB into RAM is allowed up to
        # ~5 min of retries after a 60s grace period before the job fails.
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Install ffmpeg (media integration tests use the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Real S3-compatible object storage for the six `//go:build integration`
      # files that need a live bucket: internal/storage/s3_integration_test.go,
      # internal/httpapi/delivery_integration_test.go,
      # internal/mediagc/service_integration_test.go,
      # internal/storagemigration/migration_integration_test.go,
      # cmd/api/verify_blobs_integration_test.go and
      # cmd/api/bucket_ownership_integration_test.go. Without it every one of
      # them self-skips on an unset S3_TEST_ENDPOINT, so the S3 storage layer,
      # the 307 direct-delivery path, media GC against a bucket, storage
      # migration, bucket ownership and blob verification are unexercised by
      # automation while production runs S3 — the same silence the clamav service
      # above exists to end. With it they run and fail loudly on a regression.
      #
      # Started as a STEP and not a `services:` container because minio needs the
      # argument `server /data`, and a services block can set an image, env,
      # ports and a healthcheck but cannot pass a command.
      #
      # Mirrors the `minio` service in docker-compose.yml: same image pin, same
      # dev-only credentials, same port, same readiness probe. THE TWO IMAGE PINS
      # MUST BE BUMPED TOGETHER — a CI that tests a different MinIO release from
      # the one the dev stack runs is testing something nobody deploys against.
      # The test helpers default to exactly these credentials and call
      # EnsureBucket themselves, so there is nothing to seed.
      - name: Start MinIO (the S3 integration tests need a real bucket)
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=vidra \
            -e MINIO_ROOT_PASSWORD=vidra-dev-secret \
            --health-cmd "mc ready local" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 10 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      # Embedded-migration path (`api migrate up`), same as the published image —
      # no golang-migrate CLI download, nothing to keep pinned in lock-step.
      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
        run: go run ./cmd/api migrate up

      # A `services:` container is health-gated by the runner before any step
      # runs; a hand-started one is not, so wait for it here. Migrations ran in
      # the step above while MinIO was booting, so this is usually instant — and
      # if MinIO never comes up the job fails HERE, with its logs, instead of
      # quietly running the whole suite with six packages skipped.
      - name: Wait for MinIO to report healthy
        run: |
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' minio)" = "healthy" ]; then
              echo "minio is ready"
              exit 0
            fi
            sleep 2
          done
          echo "minio did not become healthy within 120s" >&2
          docker logs minio >&2
          exit 1

      - name: Run integration tests (make test-integration)
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          # Points the EICAR real-clamd tests at the clamav service above so they
          # execute (and can fail the job) instead of self-skipping.
          CLAMAV_TEST_ADDR: localhost:3310
          # Points the six S3 integration files at the MinIO started above so
          # they execute (and can fail the job) instead of self-skipping. The
          # bucket (vidra-test) and credentials are the helpers' own defaults.
          S3_TEST_ENDPOINT: localhost:9000
        run: make test-integration
