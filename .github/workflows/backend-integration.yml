name: backend-integration

# Runs the integration-tagged backend tests (`-tags=integration`) against REAL
# Postgres + Redis + ffmpeg. These exercise the actual sqlc SQL, the Redis
# rate-limiter/dedupe, and the ffprobe/thumbnail media paths — coverage the fast
# `make ci` gate (unit tests against in-memory fakes) deliberately does not have.
#
# Kept SEPARATE from backend-ci.yml on purpose: the canonical `make ci` gate must
# stay fast and runnable on hosts without a DB/ffmpeg, so integration tests live
# behind their own `make test-integration` target + this job. Each integration
# test self-skips when its dependency is absent, so `make test-integration` is
# safe locally too.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vidra
          POSTGRES_PASSWORD: vidra
          POSTGRES_DB: vidra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidra"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Real clamd for the EICAR virus-scan integration tests
      # (internal/media/clamav_integration_test.go +
      # internal/messaging/eicar_integration_test.go). Without this service they
      # self-skip because CLAMAV_TEST_ADDR is unset; with it they scan the real
      # daemon and fail loudly on a regression.
      clamav:
        # Non-"_base" tag: the signature databases are baked into the image, so
        # clamd loads them from disk and needs NO network download to become
        # ready. Combined with CLAMAV_NO_FRESHCLAM below this makes startup fast
        # and reliable in CI (no dependency on the freshclam mirror). clamd holds
        # the whole DB resident (~1.5-2 GiB RAM), which the runner has.
        image: clamav/clamav:1.5
        env:
          # Skip the freshclam signature-DB update on boot. The bundled DB is
          # enough to detect EICAR, and a live download would add a slow, flaky
          # network dependency to every CI run. clamd starts on the baked-in DB.
          CLAMAV_NO_FRESHCLAM: "true"
        ports:
          - 3310:3310
        # clamdcheck.sh (shipped in the image) pings clamd and only succeeds once
        # the daemon has loaded its databases and accepts connections. Generous
        # budget: clamd is typically ready in well under a minute on an amd64
        # runner, but loading the full signature DB into RAM is allowed up to
        # ~5 min of retries after a 60s grace period before the job fails.
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Install ffmpeg (media integration tests use the real binary)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install migrate CLI
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.17.1/migrate.linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin migrate

      - name: Run migrations against a fresh database
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run integration tests (make test-integration)
        env:
          DATABASE_URL: postgres://vidra:vidra@localhost:5432/vidra?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          # Points the EICAR real-clamd tests at the clamav service above so they
          # execute (and can fail the job) instead of self-skipping.
          CLAMAV_TEST_ADDR: localhost:3310
        run: make test-integration
