        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown document name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: putInstanceDocument
      summary: Set or clear an instance document (admin)
      description: >-
        Stores an instance document body (homepage max 100KB; custom_css and
        custom_js max 200KB) or clears it with an empty body — the public
        delivery routes 404 while a document is unset. Changes take effect
        immediately (the in-memory cache reloads) and the new content hash
        shows in the GET /api/v1/instance customization/homepage blocks for
        cache busting. Restricted to admins; every write is audited
        (admin.instance_document.update with the document name + content hash,
        never the body). Custom JS runs in every visitor's browser — clients
        must gate the editor behind an explicit warning flow.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [homepage, custom_css, custom_js]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceDocumentRequest"
      responses:
        "200":
          description: The stored (or cleared) document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDocumentResponse"
        "400":
          description: Malformed request body (the body field is required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown document name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The body exceeds the document's size cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
