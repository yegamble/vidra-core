# Vidra Core — OpenAPI contract (source of truth for the HTTP API).
#
# DRIFT STOP GUARD: this file MUST stay in lock-step with the routes registered
# in internal/httpapi. The TestOpenAPIContract test (internal/httpapi) fails the
# build when a route is added, removed, or renamed without a matching edit here,
# and the openapi.yml GitHub Actions workflow lints this file on every change.
#
# Editing rules for the drift guard's parser:
#   - `paths:` at column 0.
#   - each path item key indented 2 spaces (e.g. `  /healthz:`).
#   - each operation (get/post/put/patch/delete) indented 4 spaces.
# Keep that shape so the contract test can compare declared paths against the
# live Echo router. When you add an endpoint in code, document it here in the
# same change; when you remove one, delete its entry here in the same change.
openapi: 3.1.0
info:
  title: Vidra Core API
  version: 0.1.0
  description: >-
    HTTP API for Vidra — a clean-room, PeerTube-inspired federated video
    platform. This document is the authoritative contract consumed by the
    vidra-user frontend and validated in CI.
servers:
  - url: http://localhost:8080
    description: Local development
# Public by default: most read endpoints require no auth. Protected operations
# override this with `security: [{ bearerAuth: [] }]`. Declaring an empty default
# makes every operation's auth posture explicit (satisfies the security-defined rule).
security: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is up. Performs no dependency checks.
      tags: [system]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Reports whether all critical dependencies (PostgreSQL, Redis) are
        reachable. Returns 503 when any configured dependency is unhealthy.
      tags: [system]
      responses:
        "200":
          description: All configured dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one configured dependency is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /version:
    get:
      operationId: getVersion
      summary: Build version metadata
      description: >-
        Reports the running build's version, git commit, build date, and Go
        toolchain. Exposes build information only — never secrets or config.
      tags: [system]
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/nodeinfo:
    get:
      operationId: getNodeInfo
      summary: Instance discovery metadata
      description: Minimal NodeInfo-style document describing this instance.
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfoResponse"
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Public instance about/config
      description: >-
        Public "about this instance" document the frontend app shell reads on
        load: instance name, software, and whether public registration is open.
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceResponse"
  /api/v1/instance/about:
    get:
      operationId: getInstanceAbout
      summary: Public instance about-page document
      description: >-
        The operator-authored long-form texts behind the /about page: the
        instance description plus the terms, code of conduct, moderation and
        administrator information, the PeerTube-style "you and your platform"
        answers, hardware info, and the support text. Every field is RAW
        markdown ("" when unset); rendering/sanitisation is the client's job.
        Public, unauthenticated.
      tags: [system]
      responses:
        "200":
          description: The about-page document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceAboutResponse"
  /api/v1/instance/contact:
    post:
      operationId: contactInstance
      summary: Send a contact-form message to the instance operator
      description: >-
        Delivers a visitor message to the instance's effective contact email.
        Public, unauthenticated, and throttled hard: a dedicated fixed-window
        limiter allows 1 request per IP per hour (independent of the general
        API budget). Available only while the EFFECTIVE contact_form_enabled
        (see GET /api/v1/instance) is true — the admin toggle is on, a contact
        email is configured, and the deployment has an outbound mail path;
        otherwise the endpoint answers 409 contact_form_disabled. The message
        and the addresses are never logged.
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceContactRequest"
      responses:
        "202":
          description: Message accepted for delivery to the operator.
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The contact form is not available (code contact_form_disabled):
            the toggle is off, no contact email is set, or mail is not
            configured on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (field errors on from_name/from_email/subject/body).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Contact budget exhausted (1 request per IP per hour); Retry-After is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/homepage:
    get:
      operationId: getInstanceHomepage
      summary: Public admin-authored homepage document
      description: >-
        The operator-authored homepage document as RAW markdown plus its
        content hash (config-parity W1). Rendering/sanitisation is the
        client's job. Public, unauthenticated; 404 while no homepage is set
        (see the homepage block on GET /api/v1/instance for the enabled flag).
      tags: [system]
      responses:
        "200":
          description: The homepage document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceHomepageResponse"
        "404":
          description: No homepage document is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/custom.css:
    get:
      operationId: getInstanceCustomCSS
      summary: Operator custom stylesheet
      description: >-
        The operator's custom CSS as a same-origin text/css file (config-parity
        W1). Consumed hash-busted (`?v={css_hash}` from the GET /api/v1/instance
        customization block); the response carries the content hash as a strong
        ETag. Public; 404 while unset.
      tags: [system]
      responses:
        "200":
          description: The stylesheet body.
          content:
            text/css:
              schema:
                type: string
        "304":
          description: Not modified (If-None-Match matched the content hash).
        "404":
          description: No custom stylesheet is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/custom.js:
    get:
      operationId: getInstanceCustomJS
      summary: Operator custom script
      description: >-
        The operator's custom JavaScript as a same-origin
        application/javascript file (config-parity W1; external-file delivery
        keeps a future script-src 'self' CSP viable). Consumed hash-busted
        (`?v={js_hash}`). Public; 404 while unset.
      tags: [system]
      responses:
        "200":
          description: The script body.
          content:
            application/javascript:
              schema:
                type: string
        "304":
          description: Not modified (If-None-Match matched the content hash).
        "404":
          description: No custom script is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/avatar:
    get:
      operationId: getInstanceAvatar
      summary: Instance avatar image
      description: >-
        Serves the instance's avatar (config-parity W1), with the content type
        derived at upload time. Public; 404 when none is set (the GET
        /api/v1/instance branding block reports is_fallback=true then).
      tags: [system]
      responses:
        "200":
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No instance avatar is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/banner:
    get:
      operationId: getInstanceBanner
      summary: Instance banner image
      description: >-
        Serves the instance's banner (config-parity W1). Public; 404 when none
        is set.
      tags: [system]
      responses:
        "200":
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No instance banner is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/instance/logo/{type}:
    get:
      operationId: getInstanceLogo
      summary: Instance logo image (typed slot)
      description: >-
        Serves one of the instance's typed logo slots (PeerTube LogoType
        parity). Public; 404 when the slot is unset or the type is unknown.
      tags: [system]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [favicon, header-wide, header-square, opengraph]
      responses:
        "200":
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown logo type, or no image set for the slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new account
      description: >-
        Creates an account and returns it with an access token. The first
        account created on a fresh instance is granted the admin role. Rate
        limited; subject to the standard request guards. When the instance
        requires registration approval, no account is created: a pending
        registration request is filed and 202 is returned with no token.
        With `cookie_mode: true` (or an existing `vidra_refresh` cookie) the
        refresh token is delivered as an httpOnly `vidra_refresh` cookie
        (Path=/api/v1/auth, SameSite=Lax, Secure on https instances) instead of
        in the response body.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: >-
            Registration requires approval; a pending request was filed. No
            account or token is created until an admin approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPending"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registration is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in
      description: >-
        Verifies credentials and returns an access token. Unknown account and
        wrong password are reported identically (401) to prevent account
        enumeration. With `cookie_mode: true` (or an existing `vidra_refresh`
        cookie) the refresh token is delivered as an httpOnly `vidra_refresh`
        cookie (Path=/api/v1/auth, SameSite=Lax, Secure on https instances)
        instead of in the response body. When the account has two-factor
        authentication enabled, valid credentials return `{mfa_required: true,
        mfa_token}` with NO session tokens — complete the login at
        POST /api/v1/auth/mfa/challenge within 5 minutes.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Authenticated — or, for an MFA-enabled account, an MFA challenge
            (no session tokens yet).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/MFARequiredResponse"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Current authenticated account
      description: >-
        Returns the account for the bearer access token. The user is reloaded
        from the database, so the response reflects current role/verification
        state rather than stale token claims.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated account's profile
      description: >-
        Partial update of profile fields (display_name, bio). Identity fields
        (username, email) are not editable here. Provide at least one field.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCurrentUser
      summary: Permanently delete the authenticated account (hard delete)
      description: >-
        IRREVERSIBLE hard delete of the caller's account after re-confirming
        the current password. Owned channels and their videos are permanently
        removed (media blobs deleted best-effort; a federated Delete is fanned
        out for previously-public videos); the account's comments become
        "[deleted]" tombstones with reply threads preserved; ratings, saved
        videos, watch history, playlists, follows, mutes, and blocks are
        erased; linked OAuth identities and TOTP settings are removed; all
        sessions are revoked. The account row itself is anonymised (username
        becomes deleted-XXXXXXXX) so audit and message history stay coherent.
        Accounts without a password (OAuth-only) cannot self-delete this way —
        an administrator must use the admin variant. For a reversible
        alternative, see POST /api/v1/auth/me/deactivate.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: The account was permanently deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Incorrect password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (missing password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >-
        Exchanges a valid refresh token for a new access + refresh token pair and
        revokes the presented token (rotation). Reusing an already-rotated token
        is treated as compromise: all of the user's sessions are revoked.
        When the body omits `refresh_token`, the token is read from the
        `vidra_refresh` cookie (cookie mode); rotation then re-sets the cookie
        with the new token and the body omits the raw token. A cookie-presented
        token that is invalid is cleared alongside the 401 so the browser stops
        re-presenting a dead cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unknown, expired, or already-rotated refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh-token session
      description: >-
        Revokes the session for the presented refresh token. Idempotent — an
        unknown or already-revoked token still returns 204 and never reveals
        whether the token existed. When the body omits `refresh_token`, the
        token is read from the `vidra_refresh` cookie (cookie mode). The
        response always clears the `vidra_refresh` cookie (Max-Age=0) so a
        browser is left signed out.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session is revoked (or was already not active).
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all of the current user's sessions
      description: >-
        "Sign out everywhere" — revokes every active refresh-token session for
        the authenticated account. Requires a bearer access token. The response
        also clears the `vidra_refresh` cookie (Max-Age=0).
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All of the user's sessions are revoked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: >-
        Starts the password-reset flow. Always returns 202 — it never reveals
        whether the email belongs to an account (enumeration-safe). A matching,
        active account is sent a single-use, expiring reset token out-of-band.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: The account's email address.
      responses:
        "202":
          description: >-
            Accepted. If the email matches an active account, a reset token has
            been sent. Returned regardless, so registered emails cannot be probed.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Complete a password reset
      description: >-
        Completes the reset using the token from the reset message: sets a new
        password and revokes all of the account's sessions (signs out
        everywhere). An unknown, used, or expired token returns 400.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The single-use token from the reset message.
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  description: The new password.
      responses:
        "204":
          description: The password is updated and existing sessions are revoked.
        "400":
          description: The reset token is invalid, used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate the current account
      description: >-
        Disables the authenticated account after confirming its password, and
        revokes all of its sessions (signs out everywhere). A disabled account
        cannot log in and its tokens stop resolving; deactivation is reversible
        by an administrator. Requires a bearer access token. Hard deletion is a
        separate, policy-gated flow.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: The account's current password, for confirmation.
      responses:
        "204":
          description: The account is deactivated and all sessions are revoked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The supplied password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/verify-email:
    post:
      operationId: requestEmailVerification
      summary: Send an email-verification message
      description: >-
        Issues a single-use, expiring verification token for the authenticated
        account and sends it out-of-band. Always 202, and a no-op if the account
        is already verified. Requires a bearer access token.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted. If the account was unverified, a token has been sent.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/verify-email/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm an email address
      description: >-
        Marks the account's email verified using the token from the verification
        message. Public — the link may be followed while logged out. An unknown,
        used, or expired token returns 400.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The single-use token from the verification message.
      responses:
        "204":
          description: The account's email is now verified.
        "400":
          description: The verification token is invalid, used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa:
    get:
      operationId: getMFAStatus
      summary: Two-factor authentication status
      description: >-
        Reports whether TOTP two-factor authentication is enabled for the
        authenticated account and how many single-use recovery codes remain. A
        pending (started but unverified) enrollment reports as disabled.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's two-factor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/totp:
    post:
      operationId: beginTOTPEnrollment
      summary: Start TOTP enrollment
      description: >-
        Generates a TOTP shared secret (RFC 6238: SHA1, 6 digits, 30s period)
        for the authenticated account and returns it — together with the
        otpauth:// provisioning URI for QR display — EXACTLY ONCE. The secret
        is stored encrypted server-side and is never retrievable again; POST
        again to restart a pending enrollment with a fresh secret. Login is
        unaffected until the enrollment is verified with a first valid code.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The new secret and provisioning URI (shown once, never logged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollmentResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Two-factor authentication is already enabled — disable it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disableTOTP
      summary: Disable two-factor authentication
      description: >-
        Turns TOTP off for the authenticated account and deletes the stored
        secret and every recovery code. The account password must be re-entered
        (a bearer token alone cannot strip two-factor protection). Also cancels
        a pending (unverified) enrollment.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: The account's current password, for confirmation.
      responses:
        "204":
          description: Two-factor authentication is disabled.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The supplied password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Two-factor authentication is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/totp/verify:
    post:
      operationId: verifyTOTPEnrollment
      summary: Verify TOTP enrollment
      description: >-
        Confirms a pending enrollment with the first valid authenticator code
        (±1 step of clock skew): two-factor authentication flips on and the 10
        single-use recovery codes are returned EXACTLY ONCE — they are stored
        hashed and cannot be retrieved again. Subsequent logins then require
        the MFA challenge.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current 6-digit code from the authenticator app.
      responses:
        "200":
          description: >-
            Two-factor authentication is now enabled; the recovery codes are
            shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          description: The code is invalid, or no enrollment is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Two-factor authentication is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/challenge:
    post:
      operationId: completeMFAChallenge
      summary: Complete an MFA login
      description: >-
        Second half of a two-factor login: exchanges the short-lived (5 min)
        single-purpose `mfa_token` from the login response plus a 6-digit TOTP
        code — or a single-use recovery code, which is consumed — for the full
        auth response. Rate limited like login. Supports `cookie_mode` exactly
        like login: the session's refresh token is then delivered as the
        httpOnly `vidra_refresh` cookie and omitted from the body. A tampered,
        expired, or repurposed token and a wrong code are both 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: >-
            The mfa_token is invalid/expired, or the code did not verify (an
            already-used recovery code does not verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/oauth/{provider}:
    get:
      operationId: beginOAuth
      summary: Start an OIDC login
      description: >-
        Begins the OAuth2/OIDC authorization-code flow for a configured
        provider (see `oauth_providers` in the instance document): responds 302
        to the provider's authorization endpoint with a fresh state, nonce, and
        PKCE challenge, sealing the attempt into a short-lived, signed,
        httpOnly `vidra_oauth_state` cookie. Navigate the browser here
        (top-level), do not call it with fetch. The callback redirect URI sent
        to the provider is always derived server-side from PUBLIC_BASE_URL —
        never from request parameters.
      tags: [auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Configured provider name (e.g. `google`).
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: >-
            Where to send the browser after the flow completes. Must be a
            same-origin relative path (`/...`); absolute URLs and `//...` are
            rejected. Defaults to `/`.
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        "404":
          description: Unknown or unconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid return_to (not a same-origin relative path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider discovery failed (issuer unreachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      summary: OIDC provider callback
      description: >-
        The redirect target the provider sends the browser back to. Verifies
        the signed state cookie against the returned `state`, exchanges the
        code (with PKCE), verifies the id_token against the provider JWKS and
        the attempt nonce, then logs in: a known identity signs its account
        in; a new identity whose provider-verified email matches an existing
        account is linked to it; otherwise a new account is created (username
        derived from the profile and deduplicated, email_verified inherited
        from the claim). The session is always issued in cookie mode — the
        rotating refresh token is set as the httpOnly `vidra_refresh` cookie
        and the SPA obtains an access token via POST /api/v1/auth/refresh with
        credentials — and the browser is redirected (302) to the validated
        `return_to` path. User-actionable failures redirect with an
        `oauth_error` query code (`access_denied`, `email_conflict`,
        `email_required`, `account_disabled`, `conflict`); protocol violations
        (missing/forged/expired state, nonce mismatch) are 400.
      tags: [auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code from the provider.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Must match the state sealed in the attempt cookie.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Provider-reported error (e.g. the user denied consent).
      responses:
        "302":
          description: >-
            Redirect to return_to. On success the `vidra_refresh` session
            cookie is set; on user-actionable failure the location carries
            `?oauth_error=<code>` instead.
        "400":
          description: Missing/forged/expired state, nonce mismatch, or missing code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown or unconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Code exchange or id_token verification failed upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/oauth-identities:
    get:
      operationId: listOAuthIdentities
      summary: List the caller's linked OAuth identities
      description: >-
        The OIDC identities linked to the authenticated account, oldest link
        first. The email is the point-in-time snapshot captured when the
        identity was linked.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthIdentitiesResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/oauth-identities/{provider}:
    delete:
      operationId: unlinkOAuthIdentity
      summary: Unlink an OAuth identity
      description: >-
        Removes the authenticated account's linked identity for one provider.
        Refused (422) when it is the account's last sign-in method — an account
        with no password set must keep at least one linked identity; set a
        password (via the password-reset flow) first.
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Identity unlinked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: That provider is not linked to this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cannot remove the last sign-in method.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels:
    post:
      operationId: createChannel
      summary: Create a channel
      description: >-
        Creates a channel owned by the authenticated user. 422 when the caller
        is at the operator's per-user channel limit (max_channels_per_user,
        config-parity W8; 0 = unlimited).
      tags: [channels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequest"
      responses:
        "201":
          description: Channel created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Handle already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Validation failed, or the caller is at the per-user channel limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}:
    get:
      operationId: getChannel
      summary: Get a channel by handle
      description: Public channel page data, looked up by case-insensitive handle.
      tags: [channels]
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateChannel
      summary: Update a channel
      description: >-
        Updates a channel's mutable fields (owner only). Partial — only the
        fields present in the body are changed; the handle is immutable.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequest"
      responses:
        "200":
          description: The updated channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChannel
      summary: Delete a channel
      description: Deletes a channel (owner only).
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The channel was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/follow:
    post:
      operationId: followChannel
      summary: Follow a channel
      description: The authenticated user follows the channel. Idempotent.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Now following (or already was).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unfollowChannel
      summary: Unfollow a channel
      description: The authenticated user stops following the channel. Idempotent.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No longer following (or already was not).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/channels:
    get:
      operationId: listMyChannels
      summary: List the authenticated user's channels
      tags: [channels]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user's channels (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/donation-addresses:
    post:
      operationId: addDonationAddress
      summary: Add a crypto donation address
      description: >-
        Adds a public crypto wallet address the caller wants displayed for
        donations, either on their account (profile) or on a channel they own
        (channel_id). This is a NON-CUSTODIAL, display-only feature: Vidra
        never holds funds, balances, or private keys, and processes no
        payments, payouts, escrow, or taxes. Viewers send funds peer-to-peer,
        entirely outside Vidra. The network must be one of the supported set
        (bitcoin, ethereum, litecoin, monero) and the address must match that
        network's format. A newly added address is unverified until ownership
        is proven via the challenge/verify flow (where supported).
      tags: [donations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDonationAddressRequest"
      responses:
        "201":
          description: The created donation address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAddress"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The referenced channel is not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The referenced channel does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This donation address already exists for the owner/scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unsupported network or malformed address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyDonationAddresses
      summary: List the caller's donation addresses
      description: >-
        Lists every donation address the caller owns, both account-level and
        channel-scoped, with each address's verified flag.
      tags: [donations]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's donation addresses (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAddressListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/donation-addresses/{id}:
    delete:
      operationId: deleteDonationAddress
      summary: Delete one of the caller's donation addresses
      tags: [donations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The donation address was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such donation address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/donation-addresses/{id}/challenge:
    post:
      operationId: challengeDonationAddress
      summary: Request an ownership-verification challenge
      description: >-
        Issues a one-time challenge message the owner signs with the address's
        private key to prove control, plus a 10-minute expiry. Only networks
        with a practical message-signing standard are supported: ethereum
        (EIP-191 personal_sign). Bitcoin (BIP-137) is intentionally deferred
        and monero/litecoin have no practical standard, so those networks
        return 501 and remain unverified-only. No key material is ever handled
        or stored by the server — the challenge nonce is a public random value.
      tags: [donations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The challenge message to sign and its expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationChallengeResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such donation address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Ownership verification is not supported for this network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/donation-addresses/{id}/verify:
    post:
      operationId: verifyDonationAddress
      summary: Verify address ownership with a signed challenge
      description: >-
        Submits the signature of the most recent challenge message. On success
        the address is marked verified and the challenge is cleared. A
        well-formed but wrong signature returns 422; an expired or missing
        challenge returns 409; a network without a signing path returns 501.
        The signature is verified, never stored or logged.
      tags: [donations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyDonationAddressRequest"
      responses:
        "200":
          description: The now-verified donation address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAddress"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such donation address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No active challenge, or it expired; request a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The signature is malformed or did not verify.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Ownership verification is not supported for this network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/donation-addresses:
    get:
      operationId: listUserDonationAddresses
      summary: List a user's public donation addresses
      description: >-
        Public read of a user's account-level (profile) donation addresses —
        only what the owner added, each with its verified flag. Channel-scoped
        addresses are not included here. No authentication required.
      tags: [donations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The user's public donation addresses (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAddressListResponse"
  /api/v1/channels/{handle}/donation-addresses:
    get:
      operationId: listChannelDonationAddresses
      summary: List a channel's public donation addresses
      description: >-
        Public read of a channel's donation addresses — only what the owner
        added, each with its verified flag. No authentication required.
      tags: [donations]
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel's public donation addresses (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationAddressListResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/export:
    post:
      operationId: requestAccountExport
      summary: Request an export of the caller's account data
      description: >-
        Enqueues a durable background job that assembles the caller's account
        data — profile, channels, video metadata (including taxonomy and
        tags), playlists, comments, follows, saved videos, watch history, and
        notification preferences — into a single JSON archive. The archive
        NEVER contains the password hash, tokens, or any other credential
        material. Media files are NOT bundled in v1: each video entry carries
        its original file's download URL instead. One export may be active per
        user (409 while one is pending/running); requesting again after
        completion replaces the previous archive. The finished archive stays
        downloadable for the operator-configured retention
        (user_export_expiration_hours, default 168h; 0 = never expires), then a
        sweeper deletes it. 403 feature_disabled when the operator has turned
        exports off (user_export_enabled), and 403 when the caller's stored
        media exceeds the operator's export cap (user_export_max_quota_bytes;
        0 = no cap).
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: The export job was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExportStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Account exports are disabled on this instance (stable code
            feature_disabled), or the caller's stored media exceeds the
            operator's export cap (stable code forbidden).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An export is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getAccountExport
      summary: Get the caller's latest export status
      description: >-
        Reports the caller's most recent export job: pending/running while the
        archive is being assembled, done once downloadable (with its expiry),
        or failed after the job dead-lettered. 404 when no export was ever
        requested or the expired archive was already cleaned up.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The latest export's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExportStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No export found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/export/download:
    get:
      operationId: downloadAccountExport
      summary: Download the caller's finished export archive
      description: >-
        Streams the finished JSON archive as an attachment. 409 while the
        export is still pending/running or after it failed; 410 once the
        archive passed its 7-day expiry (request a new export); 404 when none
        exists. The archive is the same shape POST /api/v1/me/import accepts.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The export archive (attachment).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountArchive"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No export found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The export is not ready for download.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The export has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/import:
    post:
      operationId: importAccountArchive
      summary: Import a vidra account archive (safe subsets)
      description: >-
        Accepts the JSON archive produced by the account export and re-creates
        the SAFE subsets for the caller: profile fields (display name, bio),
        playlists (each item matched by video id and added only when that
        video exists locally), follows of local channels (matched by handle),
        and notification preferences. Everything else in the archive —
        channels, videos, comments, saved videos, watch history — is NOT
        re-created in v1 and is reported per section in the returned summary's
        skipped_sections. The import is additive: it never deletes existing
        data, follows are idempotent, and re-importing creates duplicate
        playlists. The request body is bounded by the instance's HTTP body
        limit (default 8 MB). 403 feature_disabled when the operator has turned
        archive imports off (user_import_enabled).
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountArchive"
      responses:
        "200":
          description: What was imported and what was skipped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountImportSummary"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Account archive imports are disabled on this instance. Stable code
            feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The archive exceeds the request body limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Not a valid vidra account archive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/quota:
    get:
      operationId: getMyQuota
      summary: Get the caller's storage usage and quota
      description: >-
        Returns the authenticated user's current storage usage — the total
        stored bytes of their video files (originals, renditions, thumbnails)
        across the videos owned via their channels — and the effective storage
        quota that applies to them: their per-user override when an admin set
        one, else the instance default (INSTANCE_DEFAULT_QUOTA_BYTES).
        quota_bytes is null when the caller is unlimited. Uploads and URL
        imports that would exceed the quota are rejected with 422
        quota_exceeded.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's storage usage and effective quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/avatar:
    get:
      operationId: getChannelAvatar
      summary: Get a channel's avatar image
      description: >-
        Serves the channel's avatar with the Content-Type derived at upload
        time. Public. 404 when the channel is unknown or has no avatar set —
        the channel view's has_avatar flag tells clients whether one exists.
      tags: [channels]
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The avatar image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No channel with that handle, or no avatar set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setChannelAvatar
      summary: Set a channel's avatar image
      description: >-
        Uploads the channel's avatar (owner only) as a multipart form with a
        single "file" part, replacing any previous one. Accepted types are
        JPEG/PNG/WebP (by extension; otherwise 415); the served Content-Type is
        derived from the extension. A non-owner or unknown handle is 404 (the
        route does not reveal whether the caller could act on it). The upload
        is bounded by the global HTTP body limit.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The avatar image (JPEG/PNG/WebP).
      responses:
        "201":
          description: The avatar was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImage"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteChannelAvatar
      summary: Remove a channel's avatar image
      description: >-
        Deletes the channel's avatar (owner only): the record and the stored
        object. A non-owner or unknown handle is 404; so is a channel with no
        avatar set.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The avatar was removed.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No channel with that handle, not owned by the caller, or no avatar
            set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
