        "307":
          description: >-
            Direct delivery: the instance has delivery_presign_enabled on and the object store can sign URLs, so this public request is redirected to a short-lived signed object URL (one hour) carrying the same Content-Type and Content-Disposition this route would have sent. Never emitted for private/unpublished/password-protected media, nor for a request carrying a playback token or Authorization header; the 200/206 byte path stays authoritative and is always the fallback.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401":
          description: A password-protected video requires a valid playback token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >-
            Downloads are disabled for this non-privileged caller — by the
            instance downloads_enabled setting or this video's
            download_enabled flag (code "feature_disabled").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No visible video or audio-only asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/videos/{id}/download/subtitles/{lang}:
    get:
      operationId: downloadVideoSubtitle
      summary: Download a subtitle track
      description: Serves one WebVTT caption track as an attachment under the official download policy.
      tags: [videos, captions]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lang
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The WebVTT subtitle attachment.
          content:
            text/vtt:
              schema: { type: string, format: binary }
        "401":
          description: A password-protected video requires a valid playback token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >-
            Downloads are disabled for this non-privileged caller — by the
            instance downloads_enabled setting or this video's
            download_enabled flag (code "feature_disabled").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No visible video or subtitle in that language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/videos/{id}/hls/master.m3u8:
    get:
      operationId: getVideoHLSMaster
      summary: Get a video's HLS master playlist
      description: >-
        Returns the HLS master playlist for a transcoded video. Variant URIs are
        relative ("720p/playlist.m3u8"), resolving to GET
        /videos/{id}/hls/{rendition}/{file}. Visibility mirrors /original
        (private → owner only, else 404). 404 until the transcode pipeline has
        marked the video's streaming playlist ready — the detail response's
        hls_url field tells clients when it exists. Relative playlist references
        carry the current generation's v query parameter so completed VOD assets
        can be cached immutably in a private browser cache.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: v
          in: query
          required: false
          description: >-
            Playlist-generation cache key advertised in the video's hls_url.
            A stale non-empty value returns 404 rather than serving new bytes
            under an old immutable URL.
          schema:
            type: string
      responses:
        "200":
          description: The master playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: >-
            No such video (or private and not yours), or its streaming playlist
            is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/hls/{rendition}/{file}:
    get:
      operationId: getVideoHLSFile
      summary: Get a streaming playlist, manifest or segment
      description: >-
        Serves one file under a video's streaming prefix.


        For a video packaged as MPEG-TS, rendition is a rung-height directory
        ("720p") and file is its variant playlist ("playlist.m3u8"), the dense
        byte-range I-frame trick-play pair ("iframe.m3u8" / "iframe.ts"), or one
        segment ("seg_00000.ts").


        For a video packaged as CMAF, rendition is the pseudo-rendition "cmaf" —
        one directory holding the shared fMP4 segments that BOTH manifests point
        at. `GET /api/v1/videos/{id}/hls/cmaf/stream.mpd` is the video's
        canonical MPEG-DASH manifest; the same directory also holds the
        per-representation HLS media playlists ("media_0.m3u8"), init segments
        ("init-0.mp4"), media segments ("chunk-0-00001.m4s") and the trick-play
        pair ("iframe-0.m3u8" / "iframe-0.mp4"). Requesting a "cmaf" name against
        a video that is not packaged as CMAF is 404, as is the reverse.


        Same visibility and readiness rules as the master playlist; names outside
        the transcoder's fixed naming are 404.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rendition
          in: path
          required: true
          description: >-
            A rendition directory ("720p") for an MPEG-TS video, or the "cmaf"
            pseudo-rendition for a CMAF one.
          schema:
            type: string
            pattern: '^([0-9]{2,4}p|cmaf)$'
        - name: file
          in: path
          required: true
          description: >-
            MPEG-TS: "playlist.m3u8", "iframe.m3u8", "iframe.ts", or a segment
            such as "seg_00000.ts". CMAF: "stream.mpd", "media_0.m3u8",
            "init-0.mp4", "chunk-0-00001.m4s", "iframe-0.m3u8" or "iframe-0.mp4".
          schema:
            type: string
            pattern: '^(playlist\.m3u8|iframe\.m3u8|iframe\.ts|seg_[0-9]+\.ts|stream\.mpd|media_[0-9]+\.m3u8|init-[0-9]+\.mp4|chunk-[0-9]+-[0-9]+\.m4s|iframe-[0-9]+\.m3u8|iframe-[0-9]+\.mp4)$'
        - name: v
          in: query
          required: false
          description: Playlist-generation cache key propagated from the parent playlist.
          schema:
            type: string
      responses:
        "200":
          description: The playlist, DASH manifest, or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            application/dash+xml:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
        "307":
          description: >-
            Direct delivery of a SEGMENT (never a playlist — .m3u8 references are rewritten by this origin): with delivery_presign_enabled on and a signing object store, a public+published video's segment request is redirected to a short-lived signed object URL. The 200 byte path stays authoritative.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: >-
            No such video (or private and not yours), playlist not ready, or no
            such rendition file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      summary: Get a video's poster image
      description: >-
        Returns the generated JPEG poster for the video. Same visibility as the
        detail endpoint (private → owner only, else 404). A video without a
        generated thumbnail is 404 — the detail response's has_thumbnail flag
        tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The poster image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "307":
          description: >-
            Delivered from somewhere other than this API: the public poster is
            pinned and the redirect points at its immutable IPFS gateway URL, or
            direct delivery is on and it points at a short-lived signed object
            URL. The 200 byte path stays authoritative.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: No such video (or private and not yours), or no thumbnail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setVideoThumbnail
      summary: Set a video's poster image
      description: >-
        Sets a video's poster (owner only). Dispatches on Content-Type. With
        multipart/form-data it uploads a creator-supplied image as a single "file"
        part (accepted types JPEG/PNG/WebP by extension; otherwise 415; the served
        Content-Type is derived from the extension). With application/json body
        {at_seconds} it picks the poster from the exact frame at that timestamp of
        the video's processed original, extracted server-side with ffmpeg and stored
        as JPEG (UPLOAD-04 frame-pick). Either variant replaces any previous or
        auto-generated thumbnail and does not change the video's state. A non-owner
        or unknown id is 404. The multipart upload is bounded by the global HTTP
        body limit. Frame-pick specific: 409 while the video has no processed
        original yet, 422 when at_seconds is outside [0, duration), 503 when the
        server has no ffmpeg-backed frame extractor configured.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The poster image (JPEG/PNG/WebP).
          application/json:
            schema:
              type: object
              required: [at_seconds]
              properties:
                at_seconds:
                  type: number
                  format: double
                  minimum: 0
                  description: >-
                    The timestamp (seconds, fractional allowed) of the frame to
                    extract from the processed original. Must be in [0, duration).
      responses:
        "201":
          description: The thumbnail was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFile"
        "400":
          description: The multipart "file" field is missing, or the JSON body is malformed / missing at_seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Frame-pick requested before the video has a processed original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: at_seconds is outside the video duration [0, duration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Server-side frame extraction is not available (no ffmpeg-backed extractor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/storyboard.jpg:
    get:
      operationId: getVideoStoryboardImage
      summary: Get a video's storyboard sprite sheet
      description: >-
        Returns the seek-preview storyboard sprite sheet (a JPEG grid of small
        poster tiles) for the video. Paired with the WebVTT map at
        storyboard.vtt, which references this image. Same visibility as the
        detail endpoint (private → owner only, blocked → moderators only, else
        404). A video without a generated storyboard is 404 — the detail
        response's has_storyboard flag tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The storyboard sprite sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "307":
          description: >-
            Delivered from somewhere other than this API: the public sprite sheet
            is pinned and the redirect points at its immutable IPFS gateway URL,
            or direct delivery is on and it points at a short-lived signed object
            URL. The 200 byte path stays authoritative. The companion .vtt map is
            NEVER redirected — its cues reference the sprite relatively.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: No such video (or not visible), or no storyboard.
