  /api/v1/admin/instance-settings:
    get:
      operationId: getInstanceSettings
      summary: Get effective instance settings (admin)
      description: >-
        Returns every runtime-mutable instance setting's EFFECTIVE value together
        with its config default and whether the database currently overrides it.
        This is the DB-backed overlay (fix_plan P10) on top of the static config:
        the instance name/description and legal-contact metadata, the PeerTube
        platform-information fields (links, markdown bodies, default language,
        categories, moderator languages, sensitive-content policy), the registration
        gates (registration_enabled, registration_require_approval), the upload
        quarantine gate (quarantine_new_uploads), and the feature toggles
        (uploads_enabled, imports_enabled, live_enabled, comments_enabled,
        downloads_enabled). Downloads default to enabled and are controlled only
        by this runtime setting (there is no env/config counterpart).
        Boot-time-only secrets and infrastructure (database DSN, KEKs, JWT secret,
        storage backend) are NOT represented here — they stay in config.
        Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The effective instance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInstanceSettings
      summary: Update instance settings (admin)
      description: >-
        Applies a partial, per-key-validated update to the instance-settings
        overlay and returns the full effective document. The body is a flat JSON
        object of setting key → new value: a boolean for the toggle keys
        (registration_enabled, registration_require_approval,
        quarantine_new_uploads, uploads_enabled, imports_enabled, live_enabled,
        comments_enabled, downloads_enabled, contact_form_enabled,
        instance_is_sensitive, the config-parity W8 feature toggles
        import_http_enabled, channel_sync_enabled, storyboards_enabled,
        transcription_enabled, user_import_enabled, user_export_enabled, and
        the config-parity W10 VOD knobs transcoding_enabled,
        transcoding_original_resolution, upload_additional_extensions_enabled,
        the config-parity W11 live knobs live_allow_replay and
        live_default_save_replay, and the config-parity W12 federation policy
        gates federation_accept_remote_comments (default true; off drops
        inbound remote comments at the ActivityPub inbox after the
        blocked-domain check — never retroactively),
        federation_allow_channel_followers (default true; off answers inbound
        channel Follows with a Reject, existing followers untouched),
        federation_follower_approval (default false; on holds new channel
        Follows PENDING in GET /api/v1/admin/federation/follower-requests — a
        vidra deviation applying PeerTube's instance-follower approval to
        CHANNEL followers, since vidra has no instance-level AP actor), and
        federation_auto_follow_back (default false; on follows an accepted
        follower back FROM THE FOLLOWED CHANNEL'S ACTOR, respecting the domain
        blocklist and never duplicating an existing follow/follow-back edge —
        note the content of followed-back actors then federates in, so
        moderation becomes reactive, as in PeerTube). Every federation_* key
        governs the ActivityPub inbox ONLY: the ATProto integration is
        outbound cross-posting with no inbound path, so these gates are
        explicitly out of scope for it. The config-parity W13 remote-URI
        search gates ride here too: search_remote_uri_users (default true)
        and search_remote_uri_anonymous (default false) let logged-in /
        anonymous callers resolve URL- and handle-shaped search queries to
        remote content through the SSRF-guarded federation fetcher — both
        effective only while federation is enabled), an integer for the int-kind limits
        (including the W8 keys channel_sync_max_per_user,
        user_export_expiration_hours, user_export_max_quota_bytes,
        max_channels_per_user — 0 always means unlimited/never — the W10 keys
        transcoding_max_fps (0 = no cap, else 24..240), transcoding_threads
        (0 = ffmpeg default, else 1..64), and transcoding_concurrency /
        import_jobs_concurrency (1..16, read per worker tick so changes apply
        without a restart), and the W11 live limits live_max_instance_lives /
        live_max_user_lives (0..10000, 0 = unlimited, enforced at the RTMP
        publish callback) and live_max_duration_secs (0 = no limit, else
        60..2592000, enforced by the duration watchdog)), a string
        for the text/markdown/link keys and enum keys such as
        sensitive_content_policy, and an array of strings for list keys
        (instance_categories, moderator_languages, and transcoding_resolutions
        — a non-empty, duplicate-free subset of the canonical ladder rungs
        2160/1440/1080/720/480/360/240/144). A null value
        clears that override (resets the key to its config default). Only the keys
        present are changed. An unknown key, a type mismatch, or a content-invalid
        value (e.g. a malformed URL/email, an empty instance_name, an unknown
        taxonomy id, or an enum value outside its options) is 422 with field
        errors and nothing is written. Restricted to admins; audited
        (admin.instance.update, changed key names only). Changes take effect
        immediately (the overlay cache reloads), so subsequent GET /api/v1/instance,
        GET /api/v1/instance/about, POST /api/v1/instance/contact, public
        sensitive-content filtering, and the upload/import/live/comment/download/
        registration gates reflect them.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceSettingsRequest"
      responses:
        "200":
          description: The updated effective instance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown key or an invalid value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/instance-documents/{name}:
    get:
      operationId: getInstanceDocument
      summary: Get an instance document (admin)
      description: >-
        Returns one instance document's stored state (config-parity W1): the
        raw body plus its sha256 content hash. A never-set/cleared document
        returns an empty body and hash (a stable shape for the admin editor).
        Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
