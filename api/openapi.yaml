# Vidra Core — OpenAPI contract (source of truth for the HTTP API).
#
# DRIFT STOP GUARD: this file MUST stay in lock-step with the routes registered
# in internal/httpapi. The TestOpenAPIContract test (internal/httpapi) fails the
# build when a route is added, removed, or renamed without a matching edit here,
# and the openapi.yml GitHub Actions workflow lints this file on every change.
#
# Editing rules for the drift guard's parser:
#   - `paths:` at column 0.
#   - each path item key indented 2 spaces (e.g. `  /healthz:`).
#   - each operation (get/post/put/patch/delete) indented 4 spaces.
# Keep that shape so the contract test can compare declared paths against the
# live Echo router. When you add an endpoint in code, document it here in the
# same change; when you remove one, delete its entry here in the same change.
openapi: 3.1.0
info:
  title: Vidra Core API
  version: 0.1.0
  description: >-
    HTTP API for Vidra — a clean-room, PeerTube-inspired federated video
    platform. This document is the authoritative contract consumed by the
    vidra-user frontend and validated in CI.
servers:
  - url: http://localhost:8080
    description: Local development
# Public by default: most read endpoints require no auth. Protected operations
# override this with `security: [{ bearerAuth: [] }]`. Declaring an empty default
# makes every operation's auth posture explicit (satisfies the security-defined rule).
security: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is up. Performs no dependency checks.
      tags: [system]
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: >-
        Reports whether all critical dependencies (PostgreSQL, Redis) are
        reachable. Returns 503 when any configured dependency is unhealthy.
      tags: [system]
      responses:
        "200":
          description: All configured dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one configured dependency is unhealthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /version:
    get:
      operationId: getVersion
      summary: Build version metadata
      description: >-
        Reports the running build's version, git commit, build date, and Go
        toolchain. Exposes build information only — never secrets or config.
      tags: [system]
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
  /api/v1/nodeinfo:
    get:
      operationId: getNodeInfo
      summary: Instance discovery metadata
      description: Minimal NodeInfo-style document describing this instance.
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeInfoResponse"
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Public instance about/config
      description: >-
        Public "about this instance" document the frontend app shell reads on
        load: instance name, software, and whether public registration is open.
      tags: [system]
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceResponse"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new account
      description: >-
        Creates an account and returns it with an access token. The first
        account created on a fresh instance is granted the admin role. Rate
        limited; subject to the standard request guards. When the instance
        requires registration approval, no account is created: a pending
        registration request is filed and 202 is returned with no token.
        With `cookie_mode: true` (or an existing `vidra_refresh` cookie) the
        refresh token is delivered as an httpOnly `vidra_refresh` cookie
        (Path=/api/v1/auth, SameSite=Lax, Secure on https instances) instead of
        in the response body.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: >-
            Registration requires approval; a pending request was filed. No
            account or token is created until an admin approves it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationPending"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Registration is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username or email already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in
      description: >-
        Verifies credentials and returns an access token. Unknown account and
        wrong password are reported identically (401) to prevent account
        enumeration. With `cookie_mode: true` (or an existing `vidra_refresh`
        cookie) the refresh token is delivered as an httpOnly `vidra_refresh`
        cookie (Path=/api/v1/auth, SameSite=Lax, Secure on https instances)
        instead of in the response body. When the account has two-factor
        authentication enabled, valid credentials return `{mfa_required: true,
        mfa_token}` with NO session tokens — complete the login at
        POST /api/v1/auth/mfa/challenge within 5 minutes.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: >-
            Authenticated — or, for an MFA-enabled account, an MFA challenge
            (no session tokens yet).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - $ref: "#/components/schemas/MFARequiredResponse"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Current authenticated account
      description: >-
        Returns the account for the bearer access token. The user is reloaded
        from the database, so the response reflects current role/verification
        state rather than stale token claims.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The authenticated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCurrentUser
      summary: Update the authenticated account's profile
      description: >-
        Partial update of profile fields (display_name, bio). Identity fields
        (username, email) are not editable here. Provide at least one field.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCurrentUser
      summary: Permanently delete the authenticated account (hard delete)
      description: >-
        IRREVERSIBLE hard delete of the caller's account after re-confirming
        the current password. Owned channels and their videos are permanently
        removed (media blobs deleted best-effort; a federated Delete is fanned
        out for previously-public videos); the account's comments become
        "[deleted]" tombstones with reply threads preserved; ratings, saved
        videos, watch history, playlists, follows, mutes, and blocks are
        erased; linked OAuth identities and TOTP settings are removed; all
        sessions are revoked. The account row itself is anonymised (username
        becomes deleted-XXXXXXXX) so audit and message history stay coherent.
        Accounts without a password (OAuth-only) cannot self-delete this way —
        an administrator must use the admin variant. For a reversible
        alternative, see POST /api/v1/auth/me/deactivate.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: The account was permanently deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Incorrect password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (missing password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token
      description: >-
        Exchanges a valid refresh token for a new access + refresh token pair and
        revokes the presented token (rotation). Reusing an already-rotated token
        is treated as compromise: all of the user's sessions are revoked.
        When the body omits `refresh_token`, the token is read from the
        `vidra_refresh` cookie (cookie mode); rotation then re-sets the cookie
        with the new token and the body omits the raw token. A cookie-presented
        token that is invalid is cleared alongside the 401 so the browser stops
        re-presenting a dead cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: A new token pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unknown, expired, or already-rotated refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke a refresh-token session
      description: >-
        Revokes the session for the presented refresh token. Idempotent — an
        unknown or already-revoked token still returns 204 and never reveals
        whether the token existed. When the body omits `refresh_token`, the
        token is read from the `vidra_refresh` cookie (cookie mode). The
        response always clears the `vidra_refresh` cookie (Max-Age=0) so a
        browser is left signed out.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: The session is revoked (or was already not active).
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all of the current user's sessions
      description: >-
        "Sign out everywhere" — revokes every active refresh-token session for
        the authenticated account. Requires a bearer access token. The response
        also clears the `vidra_refresh` cookie (Max-Age=0).
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All of the user's sessions are revoked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: >-
        Starts the password-reset flow. Always returns 202 — it never reveals
        whether the email belongs to an account (enumeration-safe). A matching,
        active account is sent a single-use, expiring reset token out-of-band.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: The account's email address.
      responses:
        "202":
          description: >-
            Accepted. If the email matches an active account, a reset token has
            been sent. Returned regardless, so registered emails cannot be probed.
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Complete a password reset
      description: >-
        Completes the reset using the token from the reset message: sets a new
        password and revokes all of the account's sessions (signs out
        everywhere). An unknown, used, or expired token returns 400.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: The single-use token from the reset message.
                password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 72
                  description: The new password.
      responses:
        "204":
          description: The password is updated and existing sessions are revoked.
        "400":
          description: The reset token is invalid, used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/me/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate the current account
      description: >-
        Disables the authenticated account after confirming its password, and
        revokes all of its sessions (signs out everywhere). A disabled account
        cannot log in and its tokens stop resolving; deactivation is reversible
        by an administrator. Requires a bearer access token. Hard deletion is a
        separate, policy-gated flow.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: The account's current password, for confirmation.
      responses:
        "204":
          description: The account is deactivated and all sessions are revoked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The supplied password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/verify-email:
    post:
      operationId: requestEmailVerification
      summary: Send an email-verification message
      description: >-
        Issues a single-use, expiring verification token for the authenticated
        account and sends it out-of-band. Always 202, and a no-op if the account
        is already verified. Requires a bearer access token.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Accepted. If the account was unverified, a token has been sent.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/verify-email/confirm:
    post:
      operationId: confirmEmailVerification
      summary: Confirm an email address
      description: >-
        Marks the account's email verified using the token from the verification
        message. Public — the link may be followed while logged out. An unknown,
        used, or expired token returns 400.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The single-use token from the verification message.
      responses:
        "204":
          description: The account's email is now verified.
        "400":
          description: The verification token is invalid, used, or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa:
    get:
      operationId: getMFAStatus
      summary: Two-factor authentication status
      description: >-
        Reports whether TOTP two-factor authentication is enabled for the
        authenticated account and how many single-use recovery codes remain. A
        pending (started but unverified) enrollment reports as disabled.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account's two-factor state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/totp:
    post:
      operationId: beginTOTPEnrollment
      summary: Start TOTP enrollment
      description: >-
        Generates a TOTP shared secret (RFC 6238: SHA1, 6 digits, 30s period)
        for the authenticated account and returns it — together with the
        otpauth:// provisioning URI for QR display — EXACTLY ONCE. The secret
        is stored encrypted server-side and is never retrievable again; POST
        again to restart a pending enrollment with a fresh secret. Login is
        unaffected until the enrollment is verified with a first valid code.
      tags: [auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The new secret and provisioning URI (shown once, never logged).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollmentResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Two-factor authentication is already enabled — disable it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disableTOTP
      summary: Disable two-factor authentication
      description: >-
        Turns TOTP off for the authenticated account and deletes the stored
        secret and every recovery code. The account password must be re-entered
        (a bearer token alone cannot strip two-factor protection). Also cancels
        a pending (unverified) enrollment.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  description: The account's current password, for confirmation.
      responses:
        "204":
          description: Two-factor authentication is disabled.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The supplied password is incorrect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Two-factor authentication is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/totp/verify:
    post:
      operationId: verifyTOTPEnrollment
      summary: Verify TOTP enrollment
      description: >-
        Confirms a pending enrollment with the first valid authenticator code
        (±1 step of clock skew): two-factor authentication flips on and the 10
        single-use recovery codes are returned EXACTLY ONCE — they are stored
        hashed and cannot be retrieved again. Subsequent logins then require
        the MFA challenge.
      tags: [auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The current 6-digit code from the authenticator app.
      responses:
        "200":
          description: >-
            Two-factor authentication is now enabled; the recovery codes are
            shown once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesResponse"
        "400":
          description: The code is invalid, or no enrollment is in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Two-factor authentication is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/mfa/challenge:
    post:
      operationId: completeMFAChallenge
      summary: Complete an MFA login
      description: >-
        Second half of a two-factor login: exchanges the short-lived (5 min)
        single-purpose `mfa_token` from the login response plus a 6-digit TOTP
        code — or a single-use recovery code, which is consumed — for the full
        auth response. Rate limited like login. Supports `cookie_mode` exactly
        like login: the session's refresh token is then delivered as the
        httpOnly `vidra_refresh` cookie and omitted from the body. A tampered,
        expired, or repurposed token and a wrong code are both 401.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: >-
            The mfa_token is invalid/expired, or the code did not verify (an
            already-used recovery code does not verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/oauth/{provider}:
    get:
      operationId: beginOAuth
      summary: Start an OIDC login
      description: >-
        Begins the OAuth2/OIDC authorization-code flow for a configured
        provider (see `oauth_providers` in the instance document): responds 302
        to the provider's authorization endpoint with a fresh state, nonce, and
        PKCE challenge, sealing the attempt into a short-lived, signed,
        httpOnly `vidra_oauth_state` cookie. Navigate the browser here
        (top-level), do not call it with fetch. The callback redirect URI sent
        to the provider is always derived server-side from PUBLIC_BASE_URL —
        never from request parameters.
      tags: [auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
          description: Configured provider name (e.g. `google`).
        - name: return_to
          in: query
          required: false
          schema:
            type: string
          description: >-
            Where to send the browser after the flow completes. Must be a
            same-origin relative path (`/...`); absolute URLs and `//...` are
            rejected. Defaults to `/`.
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        "404":
          description: Unknown or unconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid return_to (not a same-origin relative path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Provider discovery failed (issuer unreachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      summary: OIDC provider callback
      description: >-
        The redirect target the provider sends the browser back to. Verifies
        the signed state cookie against the returned `state`, exchanges the
        code (with PKCE), verifies the id_token against the provider JWKS and
        the attempt nonce, then logs in: a known identity signs its account
        in; a new identity whose provider-verified email matches an existing
        account is linked to it; otherwise a new account is created (username
        derived from the profile and deduplicated, email_verified inherited
        from the claim). The session is always issued in cookie mode — the
        rotating refresh token is set as the httpOnly `vidra_refresh` cookie
        and the SPA obtains an access token via POST /api/v1/auth/refresh with
        credentials — and the browser is redirected (302) to the validated
        `return_to` path. User-actionable failures redirect with an
        `oauth_error` query code (`access_denied`, `email_conflict`,
        `email_required`, `account_disabled`, `conflict`); protocol violations
        (missing/forged/expired state, nonce mismatch) are 400.
      tags: [auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: Authorization code from the provider.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Must match the state sealed in the attempt cookie.
        - name: error
          in: query
          required: false
          schema:
            type: string
          description: Provider-reported error (e.g. the user denied consent).
      responses:
        "302":
          description: >-
            Redirect to return_to. On success the `vidra_refresh` session
            cookie is set; on user-actionable failure the location carries
            `?oauth_error=<code>` instead.
        "400":
          description: Missing/forged/expired state, nonce mismatch, or missing code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown or unconfigured provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Code exchange or id_token verification failed upstream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/oauth-identities:
    get:
      operationId: listOAuthIdentities
      summary: List the caller's linked OAuth identities
      description: >-
        The OIDC identities linked to the authenticated account, oldest link
        first. The email is the point-in-time snapshot captured when the
        identity was linked.
      tags: [auth]
      security:
