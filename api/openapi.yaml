        ("comment" or "video"), the comment's body/author + its video, or the
        flagged video's title + owner. Comments are matched on post/edit;
        videos on create/edit (title+description). Restricted to
        moderators/admins. Detection only — nothing is auto-hidden (the upload
        quarantine pipeline is the hold mechanism for videos). Paginated via
        ?limit (1–100, default 20)/?offset.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
