      required: [id, title, privacy, state, channel_handle, channel_display_name, owner_username, created_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [quarantined]
        channel_handle:
          type: string
        channel_display_name:
          type: string
        owner_username:
          type: string
          description: The owning account's username.
        created_at:
          type: string
          format: date-time
    QuarantinedVideoListResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/QuarantinedVideo"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RejectQuarantinedVideoRequest:
      type: object
      description: >-
        Optional body for rejecting a quarantined upload; the reason is
        recorded in the audit trail (it is not shown to the owner).
      properties:
        reason:
          type: string
          maxLength: 2000
    ReportReporter:
      type: object
      required: [username]
      properties:
        username:
          type: string
    Report:
      type: object
      required: [id, target_type, reason, status, moderator_note, created_at, reporter]
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [video, comment, account, remote_video]
        reason:
          type: string
        status:
          type: string
          enum: [open, accepted, rejected]
        moderator_note:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        reporter:
          $ref: "#/components/schemas/ReportReporter"
        video_id:
          type: string
          format: uuid
          description: The reported video (video reports).
        video_title:
          type: string
        comment_id:
          type: string
          format: uuid
          description: The reported comment (comment reports).
        comment_body:
          type: string
        reported_user_id:
          type: string
          format: uuid
          description: The reported account (account reports).
        reported_username:
          type: string
          description: Username of the reported account; omitted if that account was deleted.
        remote_video_id:
          type: string
          format: uuid
          description: The reported federated remote video (remote_video reports).
        remote_video_title:
          type: string
          description: Title of the reported remote video; omitted if it was deleted.
        remote_video_domain:
          type: string
          description: Origin instance of the reported remote video.
    ReportListResponse:
      type: object
      required: [reports, limit, offset]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    BlockedVideo:
      type: object
      description: A currently-blocked video, for the moderation block-list.
      required: [video_id, title, privacy, state, channel_handle, channel_display_name, reason, blocked_at]
      properties:
        video_id:
          type: string
          format: uuid
        title:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [draft, processing, scheduled, quarantined, published, failed]
        channel_handle:
          type: string
        channel_display_name:
          type: string
        reason:
          type: string
          description: The reason recorded when the video was blocked (may be empty).
        blocked_by:
          type: string
          description: Username of the moderator who blocked it; omitted if that account was deleted.
        blocked_at:
          type: string
          format: date-time
    BlockedVideoListResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/BlockedVideo"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    BlockedRemoteVideo:
      type: object
      description: A currently-blocked federated remote video, for the moderation block-list.
      required: [remote_video_id, title, object_url, watch_url, channel_handle, domain, reason, blocked_at]
      properties:
        remote_video_id:
          type: string
          format: uuid
        title:
          type: string
        object_url:
          type: string
          description: The remote video's ActivityPub object id.
        watch_url:
          type: string
          description: The origin's human watch page.
        channel_handle:
          type: string
          description: The origin channel identity (name@domain).
        domain:
          type: string
          description: The origin instance.
        reason:
          type: string
          description: The reason recorded when the remote video was blocked (may be empty).
        blocked_by:
          type: string
          description: Username of the moderator who blocked it; omitted if that account was deleted.
        blocked_at:
          type: string
          format: date-time
    BlockedRemoteVideoListResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/BlockedRemoteVideo"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    AdminVideo:
      type: object
      description: A video in the admin/moderator overview (any privacy/state), with block status.
      required: [id, title, privacy, state, channel_handle, channel_display_name, views, created_at, blocked]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [draft, processing, scheduled, quarantined, published, failed]
        channel_handle:
          type: string
        channel_display_name:
          type: string
        views:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        blocked:
          type: boolean
          description: Whether the video is currently blocked (hidden from public surfaces).
    AdminVideoListResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/AdminVideo"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    AdminComment:
      type: object
      description: A comment in the admin/moderator overview, with author + video context.
      required: [id, video_id, video_title, body, author_username, author_display_name, remote, created_at, deleted]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        video_title:
          type: string
        body:
          type: string
        author_username:
          type: string
        author_display_name:
          type: string
        remote:
          type: boolean
          description: True for a federated comment authored on another instance.
        author_domain:
          type: string
          description: The remote author's origin instance; omitted for local comments.
        created_at:
          type: string
          format: date-time
        deleted:
          type: boolean
          description: >-
            True for a tombstoned comment (its author's account was permanently
            deleted); body renders as "[deleted]".
    AdminCommentListResponse:
      type: object
      required: [comments, limit, offset]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/AdminComment"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    WatchedWord:
      type: object
      description: A term on the instance-wide watched-words list.
      required: [id, word, created_at]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
        created_by_username:
          type: string
          description: Username of the moderator who added it; omitted on the create response or if that account was deleted.
        created_at:
          type: string
          format: date-time
    WatchedWordListResponse:
      type: object
      required: [words, limit, offset]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/WatchedWord"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    WatchedWordMatch:
      type: object
      description: >-
        Content flagged by the watched-words list, for moderator review: a
        comment (type "comment"; comment_id/comment_body present, video_id is
        the video it is on) or a video (type "video"; comment fields absent,
        video_id/video_title are the flagged video). author_username is the
        comment's author or the video's owner respectively.
      required: [id, word, type, video_id, video_title, author_username, created_at]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
          description: The watched term that matched.
        type:
          type: string
          enum: [comment, video]
          description: What was flagged.
        comment_id:
          type: string
          format: uuid
          description: The flagged comment (comment matches only).
        comment_body:
          type: string
          description: The flagged comment's body (comment matches only).
        video_id:
          type: string
          format: uuid
          description: The flagged video, or the video the flagged comment is on.
        video_title:
          type: string
          description: The video's title (a link target for the review queue).
        author_username:
          type: string
        created_at:
          type: string
          format: date-time
    WatchedWordMatchListResponse:
      type: object
      required: [matches, limit, offset]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/WatchedWordMatch"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    CreateWatchedWordRequest:
      type: object
      required: [word]
      properties:
        word:
          type: string
          maxLength: 100
    AdminUser:
      type: object
      description: Admin projection of an account (never includes the password hash).
      required: [id, username, email, role, is_active, email_verified, bypass_quarantine, display_name, storage_quota_bytes, storage_used_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
        bypass_quarantine:
          type: boolean
          description: >-
            Whether this account is exempt from the QUARANTINE_NEW_UPLOADS
            gate — its uploads publish directly like a moderator's.
        display_name:
          type: string
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          description: >-
            Per-user storage quota override in bytes. null = the instance
            default (INSTANCE_DEFAULT_QUOTA_BYTES) applies; 0 = unlimited for
            this account.
        storage_used_bytes:
          type: integer
          format: int64
          description: >-
            The account's current storage usage: total stored bytes of its
            video files (originals, renditions, thumbnails) across the videos
            owned via its channels.
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    QuotaStatus:
      type: object
      description: >-
        The caller's storage picture: bytes currently stored and the effective
        quota (per-user override, else the instance default). quota_bytes is
        null when the caller is unlimited.
      required: [used_bytes, quota_bytes]
      properties:
        used_bytes:
          type: integer
          format: int64
          description: >-
            Total stored bytes of the caller's video files (originals,
            renditions, thumbnails) across the videos owned via their channels.
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: Effective storage quota in bytes; null = unlimited.
    DeleteAccountRequest:
      type: object
      description: >-
        Password confirmation for the irreversible account hard delete (a
        stolen access token alone must not be able to destroy the account).
      required: [password]
      properties:
        password:
          type: string
          format: password
    AccountExportStatus:
      type: object
      description: The status of the caller's most recent account export job.
      required: [id, state, download_ready, requested_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
          description: >-
            pending/running while the archive is being assembled; done once
            downloadable; failed after the job exhausted its retries.
        download_ready:
          type: boolean
          description: >-
            True when GET /api/v1/me/export/download will serve the archive
            (state done and not yet expired).
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the finished archive stops being downloadable (7 days after
            completion); null while the export has not finished.
    AccountArchive:
      type: object
      description: >-
        A vidra account export archive (format version 1): the user's own data
        as one JSON document. Contains NO password hash and NO tokens. Media
        files are not bundled — each video entry carries
        original_download_url, the (owner-gated) API URL of its original file,
        valid while the account and video exist. This same shape is what
        POST /api/v1/me/import accepts.
      required: [vidra_export, profile]
      properties:
        vidra_export:
          type: object
          description: Format marker.
          required: [version, generated_at]
          properties:
            version:
              type: integer
              description: Archive format version (currently 1).
            generated_at:
              type: string
              format: date-time
            instance:
              type: string
              description: Public origin of the exporting instance.
        profile:
          type: object
          required: [username, email, display_name, bio, unlisted, email_verified, created_at]
          properties:
            username:
              type: string
            email:
              type: string
            display_name:
              type: string
            bio:
              type: string
            unlisted:
              type: boolean
            email_verified:
              type: boolean
            created_at:
              type: string
              format: date-time
        notification_prefs:
          type: array
          items:
            type: object
            required: [type, enabled]
            properties:
              type:
                type: string
              enabled:
                type: boolean
        channels:
          type: array
          description: Owned channels (metadata only; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              handle:
                type: string
              display_name:
                type: string
              description:
                type: string
              created_at:
                type: string
                format: date-time
        videos:
          type: array
          description: >-
            Owned videos' metadata including taxonomy and tags (media not
            bundled; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              channel_handle:
                type: string
              title:
                type: string
              description:
                type: string
              privacy:
                type: string
              state:
                type: string
              category:
                type: [string, "null"]
              language:
                type: [string, "null"]
              license:
                type: [string, "null"]
              tags:
                type: array
                items:
                  type: string
              publish_at:
                type: [string, "null"]
                format: date-time
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              original_download_url:
                type: string
                description: >-
                  Where the video's original file can be downloaded (media is
                  not bundled in the archive).
        playlists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              visibility:
                type: string
              video_ids:
                type: array
                items:
                  type: string
              created_at:
                type: string
                format: date-time
        comments:
          type: array
          description: The account's own comments (not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              video_id:
                type: string
                format: uuid
              body:
                type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        follows:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type: string
                format: uuid
              channel_handle:
                type: string
              followed_at:
                type: string
                format: date-time
        saved_videos:
          type: array
          description: Watch-later entries (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              saved_at:
                type: string
                format: date-time
        watch_history:
          type: array
          description: Watch history with resume positions (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              position_seconds:
                type: integer
              watched_at:
                type: string
                format: date-time
    AccountImportSummary:
      type: object
      description: >-
        What POST /api/v1/me/import re-created (safe subsets only) and what it
        skipped.
      required:
        - profile_applied
        - playlists_created
        - playlist_items_added
        - playlist_items_skipped
        - follows_created
        - follows_skipped
        - notification_prefs_applied
        - notification_prefs_skipped
        - skipped_sections
      properties:
        profile_applied:
          type: boolean
          description: True when display_name/bio were applied from the archive.
        playlists_created:
          type: integer
        playlist_items_added:
          type: integer
        playlist_items_skipped:
          type: integer
          description: Items whose video does not exist on this instance.
        follows_created:
          type: integer
        follows_skipped:
          type: integer
          description: Follows of channels not present locally.
        notification_prefs_applied:
          type: integer
        notification_prefs_skipped:
          type: integer
          description: Preferences for notification types this build does not know.
        skipped_sections:
          type: object
          description: >-
            Counts of archive entries that are not importable in v1, keyed by
            section (channels, videos, comments, saved_videos, watch_history,
            playlists).
          additionalProperties:
            type: integer
    LiveStream:
      type: object
      required: [id, channel_id, title, description, privacy, state, permanent, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [offline, live, ended]
          description: RTMP ingestion (a later boundary) flips this; starts offline.
        permanent:
          type: boolean
          description: A permanent/recurring live keeps its key across sessions.
        replay_enabled:
          type: boolean
          description: >-
            When true, the media server records each session and the api
            republishes the recording as a normal on-demand video on ingest-stop
            (privacy inherited). Default false.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        channel_handle:
          type: string
          description: Owning channel handle (on the single-stream get).
        channel_display_name:
          type: string
        hls_url:
          type: string
          description: >-
            Live HLS playlist path, present only while the stream is live and a
            media server (LIVE_HLS_ROOT) is configured to serve it.
    CreateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          default: false
          description: Record sessions and republish them as VODs (see LiveStream.replay_enabled).
    UpdateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          default: false
    CreateLiveStreamResponse:
      type: object
      required: [live_stream, stream_key]
      properties:
        live_stream:
          $ref: "#/components/schemas/LiveStream"
        stream_key:
          type: string
          description: The private stream key, shown ONCE. Put it in your encoder (OBS).
        rtmp_url:
          type: string
          description: RTMP ingest base URL (omitted when no ingest is configured).
    LiveStreamListResponse:
      type: object
      required: [live_streams]
      properties:
        live_streams:
          type: array
          items:
            $ref: "#/components/schemas/LiveStream"
    LiveStreamKey:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The new stream key, shown ONCE.
        rtmp_url:
          type: string
    LiveIngestRequest:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The publisher's raw stream key, as presented to the RTMP ingest.
    StartConversationRequest:
      type: object
      required: [recipient_id]
      properties:
        recipient_id:
          type: string
          format: uuid
        encrypted:
          type: boolean
          default: false
          description: >-
            Choose the conversation type AT CREATION, immutably. An encrypted
            conversation stores only opaque per-device ciphertext envelopes
            (the server holds no keys and cannot decrypt); a plaintext one only
            {body} messages. A pair of users can have one of each — the two
            types are distinct conversations.
    Conversation:
      type: object
      required: [id, encrypted, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        encrypted:
          type: boolean
          description: Immutable conversation type, chosen at creation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationSummary:
      type: object
      description: "A conversation in the inbox: the other participant + last message preview (always empty for encrypted conversations — envelopes are opaque)."
      required: [id, updated_at, encrypted, other_user_id, other_username, other_display_name, last_message_body, last_message_at]
      properties:
        id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
        encrypted:
          type: boolean
        other_user_id:
          type: string
          format: uuid
        other_username:
          type: string
        other_display_name:
          type: string
        last_message_body:
          type: string
          description: Empty when the conversation has no messages yet, and always empty for encrypted conversations.
        last_message_at:
          type: string
          format: date-time
    ConversationListResponse:
      type: object
      required: [conversations, limit, offset]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    SendMessageRequest:
      type: object
      description: >-
        The PLAINTEXT send shape — valid only on a plaintext conversation
        (sending it to an encrypted conversation is 422, and vice versa).
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    EncryptedEnvelope:
      type: object
      description: >-
        One per-recipient-device ciphertext blob. The CLIENT encrypts once per
        device pair (Olm session) and fans out; the server stores each blob
        opaquely and returns it byte-identical.
      required: [recipient_device_id, message_type, ciphertext]
      properties:
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
          description: "Olm message type: 0 = prekey message, 1 = normal message."
        ciphertext:
          type: string
          maxLength: 65536
          description: Opaque ciphertext, at most 64 KiB. Never inspected or logged by the server.
    SendEncryptedMessageRequest:
      type: object
      description: >-
        The ENCRYPTED send shape — valid only on an encrypted conversation.
        One envelope per recipient device (including the sender's other
        devices); every recipient device must belong to a participant of the
        conversation, and the sender device to the caller.
      required: [sender_device_id, envelopes]
      properties:
        sender_device_id:
          type: string
          format: uuid
          description: One of the caller's registered E2EE devices.
        envelopes:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/EncryptedEnvelope"
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 30
          maximum: 7776000
          description: >-
            Optional disappearing-message timer (30 seconds to 90 days). Stamps
            expires_at on every envelope; expired envelopes vanish from reads
            immediately and are hard-deleted by a background sweeper.
    SendEncryptedResponse:
      type: object
      description: Summary of an accepted encrypted send (the envelopes are not echoed back).
      required: [conversation_id, envelope_count, created_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        envelope_count:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present when a disappearing-message timer was set.
    EncryptedMessage:
      type: object
      description: >-
        A stored envelope, returned only to the owner of its recipient device.
        The ciphertext is byte-identical to what the sender posted — the server
        cannot decrypt it.
      required: [id, conversation_id, sender_user_id, sender_device_id, recipient_device_id, message_type, ciphertext, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        sender_device_id:
          type: string
          format: uuid
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
        ciphertext:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present on disappearing messages.
    EncryptedMessageListResponse:
      type: object
      description: A page of the CALLER's devices' envelopes, newest first (expired ones filtered).
      required: [envelopes, limit, offset]
      properties:
        envelopes:
          type: array
          items:
            $ref: "#/components/schemas/EncryptedMessage"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RegisterE2EEDeviceRequest:
      type: object
      required: [device_name, identity_key, signing_key]
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-visible label ("Ada's laptop").
        identity_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Curve25519 identity key (base64). Private keys never leave the device.
        signing_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Ed25519 signing key (base64).
    E2EEDevice:
      type: object
      description: A registered E2EE device. Carries PUBLIC key material only.
      required: [id, user_id, device_name, identity_key, signing_key, created_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_name:
          type: string
        identity_key:
          type: string
        signing_key:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    E2EEDeviceListResponse:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/E2EEDevice"
    E2EEOneTimeKey:
      type: object
      description: One public one-time prekey (client-assigned key_id).
      required: [key_id, key]
      properties:
        key_id:
          type: string
          maxLength: 64
        key:
          type: string
          maxLength: 512
    UploadOneTimeKeysRequest:
      type: object
      required: [one_time_keys]
      properties:
        one_time_keys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/E2EEOneTimeKey"
    UploadOneTimeKeysResponse:
      type: object
      required: [unclaimed]
      properties:
        unclaimed:
          type: integer
          format: int64
          description: The device's unclaimed one-time-key count after the upload.
    OneTimeKeyCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
    E2EEClaim:
      type: object
      description: >-
        One device's claim result: its public identity plus one ATOMICALLY
        claimed (single-use) one-time key — null when the device has none left.
      required: [device_id, identity_key, signing_key, one_time_key]
      properties:
        device_id:
          type: string
          format: uuid
        identity_key:
          type: string
        signing_key:
          type: string
        one_time_key:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/E2EEOneTimeKey"
    E2EEClaimResponse:
      type: object
      required: [user_id, claims]
      properties:
        user_id:
          type: string
          format: uuid
        claims:
          type: array
          items:
            $ref: "#/components/schemas/E2EEClaim"
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        sender_username:
          type: string
        sender_display_name:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
    MessageListResponse:
      type: object
      required: [messages, limit, offset]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    AuditLogEntry:
      type: object
      description: A durable security-audit record. Never contains secrets/PII.
      required: [id, action, result, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: Stable dot-namespaced action id (e.g. auth.login).
          example: auth.login
        result:
          type: string
          enum: [success, failure]
        actor_id:
          type: string
          format: uuid
          description: The acting account's id; omitted for unauthenticated events.
        actor_username:
          type: string
          description: Resolved best-effort; omitted if the account is deleted/unknown.
        reason:
          type: string
          description: Safe, non-sensitive classification (e.g. invalid_credentials).
        request_id:
          type: string
        occurred_at:
          type: string
          format: date-time
    AuditLogListResponse:
      type: object
      required: [entries, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    MediaGCRequest:
      type: object
      description: Media garbage-collection request. dry_run defaults to true.
      properties:
        dry_run:
          type: boolean
          default: true
          description: >-
            When true (default), report the would-delete orphan set without
            deleting anything. Pass false to actually delete the orphans.
    MediaGCResponse:
      type: object
      required: [dry_run, scanned, orphans, deleted]
      properties:
        dry_run:
          type: boolean
        scanned:
          type: integer
          description: Total stored objects listed across the known prefixes.
        orphans:
          type: array
          items:
            type: string
          description: Orphan object keys — the would-delete set on a dry run, the deleted set otherwise.
        deleted:
          type: integer
          description: Number of orphans actually deleted (0 on a dry run).
    SystemStatus:
      type: object
      description: Operational snapshot for the admin dashboard. No secrets/PII.
      required: [status, software, environment, uptime_seconds, components]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        software:
          type: object
          required: [name, version, commit, build_date, go_version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
            commit:
              type: string
            build_date:
              type: string
            go_version:
              type: string
        environment:
          type: string
          enum: [development, test, production]
        uptime_seconds:
          type: integer
          format: int64
        components:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                description: ok | down | not_configured
              error:
                type: string
    UpdateUserRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
          description: >-
            Admin-set email verification state: true marks the address
            confirmed without the token round-trip; false revokes the
            confirmation. Omit to leave unchanged.
        bypass_quarantine:
          type: boolean
          description: >-
            Exempts the account from the QUARANTINE_NEW_UPLOADS gate (its
            uploads publish directly); false re-subjects it. Omit to leave
            unchanged.
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            Per-user storage quota in bytes. Omit to leave unchanged; null
            resets the account to the instance default; 0 makes the account
            unlimited. Negative or non-integer values are 422.
    VideoFile:
      type: object
      description: >-
        A stored file backing a video. The storage key is internal and not
        exposed.
      required: [id, kind, content_type, original_name, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [original, rendition]
        content_type:
          type: string
          description: The client-declared MIME type (untrusted, for display only).
          example: video/mp4
        original_name:
          type: string
          description: The client-declared filename (untrusted, for display only).
          example: Clip.MP4
        size_bytes:
          type: integer
          format: int64
          description: Number of bytes actually stored.
          example: 10485760
        created_at:
          type: string
          format: date-time
    UploadVideoFileResponse:
      type: object
      required: [video, file]
      properties:
        video:
          $ref: "#/components/schemas/Video"
        file:
          $ref: "#/components/schemas/VideoFile"
    ImportVideoRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: >-
            Public http/https URL of the media file to import. The server refuses
            non-http schemes and non-public addresses (SSRF-guarded).
          example: https://example.com/clip.mp4
    ImportJob:
      type: object
      description: An asynchronous URL-import job for a video's original file.
      required: [id, video_id, state, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            source URL.
        attempts:
          type: integer
          description: How many times the import has been attempted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportJobResponse:
      type: object
      required: [import_job]
      properties:
        import_job:
          $ref: "#/components/schemas/ImportJob"
    AutoCaptionRequest:
      type: object
      description: >-
        Optional body for an auto-caption request. When language is omitted the
        server uses WHISPER_DEFAULT_LANGUAGE.
      properties:
        language:
          type: string
          description: >-
            BCP-47-ish caption language tag (e.g. en, pt-BR). It is both the tag
            the generated track is stored under and the transcription hint.
          example: en
    CaptionJob:
      type: object
      description: An asynchronous auto-caption (Whisper) job for a video.
      required: [id, video_id, language, state, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        language:
          type: string
          description: The caption language tag the generated track is stored under.
        state:
          type: string
          enum: [pending, running, done, failed]
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            Whisper endpoint URL.
        attempts:
          type: integer
          description: How many times the auto-caption has been attempted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CaptionJobResponse:
      type: object
      required: [caption_job]
      properties:
        caption_job:
          $ref: "#/components/schemas/CaptionJob"
    CreateUploadSessionRequest:
      type: object
      required: [size, filename]
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: The total size of the file to upload, in bytes.
          example: 104857600
        filename:
          type: string
          description: >-
            The client filename; its extension must be an accepted video
            container (validated up front).
          example: clip.mp4
    UploadSessionResponse:
      type: object
      description: The opened resumable upload session.
      required: [upload_id, chunk_size, total_chunks, size, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
        chunk_size:
          type: integer
          description: >-
            The fixed chunk size in bytes (8 MiB). Every chunk but the last must
            be exactly this many bytes.
        total_chunks:
          type: integer
          description: How many chunks to upload (indices 0 … total_chunks-1).
        size:
          type: integer
          format: int64
          description: The declared total size, echoed back.
        expires_at:
          type: string
          format: date-time
          description: When the session (and its uploaded chunks) expire (24h).
    UploadStatusResponse:
      type: object
      description: A resumable upload's received-chunk status (the resume contract).
      required:
        - upload_id
        - video_id
        - state
        - size
        - chunk_size
        - total_chunks
        - received_chunks
        - bytes_received
        - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [active, completed, cancelled]
        size:
          type: integer
          format: int64
        chunk_size:
          type: integer
        total_chunks:
          type: integer
        received_chunks:
          type: array
          items:
            type: integer
          description: The chunk indices that have landed, ascending.
        bytes_received:
          type: integer
          format: int64
          description: The total bytes received across all landed chunks.
        expires_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ada
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        note:
          type: string
          maxLength: 2000
          description: >-
            Optional message to moderators, used only when the instance requires
            registration approval; ignored otherwise.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RegistrationPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
          description: The signup is queued for admin approval; no account exists yet.
    RegistrationRequest:
      type: object
      required: [id, username, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        note:
          type: string
          description: Optional applicant message.
        status:
          type: string
          enum: [pending, approved, rejected]
        moderator_note:
          type: string
          description: Internal note recorded when the request was rejected.
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        reviewer_username:
          type: string
          description: Username of the admin who reviewed it; omitted while pending.
    RegistrationRequestListResponse:
      type: object
      required: [requests, limit, offset]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationRequest"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RejectRegistrationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: Optional internal moderator note (not shown to the applicant).
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          format: password
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: >-
            The opaque refresh token returned by register/login/refresh. May be
            omitted when the request carries the `vidra_refresh` cookie (cookie
            mode) — the cookie value is used instead. An explicit body token
            takes precedence over the cookie. 422 when neither is present.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the rotated session into cookie mode even when the token was
            sent in the body. A cookie-supplied token implies cookie mode.
    AuthResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
          description: Signed HS256 JWT access token.
        refresh_token:
          type: string
          description: >-
            Opaque rotating refresh token; store securely, send to /auth/refresh.
            Omitted in cookie mode, where the httpOnly `vidra_refresh` cookie is
            the sole carrier of the refresh token.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"
    MFARequiredResponse:
      type: object
      required: [mfa_required, mfa_token]
      description: >-
        Login outcome for an account with two-factor authentication enabled:
        the credentials were valid but no session is issued yet. Present the
        mfa_token with a TOTP or recovery code at POST /api/v1/auth/mfa/challenge.
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
          description: >-
            Short-lived (5 min) single-purpose token. Not an access token — it
            is only accepted by the MFA challenge endpoint.
    MFAStatusResponse:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enabled.
        recovery_codes_remaining:
          type: integer
          description: Unused single-use recovery codes left (0 when disabled).
          example: 10
    TOTPEnrollmentResponse:
      type: object
      required: [secret, otpauth_uri]
      description: >-
        Returned exactly once when enrollment starts; neither field can be
        retrieved again.
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret, for manual authenticator entry.
        otpauth_uri:
          type: string
          description: >-
            otpauth:// provisioning URI (QR-code payload) carrying the secret,
            the account label, and the instance's issuer name.
    RecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: >-
            The 10 single-use recovery codes, shown exactly once (stored
            hashed). Each replaces a TOTP code at the MFA challenge and is
            consumed on use.
          items:
            type: string
            example: a1b2c-3d4e5
    MFAChallengeRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: The mfa_token from the login response (valid 5 minutes).
        code:
          type: string
          description: >-
            The current 6-digit authenticator code (±1 period of clock skew is
            tolerated) or one unused recovery code.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients), exactly
            like login: the rotating refresh token is set as an httpOnly
            `vidra_refresh` cookie and omitted from the response body.
