        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Enabled, but status aggregation is not implemented yet (P19.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: IPFS mirroring is not enabled on this instance (ipfs_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/ipfs/reconcile:
    post:
      operationId: reconcileIPFS
      summary: Kick an IPFS reconciliation/backfill scan (admin)
      description: >-
        Triggers an immediate reconciliation scan of the IPFS mirror: re-enqueue
        failed pins and upsert pin intents for eligible ALREADY-PUBLIC objects that
        have no ledger row yet (the outage-backfill path). Idempotent — a second
        run enqueues nothing new. Returns 503 ipfs_disabled when IPFS_ENABLED=false.
        Restricted to admins; audited. (The real scan is delivered in P19.6; until
        then an enabled instance answers 501 not_implemented.)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [public, private]
          description: >-
            Optional swarm filter (fix_plan P19.P2): scope the backfill seeding to the
            public or private mirror only. Omit to reconcile both. An object is seeded
            on its own eligible swarm regardless; this only restricts which swarm's
            objects are considered.
      responses:
        "202":
          description: The scan was accepted; counts of what was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPFSReconcileResult"
        "400":
          description: The network filter is neither 'public' nor 'private'.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Enabled, but the reconcile scan is not implemented yet (P19.6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: IPFS mirroring is not enabled on this instance (ipfs_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/media/gc:
    post:
      operationId: adminMediaGC
      summary: Run media garbage collection (admin)
      description: >-
        Sweeps stored media objects under the known prefixes (originals,
        thumbnails, storyboards, captions, the HLS tree, playlist covers) and
        deletes those with no database reference. Never lists or touches an
        unknown prefix. Defaults to a dry run — pass dry_run=false to actually
        delete. Restricted to admins; audited. Returns the scanned count, the
        orphan keys, and the number deleted (0 on a dry run). The daily scheduled
        sweep runs the same collector.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaGCRequest"
      responses:
        "200":
          description: The sweep result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGCResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The storage backend does not support listing (GC unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests:
    get:
      operationId: listRegistrationRequests
      summary: List the registration approval queue
      description: >-
        Returns registration requests, newest first, with the reviewing admin's
        username. Restricted to admins. status=pending returns only unresolved
        requests. Paginated via limit (1–100, default 20) and offset. The stored
        password hash is never exposed.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Set to "pending" to return only unresolved requests.
          schema:
            type: string
            enum: [pending]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of registration requests (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequestListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/approve:
    post:
      operationId: approveRegistrationRequest
      summary: Approve a registration request
      description: >-
        Approves a pending request, creating the account from the stored
        credentials (atomically). Admin only. An unknown/already-resolved id is
        404; a username/email taken since the request was filed is 409.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The request was approved and the account created.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username or email is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/reject:
    post:
      operationId: rejectRegistrationRequest
      summary: Reject a registration request
      description: >-
        Rejects a pending request with an optional internal moderator note.
        Admin only. An unknown/already-resolved id is 404.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRegistrationRequest"
      responses:
        "204":
          description: The request was rejected.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests:
    get:
      operationId: listFederationFollowerRequests
      summary: List the federation follower-approval queue
      description: >-
        Returns pending inbound ActivityPub channel Follows awaiting an admin
        decision, newest first, while federation_follower_approval is on
        (config-parity W12). Modeled on the registration-requests queue.
        Restricted to admins. Paginated via limit (1–100, default 20) and
        offset. A vidra deviation from PeerTube recorded in the parity ledger:
        approval applies to CHANNEL followers because vidra has no
        instance-level AP actor. Governs the ActivityPub inbox only — the
        ATProto integration is outbound cross-posting with no inbound path.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of pending follower requests (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationFollowerRequestListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests/{id}/approve:
    post:
      operationId: approveFederationFollowerRequest
      summary: Approve a pending channel follower
      description: >-
        Approves one pending inbound channel Follow: the follow flips to
        accepted and the Accept activity is queued to the follower's inbox
        (the delivery the remote has been waiting on). When
        federation_auto_follow_back is on, an instance-initiated follow-back of
        the follower is queued too — signed by the FOLLOWED CHANNEL's actor,
        since vidra has no instance-level AP actor. Admin only; audited
        (admin.federation.follower_approve, safe row id only). An
        unknown/already-resolved id is 404. ActivityPub only.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follower was approved and the Accept queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending follower request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests/{id}/reject:
    post:
      operationId: rejectFederationFollowerRequest
      summary: Reject a pending channel follower
      description: >-
        Rejects one pending inbound channel Follow: the pending follow is
        removed and a Reject activity is queued to the follower's inbox. Admin
        only; audited (admin.federation.follower_reject, safe row id only). An
        unknown/already-resolved id is 404. ActivityPub only.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follower was rejected and the Reject queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending follower request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List accounts (admin)
      description: >-
        Returns accounts, newest first, optionally filtered by a username/email
        substring (q). Restricted to admins. Paginated via limit (1–100, default
        20) and offset.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Username/email substring filter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Edit a user's role / active flag / storage quota (admin)
      description: >-
        Updates a user's role, active flag, and/or storage quota (partial).
        Restricted to admins. An admin cannot demote or deactivate their own
        account (422). An unknown id is 404. Deactivating revokes the user's
        sessions. storage_quota_bytes is tri-state — omitted: unchanged; null:
        reset to the instance default; a non-negative integer: per-user
        override (0 = unlimited).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or an attempt to self-demote/deactivate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      summary: Permanently delete a user's account (admin, hard delete)
      description: >-
        IRREVERSIBLE admin variant of the account hard delete, with the same
        semantics as DELETE /api/v1/auth/me (owned channels/videos purged with
        federation Delete fan-out and best-effort blob cleanup, comments
        tombstoned, per-user data erased, sessions revoked, account row
        anonymised) but no password confirmation. Self-guarded: an admin
        cannot hard-delete their own account this way (422).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account was permanently deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user (or already deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Attempt to hard-delete the caller's own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: One of ok, down, not_configured.
          example: ok
        error:
          type: string
          description: Present only when the component is down.
    ReadinessResponse:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          description: ok when all dependencies are reachable, otherwise degraded.
          example: ok
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
    VersionResponse:
      type: object
      required: [name, version, commit, build_date, go]
      properties:
        name:
          type: string
          example: vidra
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: Short git SHA, or "unknown" when not built with ldflags.
          example: a1b2c3d
        build_date:
          type: string
          description: UTC build timestamp (RFC 3339), or "unknown".
          example: 2026-06-19T00:00:00Z
        go:
          type: string
          example: go1.26
    ErrorResponse:
      type: object
      description: >-
        The single, consistent error envelope returned by every endpoint for
        non-2xx responses (except the readiness probe, which returns
        ReadinessResponse on 503).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case identifier for the error class.
              example: not_found
            message:
              type: string
              description: Human-readable description; never leaks internal detail on 5xx.
              example: resource not found
            request_id:
              type: string
              description: Correlates the response with server logs. Omitted when unknown.
            fields:
              type: array
              description: >-
                Field-level validation problems. Present only on validation
                failures (422 unprocessable_entity).
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: must be a valid email
    InstanceResponse:
      type: object
      required: [name, description, short_description, software, registration_enabled,
                 registration_requires_approval, oauth_providers, federation_enabled,
                 terms_url, privacy_url, contact_email, default_language, categories,
                 moderator_languages, server_country, is_sensitive,
                 sensitive_content_policy, contact_form_enabled, social_links, features,
                 branding, defaults, broadcast, customization, social, homepage, live,
                 search]
      properties:
        name:
          type: string
          example: Vidra
        description:
          type: string
          description: >-
            Operator-provided long description (raw markdown); may be empty.
        short_description:
          type: string
          description: Operator-provided short plain-text description; may be empty.
        default_language:
          type: string
          description: >-
            The instance's default content language — a taxonomy language id
            from GET /videos/config. Defaults to "en".
          example: en
        categories:
          type: array
          items:
            type: string
          description: >-
            The operator-selected main instance categories (taxonomy category
            ids from GET /videos/config). Empty when unset.
        moderator_languages:
          type: array
          items:
            type: string
          description: >-
            Languages the operator/moderators speak (taxonomy language ids
            from GET /videos/config). Empty when unset.
        server_country:
          type: string
          description: Free-text server country name; may be empty.
        is_sensitive:
          type: boolean
          description: Whether this instance is dedicated to sensitive content.
        sensitive_content_policy:
          type: string
          enum: [hide, warn, blur, display]
          description: >-
            The instance policy for videos flagged sensitive. "hide" is
            enforced server-side (flagged videos are excluded from the public
            feed and search); warn/blur/display are presentation-only hints
            the frontend applies.
        contact_form_enabled:
          type: boolean
          description: >-
            EFFECTIVE contact-form availability: the admin toggle is on AND an
            effective contact email is set AND the deployment has an outbound
            mail path. POST /api/v1/instance/contact answers 409 whenever this
            is false.
        social_links:
          type: object
          required: [website, mastodon, x, bluesky]
          description: Operator social/link row; each value is "" when unset.
          properties:
            website:
              type: string
            mastodon:
              type: string
            x:
              type: string
            bluesky:
              type: string
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        registration_enabled:
          type: boolean
          description: Whether public account signup is currently accepted.
        registration_requires_approval:
          type: boolean
          description: >-
            Whether signup files a pending request for admin approval instead of
            creating an account immediately (only relevant when registration is
            enabled).
        oauth_providers:
          type: array
          items:
            type: string
          description: >-
            Configured OIDC login provider names, in display order. Render a
            "continue with <provider>" button per entry, navigating (top-level)
            to GET /api/v1/auth/oauth/{provider}. Empty when OAuth login is off.
          example: [google]
        federation_enabled:
          type: boolean
          description: >-
            Whether ActivityPub federation is enabled on this instance (gates
            remote-content surfaces such as remote follows and remote videos).
        terms_url:
          type: string
          description: Link to the instance terms of service; may be empty.
        privacy_url:
          type: string
          description: Link to the instance privacy policy; may be empty.
        contact_email:
          type: string
          description: Operator contact email; may be empty.
        features:
          type: object
          required:
            - uploads
            - imports
            - live
            - comments
            - downloads
            - import_http
            - channel_sync
            - storyboards
            - transcription
            - user_import
            - user_export
            - transcoding
            - mail
          description: >-
            Effective feature toggles (the DB-backed instance-settings overlay
            over static config). The frontend disables the matching affordances
            in lock-step with the backend's enforcement. The config-parity W8
            flags (import_http, channel_sync, storyboards, transcription,
            user_import, user_export) and the W10 transcoding flag report
            EFFECTIVE availability — the runtime admin setting AND, where one
            exists, the deployment's boot capability (yt-dlp resolver, Whisper
            endpoint, ffmpeg/ffprobe). The mail flag is pure boot capability
            (an outbound mail path exists).
          properties:
            uploads:
              type: boolean
              description: Whether new video uploads are accepted.
            imports:
              type: boolean
              description: Whether URL video import is accepted.
            live:
              type: boolean
              description: Whether creating live streams is allowed.
            comments:
              type: boolean
              description: Whether posting comments is allowed.
            downloads:
              type: boolean
              description: >-
                Whether regular users may download video media. Moderators and
                admins retain download access when this operator toggle is off.
            import_http:
              type: boolean
              description: >-
                Whether the yt-dlp platform-URL import path is available
                (imports on, import_http_enabled on, and the yt-dlp resolver
                wired on this deployment).
            channel_sync:
              type: boolean
              description: >-
                Whether channel auto-sync is available (channel_sync_enabled
                on, the platform import path on, and the yt-dlp resolver wired).
            storyboards:
              type: boolean
              description: >-
                Whether seek-preview storyboard generation is enabled
                (storyboards_enabled). Already-stored storyboards keep serving
                when this is off.
            transcription:
              type: boolean
              description: >-
                Whether Whisper auto-captioning is available
                (transcription_enabled on AND a Whisper endpoint configured).
            user_import:
              type: boolean
              description: Whether POST /api/v1/me/import accepts account archives.
            user_export:
              type: boolean
              description: Whether POST /api/v1/me/export accepts export requests.
            transcoding:
              type: boolean
              description: >-
                Whether the HLS transcoding pipeline is effectively available
                (transcoding_enabled on AND ffmpeg/ffprobe wired at boot,
                config-parity W10). Already-produced playlists keep serving
                when this is false; new uploads stay playable via the retained
                original.
            mail:
              type: boolean
              description: >-
                Whether this deployment has an outbound mail path (an SMTP
                relay via MAIL_ENABLED, or the dev capture seam) — a boot
                capability, not a runtime setting. The admin UI renders the
                mail-dependent settings (email_subject_prefix,
                email_body_signature, contact_form_enabled)
                disabled-with-explanation when false, since they are inert
                without a mailer (config-parity W6 email seam).
        branding:
          type: object
          description: >-
            Instance imagery (config-parity W1 shape; W4 populates the
            frontend consumers). Each slot carries its public serving URL
            ("" when unset) and an is_fallback flag telling the client to use
            its built-in default imagery. The response also gains an ETag and
            Cache-Control s-maxage=60.
          required: [avatar, banner, logos, hide_instance_name]
          properties:
            avatar:
              $ref: "#/components/schemas/InstanceAssetRef"
            banner:
              $ref: "#/components/schemas/InstanceAssetRef"
            logos:
              type: object
              required: [favicon, header_wide, header_square, opengraph]
              properties:
                favicon:
                  $ref: "#/components/schemas/InstanceAssetRef"
                header_wide:
                  $ref: "#/components/schemas/InstanceAssetRef"
                header_square:
                  $ref: "#/components/schemas/InstanceAssetRef"
                opengraph:
                  $ref: "#/components/schemas/InstanceAssetRef"
            hide_instance_name:
              type: boolean
              description: >-
                Hide the textual instance name in the header (meaningful once
                a header logo is set).
        defaults:
          type: object
          description: >-
            Operator-tuned client behaviour defaults (W5/W9 consume): what
            anonymous visitors see first and how publish forms are seeded.
          required: [feed_sort, feed_scope, landing_page, theme,
                     player_autoplay, miniature_prefer_author_display_name, publish]
          properties:
            feed_sort:
              type: string
              enum: [recent, popular, trending]
            feed_scope:
              type: string
              enum: [local, all]
            landing_page:
              type: string
              enum: [home-recent, trending, local, home]
              description: >-
                "home" is the admin-authored homepage document and only takes
                effect once one is set (homepage.enabled).
            theme:
              type: string
              enum: [system, light, dark]
            player_autoplay:
              type: boolean
              description: >-
                Seeds BOTH start-on-open and autoplay-next for anonymous/unset
                users (documented deviation); never overrides an explicit
                per-user preference.
            miniature_prefer_author_display_name:
              type: boolean
            publish:
              type: object
              required: [privacy, licence, comment_policy, download_enabled]
              properties:
                privacy:
                  type: string
                  enum: [public, unlisted, private]
                licence:
                  type: integer
                  format: int64
                  description: PT-compatible licence id; 0 = no default licence.
                comment_policy:
                  type: string
                  enum: [enabled, disabled]
                download_enabled:
                  type: boolean
        broadcast:
          type: object
          description: Operator broadcast banner (W3 renders it).
          required: [enabled, message, level, dismissable]
          properties:
            enabled:
              type: boolean
            message:
              type: string
              description: Raw markdown.
            level:
              type: string
              enum: [info, warning, error]
            dismissable:
              type: boolean
        customization:
          type: object
          description: >-
            Custom CSS/JS references by content hash (never inlined; fetch
            /api/v1/instance/custom.css?v={css_hash}) plus the primary-color
            override.
          required: [css_hash, js_hash, primary_color]
          properties:
            css_hash:
              type: string
              description: sha256 of the custom_css document; "" when unset.
            js_hash:
              type: string
              description: sha256 of the custom_js document; "" when unset.
            primary_color:
              type: string
              description: '"#rrggbb" or "" (no override).'
        social:
          type: object
          description: >-
            Link-card metadata (distinct from social_links.x — twitter:site
            wants a handle, not a profile URL).
          required: [twitter_username]
          properties:
            twitter_username:
              type: string
              example: "@vidra"
        homepage:
          type: object
          description: >-
            Admin-authored homepage document state; the body is fetched from
            GET /api/v1/instance/homepage.
          required: [enabled, hash]
          properties:
            enabled:
              type: boolean
            hash:
              type: string
              description: sha256 of the homepage document; "" when unset.
        live:
          type: object
          description: >-
            Effective live-streaming policy (config-parity W11) so the
            live-create UI can hide the replay toggle, seed its default, and
            explain the caps. features.live stays the master availability
            flag; every limit here uses 0 = unlimited / no limit.
          required: [allow_replay, default_save_replay, max_instance_lives,
                     max_user_lives, max_duration_secs]
          properties:
            allow_replay:
              type: boolean
              description: >-
                Instance master gate for replay-to-VOD: when false, no replay
                is produced regardless of a stream's replay_enabled flag.
            default_save_replay:
              type: boolean
              description: >-
                EFFECTIVE default seeded into a new live stream's
                replay_enabled when the client omits it (the
                live_default_save_replay setting AND allow_replay).
            max_instance_lives:
              type: integer
              format: int64
              description: >-
                Max simultaneous live sessions across the instance, enforced
                at the RTMP publish callback (403 deny). 0 = unlimited.
            max_user_lives:
              type: integer
              format: int64
              description: >-
                Max simultaneous live sessions per user (across all their
                channels), enforced at the same callback. 0 = unlimited.
            max_duration_secs:
              type: integer
              format: int64
              description: >-
                Max live-session duration; a watchdog force-closes over-limit
                sessions (permanent streams return to offline, one-shots end).
                0 = no limit.
        search:
          type: object
          description: >-
            EFFECTIVE remote-URI search gates (config-parity W13): whether a
            URI/handle-shaped search query is resolved to remote content for
            logged-in and anonymous callers. Each flag is the runtime setting
            (search_remote_uri_users / search_remote_uri_anonymous) AND the
            boot capability (federation enabled + wired), so the search UI's
            help text stays in lock-step with the backend gate.
          required: [remote_uri_users, remote_uri_anonymous]
          properties:
            remote_uri_users:
              type: boolean
              description: >-
                Logged-in callers may search by URL/handle (default on).
            remote_uri_anonymous:
              type: boolean
              description: >-
                Anonymous callers may search by URL/handle (default off —
                the SSRF/abuse surface, matching PeerTube).
    InstanceAssetRef:
      type: object
      description: >-
        One instance branding asset reference: its public serving URL ("" when
        unset) and whether the client should fall back to built-in imagery.
      required: [url, is_fallback]
      properties:
        url:
          type: string
          description: Public serving path, e.g. /api/v1/instance/avatar.
        is_fallback:
          type: boolean
    InstanceAboutResponse:
      type: object
      description: >-
        The operator-authored about-page texts (spec instance-platform-info).
        Every field is RAW markdown, "" when unset.
      required: [description, terms, code_of_conduct, moderation_info,
                 administrator_info, creation_reason, maintenance_lifetime,
                 business_model, hardware_info, support_text]
      properties:
        description:
          type: string
          description: The long instance description (same value as GET /instance).
        terms:
          type: string
          description: Terms markdown body (distinct from the terms_url link).
        code_of_conduct:
          type: string
        moderation_info:
          type: string
        administrator_info:
          type: string
          description: Who is behind the instance?
        creation_reason:
          type: string
          description: Why did you create this instance?
        maintenance_lifetime:
          type: string
          description: How long do you plan to maintain it?
        business_model:
          type: string
          description: How will you finance the server?
        hardware_info:
          type: string
        support_text:
          type: string
    InstanceContactRequest:
      type: object
      required: [from_name, from_email, subject, body]
      properties:
        from_name:
          type: string
          minLength: 1
          maxLength: 120
          description: The visitor's name.
        from_email:
          type: string
          maxLength: 254
          description: >-
            The visitor's reply address (set as Reply-To on the delivered
            mail; never the envelope sender).
        subject:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 10
          maxLength: 5000
    OAuthIdentity:
      type: object
      required: [provider, email, created_at]
      properties:
        provider:
          type: string
          description: Configured provider name the identity belongs to.
          example: google
        email:
          type: string
          description: >-
            Email snapshot captured when the identity was linked (display only;
            the account email is authoritative). May be empty.
        created_at:
          type: string
          format: date-time
          description: When the identity was linked.
    OAuthIdentitiesResponse:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/OAuthIdentity"
    NodeInfoResponse:
      type: object
      required: [version, software, instance]
      properties:
        version:
          type: string
          description: NodeInfo schema version.
          example: "2.0"
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        instance:
          type: object
          required: [name]
          properties:
            name:
              type: string
    User:
      type: object
      required: [id, username, email, role, email_verified, display_name, bio, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.test
        role:
          type: string
          enum: [user, moderator, admin]
        email_verified:
          type: boolean
        display_name:
          type: string
          description: Human-facing name; may be empty.
          example: Ada L.
        bio:
          type: string
          description: Short free-text description; may be empty.
        unlisted:
          type: boolean
          description: >-
            Account-level discovery opt-out. When true, the account's channels
            and videos are excluded from public discovery surfaces (video feed,
            search) while direct channel/video URLs keep serving. Default false.
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /users/{id}/avatar).
            Present on GET/PATCH /auth/me; omitted elsewhere.
        has_banner:
          type: boolean
          description: >-
            Whether a profile banner is set (served at GET /users/{id}/banner).
            Present on GET/PATCH /auth/me; omitted elsewhere.
    ProfileImage:
      type: object
      description: >-
        A stored avatar/banner's metadata, returned by the upload endpoints.
        The image itself is served by the corresponding public GET route with
        the Content-Type recorded here.
      required: [kind, content_type, size_bytes, created_at, updated_at]
      properties:
        kind:
          type: string
          enum: [avatar, banner]
        content_type:
          type: string
          description: Derived from the upload's file extension.
          example: image/png
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      description: Partial profile update; provide at least one field.
      properties:
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 1000
        unlisted:
          type: boolean
          description: >-
            Toggle the account-level discovery opt-out (see User.unlisted).
    Channel:
      type: object
      required: [id, owner_id, handle, display_name, description, follower_count, created_at]
      properties:
        follower_count:
          type: integer
          format: int64
          description: Number of users following this channel.
          example: 0
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        handle:
          type: string
          example: ada_makes
        display_name:
          type: string
          example: Ada Makes
        description:
          type: string
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /channels/{handle}/avatar).
        has_banner:
          type: boolean
          description: >-
            Whether a banner is set (served at GET /channels/{handle}/banner).
    CreateChannelRequest:
      type: object
      required: [handle, display_name]
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 30
          description: 3–30 chars; letters, digits, or underscore.
          example: ada_makes
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Ada Makes
        description:
          type: string
          maxLength: 1000
    UpdateChannelRequest:
      type: object
      description: Partial update; provide at least one field. Handle is immutable.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 1000
    ChannelListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    FollowedChannel:
      description: A channel the caller follows, with the follow timestamp.
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [followed_at]
          properties:
            followed_at:
              type: string
              format: date-time
              description: When the caller followed this channel.
    FollowedChannelsResponse:
      type: object
      required: [channels, limit, offset]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/FollowedChannel"
        limit:
          type: integer
        offset:
          type: integer
    DonationAddress:
      type: object
      description: >-
        A public crypto wallet address displayed for NON-CUSTODIAL donations.
        Vidra never holds funds or private keys and there is deliberately no
        balance/amount field. The internal verification nonce/expiry are never
        exposed.
      required: [id, owner_id, network, address, label, verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: >-
            The channel this address is scoped to. Omitted for account-level
            (profile) addresses.
        network:
          type: string
          enum: [bitcoin, ethereum, litecoin, monero]
        address:
          type: string
          example: 0x52908400098527886E0F7030069857D2E4169EE7
        label:
          type: string
          maxLength: 60
          example: Tips
        verified:
          type: boolean
          description: >-
            Whether the owner cryptographically proved control of this address
            via the challenge/verify flow.
        created_at:
          type: string
          format: date-time
    DonationAddressListResponse:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DonationAddress"
    AddDonationAddressRequest:
      type: object
      required: [network, address]
      properties:
        channel_id:
          type: string
          format: uuid
          description: >-
            Optional. When set, scopes the address to a channel the caller
            owns; omit or leave empty for an account-level (profile) address.
        network:
          type: string
          enum: [bitcoin, ethereum, litecoin, monero]
        address:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 60
    DonationChallengeResponse:
      type: object
      required: [message, expires_at]
      properties:
        message:
          type: string
          description: >-
            The exact message to sign with the address's private key. For
            ethereum, sign it as an EIP-191 personal_sign message.
        expires_at:
          type: string
          format: date-time
    VerifyDonationAddressRequest:
      type: object
      required: [signature]
      properties:
        signature:
          type: string
          description: >-
            The signature of the challenge message. For ethereum, the 65-byte
            [r||s||v] personal_sign signature, hex-encoded (0x-prefixed
            accepted).
    Video:
      type: object
      required: [id, remote, title, description, is_sensitive, created_at]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: >-
            Whether this card is a federated REMOTE video. Local videos are
            always false. Remote cards (subscriptions feed, search, and the
            public feed with scope=all) omit the local-only fields
            (channel_id, privacy, state) and instead carry domain, watch_url,
            and optionally stream_url; their metadata detail lives at GET
            /remote-videos/{id} and their cached poster at GET
            /remote-videos/{id}/thumbnail.
        channel_id:
          type: string
          format: uuid
          description: >-
            The owning local channel. Present on every local video; omitted on
            remote cards (a remote video has no local channel).
        channel_handle:
          type: string
          description: >-
            The owning channel's handle, present on card/feed views so the client
            can link to /channels/{handle}. Omitted on the detail view. On a
            remote card this is the remote channel's "name@domain" identity
            (not a local route).
        channel_display_name:
          type: string
          description: The owning channel's display name; present alongside channel_handle on card/feed views.
        title:
          type: string
          example: My first upload
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private, password]
          description: Present on every local video; omitted on remote cards.
        state:
          type: string
          enum: [draft, processing, scheduled, quarantined, published, failed]
          description: >-
            Publish lifecycle. "scheduled" means the upload finished processing
            but publish_at lies in the future; public surfaces (feed, search,
            channel lists) only show "published", while direct links behave
            like any non-published video. "quarantined" means the instance
            holds new uploads for moderator review (QUARANTINE_NEW_UPLOADS):
            only the owner (studio badge) and moderators can see the video
            until it is approved (published) or rejected (failed). Present on
            every local video; omitted on remote cards.
        is_sensitive:
          type: boolean
          description: >-
            Whether the owner flagged the video as sensitive content. Always
            present; false on remote cards (no local flag exists for them).
            When the instance sensitive_content_policy is "hide", flagged
            videos are excluded from the public feed and search server-side;
            under warn/blur the frontend applies the matching presentation.
        created_at:
          type: string
          format: date-time
          description: >-
            Creation time. On a remote card this is the origin's published
            time (falling back to when the video was fetched).
        domain:
          type: string
          description: >-
            REMOTE cards only: the origin instance's domain.
        watch_url:
          type: string
          description: >-
            REMOTE cards only: the origin's human watch page (always present
            on remote cards; the card links out here).
        stream_url:
          type: string
          description: >-
            REMOTE cards only: best playable URL from the origin (HLS
            preferred, else a direct video file). Omitted when the origin
            advertised none — the card then links out via watch_url.
        publish_at:
          type: string
          format: date-time
          description: >-
            The scheduled publish time. Present on the detail, create/update,
            and owner (studio) channel-list views once a schedule was set;
            omitted otherwise. The server publishes the video (running the
            same side effects as a direct publish) when this time arrives.
        duration_seconds:
          type:
            - integer
            - "null"
          description: >-
            Probed duration in whole seconds, recorded by the media probe. Present
            on the detail endpoint and on card/feed views (feed, search, channel
            lists, subscriptions, saved, history) so a card can show a length badge
            or resume progress bar; omitted when unknown (not yet probed).
        width:
          type:
            - integer
            - "null"
          description: Probed pixel width; omitted when unknown (e.g. audio-only).
        height:
          type:
            - integer
            - "null"
          description: Probed pixel height; omitted when unknown (e.g. audio-only).
        has_thumbnail:
          type: boolean
          description: >-
            Whether a poster image is available at GET /videos/{id}/thumbnail.
            Present on the detail endpoint; omitted on list/feed views.
        has_storyboard:
          type: boolean
          description: >-
            Whether a seek-preview storyboard is available at GET
            /videos/{id}/storyboard.jpg (+ the .vtt map). Present on the detail
            endpoint; omitted on list/feed views.
        has_chapters:
          type: boolean
          description: >-
            Whether the video has seek-bar chapters at GET
            /videos/{id}/chapters. Present on the detail endpoint; omitted on
            list/feed views. Lets the player fetch chapters only when they exist.
        views:
          type: integer
          format: int64
          description: >-
            Recorded view count. Present on the detail endpoint; omitted on
            list/feed views.
        category:
          type: string
          description: >-
            Optional subject-category id from GET /videos/config; omitted when
            unset. Present on the create/update/detail views.
        language:
          type: string
          description: >-
            Optional content language code (ISO 639-1) from GET /videos/config;
            omitted when unset.
        license:
          type: string
          description: >-
            Optional content-license id from GET /videos/config; omitted when
            unset.
        tags:
          type: array
          description: >-
            The video's free-form tags (lowercased, alphabetical; at most 5).
            Present on the create/update/detail views; omitted when empty and
            on list/feed views.
          items:
            type: string
            maxLength: 50
        hls_url:
          type: string
          description: >-
            Path of the HLS master playlist (GET /videos/{id}/hls/master.m3u8).
            Present on the detail endpoint only once the transcoded streaming
            playlist is ready; omitted while transcoding is pending/failed or
            disabled. Progressive playback via /original is always available.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/master.m3u8
        renditions:
          type: array
          description: >-
            The available HLS ladder rungs (tallest first), present alongside
            hls_url on the detail endpoint once transcoding completed.
          items:
            $ref: "#/components/schemas/VideoRendition"
        ipfs_pinned:
          type: boolean
          description: >-
            Whether at least one of this video's media objects is currently
            pinned to IPFS (fix_plan P19, .ralph/specs/ipfs-media.md). Drives the
            "IPFS" thumbnail badge on card/feed views. Present (true) only for
            public+published videos whose media the mirror has pinned; omitted
            (treat as false) otherwise, and always absent when IPFS_ENABLED is
            off. IPFS is a MIRROR SIDECAR — local/S3 remains authoritative, so a
            false/absent value never affects playback.
        ipfs:
          allOf:
            - $ref: "#/components/schemas/VideoIPFS"
          description: >-
            IPFS mirror CIDs for this video, present on the DETAIL endpoint only
            when the video is public+published and at least one object is pinned;
            omitted otherwise. CIDs are NEVER emitted for non-public videos
            regardless of caller (privacy invariant). Serving is unchanged —
            these are additive, content-address handles for clients that prefer a
            gateway fetch.
    VideoIPFS:
      type: object
      description: >-
        Pinned IPFS content identifiers for a public+published video (fix_plan
        P19). Each CID is a validated CIDv1; a client resolves an object as
        {gateway_url}/ipfs/{cid}. Fields are omitted when the corresponding
        object is not pinned.
      properties:
        original_cid:
          type: string
          description: >-
            CIDv1 of the pinned video original (web-videos/<id><ext>). Omitted
            until the original is pinned.
          example: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
        hls_cid:
          type: string
          description: >-
            CIDv1 (wrap-directory root) of the pinned HLS tree. Populated once
            the HLS directory add lands (P19.4); omitted until then or when the
            video has no transcoded HLS.
        gateway_url:
          type: string
          description: >-
            Public IPFS gateway base (from IPFS_GATEWAY_URL) under which the CIDs
            resolve, e.g. https://ipfs.example.org. Built only from the
            configured gateway and validated CIDs — never a caller-supplied
            value.
          example: https://ipfs.example.org
    VideoRendition:
      type: object
      description: One transcoded HLS rendition (ladder rung) of a video.
      required: [height, width]
      properties:
        height:
          type: integer
          example: 720
        width:
          type: integer
          example: 1280
    VideoChapter:
      type: object
      description: One seek-bar chapter of a video (CORE-15).
      required: [start_seconds, title]
      properties:
        start_seconds:
          type: integer
          minimum: 0
          description: Whole-second offset from the video start where the chapter begins.
          example: 90
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Short chapter title (1–120 characters after trimming).
          example: Introduction
    VideoChapters:
      type: object
      description: >-
        A video's chapters in playback order (ascending start_seconds); the
        array is empty when the video has none.
      required: [chapters]
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/VideoChapter"
    SetVideoChaptersRequest:
      type: object
      description: >-
        The whole chapter set to store (replaces any existing set). An empty
        array clears all chapters. start_seconds must be >= 0 and strictly
        increasing; titles are 1–120 characters after trimming; at most 100
        chapters; each start must be less than the probed duration when known.
      required: [chapters]
      properties:
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VideoChapter"
    UnlockVideoRequest:
      type: object
      description: A password to unlock a password-protected video (CORE-17).
      required: [password]
      properties:
        password:
          type: string
          description: The video's password (write-only; never logged or returned).
    UnlockVideoResponse:
      type: object
      description: >-
        A minted playback token for a password-protected video. The token is
        video-scoped, carries no account identity, and is valid for expires_in
        seconds. Present it as `Authorization: Bearer <playback_token>` or as a
        `?pt=<playback_token>` query parameter on the video's read endpoints.
      required: [playback_token, expires_in]
      properties:
        playback_token:
          type: string
          description: The opaque, video-scoped playback token (a secret — do not log).
        expires_in:
          type: integer
          description: The token lifetime in seconds (21600 = 6 hours).
          example: 21600
    VideoPassword:
      type: object
      description: >-
        One video password's public projection. The plaintext and the bcrypt hash
        are write-only and never appear in any response.
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    VideoPasswords:
      type: object
      description: A video's passwords (id + created_at only).
      required: [passwords]
      properties:
        passwords:
          type: array
          items:
            $ref: "#/components/schemas/VideoPassword"
    SetVideoPasswordRequest:
      type: object
      description: One password to add to a video (6–100 characters).
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 100
    ReplaceVideoPasswordsRequest:
      type: object
      description: >-
        The whole password set to store (replaces any existing set). 1–20 entries,
        each 6–100 characters.
      required: [passwords]
      properties:
        passwords:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 6
            maxLength: 100
    EmbedPrivacy:
      type: object
      description: >-
        A video's embed-privacy policy (CORE-17). status is the tier;
        allowed_domains lists the permitted hostnames and is present/required only
        for the "whitelist" tier (bare hostnames — no scheme, port, or path; at
        most 50). Enforcement is at the embed page, not the server.
      required: [status]
      properties:
        status:
          type: string
          enum: [enabled, disabled, whitelist]
        allowed_domains:
          type: array
          maxItems: 50
          items:
            type: string
          description: Allow-listed hostnames; present only for the "whitelist" status.
    DailyViews:
      type: object
      description: One day of a stats series (UTC calendar day).
      required: [day, views]
      properties:
        day:
          type: string
          format: date
          example: "2026-07-03"
        views:
          type: integer
          format: int64
    VideoStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        daily_views:
          type: array
          description: Dense 30-day series, oldest first, zero-filled.
          items:
            $ref: "#/components/schemas/DailyViews"
    ChannelStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, followers, videos, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        followers:
          type: integer
          format: int64
        videos:
          type: integer
          format: int64
          description: Total videos on the channel (any privacy/state).
        daily_views:
          type: array
          description: Dense 30-day series aggregated across the channel's videos.
          items:
            $ref: "#/components/schemas/DailyViews"
    VideoDownloadFile:
      type: object
      description: >-
        One downloadable single-file representation: original, progressive
        VP9/WebM, packaged HLS-quality MP4, audio-only M4A, or WebVTT subtitle.
      required: [kind, url, filename, content_type]
      properties:
        kind:
          type: string
          enum: [original, webm, hls, audio, subtitle]
        url:
          type: string
          description: API path serving this attachment.
        video_only_url:
          type: string
          description: HLS rows only; matching quality without the audio stream.
        filename:
          type: string
          description: Safe suggested filename for the browser download.
        content_type:
          type: string
          example: video/mp4
        size_bytes:
          type: integer
          format: int64
          description: Stored size in bytes, omitted when the backend cannot determine it.
        original_name:
          type: string
          description: The upload's original filename (original entries only).
        height:
          type: integer
          description: Pixel height, when known (probed for the original; the rung height for HLS renditions).
          example: 720
        width:
          type: integer
          description: Pixel width, when known.
          example: 1280
        language:
          type: string
          description: BCP-47-ish language tag for subtitle rows.
          example: en
        label:
          type: string
          description: Human label for subtitle rows.
          example: English
    VideoDownloadResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/VideoDownloadFile"
    CreateVideoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private, password]
          description: Defaults to "private" when omitted.
        category:
          type: string
          description: Optional subject-category id (see GET /videos/config). Unknown value -> 422.
        language:
          type: string
          description: Optional content language code (see GET /videos/config). Unknown value -> 422.
        license:
          type: string
          description: Optional content-license id (see GET /videos/config). Unknown value -> 422.
        tags:
          type: array
          description: >-
            Free-form tags. Lowercased, trimmed, and deduped server-side; at
            most 5 distinct tags of at most 50 characters each -> 422 otherwise.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Schedule the publish: after processing, the video parks in the
            "scheduled" state until this time, then publishes automatically.
            Must lie in the future -> 422 otherwise.
        is_sensitive:
          type: boolean
          description: >-
            Mark the video as sensitive content (defaults to false). See the
            Video schema for how the instance policy treats flagged videos.
    UpdateVideoRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private, password]
        category:
          type: string
          description: Set the subject-category id (see GET /videos/config). Unknown/empty value -> 422.
        language:
          type: string
          description: Set the content language code (see GET /videos/config). Unknown/empty value -> 422.
        license:
          type: string
          description: Set the content-license id (see GET /videos/config). Unknown/empty value -> 422.
        tags:
          type: array
          description: >-
            Replaces the video's whole tag set (an empty array clears it; omit
            the field to leave tags unchanged). Same limits as create.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Set (or move) the scheduled publish time. Only accepted while the
            video is not yet published, and must lie in the future -> 422
            otherwise.
        is_sensitive:
          type: boolean
          description: Set or clear the sensitive-content flag (omit to leave unchanged).
    Caption:
      type: object
      description: A WebVTT caption track's metadata (the file is fetched separately).
      required: [language, label, created_at]
      properties:
        language:
          type: string
          description: BCP-47-ish language tag (e.g. en, pt-BR).
        label:
          type: string
        created_at:
          type: string
          format: date-time
    CaptionListResponse:
      type: object
      required: [captions]
      properties:
        captions:
          type: array
          items:
            $ref: "#/components/schemas/Caption"
    Comment:
      type: object
      required: [id, video_id, body, parent_id, author_id, author_username, author_display_name, remote, created_at, updated_at, edited, deleted]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        body:
          type: string
        parent_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The id of the comment this one replies to, or null for a top-level
            comment. The client uses it to build the thread tree.
        author_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The comment author's account id (so a signed-in viewer can mute
            them) — null for a federated (remote-authored) comment.
        author_username:
          type: string
          description: >-
            The local author's username, or — for a remote comment — the remote
            author-name snapshot captured at ingestion.
        author_display_name:
          type: string
        remote:
          type: boolean
          description: True for a federated comment authored on another instance.
        author_domain:
          type: string
          description: The remote author's origin instance; omitted for local comments.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited:
          type: boolean
          description: True once the comment has been edited (updated_at moved past created_at).
        deleted:
          type: boolean
          description: >-
            True for a tombstoned comment: its author's account was
            permanently deleted, the stored body was erased, and body renders
            as "[deleted]" while the reply thread stays intact.
    CommentListResponse:
      type: object
      required: [comments, limit, offset]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        limit:
          type: integer
        offset:
          type: integer
    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000
          description: The new comment text.
    MutedAccount:
      type: object
      description: An account the caller has muted, with its display identity.
      required: [user_id, username, display_name, muted_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedAccountListResponse:
      type: object
      required: [accounts, limit, offset]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/MutedAccount"
        limit:
          type: integer
        offset:
          type: integer
    MutedInstance:
      type: object
      required: [domain, muted_at]
      properties:
        domain:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedInstanceListResponse:
      type: object
      required: [instances, limit, offset]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/MutedInstance"
        limit:
          type: integer
        offset:
          type: integer
    BlockInstanceRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: Bare hostname (optionally host:port) of the instance to block.
        reason:
          type: string
          maxLength: 2000
          description: Recorded on the blocklist and in the audit trail. May be empty.
    BlockedInstance:
      type: object
      required: [domain, reason, blocked_at]
      properties:
        domain:
          type: string
        reason:
          type: string
        blocked_by:
          type: string
          format: uuid
          description: The admin who blocked it. Omitted if that account was deleted.
        blocked_at:
          type: string
          format: date-time
    BlockedInstanceListResponse:
      type: object
      required: [instances, limit, offset]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/BlockedInstance"
        limit:
          type: integer
        offset:
          type: integer
    RemoteVideo:
      type: object
      required: [id, remote, domain, title, description, object_url, watch_url, has_thumbnail]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: Always true. Distinguishes remote cards from local videos.
        domain:
          type: string
          description: The origin instance's domain.
        title:
          type: string
        description:
          type: string
        object_url:
          type: string
          description: The ActivityPub object id on the origin.
        watch_url:
          type: string
          description: The origin's human watch page.
        stream_url:
          type: string
          description: >-
            Best playable URL from the origin (HLS preferred, else direct
            video file). Omitted when the origin advertised none.
        duration_seconds:
          type: integer
        published_at:
          type: string
          format: date-time
        has_thumbnail:
          type: boolean
          description: Whether a locally cached thumbnail is available.
    ATProtoLinkRequest:
      type: object
      required: [handle, app_password]
      description: >-
        Credentials for linking a Bluesky account. app_password must be a
        Bluesky APP PASSWORD (Settings → App Passwords), never the account's
        main password — the backend never returns it.
      properties:
        handle:
          type: string
          maxLength: 253
          description: The Bluesky handle, e.g. "alice.bsky.social" (leading @ tolerated).
          example: alice.bsky.social
        app_password:
          type: string
          description: A Bluesky app password (write-only; never returned).
          example: xxxx-xxxx-xxxx-xxxx
        pds_url:
          type: string
          maxLength: 2000
          description: >-
            Optional PDS base URL; defaults to https://bsky.social. Must be an
            https, public origin.
          example: https://bsky.social
        auto_post:
          type: boolean
          default: false
          description: >-
            When true, newly published PUBLIC videos owned by the caller are
            announced on Bluesky.
    ATProtoStatus:
      type: object
      required: [handle, did, pds_url, auto_post, created_at]
      description: >-
        The caller's linked Bluesky account. Deliberately excludes the app
        password (sealed or raw) — it is never exposed.
      properties:
        handle:
          type: string
          description: The linked Bluesky handle (as resolved by the PDS).
          example: alice.bsky.social
        did:
          type: string
          description: The resolved decentralized identifier.
          example: did:plc:abc123
        pds_url:
          type: string
          description: The PDS the account is hosted on.
          example: https://bsky.social
        auto_post:
          type: boolean
          description: Whether newly published public videos are auto-announced.
        created_at:
          type: string
          format: date-time
        last_posted_at:
          type: string
          format: date-time
          description: When the last successful auto-post was made (absent if never).
    CreateRemoteFollowRequest:
      type: object
      description: >-
        Names the remote channel to follow — exactly one of handle or
        actor_url.
      properties:
        handle:
          type: string
          maxLength: 2000
          description: The remote channel's WebFinger handle, "name@domain" (leading @ tolerated).
          example: films@videos.example
        actor_url:
          type: string
          maxLength: 2000
          description: The remote channel's ActivityPub actor URL.
          example: https://videos.example/video-channels/films
    RemoteFollow:
      type: object
      required: [id, actor_url, handle, domain, state, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The follow row id (the DELETE /me/remote-follows/{id} key).
        actor_url:
          type: string
          description: The followed remote channel's ActivityPub actor URL.
        handle:
          type: string
          description: The followed channel's "name@domain" identity.
          example: films@videos.example
        domain:
          type: string
          description: The origin instance's domain.
        state:
          type: string
          enum: [pending, accepted]
          description: >-
            pending until the remote instance Accepts the follow, then
            accepted (only accepted follows feed the subscriptions feed and
            the ingestion gate). A remote Reject removes the follow.
        created_at:
          type: string
          format: date-time
    RemoteFollowListResponse:
      type: object
      required: [follows, limit, offset]
      properties:
        follows:
          type: array
          items:
            $ref: "#/components/schemas/RemoteFollow"
        limit:
          type: integer
        offset:
          type: integer
    BlockedUser:
      type: object
      required: [user_id, username, display_name, blocked_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        blocked_at:
          type: string
          format: date-time
    BlockedUserListResponse:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/BlockedUser"
        limit:
          type: integer
        offset:
          type: integer
    VideoRating:
      type: object
      required: [like_count, dislike_count, my_rating]
      properties:
        like_count:
          type: integer
          format: int64
        dislike_count:
          type: integer
          format: int64
        my_rating:
          type: [string, "null"]
          enum: [like, dislike, null]
          description: The caller's own rating, or null when anonymous or unrated.
    VideoListResponse:
      type: object
      required: [videos]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
    VideoConfigOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: >-
            Stable identifier persisted on a video (or used to validate input) —
            not display text. Numeric for categories/licenses, ISO 639-1 for
            languages, the privacy value for privacies.
          example: "1"
        label:
          type: string
          description: Human-readable display label.
          example: Music
    VideoConfigResponse:
      type: object
      required: [categories, licenses, languages, privacies]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        privacies:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
    VideoFeedResponse:
      type: object
      required: [videos, sort, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        sort:
          type: string
          enum: [recent, popular, trending]
          description: The ordering actually applied (normalised from the request).
        scope:
          type: string
          enum: [local, all]
          description: >-
            The feed scope actually applied (normalised from the request);
            present on the public feed only. "all" mixes federated remote
            videos (remote:true cards) into the feed.
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    VideoSearchResponse:
      type: object
      required: [query, videos, limit, offset]
      properties:
        query:
          type: string
          example: go concurrency
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        remote:
          type: array
          description: >-
            Remote-URI search hits (config-parity W13). Present only on the
            first page (offset 0) when the query was URI/handle-shaped, the
            caller's auth-state gate (search_remote_uri_users /
            search_remote_uri_anonymous) allowed resolution, AND the target
            resolved within the strict deadline; omitted otherwise —
            unresolvable/timeout/rate-limited resolution degrades silently to
            local-only results.
          items:
            $ref: "#/components/schemas/RemoteSearchResult"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RemoteSearchResult:
      type: object
      required: [type]
      description: >-
        One typed remote hit resolved from a URI/handle-shaped search query
        (config-parity W13): a remote video (same projection as
        GET /api/v1/remote-videos/{id}) or a remote channel/account identity.
        Exactly one of video/actor is present, matching type.
      properties:
        type:
          type: string
          enum: [video, channel, account]
          description: >-
            video = a resolved remote Video object (ingested + cached);
            channel = a Group actor; account = a Person (or other non-Group)
            actor.
        video:
          $ref: "#/components/schemas/RemoteVideo"
        actor:
          $ref: "#/components/schemas/RemoteSearchActor"
    RemoteSearchActor:
      type: object
      required: [actor_url, handle, domain]
      description: >-
        A resolved remote channel/account: the followable identity —
        POST /api/v1/me/remote-follows accepts either the handle or the
        actor URL.
      properties:
        actor_url:
          type: string
          description: The ActivityPub actor URL on the origin.
        handle:
          type: string
          description: The name@domain identity.
          example: movies@tube.example
        domain:
          type: string
          description: The origin instance's domain.
    WatchProgressRequest:
      type: object
      required: [position_seconds]
      properties:
        position_seconds:
          type: integer
          format: int32
          minimum: 0
          description: Playback position in whole seconds.
          example: 42
    WatchProgress:
      type: object
      required: [video_id, position_seconds]
      properties:
        video_id:
          type: string
          format: uuid
        position_seconds:
          type: integer
          format: int32
          description: The caller's saved resume position in whole seconds (0 when none).
          example: 42
    HistoryItem:
      description: >-
        A watch-history card: a video card plus the caller's saved resume
        position and when they last watched it.
      allOf:
        - $ref: "#/components/schemas/Video"
        - type: object
          required: [position_seconds, watched_at]
          properties:
            position_seconds:
              type: integer
              format: int32
              description: The caller's saved resume position in whole seconds.
              example: 42
            watched_at:
              type: string
              format: date-time
              description: When the caller last watched this video.
    WatchHistoryResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    NotificationActor:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
    Notification:
      type: object
      required: [id, type, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [follow, comment, message, report_resolved, video_rejected, caption_ready]
          description: What happened. follow = someone followed your channel; comment = someone commented on your video; message = someone sent you a direct message; report_resolved = a moderator resolved an abuse report you filed; video_rejected = a moderator rejected your quarantined upload (video_id/video_title carry which one; the moderator's identity is never included); caption_ready = an auto-generated caption track finished for your video (video_id/video_title carry which one).
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/NotificationActor"
        channel_handle:
          type: string
          description: Followed channel's handle (follow notifications).
        channel_display_name:
          type: string
          description: Followed channel's display name (follow notifications).
        video_id:
          type: string
          format: uuid
          description: Commented video's id (comment notifications).
        video_title:
          type: string
          description: Commented video's title (comment notifications).
        comment_id:
          type: string
          format: uuid
          description: The comment's id (comment notifications).
        conversation_id:
          type: string
          format: uuid
          description: The conversation's id (message notifications) — link to the thread.
        report_id:
          type: string
          format: uuid
          description: The resolved report's id (report_resolved notifications). The resolving moderator's identity is never included (actor is absent for this type).
        report_status:
          type: string
          enum: [open, accepted, rejected]
          description: The report's resolution outcome (report_resolved notifications).
        report_target_type:
          type: string
          enum: [video, comment, account]
          description: What the resolved report targeted (report_resolved notifications).
    NotificationListResponse:
      type: object
      required: [notifications, unread_count, limit, offset]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
          format: int64
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    UnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          format: int64
          example: 3
    NotificationPrefsResponse:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Every known notification type mapped to whether it is delivered to
            this user. Types with no stored preference default to true.
          additionalProperties:
            type: boolean
          example: { caption_ready: true, comment: true, follow: false, message: true, report_resolved: true, video_rejected: true }
    UpdateNotificationPrefsRequest:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Partial map of notification type -> enabled. Only the types present
            are changed. Known types: caption_ready, comment, follow, message,
            report_resolved, video_rejected. An unknown type rejects the whole
            update (422).
          additionalProperties:
            type: boolean
          minProperties: 1
          example: { follow: false }
    PlayerSettings:
      type: object
      description: >-
        A signed-in user's effective player defaults (PLAY-07). Every field is
        always present; a user who never saved gets these built-in defaults.
      required: [autoplay_next, default_speed, default_quality, captions_default, theater_default]
      properties:
        autoplay_next:
          type: boolean
          description: Whether the next video autoplays when the current one ends.
          example: true
        default_speed:
          type: number
          description: >-
            Default playback speed. One of the shared playback rates: 0.25, 0.5,
            0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4.
          example: 1
        default_quality:
          type: string
          description: >-
            Default quality: "auto" (adaptive) or a rendition height like "720p"
            (^[0-9]{2,4}p$, same shape as the HLS rendition path segment).
          example: auto
        captions_default:
          type: boolean
          description: Whether captions are on by default when a track exists.
          example: false
        theater_default:
          type: boolean
          description: Whether the player opens in theater mode by default.
          example: false
    UpdatePlayerSettingsRequest:
      type: object
      description: >-
        Merge-update body: every field is optional. An omitted field keeps its
        stored value (or the default, for a user who never saved); a supplied
        field replaces it. At least one field is normally sent, but an empty body
        is accepted as a no-op that returns the current effective settings.
      properties:
        autoplay_next:
          type: boolean
          example: false
        default_speed:
          type: number
          description: >-
            One of the shared playback rates (0.25, 0.5, 0.75, 1, 1.25, 1.5,
            1.75, 2, 2.5, 3, 3.5, 4); any other value is 400.
          example: 1.5
        default_quality:
          type: string
          description: '"auto" or a rendition height like "720p"; any other value is 400.'
          example: 1080p
        captions_default:
          type: boolean
          example: true
        theater_default:
          type: boolean
          example: true
    Playlist:
