        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/peertube-import/{id}:
    get:
      operationId: getPeerTubeImport
      summary: Get one PeerTube import run (admin)
      description: >-
        Returns one import run by id — the progress-poll endpoint. Restricted to
