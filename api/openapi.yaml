          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/videos/{id}/download/hls/{height}:
    get:
      operationId: downloadVideoHLSRendition
      summary: Download one HLS quality as a progressive MP4
      description: >-
        Serves one transcoded HLS rung remuxed into a single MP4 file. Audio is
        included in the same file by default; audio=false selects the matching
        video-only MP4. No video re-encoding occurs during the download.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
