          type: array
          items:
            $ref: "#/components/schemas/SuggestionBanEntry"
        limit:
          type: integer
        offset:
          type: integer
    WatchedWordListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [words]
          properties:
            words:
              type: array
              items:
                $ref: "#/components/schemas/WatchedWord"
    WatchedWordMatch:
      type: object
      description: >-
        Content flagged by the watched-words list, for moderator review: a
        comment (type "comment"; comment_id/comment_body present, video_id is
        the video it is on) or a video (type "video"; comment fields absent,
        video_id/video_title are the flagged video). author_username is the
        comment's author or the video's owner respectively.
      required: [id, word, type, video_id, video_title, author_username, created_at]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
          description: The watched term that matched.
        type:
          type: string
          enum: [comment, video]
          description: What was flagged.
        comment_id:
          type: string
          format: uuid
          description: The flagged comment (comment matches only).
        comment_body:
          type: string
          description: The flagged comment's body (comment matches only).
        video_id:
          type: string
          format: uuid
          description: The flagged video, or the video the flagged comment is on.
        video_title:
          type: string
          description: The video's title (a link target for the review queue).
        author_username:
          type: string
        created_at:
          type: string
          format: date-time
    WatchedWordMatchListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [matches]
          properties:
            matches:
              type: array
              items:
                $ref: "#/components/schemas/WatchedWordMatch"
    CreateWatchedWordRequest:
      type: object
      required: [word]
      properties:
        word:
          type: string
          maxLength: 100
    AdminUser:
      type: object
      description: Admin projection of an account (never includes the password hash).
      required: [id, username, email, role, is_active, email_verified, bypass_quarantine, display_name, storage_quota_bytes, storage_used_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
        bypass_quarantine:
          type: boolean
          description: >-
            Whether this account is exempt from the QUARANTINE_NEW_UPLOADS
            gate — its uploads publish directly like a moderator's.
        display_name:
          type: string
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          description: >-
            Per-user storage quota override in bytes. null = the instance
            default (INSTANCE_DEFAULT_QUOTA_BYTES) applies; 0 = unlimited for
            this account.
        storage_used_bytes:
          type: integer
          format: int64
          description: >-
            The account's current storage usage: total stored bytes of its
            video files (originals, renditions, thumbnails) across the videos
            owned via its channels.
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/AdminUser"
    QuotaStatus:
      type: object
      description: >-
        The caller's storage picture: bytes currently stored and the effective
        quota (per-user override, else the instance default). quota_bytes is
        null when the caller is unlimited.
      required: [used_bytes, quota_bytes, daily_used_bytes, daily_quota_bytes]
      properties:
        used_bytes:
          type: integer
          format: int64
          description: >-
            Total stored bytes of the caller's video files (originals,
            renditions, thumbnails) across the videos owned via their channels.
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: Effective storage quota in bytes; null = unlimited.
        daily_used_bytes:
          type: integer
          format: int64
          description: >-
            Bytes of originals the caller stored in the trailing 24h (ROLLING
            window, config default_user_daily_quota_bytes). 0 while no daily
            quota is configured (the ledger is not consulted).
        daily_quota_bytes:
          type: [integer, "null"]
          format: int64
          description: >-
            The instance's rolling-24h daily upload quota in bytes; null =
            unlimited/not configured. Exceeding it answers 422
            `daily_quota_exceeded` on the upload gates.
    DeleteAccountRequest:
      type: object
      description: >-
        Password confirmation for the irreversible account hard delete (a
        stolen access token alone must not be able to destroy the account).
      required: [password]
      properties:
        password:
          type: string
          format: password
    AccountExportStatus:
      type: object
      description: The status of the caller's most recent account export job.
      required: [id, state, download_ready, requested_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
          description: >-
            pending/running while the archive is being assembled; done once
            downloadable; failed after the job exhausted its retries.
        download_ready:
          type: boolean
          description: >-
            True when GET /api/v1/me/export/download will serve the archive
            (state done and not yet expired).
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the finished archive stops being downloadable (7 days after
            completion); null while the export has not finished.
    AccountArchive:
      type: object
      description: >-
        A vidra account export archive (format version 1): the user's own data
        as one JSON document. Contains NO password hash and NO tokens. Media
        files are not bundled — each video entry carries
        original_download_url, the (owner-gated) API URL of its original file,
        valid while the account and video exist. This same shape is what
        POST /api/v1/me/import accepts.
      required: [vidra_export, profile]
      properties:
        vidra_export:
          type: object
          description: Format marker.
          required: [version, generated_at]
          properties:
            version:
              type: integer
              description: Archive format version (currently 1).
            generated_at:
              type: string
              format: date-time
            instance:
              type: string
              description: Public origin of the exporting instance.
        profile:
          type: object
          required: [username, email, display_name, bio, unlisted, email_verified, created_at]
          properties:
            username:
              type: string
            email:
              type: string
            display_name:
              type: string
            bio:
              type: string
            unlisted:
              type: boolean
            email_verified:
              type: boolean
            created_at:
              type: string
              format: date-time
        notification_prefs:
          type: array
          items:
            type: object
            required: [type, enabled]
            properties:
              type:
                type: string
              enabled:
                type: boolean
        channels:
          type: array
          description: Owned channels (metadata only; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              handle:
                type: string
              display_name:
                type: string
              description:
                type: string
              created_at:
                type: string
                format: date-time
        videos:
          type: array
          description: >-
            Owned videos' metadata including taxonomy and tags (media not
            bundled; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              channel_handle:
                type: string
              title:
                type: string
              description:
                type: string
              privacy:
                type: string
              state:
                type: string
              category:
                type: [string, "null"]
              language:
                type: [string, "null"]
              license:
                type: [string, "null"]
              tags:
                type: array
                items:
                  type: string
              publish_at:
                type: [string, "null"]
                format: date-time
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              original_download_url:
                type: string
                description: >-
                  Where the video's original file can be downloaded (media is
                  not bundled in the archive).
        playlists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              visibility:
                type: string
              video_ids:
                type: array
                items:
                  type: string
              created_at:
                type: string
                format: date-time
        comments:
          type: array
          description: The account's own comments (not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              video_id:
                type: string
                format: uuid
              body:
                type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        follows:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type: string
                format: uuid
              channel_handle:
                type: string
              followed_at:
                type: string
                format: date-time
        saved_videos:
          type: array
          description: Watch-later entries (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              saved_at:
                type: string
                format: date-time
        watch_history:
          type: array
          description: Watch history with resume positions (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              position_seconds:
                type: integer
              watched_at:
                type: string
                format: date-time
    AccountImportSummary:
      type: object
      description: >-
        What POST /api/v1/me/import re-created (safe subsets only) and what it
        skipped.
      required:
        - profile_applied
        - playlists_created
        - playlist_items_added
        - playlist_items_skipped
        - follows_created
        - follows_skipped
        - notification_prefs_applied
        - notification_prefs_skipped
        - skipped_sections
      properties:
        profile_applied:
          type: boolean
          description: True when display_name/bio were applied from the archive.
        playlists_created:
          type: integer
        playlist_items_added:
          type: integer
        playlist_items_skipped:
          type: integer
          description: Items whose video does not exist on this instance.
        follows_created:
          type: integer
        follows_skipped:
          type: integer
          description: Follows of channels not present locally.
        notification_prefs_applied:
          type: integer
        notification_prefs_skipped:
          type: integer
          description: Preferences for notification types this build does not know.
        skipped_sections:
          type: object
          description: >-
            Counts of archive entries that are not importable in v1, keyed by
            section (channels, videos, comments, saved_videos, watch_history,
            playlists).
          additionalProperties:
            type: integer
    LiveStream:
      type: object
      required: [id, channel_id, title, description, privacy, state, permanent, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [offline, live, ended]
          description: RTMP ingestion (a later boundary) flips this; starts offline.
        permanent:
          type: boolean
          description: A permanent/recurring live keeps its key across sessions.
        replay_enabled:
          type: boolean
          description: >-
            When true, the media server records each session and the api
            republishes the recording as a normal on-demand video on ingest-stop
            (privacy inherited). Default false.
        started_at:
          type: string
          format: date-time
          description: >-
            When the current live session began (stamped on the transition into
            "live", cleared when it ends). Present only while the stream is live.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        channel_handle:
          type: string
          description: Owning channel handle (on the single-stream get).
        channel_display_name:
          type: string
        hls_url:
          type: string
          description: >-
            Live HLS playlist path, present only while the stream is live and a
            media server (LIVE_HLS_ROOT) is configured to serve it.
    CreateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          description: >-
            Record sessions and republish them as VODs (see
            LiveStream.replay_enabled). When OMITTED, the instance default
            (live_default_save_replay, exposed as the /instance live block's
            default_save_replay) is seeded; an explicit value always wins.
            While the instance disallows replay (live.allow_replay=false) the
            seed is always false and any stored flag produces no replay.
    UpdateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          default: false
    CreateLiveStreamResponse:
      type: object
      required: [live_stream, stream_key]
      properties:
        live_stream:
          $ref: "#/components/schemas/LiveStream"
        stream_key:
          type: string
          description: The private stream key, shown ONCE. Put it in your encoder (OBS).
        rtmp_url:
          type: string
          description: RTMP ingest base URL (omitted when no ingest is configured).
    LiveStreamListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [live_streams]
          properties:
            live_streams:
              type: array
              items:
                $ref: "#/components/schemas/LiveStream"
    LiveStreamCard:
      type: object
      description: >-
        One entry of the public "Live now" listing — the minimal, truthful
        projection of a currently-live PUBLIC stream. Omits fields a discovery
        rail cannot honestly use: no privacy/state (every entry is public+live),
        no stream key, no viewer/concurrent count (no server-side counter yet —
        W4 dependency), no thumbnail (live streams have no server-generated
        poster yet).
      required: [id, title, channel_handle, channel_display_name, is_live]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        channel_handle:
          type: string
        channel_display_name:
          type: string
        started_at:
          type: string
          format: date-time
          description: When the current live session began (omitted only for pre-tracking streams).
        is_live:
          type: boolean
          description: Always true for a listing entry (discriminator for a shared card renderer).
        hls_url:
          type: string
          description: >-
            Live HLS playlist path, present only when a media server
            (LIVE_HLS_ROOT) is configured to serve it.
    LivePublicListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [live_streams]
          properties:
            live_streams:
              type: array
              items:
                $ref: "#/components/schemas/LiveStreamCard"
    LiveStreamKey:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The new stream key, shown ONCE.
        rtmp_url:
          type: string
    LiveIngestRequest:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The publisher's raw stream key, as presented to the RTMP ingest.
    StartConversationRequest:
      type: object
      description: >-
        Names the other participant by EXACTLY ONE of recipient_id or
        recipient_username — providing both, or neither, is a 422 field error.
        recipient_username is resolved server-side (case-insensitive, active
        accounts only); an unknown or deactivated username is a 404, exactly
        like an unknown recipient_id, so existence is not leaked differently.
        Resolving to yourself is a 422 (cannot message yourself).
      properties:
        recipient_id:
          type: string
          format: uuid
          description: The recipient's user id. Provide this OR recipient_username, not both.
        recipient_username:
          type: string
          description: >-
            The recipient's username, resolved server-side (case-insensitive,
            active accounts only). An alternative to recipient_id — provide
            exactly one.
        encrypted:
          type: boolean
          default: false
          description: >-
            Choose the conversation type AT CREATION, immutably. An encrypted
            conversation stores only opaque per-device ciphertext envelopes
            (the server holds no keys and cannot decrypt); a plaintext one only
            {body} messages. A pair of users can have one of each — the two
            types are distinct conversations.
    Conversation:
      type: object
      required: [id, other_user_id, encrypted, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        other_user_id:
          type: string
          format: uuid
          description: The other participant's user id from the authenticated caller's perspective.
        encrypted:
          type: boolean
          description: Immutable conversation type, chosen at creation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationSummary:
      type: object
      description: "A conversation in the inbox: the other participant + last message preview (always empty for encrypted conversations — envelopes are opaque)."
      required: [id, updated_at, encrypted, other_user_id, other_username, other_display_name, last_message_body, last_message_at]
      properties:
        id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
        encrypted:
          type: boolean
        other_user_id:
          type: string
          format: uuid
        other_username:
          type: string
        other_display_name:
          type: string
        other_has_avatar:
          type: boolean
          description: Whether the other participant has an avatar set (served at GET /users/{id}/avatar). Lets clients skip a guaranteed-404 avatar probe for avatar-less users.
        last_message_body:
          type: string
          description: Empty when the conversation has no messages yet, and always empty for encrypted conversations.
        last_message_at:
          type: string
          format: date-time
        unread_count:
          type: integer
          format: int64
          description: The caller's unread messages (peer messages past their read watermark).
    ConversationListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [conversations]
          properties:
            conversations:
              type: array
              items:
                $ref: "#/components/schemas/ConversationSummary"
    SendMessageRequest:
      type: object
      description: >-
        The PLAINTEXT send shape — valid only on a plaintext conversation
        (sending it to an encrypted conversation is 422, and vice versa). A
        message needs a body OR at least one attachment.
      properties:
        body:
          type: string
          maxLength: 5000
        attachment_ids:
          type: array
          maxItems: 30
          description: >-
            Ids from POST /conversations/{id}/attachments — own-uploaded, in this
            conversation, not yet sent. Up to 30 per message (Facebook-Messenger
            parity); the 31st and beyond are a 422 field error.
          items:
            type: string
            format: uuid
    EncryptedEnvelope:
      type: object
      description: >-
        One per-recipient-device ciphertext blob. The CLIENT encrypts once per
        device pair (Olm session) and fans out; the server stores each blob
        opaquely and returns it byte-identical.
      required: [recipient_device_id, message_type, ciphertext]
      properties:
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
          description: "Olm message type: 0 = prekey message, 1 = normal message."
        ciphertext:
          type: string
          maxLength: 65536
          description: Opaque ciphertext, at most 64 KiB. Never inspected or logged by the server.
    SendEncryptedMessageRequest:
      type: object
      description: >-
        The ENCRYPTED send shape — valid only on an encrypted conversation.
        One envelope per recipient device (including the sender's other
        devices); every recipient device must belong to a participant of the
        conversation, and the sender device to the caller.
      required: [sender_device_id, envelopes]
      properties:
        sender_device_id:
          type: string
          format: uuid
          description: One of the caller's registered E2EE devices.
        envelopes:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/EncryptedEnvelope"
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 30
          maximum: 7776000
          description: >-
            Optional disappearing-message timer (30 seconds to 90 days). Stamps
            expires_at on every envelope; expired envelopes vanish from reads
            immediately and are hard-deleted by a background sweeper.
    SendEncryptedResponse:
      type: object
      description: Summary of an accepted encrypted send (the envelopes are not echoed back).
      required: [conversation_id, envelope_count, created_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        envelope_count:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present when a disappearing-message timer was set.
    EncryptedMessage:
      type: object
      description: >-
        A stored envelope, returned only to the owner of its recipient device.
        The ciphertext is byte-identical to what the sender posted — the server
        cannot decrypt it.
      required: [id, conversation_id, sender_user_id, sender_device_id, recipient_device_id, message_type, ciphertext, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        sender_device_id:
          type: string
          format: uuid
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
        ciphertext:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present on disappearing messages.
    EncryptedMessageListResponse:
      type: object
      description: A page of the CALLER's devices' envelopes, newest first (expired ones filtered).
      required: [envelopes, limit, offset]
      properties:
        envelopes:
          type: array
          items:
            $ref: "#/components/schemas/EncryptedMessage"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RegisterE2EEDeviceRequest:
      type: object
      required: [device_name, identity_key, signing_key]
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-visible label ("Ada's laptop").
        identity_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Curve25519 identity key (base64). Private keys never leave the device.
        signing_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Ed25519 signing key (base64).
    E2EEDevice:
      type: object
      description: A registered E2EE device. Carries PUBLIC key material only.
      required: [id, user_id, device_name, identity_key, signing_key, created_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_name:
          type: string
        identity_key:
          type: string
        signing_key:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    E2EEDeviceListResponse:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/E2EEDevice"
    E2EEOneTimeKey:
      type: object
      description: One public one-time prekey (client-assigned key_id).
      required: [key_id, key]
      properties:
        key_id:
          type: string
          maxLength: 64
        key:
          type: string
          maxLength: 512
    UploadOneTimeKeysRequest:
      type: object
      required: [one_time_keys]
      properties:
        one_time_keys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/E2EEOneTimeKey"
    UploadOneTimeKeysResponse:
      type: object
      required: [unclaimed]
      properties:
        unclaimed:
          type: integer
          format: int64
          description: The device's unclaimed one-time-key count after the upload.
    OneTimeKeyCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
    E2EEClaim:
      type: object
      description: >-
        One device's claim result: its public identity plus one ATOMICALLY
        claimed (single-use) one-time key — null when the device has none left.
      required: [device_id, identity_key, signing_key, one_time_key]
      properties:
        device_id:
          type: string
          format: uuid
        identity_key:
          type: string
        signing_key:
          type: string
        one_time_key:
          description: A claimed one-time prekey, or null when the device has none left.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/E2EEOneTimeKey"
    E2EEClaimResponse:
      type: object
      required: [user_id, claims]
      properties:
        user_id:
          type: string
          format: uuid
        claims:
          type: array
          items:
            $ref: "#/components/schemas/E2EEClaim"
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        sender_username:
          type: string
        sender_display_name:
          type: string
        sender_has_avatar:
          type: boolean
          description: Whether the sender has an avatar set (served at GET /users/{id}/avatar). Lets clients skip a guaranteed-404 avatar probe for avatar-less senders.
        body:
          type: string
          description: The message text, or "[deleted]" for a tombstoned message.
        deleted:
          type: boolean
          description: True when the sender has deleted (tombstoned) the message.
        created_at:
          type: string
          format: date-time
        attachments:
          type: array
          description: DM attachments linked to this message (metadata only; fetch the bytes at GET /api/v1/attachments/{id}).
          items:
            $ref: "#/components/schemas/DMAttachment"
        preview:
          description: OpenGraph link preview of the first URL in the body; omitted until the async fetch has resolved (optional).
          allOf:
            - $ref: "#/components/schemas/LinkPreview"
    DMAttachment:
      type: object
      required: [id, kind, content_type, filename, size_bytes]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, pdf, doc]
          description: >-
            Coarse attachment kind. "doc" covers office documents
            (DOC/DOCX/PPT/PPTX/XLS/XLSX); PDFs keep their own "pdf" kind.
        content_type:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          description: Intrinsic pixel width, present only for kind=image when probed successfully.
        height:
          type: integer
          description: Intrinsic pixel height, present only for kind=image when probed successfully.
    LinkPreview:
      type: object
      required: [url]
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
    UploadAttachmentResponse:
      type: object
      required: [attachment_id, kind, content_type, filename, size_bytes]
      properties:
        attachment_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, pdf, doc]
          description: >-
            Coarse attachment kind. "doc" covers office documents
            (DOC/DOCX/PPT/PPTX/XLS/XLSX); PDFs keep their own "pdf" kind.
        content_type:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          description: Intrinsic pixel width, present only for kind=image when probed successfully.
        height:
          type: integer
          description: Intrinsic pixel height, present only for kind=image when probed successfully.
    MarkConversationReadRequest:
      type: object
      description: Optionally pins the read watermark to a specific message; when absent the newest message is used.
      properties:
        message_id:
          type: string
          format: uuid
    MessagingPrefs:
      type: object
      required: [read_receipts]
      properties:
        read_receipts:
          type: boolean
          description: When false, the caller's read watermark is hidden from peers.
    UpdateMessagingPrefsRequest:
      type: object
      properties:
        read_receipts:
          type: boolean
    MessageListResponse:
      type: object
      required: [messages, limit, offset]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        peer_last_read_message_id:
          type: string
          format: uuid
          description: The other participant's read watermark, for a "seen" indicator. Omitted when they have read nothing or disabled read receipts.
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    AuditLogEntry:
      type: object
      description: >-
        A durable, low-volume security-audit envelope. Metadata and changes are
        allowlisted and bounded; raw payloads, content, email/IP data, signed URLs,
        headers, cookies, credentials, and process output are forbidden. Routine
        high-volume content activity and job execution events use separate streams.
      required: [id, schema_version, domain, action, result, actor_kind, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        schema_version:
          type: integer
          minimum: 1
          description: Audit-envelope schema version (2 for newly written typed events).
        domain:
          type: string
          maxLength: 64
          description: Stable action domain, such as auth, moderation, admin, or content.
        action:
          type: string
          maxLength: 160
          description: Stable dot-namespaced action id (e.g. auth.login).
          example: auth.login
        result:
          type: string
          enum: [success, failure]
          description: The outcome of the attempted action.
        actor_id:
          type: string
          format: uuid
          description: The acting account's id; omitted for unauthenticated events.
        actor_kind:
          type: string
          enum: [anonymous, user, system, service]
          description: Safe actor snapshot kind at event time.
        actor_role:
          type: string
          enum: [user, moderator, admin]
          description: Safe authorization-role snapshot; present only for a known user actor.
        actor_username:
          type: string
          description: Current username resolved best-effort at read time; not part of the durable actor snapshot.
        reason:
          type: string
          maxLength: 512
          description: Safe, bounded classification (e.g. invalid_credentials), never moderator/user prose.
        request_id:
          type: string
          maxLength: 128
        correlation_id:
          type: string
          maxLength: 128
        trace_id:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
        pipeline_run_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        resource_type:
          type: string
          maxLength: 64
        resource_id:
          type: string
          maxLength: 512
          description: Bounded opaque identifier; URLs are forbidden.
        metadata:
          type: object
          description: Allowlisted bounded scalar classifications only.
          additionalProperties:
            type: string
            maxLength: 256
        changes:
          type: array
          maxItems: 32
          description: Allowlisted safe before/after scalar differences; content fields are forbidden.
          items:
            $ref: "#/components/schemas/AuditLogChange"
        occurred_at:
          type: string
          format: date-time
    AuditLogChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Allowlisted low-sensitivity state/config field.
        before:
          type: string
          maxLength: 256
        after:
          type: string
          maxLength: 256
    AuditLogListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [entries]
          properties:
            entries:
              type: array
              items:
                $ref: "#/components/schemas/AuditLogEntry"
    MediaGCConfig:
      type: object
      description: >-
        The media garbage collector's boot facts plus its live ownership state
        (GET /api/v1/admin/media/gc). enabled and max_orphan_percent are
        boot-baked configuration reported read-only; bucket_ownership is the
        service's current in-memory state, so an adoption shows on the next
        read.
      required: [enabled, max_orphan_percent, bucket_ownership]
      properties:
        enabled:
          type: boolean
          description: >-
            MEDIA_GC_ENABLED — whether the daily automatic DESTRUCTIVE sweep
            runs at all. The manual POST stays available either way: an
            operator asking for a sweep by hand is not the hazard the flag
            exists for.
        max_orphan_percent:
          type: integer
          description: >-
            MEDIA_GC_MAX_ORPHAN_PERCENT — the circuit breaker. A destructive
            sweep finding more than this share of scanned objects to be
            orphans deletes nothing and reports why. 0 disables deletion
            entirely; 100 lets any ratio through.
        bucket_ownership:
          type: string
          enum: [owned, unowned, conflict, not-applicable, unknown]
          description: >-
            Same vocabulary and meaning as MediaGCResponse.bucket_ownership.
            Only `owned` and `not-applicable` permit deletion.
    MediaGCRequest:
      type: object
      description: Media garbage-collection request. dry_run defaults to true.
      properties:
        dry_run:
          type: boolean
          default: true
          description: >-
            When true (default), report the would-delete orphan set without
            deleting anything. Pass false to actually delete the orphans.
    MediaGCResponse:
      type: object
      required:
        [
          dry_run,
          mode,
          scanned,
          orphans,
          deleted,
          orphan_percent,
          breaker_tripped,
          bucket_ownership,
          forced_dry_run,
        ]
      properties:
        dry_run:
          type: boolean
          description: >-
            Whether the sweep ACTUALLY ran as a dry run, which is not necessarily
            what was asked for — see forced_dry_run and breaker_tripped.
        mode:
          type: string
          enum: [dry-run, delete]
          description: The mode the sweep actually ran in; the same fact as dry_run.
        scanned:
          type: integer
          description: Total stored objects listed across the known prefixes.
        orphans:
          type: array
          items:
            type: string
          description: Orphan object keys — the would-delete set on a dry run, the deleted set otherwise.
        deleted:
          type: integer
          description: Number of orphans actually deleted (0 on a dry run).
        orphan_percent:
          type: integer
          description: >-
            Orphans as a whole-number percentage of scanned (0 when nothing was
            scanned) — the figure the circuit breaker compares against
            MEDIA_GC_MAX_ORPHAN_PERCENT.
        breaker_tripped:
          type: boolean
          description: >-
            True when the orphan share exceeded MEDIA_GC_MAX_ORPHAN_PERCENT, so a
            requested delete deleted nothing. Only ever set on sweeps of more
            than 100 orphans — a handful of orphans in a nearly-empty store is a
            high percentage and not a reason to stop.
        bucket_ownership:
          type: string
          enum: [owned, unowned, conflict, not-applicable, unknown]
          description: >-
            Whether the object store is established as this instance's:
            `owned` (marker matches), `unowned` (no marker and the store was not
            empty), `conflict` (the marker names a different install),
            `not-applicable` (local disk, exempt by design), `unknown`
            (ownership was never resolved). Only `owned` and `not-applicable`
            permit deletion.
        forced_dry_run:
          type: boolean
          description: >-
            True when a requested delete was downgraded to a dry run by a safety
            rail rather than because the caller asked for one. See
            forced_dry_run_reason for which rail.
        forced_dry_run_reason:
          type: string
          enum: [bucket_ownership, storage_migration_active]
          description: >-
            Which safety rail forced the dry run; absent when none did.
            `bucket_ownership` — the object store is not established as this
            instance's (adopt it, or fix the configuration).
            `storage_migration_active` — a storage migration campaign is in
            flight, so the two stores are deliberately out of step and
            "unreferenced" is not evidence about either of them. It also covers
            the case where the check itself could not be answered, which is
            treated as "a migration is running". Wait for the campaign to reach
            done, or cancel it.
    StorageMigration:
      type: object
      description: >-
        One media-store migration campaign. source_desc/target_desc are store
        IDENTITY strings ("s3://<endpoint>/<bucket>" or "local:<path>") — never
        credentials, which authorise a store rather than name it. The api
        compares them against the backends it is actually holding before it
        copies or deletes anything, which is how it detects the cutover env swap.
      required:
        [
          id,
          state,
          source_desc,
          target_desc,
          objects_total,
          objects_done,
          objects_failed,
          last_error,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            [
              enumerating,
              copying,
              synced,
              cutover,
              deleting_source,
              done,
              cancelled,
              failed,
            ]
          description: >-
            `enumerating` — listing the source store.
            `copying` — objects are being copied and verified.
            `synced` — every object is verified in the target and a delta pass
            found nothing new; this is the state to cut over from.
            `cutover` — the api is serving from the target and the grace clock
            is running.
            `deleting_source` — removing the old store's copies.
            `done`/`cancelled`/`failed` — terminal.
        source_desc:
          type: string
          example: local:/var/lib/vidra/media
        target_desc:
          type: string
          example: s3://nyc3.digitaloceanspaces.com/example-video-media
        objects_total:
          type: integer
          format: int64
          description: Objects enumerated in the source so far.
        objects_done:
          type: integer
          format: int64
          description: Objects verified in the target (including those whose source copy has since been deleted).
        objects_failed:
          type: integer
          format: int64
          description: Objects that dead-lettered. They do not block completion; they are a reported fact.
        last_error:
          type: string
          description: >-
            A safe, operator-facing diagnostic — a category or an instruction,
            never a raw backend error, endpoint or object key. Typically set when
            a campaign is STUCK waiting for an operator (for example, the
            environment was swapped before every object had been copied).
        observed_cutover_at:
          type: string
          format: date-time
          description: >-
            When the api first saw itself serving from target_desc. The grace
            period before the source is deleted is measured from here, and it is
            written once so a restart cannot restart the clock.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        objects:
          type: object
          description: >-
            Per-state object counts. Returned on the single-campaign view only.
            Cutting over is safe when pending and copying are both zero.
          additionalProperties:
            type: integer
            format: int64
          example:
            { pending: 0, copying: 0, verified: 412, failed: 0, source_deleted: 0 }
    StorageMigrationList:
      type: object
      required: [migrations]
      properties:
        migrations:
          type: array
          description: Campaign history, newest first.
          items:
            $ref: "#/components/schemas/StorageMigration"
    MediaGCAdoptBucketRequest:
      type: object
      description: >-
        Optional body for the bucket adoption. Omit it entirely for the normal,
        guarded adoption.
      properties:
        force:
          type: boolean
          default: false
          description: >-
            Adopt even though this instance references media stored under
            another system's key layout (a reference-mode import). True only
            once the source instance is retired or its media has been copied
            across; the override is named in the audit event.
    MediaGCAdoptBucketResponse:
      type: object
      required: [bucket_ownership, marker_key]
      properties:
        bucket_ownership:
          type: string
          enum: [owned]
          description: The ownership state after the adoption.
        marker_key:
          type: string
          description: The object key the ownership marker was written to.
          example: .vidra/owner
    AdminStats:
      type: object
      description: >-
        Instance-wide overview counts for the admin dashboard cards. Every field
        is a live COUNT/SUM; no deltas, no secrets/PII.
      required: [users, published_videos, media_stored_bytes, federated_peers, comments]
      properties:
        users:
          type: integer
          format: int64
          description: Total number of accounts (active or not).
        published_videos:
          type: integer
          format: int64
          description: Public, published videos (the local-posts total NodeInfo advertises).
        media_stored_bytes:
          type: integer
          format: int64
          description: Total stored bytes of every video file across all accounts.
        federated_peers:
          type: integer
          format: int64
          description: Distinct remote instances we have cached actors from.
        comments:
          type: integer
          format: int64
          description: Total number of local comments.
    SystemStatus:
      type: object
      description: Operational snapshot for the admin dashboard. No secrets/PII.
      required: [status, software, environment, uptime_seconds, components, rate_limits]
      properties:
        status:
          type: string
          enum: [ok, degraded, draining]
          description: >-
            draining wins over the other two, exactly as on /readyz: the
            process has received SIGTERM and is leaving; the page keeps
            answering 200 through the drain delay so the admin watching a
            deploy sees the same fact the load balancer acts on.
        software:
          type: object
          required: [name, version, commit, build_date, go_version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
            commit:
              type: string
            build_date:
              type: string
            go_version:
              type: string
        environment:
          type: string
          enum: [development, test, production]
        uptime_seconds:
          type: integer
          format: int64
        components:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                description: ok | down | not_configured
              error:
                type: string
        rate_limits:
          type: object
          description: >-
            The effective, non-secret rate-limit configuration in force. Rate
            limits are a deploy-time capacity decision (RATE_LIMIT_* /
            AUTH_RATE_LIMIT_* env), surfaced here read-only so an operator can
            confirm what is applied — there is no runtime mutation endpoint (see
            product-decisions §3).
          required: [enabled, requests, auth_requests, window_seconds]
          properties:
            enabled:
              type: boolean
            requests:
              type: integer
              description: General per-IP request budget over the window.
            auth_requests:
              type: integer
              description: Stricter per-IP budget for sensitive auth endpoints.
            window_seconds:
              type: integer
              format: int64
              description: The shared fixed-window length in seconds.
        database:
          type: object
          description: >-
            This process's PostgreSQL connection pool, sampled when the page was
            read. Four counts and nothing else, because the invariant between
            them is what makes them readable: acquired + idle + constructing ==
            total, and total can never exceed max — so "acquired pinned at max"
            is the whole diagnosis of a pool that has become the bottleneck.
            ABSENT when no pool is wired, rather than zeroed: 0 of 0 connections
            is indistinguishable from a pool with nothing left. Connection
            COUNTS only — never a DSN, a credential or a server address.
            The Prometheus gauges (vidra_db_pool_*) are the instrument for trend
            and for the acquire-wait counters; this block exists because
            METRICS_ENABLED is off by default and an admin looking at a slow
            instance should not have to stand up a metrics stack to find out
            whether its pool is full.
          required: [pool_total_conns, pool_idle_conns, pool_acquired_conns,
                     pool_max_conns]
          properties:
            pool_total_conns:
              type: integer
              format: int32
              description: Connections held right now (idle + acquired + constructing).
            pool_idle_conns:
              type: integer
              format: int32
            pool_acquired_conns:
              type: integer
              format: int32
              description: >-
                Checked out right now. Includes the one connection the
                singleton-cron leader elector pins for as long as this instance
                is the leader.
            pool_max_conns:
              type: integer
              format: int32
              description: >-
                DB_MAX_CONNS — this PROCESS's ceiling. Server-wide demand is
                this times the number of api and worker processes.
        cdn_purge:
          type: object
          description: >-
            This process's CDN purge record: how many invalidation fan-outs
            have run since boot, the per-key outcomes, and when a run last
            ended with the edge possibly still serving something. It exists
            because purge success is otherwise silent and failure one aggregate
            log line, while promoting media headers to shared-cacheable is
            gated on purge being demonstrably exercised. ABSENT — not zeroed —
            when no CDN is wired: zero runs on an edgeless install would read
            as a purge system that never works. In-process counters, reset by a
            restart. Never includes keys or URLs.
          required: [runs, keys_purged, keys_failed]
          properties:
            runs:
              type: integer
              format: int64
              description: >-
                Attempted purge runs — one per invalidated video fan-out or
                single-key asset (avatar, banner, playlist cover).
            keys_purged:
              type: integer
              format: int64
              description: >-
                Keys the provider accepted invalidation for, across all runs
                (404 — never cached — counts as accepted).
            keys_failed:
              type: integer
              format: int64
            last_incomplete_run_at:
              type: string
              format: date-time
              description: >-
                When a run last ended incomplete — per-key failures, or a key
                list known to be short (listing failed / fan-out cap hit).
                Omitted while every run since boot purged its full key set, so
                absence is the good news it reads as.
    MailTestResult:
      type: object
      description: >-
        The mail probe was handed to the relay. "sent" is the only value — a
        failure is an error response, not a status in here.
      required: [status]
      properties:
        status:
          type: string
          enum: [sent]
    InfrastructureFeature:
      type: object
      description: >-
        One optional subsystem's honest state. enabled is "the operator turned
        this on"; configured is "the deployment supplies what it needs to work".
        The two come apart (WHISPER_ENABLED with no endpoint, ATPROTO with no
        sealing key, MAIL_ENABLED behind a relay nobody set) and the gap is the
        interesting case, which is why one boolean was not enough. note carries
        the operator-facing sentence: what the gap is and what closing it buys.
        It is present when a feature is off (discovery — an operator cannot turn
        on what they never knew shipped) or enabled-but-unconfigured (a finding),
        and absent when the feature is on and complete.
        The key vocabulary is fixed and the list is returned in a stable order:
        object_storage, mail, search, federation, atproto, atproto_login,
        malware_scan, captions, live, ipfs, cdn, drm, tracing, metrics,
        vp9_alternates. A client that does not recognise a key must render it
        rather than drop it — this list is how an operator discovers a feature
        the server shipped before the client learned its name.
        Every row is computed from boot config with TWO exceptions, both a
        delivery posture whose only spelling is a runtime setting: cdn's
        enabled half is the runtime delivery_cdn_enabled setting, because a CDN
        has no env spelling of "on" (DELIVERY_CDN_BASE_URL is the wiring, the
        setting is the posture) and a boot-only reading could report nothing
        but "off" on an instance actively serving through an edge — its
        configured half is still boot config, which is what lets the row
        contradict a switch turned on with nothing behind it. And
        object_storage's NOTE (never its columns) reads the runtime
        delivery_presign_enabled setting: on an s3 install with the switch off
        the API proxies every media byte, and the active row's note is where an
        operator discovers the Advanced-page switch and its CORS precondition.
        DRM reports the provider's state and the PRESENCE of DRM_KEY_KEK, never
        the key. The only provider this build ships is clearkey-test, which
        protects nothing (it hands the content key to any authorised viewer over
        TLS) and encrypts nothing yet — the note says so IN EVERY STATE,
        including active: drm is the one row that carries a note while enabled
        and configured, because a green pill next to the word DRM is a sentence
        an operator repeats to somebody else. The warning is pinned to the
        clearkey-test provider value, so a future real provider will not
        inherit it.
        DASH is deliberately absent even though vidra produces it (the default
        cmaf packager writes an MPEG-DASH manifest beside the HLS playlists):
        packaging format is a per-VIDEO property recorded when that video's tree
        was written, with no switch and nothing to half-configure, so no
        (enabled, configured) pair could describe an instance serving both.
      required: [key, enabled, configured]
      properties:
        key:
          type: string
          example: object_storage
        enabled:
          type: boolean
          description: The operator's switch is on.
        configured:
          type: boolean
          description: The deployment supplies what the feature needs.
        note:
          type: string
          description: >-
            What to do about it. Absent when the feature is enabled and fully
            configured — except drm on the test provider (whose active state is
            exactly the one that needs the caveat) and object_storage with
            direct delivery off (whose active state is where the proxying fact
            and the delivery_presign_enabled switch are discovered).
    InfrastructureStatus:
      type: object
      description: >-
        The deploy-time shape of this instance. No secrets: no DSN, no S3 keys,
        no SMTP credentials, no JWT secret, no KEK, no ingest/internal secret.
      required: [server, storage, networking, backups, features]
      properties:
        server:
          type: object
          required: [environment, role, request_timeout_seconds,
                     stream_request_timeout_seconds,
                     body_limit, upload_max_bytes, metrics_enabled, tracing_enabled,
                     tracing_protocol, db_max_conns, db_min_conns,
                     db_conn_max_lifetime_seconds, db_conn_max_idle_time_seconds,
                     drain_delay_seconds]
          properties:
            environment:
              type: string
              enum: [development, test, production]
            role:
              type: string
              enum: [all, api, worker]
              description: >-
                VIDRA_ROLE — whether this process runs the background workers
                and/or serves HTTP. Boot-baked topology, not a credential. A
                fleet accidentally deployed all-api runs zero workers (no
                transcodes, no media GC, no search outbox) and is otherwise
                indistinguishable from a healthy all-in-one install. Reports
                the role of the process ANSWERING this request — a worker-only
                process never serves this page.
            request_timeout_seconds:
              type: integer
              format: int64
              description: The general per-request handler deadline.
            stream_request_timeout_seconds:
              type: integer
              format: int64
              description: >-
                The deadline used instead on the byte-streaming routes (uploads,
                media reads), which are bounded by the client's link speed.
            body_limit:
              type: string
              description: HTTP_BODY_LIMIT verbatim, an Echo size string.
              example: 8M
            upload_max_bytes:
              type: integer
              format: int64
              description: Effective single-upload cap in bytes; 0 means no cap.
            metrics_enabled:
              type: boolean
              description: >-
                Whether GET /metrics is mounted. Shown because that endpoint has
                no authentication of its own.
            tracing_enabled:
              type: boolean
            tracing_protocol:
              type: string
              description: >-
                grpc | http/protobuf. The exporter ENDPOINT is deliberately not
                reported — it is an internal address.
            db_max_conns:
              type: integer
              description: >-
                DB_MAX_CONNS — this PROCESS's slice of PostgreSQL's server-wide
                max_connections budget. Read-only (pool sizing is a deploy-time
                capacity decision, like the rate limits on /admin/system), and
                reported here because the arithmetic that decides whether
                another replica fits is invisible from either end otherwise: the
                database sees connections but not which process owns them, and a
                replica sees its own pool but not how many replicas exist.
            db_min_conns:
              type: integer
              description: DB_MIN_CONNS — the warm floor this process keeps open.
            db_conn_max_lifetime_seconds:
              type: integer
              format: int64
              description: >-
                DB_CONN_MAX_LIFETIME in seconds. A pool that retires connections
                faster than the workload reuses them pays a fresh handshake per
                burst.
            db_conn_max_idle_time_seconds:
              type: integer
              format: int64
              description: DB_CONN_MAX_IDLE_TIME in seconds.
            drain_delay_seconds:
              type: integer
              format: int64
              description: >-
                HTTP_DRAIN_DELAY — how long this process keeps serving after
                SIGTERM, once /readyz has started answering 503, before the
                listener closes. 0 (the default) is correct on a single node and
                is a source of user-visible connection resets on every deploy
                behind a load balancer, which is why zero is reported rather
                than omitted.
        storage:
          type: object
          description: >-
            Where media bytes live. The bucket's coordinates are operational;
            the credentials that open it are never included.
          required: [backend, local_root, s3_endpoint, s3_bucket, s3_region,
                     s3_use_ssl, s3_force_path_style]
          properties:
            backend:
              type: string
              enum: [local, s3]
            local_root:
              type: string
              description: Container path media is written to on the local backend ("" on s3).
            s3_endpoint:
              type: string
              description: host[:port], no scheme ("" on local).
            s3_bucket:
              type: string
            s3_region:
              type: string
            s3_use_ssl:
              type: boolean
            s3_force_path_style:
              type: boolean
        delivery:
          type: object
          description: >-
            How media bytes leave the deployment when this process is not the
            one serving them. ABSENT — not empty — when no CDN is wired
            (DELIVERY_CDN_BASE_URL unset). The purge endpoint template and its
            token are never reported: an invalidation API routinely carries the
            credential in the URL.
          required: [cdn_base_url]
          properties:
            cdn_base_url:
              type: string
              description: >-
                DELIVERY_CDN_BASE_URL verbatim. Definitionally public — every
                viewer's player fetches segments from it — reported so
                confirming WHICH edge is wired does not need an SSH session.
        live:
          type: object
          description: >-
            The live ingest plane's coordinates. ABSENT when FEATURE_LIVE is
            off; PRESENT (with empty strings) when live is enabled with nothing
            behind it — the empty coordinates ARE the finding the live feature
            row's note describes. LIVE_INGEST_SECRET is never included.
          required: [rtmp_url, hls_root]
          properties:
            rtmp_url:
              type: string
              description: >-
                LIVE_RTMP_URL — already handed verbatim to every streamer on
                stream creation.
            hls_root:
              type: string
              description: >-
                LIVE_HLS_ROOT — a container path in the same sensitivity class
                as storage.local_root.
        networking:
          type: object
          required: [public_base_url, https_effective, allow_plain_http,
                     trusted_proxy_cidrs, cors_allowed_origins, federation_enabled,
                     atproto_enabled, atproto_login_enabled]
          properties:
            public_base_url:
              type: string
              description: The canonical public origin ("" when unset).
            https_effective:
              type: boolean
              description: >-
                Whether browsers reach this instance over TLS — the one predicate
                Secure cookies and HSTS both hang off.
            allow_plain_http:
              type: boolean
              description: >-
                The operator's explicit consent to a plain-http production origin
                (a lab/LAN/air-gapped install). True on a public deployment is a
                finding.
            trusted_proxy_cidrs:
              type: array
              description: >-
                EXTRA networks whose X-Forwarded-For is believed, on top of the
                built-in loopback/private set. Never null.
              items:
                type: string
            cors_allowed_origins:
              type: array
              description: The browser-origin allow-list. Never null.
              items:
                type: string
            federation_enabled:
              type: boolean
            atproto_enabled:
              type: boolean
            atproto_login_enabled:
              type: boolean
        backups:
          type: object
          description: >-
            GUIDANCE, not live state. The api container cannot see the deploy
            directory the backups are written to, so it reports the contract and
            names the tool that can answer whether it is being met.
          required: [external_postgres, schedule_note, staleness_note,
                     artifacts_note, live_state_note]
          properties:
            external_postgres:
              type: boolean
              description: >-
                VIDRA_EXTERNAL_POSTGRES — the operator's declaration that the
                database is a managed one somebody else snapshots. Display-only;
                nothing in the api behaves differently.
            schedule_note:
              type: string
              description: >-
                The cadence in force. Replaced with the managed-database advice
                when external_postgres is true.
            staleness_note:
              type: string
            artifacts_note:
              type: string
            live_state_note:
              type: string
        features:
          type: array
          items:
            $ref: "#/components/schemas/InfrastructureFeature"
    JobRunState:
      type: string
      description: Stable state vocabulary for the unified operational projection.
      enum:
        - queued
        - claimed
        - running
        - retry_scheduled
        - succeeded
        - failed
        - dead_lettered
        - cancel_requested
        - cancelled
    JobMetadata:
      type: object
      description: >-
        Bounded, allowlisted operational metadata. Values are short scalar
        booleans/numbers/enum-like tokens only; URLs, credentials, emails, nested
        payloads, process output, and arbitrary source data are rejected.
      additionalProperties: false
      properties:
        mode: { type: string, maxLength: 128 }
        resolver: { type: string, maxLength: 128 }
        language: { type: string, maxLength: 128 }
        media_class: { type: string, maxLength: 128 }
        network: { type: string, maxLength: 128 }
        dry_run: { type: boolean }
        conflict_policy: { type: string, maxLength: 128 }
        source_version: { type: number, minimum: 0 }
        planned: { type: number, minimum: 0 }
        imported: { type: number, minimum: 0 }
        skipped: { type: number, minimum: 0 }
        failed: { type: number, minimum: 0 }
        unsupported: { type: number, minimum: 0 }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
        duration_seconds: { type: number, minimum: 0 }
        bytes: { type: number, minimum: 0 }
        items: { type: number, minimum: 0 }
        reason_code: { type: string, maxLength: 128 }
    JobRun:
      type: object
      description: >-
        One sanitized execution projection. Source queue identifiers, lease
        tokens, idempotency keys, raw inputs, and unrestricted errors are not exposed.
      required:
        - id
        - type
        - queue
        - state
        - priority
        - attempt
        - input_metadata
        - output_metadata
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        pipeline_run_id: { type: string, format: uuid }
        parent_job_id: { type: string, format: uuid }
        type: { type: string, maxLength: 128 }
        queue: { type: string, maxLength: 128 }
        state: { $ref: "#/components/schemas/JobRunState" }
        stage: { type: string, maxLength: 128 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        priority: { type: integer, format: int32 }
        attempt: { type: integer, format: int32, minimum: 0 }
        max_attempts: { type: integer, format: int32, minimum: 1 }
        actor_id: { type: string, format: uuid }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 255 }
        request_id: { type: string, maxLength: 128 }
        correlation_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 32 }
        worker_id: { type: string, maxLength: 255 }
        lease_expires_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        input_metadata: { $ref: "#/components/schemas/JobMetadata" }
        output_metadata: { $ref: "#/components/schemas/JobMetadata" }
        error_class: { type: string, maxLength: 64 }
        error_code: { type: string, maxLength: 128 }
        error_detail:
          type: string
          maxLength: 2048
          description: Bounded redacted detail; never raw subprocess/network output.
        error_retryable: { type: boolean }
    JobEvent:
      type: object
      description: One durable sanitized execution transition.
      required: [id, cursor, job_id, kind, state, attempt, metadata, occurred_at]
      properties:
        id: { type: string, format: uuid }
        cursor:
          type: string
          pattern: "^[0-9]+$"
          description: Opaque BIGINT replay cursor serialized as a decimal string.
        job_id: { type: string, format: uuid }
        pipeline_run_id: { type: string, format: uuid }
        kind: { type: string, maxLength: 128 }
        state: { $ref: "#/components/schemas/JobRunState" }
        stage: { type: string, maxLength: 128 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        attempt: { type: integer, format: int32, minimum: 0 }
        worker_id: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 1024 }
        metadata: { $ref: "#/components/schemas/JobMetadata" }
        request_id: { type: string, maxLength: 128 }
        correlation_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 32 }
        occurred_at: { type: string, format: date-time }
    JobRunsResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [runs, event_cursor]
          properties:
            runs:
              type: array
              items: { $ref: "#/components/schemas/JobRun" }
            event_cursor:
              type: string
              pattern: "^[0-9]+$"
    JobRunDetailResponse:
      type: object
      required: [run, events, events_total, events_limit, events_offset, event_cursor]
      properties:
        run: { $ref: "#/components/schemas/JobRun" }
        events:
          type: array
          description: Newest-first event page through event_cursor.
          items: { $ref: "#/components/schemas/JobEvent" }
        events_total: { type: integer, format: int64, minimum: 0 }
        events_limit: { type: integer, minimum: 1, maximum: 100 }
        events_offset: { type: integer, minimum: 0 }
        event_cursor:
          type: string
          pattern: "^[0-9]+$"
    JobsOverview:
      type: object
      description: >-
        Durable job-queue operations snapshot (admin jobs page). No secrets/PII.
      required: [queues, recent_failures]
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueStatus"
        recent_failures:
          type: array
          description: Newest-first, merged across queues, capped.
          items:
            $ref: "#/components/schemas/JobFailure"
    QueueStatus:
      type: object
      description: >-
        One queue's normalised depth. For upload_sessions (no retry model),
        pending=active, done=completed, failed=cancelled, running=0. For
        storage_migrations the unit is the OBJECT being moved, not the campaign:
        pending=not yet copied, running=copying, done=verified or
        source-deleted, failed=dead-lettered.
      required: [queue, pending, running, done, failed, oldest_pending_age_seconds]
      properties:
        queue:
          type: string
          example: transcode_jobs
        pending:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        done:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        oldest_pending_age_seconds:
          type: integer
          format: int64
          description: Age of the oldest still-pending item, or 0 when none pending.
    JobFailure:
      type: object
      description: One dead-lettered job, safe to show an operator (no secrets/URLs).
      required: [queue, id, error, attempts, failed_at]
      properties:
        queue:
          type: string
        id:
          type: string
          format: uuid
        error:
          type: string
        attempts:
          type: integer
        failed_at:
          type: string
          format: date-time
    InstanceSetting:
      type: object
      description: >-
        One runtime-mutable instance setting's effective state: its type, the
        effective value (a string for text/enum keys, a boolean for toggle
        keys, an integer for limit keys, an array of strings for list keys),
        the default, and whether the database currently overrides it. Enum-typed
        settings also list their allowed options. Every setting carries its
        admin-IA placement (page + section, config-parity W1) so the
        metadata-driven admin UI auto-places keys into the right page.
      required: [key, type, value, default, overridden, page, section]
      properties:
        key:
          type: string
          description: The stable setting key.
          example: uploads_enabled
        type:
          type: string
          enum: [string, bool, enum, list, int]
        value:
          description: The effective value (string, boolean, integer, or string array per type).
          oneOf:
            - type: string
            - type: boolean
            - type: integer
              format: int64
            - type: array
              items:
                type: string
        default:
          description: The default (string, boolean, integer, or string array per type).
          oneOf:
            - type: string
            - type: boolean
            - type: integer
              format: int64
            - type: array
              items:
                type: string
        overridden:
          type: boolean
          description: Whether a database override is currently set for this key.
        options:
          type: array
          items:
            type: string
          description: >-
            For type=enum only: the allowed values, in display order. Absent
            for other types.
        page:
          type: string
          enum: [general, vod, live, federation, customization, homepage, advanced]
          description: The admin-config page this key renders on.
        section:
          type: string
          description: The in-page section (stable snake_case label), e.g. "broadcast".
    PeerTubeImportLaunchRequest:
      type: object
      description: >-
        Launch parameters for a PeerTube import run. The source connection is
        NOT here — it comes from server config only.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [dry_run, run]
          description: dry_run reports the plan and writes nothing; run performs the import.
        conflict_policy:
          type: string
          enum: [skip, rename, merge, fail]
          description: >-
            How username/handle/email/slug collisions with existing Vidra rows
            are resolved. Defaults to skip (safest, non-destructive).
        source_authoritative:
          type: boolean
          description: >-
            Optional; omitted means false. Whether the SOURCE wins where it and
            this instance have diverged. It
            is a SECOND, ORTHOGONAL axis, not another conflict_policy value: the
            policy resolves natural-key collisions at insert time, this decides
            whether a re-run may UPDATE the rows the import already owns. It
            exists for the migration workflow this tool is actually used for — a
            repeated sync against a still-live PeerTube, on a schedule, up to
            cutover — where a title edited, a password changed or a chapter moved
            on the source must follow. It updates video/channel/user metadata
            (including the password hash), chapters, video tags, ratings,
            playlist items, subscriptions, the instance category taxonomy and
            actor images. It NEVER touches a row created on Vidra (they have no
            import ledger entry), never re-inserts an entity, never rotates an
            actor keypair, never assigns a view count, never overwrites a
            rendition row, and never re-downloads media. Defaults to false —
            gap-filling, which is what an import has always done.

            It is independent of `acknowledged_schema_version`, which is a
            version gate rather than a write policy: acknowledging a schema
            version grants no permission to overwrite anything, and a
            source-authoritative run against a verified source needs no
            acknowledgement.
        acknowledged_schema_version:
          type: integer
          minimum: 1
          description: >-
            An administrator's explicit, per-request sign-off on a source schema
            version OUTSIDE the importer's verified range. Omit it — that is the
            normal case, and the version gate then stands.

            Set it only to the exact `source_version` a previous run reported
            alongside `error_code: unverified_schema`. It is a version rather
            than a boolean deliberately: the gate opens only when this equals the
            version preflight actually detects, so an acknowledgement cannot be
            made in the abstract by a caller that never looked at the source, and
            stops applying by itself if the source is upgraded in the meantime.

            It is per-run and is never remembered: the next launch must state it
            again. There is no server default and no configuration key for it. It
            widens the schema-version gate and nothing else, and is recorded on
            the run (`acknowledged_schema_version`) next to the admin who
            launched it, plus an audit event naming the version accepted.

            What is being accepted is real: an unverified schema may have
            renamed or removed columns the importer reads, so the run can fail
            partway or carry incorrect data. A run refused with
            `error_code: undetectable_schema` cannot be acknowledged at all —
            there is no version to name.
    PeerTubeImportCounts:
      type: object
      description: Per-entity outcome tally.
      required: [planned, imported, skipped, failed, unsupported]
      properties:
        planned:
          type: integer
        imported:
          type: integer
        updated:
          type: integer
          description: >-
            Rows that already existed and were CHANGED to match the source. Only
            ever non-zero for a source_authoritative run. Not required: reports
            persisted by earlier releases have no such field.
        skipped:
          type: integer
        failed:
          type: integer
        unsupported:
          type: integer
    PeerTubeImportReport:
      type: object
      description: >-
        Machine-readable summary of a plan (dry-run) or run. Carries only counts,
        the detected source version, and safe conflict notes — never secrets/PII.
      required: [dry_run, conflict_policy, entities]
      properties:
        source_version:
          type: integer
          description: Detected PeerTube schema version (application.migrationVersion).
        dry_run:
          type: boolean
        conflict_policy:
          type: string
        source_authoritative:
          type: boolean
          description: >-
            Whether this run was allowed to update rows the import already owns
            where the source and this instance had diverged. Recorded on the
            report because "why did that title change?" is asked long afterwards.
        entities:
          type: object
          description: >-
            Per-entity-kind counts, keyed by entity kind (category_taxonomy,
            user, channel, actor_avatar, actor_banner, video, video_file,
            hls_playlist, thumbnail, storyboard, caption, tag, view_count,
            chapter, rating, rendition, comment, playlist, playlist_item,
            follow). view_count
            counts VIDEOS whose view total was carried, never views: the source
            records one lifetime number per video and no daily breakdown, so the
            total is applied as a delta to the video's counter and no per-day
            rows are invented. category_taxonomy is the INSTANCE's category list,
            so it is 0 or 1: 1 when the source replaces the stock taxonomy (a
            categories plugin) and the setting is the import's to write, 0 for
            the majority of sources, which run the stock list and get no override
            written. actor_avatar and actor_banner count the source's account and
            channel profile images, which are FETCHED over HTTP from the source
            instance rather than read from its object store (no PeerTube
            configuration puts them there), and which are never written over an
            image this instance already has. thumbnail and storyboard count
            VIDEOS whose poster and seek-preview sprite sheet were carried, and
            they follow the same rules: PeerTube keeps neither in object storage
            either, so both are read from a mounted source media root when there
            is one and fetched over HTTP otherwise, and neither is written over
            an asset this instance already holds. A storyboard is carried as its
            sprite sheet AND a WebVTT map synthesised from the source's grid
            geometry, because PeerTube stores no map of its own; expect a source
            to have fewer storyboards than videos, since it generates none for a
            video shorter than three seconds.
          additionalProperties:
            $ref: "#/components/schemas/PeerTubeImportCounts"
        deferred:
          type: array
          description: Entity families intentionally not migrated (regenerate/reconcile by hand).
          items:
            type: string
        conflicts:
          type: array
          description: Safe, human-readable notes about resolved collisions.
          items:
            type: string
    PeerTubeImportRun:
      type: object
      description: Status view of one PeerTube import run.
      required: [id, mode, state, conflict_policy, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [dry_run, run]
        state:
          type: string
          enum: [pending, running, done, failed]
        conflict_policy:
          type: string
          enum: [skip, rename, merge, fail]
        source_authoritative:
          type: boolean
          description: >-
            Whether this run was launched with the source as the authority where
            the two sides have diverged.
        source_version:
          type: [integer, "null"]
          description: >-
            The PeerTube schema version (application.migrationVersion) preflight
            detected. Populated even when preflight REFUSED that version — it is
            the number an administrator has to be shown before they can be asked
            to acknowledge it.
        acknowledged_schema_version:
          type: [integer, "null"]
          description: >-
            The unverified schema version the launching administrator explicitly
            accepted for this run, or null (the norm). Recorded so the import
            history shows what was signed off on, not merely that something was.
        report:
          $ref: "#/components/schemas/PeerTubeImportReport"
        error:
          type: string
          description: Safe, client-visible failure reason (never a DSN/credential).
        error_code:
          type: string
          description: >-
            Stable snake_case class of a failure; empty when the run has not
            failed or the failure has no class of its own. Clients branch on
            this; `error` is prose for a person.

            unverified_schema — the source's schema version was detected and
            falls outside the importer's verified range. `source_version` carries
            it. This is the ONE failure an administrator may overrule, by
            re-launching with `acknowledged_schema_version` set to that number.

            undetectable_schema — no schema version could be read from the source
            at all. Not acknowledgeable: there is no version to name. It needs a
            human on the `peertube-import` CLI with --force.
          example: unverified_schema
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    PeerTubeImportRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/PeerTubeImportRun"
    IPFSStatus:
      type: object
      description: >-
        Status of the hybrid IPFS media mirror (fix_plan P19). IPFS is a mirror
        sidecar; these fields are informational and never gate media serving.
      required: [enabled, node_reachable, gateway_url, cluster_enabled, cluster_reachable, pins, by_class, networks]
      properties:
        enabled:
          type: boolean
          description: Whether IPFS_ENABLED is set on this instance.
        node_reachable:
          type: boolean
          description: Whether the Kubo node answered the /api/v0/version health probe.
        gateway_url:
          type: string
          description: The public gateway base URL emitted in media responses.
        cluster_enabled:
          type: boolean
          description: Whether an IPFS Cluster REST API is configured for replication.
        cluster_reachable:
          type: boolean
          description: >-
            Whether the configured IPFS Cluster REST API answered its /id health
            probe. Always false when cluster_enabled is false.
        pins:
          $ref: "#/components/schemas/IPFSPinCounts"
        by_class:
          type: array
          description: Pin counts broken down per media class.
          items:
            $ref: "#/components/schemas/IPFSClassPinCounts"
        networks:
          allOf:
            - $ref: "#/components/schemas/IPFSNetworks"
          description: >-
            Per-swarm split of the mirror status (fix_plan P19.P2): the public mirror
            and the separate private replication swarm each with their own enabled
            flag, node reachability, and pin counts. The top-level pins/by_class/
            node_reachable fold across both for back-compat. Additive — private-tier
            fields are inert (enabled=false, zero counts) unless IPFS_MIRROR_PRIVATE is
            configured. Never carries a CID or gateway URL for the private swarm (it is
            replication, not distribution).
    IPFSNetworks:
      type: object
      description: The public + private swarm status blocks (fix_plan P19.P2).
      required: [public, private]
      properties:
        public:
          $ref: "#/components/schemas/IPFSNetworkStatus"
        private:
          $ref: "#/components/schemas/IPFSNetworkStatus"
    IPFSNetworkStatus:
      type: object
      description: >-
        One swarm's mirror status: whether that tier is enabled on this instance, its
        node's reachability, its optional replication-cluster health, and its pin counts
        overall and per media class. Carries no gateway URL and no CIDs.
      required: [enabled, node_reachable, cluster_enabled, cluster_reachable, pins, by_class]
      properties:
        enabled:
          type: boolean
          description: Whether this swarm's tier is configured (public = IPFS_ENABLED, private = IPFS_MIRROR_PRIVATE).
        node_reachable:
          type: boolean
          description: Whether this swarm's Kubo node answered its health probe.
        cluster_enabled:
          type: boolean
          description: >-
            Whether an IPFS Cluster REST API is configured for THIS swarm's replication
            (public = IPFS_CLUSTER_API_URL, private = IPFS_PRIVATE_CLUSTER_API_URL). The
            private cluster is a fully separate cluster on the private swarm (fix_plan P19.P3).
        cluster_reachable:
          type: boolean
          description: >-
            Whether this swarm's IPFS Cluster REST API answered its /id health probe.
            Always false when cluster_enabled is false.
        pins:
          $ref: "#/components/schemas/IPFSPinCounts"
        by_class:
          type: array
          description: This swarm's pin counts broken down per media class.
          items:
            $ref: "#/components/schemas/IPFSClassPinCounts"
    IPFSPinCounts:
      type: object
      description: Pin counts by ledger state.
      required: [pinned, pending, failed, unpinned]
      properties:
        pinned:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        unpinned:
          type: integer
          format: int64
    IPFSClassPinCounts:
      type: object
      description: Pin counts for one media class.
      required: [media_class, pinned, pending, failed, unpinned]
      properties:
        media_class:
          type: string
          description: e.g. video_original, hls, thumbnail, user_avatar.
        pinned:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        unpinned:
          type: integer
          format: int64
    IPFSReconcileResult:
      type: object
      description: >-
        Result of an IPFS reconciliation scan: how many pin intents were enqueued,
        overall and per media class. Idempotent — a second run enqueues zero.
      required: [enqueued, by_class]
      properties:
        enqueued:
          type: integer
          format: int64
          description: Total pin intents enqueued by this scan.
        by_class:
          type: object
          description: Enqueued counts keyed by media class.
          additionalProperties:
            type: integer
            format: int64
    InstanceSettingsResponse:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSetting"
    SettingValidationIssue:
      type: object
      description: >-
        One rejected setting: the key that would fail and the message the PATCH's
        422 would carry for it. Identical in shape to the field errors in
        ErrorResponse, so a client renders both the same way.
      required: [field, message]
      properties:
        field:
          type: string
          description: The setting key.
          example: instance_name
        message:
          type: string
          example: is required
    InstanceSettingsValidationResponse:
      type: object
      description: >-
        The dry-run result. fields is always present: an empty array means the
        same body would be accepted by PATCH /api/v1/admin/instance-settings.
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SettingValidationIssue"
    InstanceHomepageResponse:
      type: object
      description: >-
        The admin-authored homepage document (config-parity W1): RAW markdown
        plus its sha256 content hash.
      required: [body, hash]
      properties:
        body:
          type: string
          description: Raw markdown; the client renders/sanitises.
        hash:
          type: string
          description: Lowercase-hex sha256 of the body.
    InstanceDocumentResponse:
      type: object
      description: >-
        One instance document's stored state (admin editor shape). A never-set
        or cleared document has an empty body and hash.
      required: [name, body, hash]
      properties:
        name:
          type: string
          enum: [homepage, custom_css, custom_js]
        body:
          type: string
        hash:
          type: string
          description: Lowercase-hex sha256 of the body ("" when unset).
    UpdateInstanceDocumentRequest:
      type: object
      description: >-
        The new document body. An empty string clears the document (public
        delivery 404s while unset). Caps: homepage 100KB; custom_css/custom_js
        200KB.
      required: [body]
      properties:
        body:
          type: string
    UpdateInstanceSettingsRequest:
      type: object
      description: >-
        A flat object of setting key → new value. Toggle keys take a boolean;
        text/markdown/link and enum keys take a string; limit keys (quota, upload
        size/sessions, import resolution) take an integer; list keys take an array
        of strings. A null value clears the override (reset to the config default).
        Only the keys present are changed. At least one key is required. Limit
        changes take effect on the next request/job (no restart).
      additionalProperties:
        description: >-
          The new value: a string for text/markdown/link/enum keys, a boolean for
          toggle keys, an integer for limit keys, an array of strings for list
          keys, or null to clear the override (reset to the config default).
        oneOf:
          - type: string
          - type: boolean
          - type: integer
            format: int64
          - type: array
            items:
              type: string
          - type: "null"
      example:
        instance_name: My Vidra
        uploads_enabled: false
        downloads_enabled: false
        sensitive_content_policy: blur
        instance_categories: ["1", "7"]
        upload_max_size_bytes: 2147483648
        terms_url: null
    UpdateUserRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
          description: >-
            Admin-set email verification state: true marks the address
            confirmed without the token round-trip; false revokes the
            confirmation. Omit to leave unchanged.
        bypass_quarantine:
          type: boolean
          description: >-
            Exempts the account from the QUARANTINE_NEW_UPLOADS gate (its
            uploads publish directly); false re-subjects it. Omit to leave
            unchanged.
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            Per-user storage quota in bytes. Omit to leave unchanged; null
            resets the account to the instance default; 0 makes the account
            unlimited. Negative or non-integer values are 422.
    VideoFile:
      type: object
      description: >-
        A stored file backing a video. The storage key is internal and not
        exposed.
      required: [id, kind, content_type, original_name, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [original, rendition]
        content_type:
          type: string
          description: The client-declared MIME type (untrusted, for display only).
          example: video/mp4
        original_name:
          type: string
          description: The client-declared filename (untrusted, for display only).
          example: Clip.MP4
        size_bytes:
          type: integer
          format: int64
          description: Number of bytes actually stored.
          example: 10485760
        created_at:
          type: string
          format: date-time
    UploadVideoFileResponse:
      type: object
      required: [video, file]
      properties:
        video:
          $ref: "#/components/schemas/Video"
        file:
          $ref: "#/components/schemas/VideoFile"
    ImportVideoRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: >-
            Public http/https URL of the media file (direct) or platform watch
            page (ytdlp) to import. The server refuses non-http schemes and
            non-public addresses (SSRF-guarded) before any fetch.
          example: https://example.com/clip.mp4
        resolver:
          type: string
          enum: [auto, direct, ytdlp]
          default: auto
          description: >-
            How to fetch the source. `auto` (default) tries a direct media fetch
            (by extension/Content-Type) and falls back to the sandboxed yt-dlp
            platform extractor when it is enabled. `direct` forces a plain
            HTTP(S) media fetch. `ytdlp` forces the platform extractor and is
            refused with 503 when YTDLP_IMPORT_ENABLED is off on this instance.
    ImportJob:
      type: object
      description: An asynchronous URL-import job for a video's original file.
      required: [id, video_id, state, resolver, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
        resolver:
          type: string
          enum: [auto, direct, ytdlp]
          description: >-
            The mechanism the worker used. `auto` is the transient requested
            value until the worker resolves it, then it is rewritten to the
            concrete `direct` or `ytdlp` that actually ran.
        stage:
          type: string
          enum: [resolving, downloading, processing]
          description: >-
            Coarse progress while state is running (omitted otherwise): resolving
            (picking the concrete resolver for an auto request), downloading
            (fetching the bytes), processing (scan/probe/transcode). Never
            carries a secret.
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            source URL.
        attempts:
          type: integer
          description: How many times the import has been attempted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportJobResponse:
      type: object
      required: [import_job]
      properties:
        import_job:
          $ref: "#/components/schemas/ImportJob"
    CreateChannelSyncRequest:
      type: object
      required: [channel_id, external_channel_url]
      properties:
        channel_id:
          type: string
          format: uuid
          description: The LOCAL channel (owned by the caller) to mirror uploads into.
        external_channel_url:
          type: string
          description: >-
            Public http/https URL of the external platform channel to mirror.
            SSRF-validated before use; a non-public address is refused.
          example: https://www.youtube.com/@example
    ChannelSync:
      type: object
      description: A binding that mirrors an external channel's uploads into a local channel.
      required: [id, channel_id, external_channel_url, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        external_channel_url:
          type: string
        state:
          type: string
          enum: [waiting_first_run, syncing, idle, failed]
          description: >-
            waiting_first_run (never synced), syncing (a run is in progress),
            idle (last run succeeded), failed (last run errored; see last_error).
        last_sync_at:
          type: string
          format: date-time
          description: When the last successful run completed (omitted until the first run).
        last_error:
          type: string
          description: >-
            A safe, human-readable reason for the last failed run (omitted when
            empty). Never a raw internal error or credentials.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelSyncResponse:
      type: object
      required: [channel_sync]
      properties:
        channel_sync:
          $ref: "#/components/schemas/ChannelSync"
    ChannelSyncListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [channel_syncs]
          properties:
            channel_syncs:
              type: array
              items:
                $ref: "#/components/schemas/ChannelSync"
    AutoCaptionRequest:
      type: object
      description: >-
        Optional body for an auto-caption request. When language is omitted the
        server uses WHISPER_DEFAULT_LANGUAGE.
      properties:
        language:
          type: string
          description: >-
            BCP-47-ish caption language tag (e.g. en, pt-BR). It is both the tag
            the generated track is stored under and the transcription hint.
          example: en
    CaptionJob:
      type: object
      description: An asynchronous auto-caption (Whisper) job for a video.
      required: [id, video_id, language, state, attempts, progress_percent, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        language:
          type: string
          description: The caption language tag the generated track is stored under.
        state:
          type: string
          enum: [pending, running, done, failed]
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            Whisper endpoint URL.
        attempts:
          type: integer
          description: How many times the auto-caption has been attempted.
        stage:
          type: string
          description: Safe coarse stage such as preparing, transcribing, storing, or complete.
        progress_percent:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CaptionJobResponse:
      type: object
      required: [caption_job]
      properties:
        caption_job:
          $ref: "#/components/schemas/CaptionJob"
    CreateUploadSessionRequest:
      type: object
      required: [size, filename]
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: The total size of the file to upload, in bytes.
          example: 104857600
        filename:
          type: string
          description: >-
            The client filename; its extension must be an accepted video
            container (validated up front).
          example: clip.mp4
        file_fingerprint:
          type: string
          maxLength: 128
          description: >-
            Optional OPAQUE client identity for the file, used for cross-refresh
            / cross-device resume (see GET /api/v1/me/uploads). Recommended
            recipe: a SHA-256 hex digest over the file size concatenated with its
            first and last 1 MiB. Stored verbatim (<=128 chars) and never parsed
            by the server — only compared. Omit or leave empty to supply none.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    UploadSessionResponse:
      type: object
      description: The opened resumable upload session.
      required: [upload_id, chunk_size, total_chunks, size, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
        chunk_size:
          type: integer
          description: >-
            The fixed chunk size in bytes (8 MiB). Every chunk but the last must
            be exactly this many bytes.
        total_chunks:
          type: integer
          description: How many chunks to upload (indices 0 … total_chunks-1).
        size:
          type: integer
          format: int64
          description: The declared total size, echoed back.
        expires_at:
          type: string
          format: date-time
          description: When the session (and its uploaded chunks) expire (24h).
    UploadStatusResponse:
      type: object
      description: >-
        A resumable upload's received-chunk status (the resume contract) and its
        lifecycle state — which, since completion became asynchronous, is also
        the contract a client polls after the last chunk lands.
      required:
        - upload_id
        - video_id
        - state
        - size
        - chunk_size
        - total_chunks
        - received_chunks
        - bytes_received
        - expires_at
        - failure_reason
      properties:
        upload_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          description: >-
            `active` — the client is still sending chunks.
            `queued` — completion was accepted and a finalize job is enqueued.
            `processing` — a worker is assembling, storing and probing the file.
            `completed` — the pipeline finished; read the VIDEO for its outcome
            (a probe or scan may still have failed it).
            `failed` — finalisation failed permanently; `failure_reason` says why.
            `cancelled` — the client cancelled before completing.
          enum: [active, queued, processing, completed, failed, cancelled]
        failure_reason:
          type: string
          description: >-
            A safe, human-readable reason for a `failed` session; empty for every
            other state.
        size:
          type: integer
          format: int64
        chunk_size:
          type: integer
        total_chunks:
          type: integer
        received_chunks:
          type: array
          items:
            type: integer
          description: The chunk indices that have landed, ascending.
        bytes_received:
          type: integer
          format: int64
          description: The total bytes received across all landed chunks.
        expires_at:
          type: string
          format: date-time
    ActiveUploadsResponse:
      type: object
      description: The caller's active resumable upload sessions (UPLOAD-03).
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/ActiveUpload"
    ActiveUpload:
      type: object
      description: >-
        One of the caller's ACTIVE resumable upload sessions, with enough to
        reconstruct/continue it after a refresh or on another device.
      required:
        - upload_id
        - video_id
        - filename
        - size
        - chunk_size
        - total_chunks
        - received_chunks
        - file_fingerprint
        - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
          format: int64
          description: The declared total file size, in bytes.
        chunk_size:
          type: integer
          description: The fixed chunk size in bytes (every chunk but the last).
        total_chunks:
          type: integer
          description: How many chunks the file is split into.
        received_chunks:
          type: integer
          description: How many chunk indices have landed so far.
        file_fingerprint:
          type: string
          description: >-
            The opaque file identity supplied at create time (empty when none was
            provided).
        expires_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ada
          description: >-
            Must not contain `@` or whitespace. Sign-in accepts an email OR a
            username and resolves the email first, so a username holding `@`
            could only ever be an unreachable sign-in identifier or a lookalike
            of another account's address. Usernames created before this rule are
            unaffected and still sign in normally.
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        note:
          type: string
          maxLength: 2000
          description: >-
            Optional message to moderators, used only when the instance requires
            registration approval; ignored otherwise.
        age_attestation:
          type: boolean
          description: >-
            PeerTube-style minimum-age attestation ("I am at least N years
            old"). Required (true) while the instance's
            registration_minimum_age setting is active (GET /api/v1/instance
            reports the threshold); no birthdate is collected. Missing/false
            while active is a 422 field error on `age_attestation`.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    ClaimOwnerRequest:
      type: object
      required: [token, username, email, password]
      properties:
        token:
          type: string
          format: password
          description: >-
            The one-time setup token from the server log. Compared in constant
            time against its stored hash; unrecoverable once the log line is
            lost (restart the server to mint a fresh one).
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ada
          description: >-
            Must not contain `@` or whitespace — the same rule registration
            applies, for the same reason (see RegisterRequest.username).
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RegistrationPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, verification_pending]
          description: >-
            `pending`: the signup is queued for admin approval; no account
            exists yet. `verification_pending`: the account was created HELD
            behind the email-verification gate
            (registration_require_email_verification) — no session is issued
            and login answers 403 `email_verification_required` until the
            emailed link is confirmed at POST /api/v1/auth/verify-email/confirm.
    RegistrationRequest:
      type: object
      required: [id, username, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        note:
          type: string
          description: Optional applicant message.
        status:
          type: string
          enum: [pending, approved, rejected]
        moderator_note:
          type: string
          description: Internal note recorded when the request was rejected.
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        reviewer_username:
          type: string
          description: Username of the admin who reviewed it; omitted while pending.
    RegistrationRequestListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [requests]
          properties:
            requests:
              type: array
              items:
                $ref: "#/components/schemas/RegistrationRequest"
    RejectRegistrationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: Optional internal moderator note (not shown to the applicant).
    FederationFollowerRequest:
      type: object
      required: [id, channel_id, channel_handle, actor_url, created_at]
      description: >-
        One pending inbound ActivityPub channel Follow awaiting an admin
        decision (federation_follower_approval, config-parity W12).
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        channel_handle:
          type: string
          description: Handle of the local channel being followed.
        actor_url:
          type: string
          description: The remote follower's ActivityPub actor URL.
        handle:
          type: string
          description: >-
            The follower's cached fediverse identity
            (preferred_username@domain); omitted when the remote-actor cache
            row is gone.
        domain:
          type: string
          description: The follower's home domain; omitted when uncached.
        created_at:
          type: string
          format: date-time
    FederationFollowerRequestListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [requests]
          properties:
            requests:
              type: array
              items:
                $ref: "#/components/schemas/FederationFollowerRequest"
    LoginRequest:
      type: object
      required: [password]
      description: >-
        Send EXACTLY ONE identifier: `identifier` (an email address or a
        username) or the legacy `email`. Supplying both is a 422 field error on
        `identifier` — the request would otherwise be ambiguous. Supplying
        neither is a 422 on `email`.
      properties:
        email:
          type: string
          example: ada@example.test
          description: >-
            Legacy email-only sign-in field, still fully supported. Must be a
            syntactically valid address. Prefer `identifier`.
        identifier:
          type: string
          minLength: 3
          maxLength: 254
          example: ada
          description: >-
            An email address OR a username. No format is imposed beyond length,
            because usernames created before the '@'/whitespace ban may contain
            anything. When the value matches an account's email address it
            ALWAYS resolves to that account, never to a different account that
            holds the same string as its username.
        password:
          type: string
          format: password
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: >-
            The opaque refresh token returned by register/login/refresh. May be
            omitted when the request carries the `vidra_refresh` cookie (cookie
            mode) — the cookie value is used instead. An explicit body token
            takes precedence over the cookie. 422 when neither is present.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the rotated session into cookie mode even when the token was
            sent in the body. A cookie-supplied token implies cookie mode.
    AuthResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
          description: Signed HS256 JWT access token.
        refresh_token:
          type: string
          description: >-
            Opaque rotating refresh token; store securely, send to /auth/refresh.
            Omitted in cookie mode, where the httpOnly `vidra_refresh` cookie is
            the sole carrier of the refresh token.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"
    MFARequiredResponse:
      type: object
      required: [mfa_required, mfa_token]
      description: >-
        Login outcome for an account with two-factor authentication enabled:
        the credentials were valid but no session is issued yet. Present the
        mfa_token with a TOTP or recovery code at POST /api/v1/auth/mfa/challenge.
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
          description: >-
            Short-lived (5 min) single-purpose token. Not an access token — it
            is only accepted by the MFA challenge endpoint.
    MFAStatusResponse:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enabled.
        recovery_codes_remaining:
          type: integer
          description: Unused single-use recovery codes left (0 when disabled).
          example: 10
    TOTPEnrollmentResponse:
      type: object
      required: [secret, otpauth_uri]
      description: >-
        Returned exactly once when enrollment starts; neither field can be
        retrieved again.
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret, for manual authenticator entry.
        otpauth_uri:
          type: string
          description: >-
            otpauth:// provisioning URI (QR-code payload) carrying the secret,
            the account label, and the instance's issuer name.
    RecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: >-
            The 10 single-use recovery codes, shown exactly once (stored
            hashed). Each replaces a TOTP code at the MFA challenge and is
            consumed on use.
          items:
            type: string
            example: a1b2c-3d4e5
    MFAChallengeRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: The mfa_token from the login response (valid 5 minutes).
        code:
          type: string
          description: >-
            The current 6-digit authenticator code (±1 period of clock skew is
            tolerated) or one unused recovery code.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients), exactly
            like login: the rotating refresh token is set as an httpOnly
            `vidra_refresh` cookie and omitted from the response body.
    QoEEventInput:
      type: object
      required: [type, video_id, engine, packaging_format]
      description: >-
        One playback measurement. Every vocabulary is closed and validated at
        the edge; an unknown value rejects the whole batch rather than being
        stored.
      properties:
        type:
          type: string
          enum: [playback.start, playback.rebuffer, playback.bitrate_switch, playback.error]
        video_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
          description: >-
            The playback session's id. Client-asserted unless playback_token is
            also present and verifies.
        playback_token:
          type: string
          description: >-
            The session's playback token, when the video had one (password
            privacy only). Presenting it makes session_id attestable.
        source_url:
          type: string
          maxLength: 2048
          description: >-
            The final URL the client fetched media from. Classified server-side
            into a delivery source and then discarded — never stored.
        engine:
          type: string
          enum: [hls-js, native-hls, progressive, shaka]
        packaging_format:
          type: string
          enum: [hls-ts, cmaf, progressive]
        ttff_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          description: Required on playback.start, and rejected on every other type.
        rebuffer_ms:
          type: integer
          minimum: 0
          maximum: 3600000
          description: >-
            Duration of one rebuffer that has ENDED. Required on
            playback.rebuffer, and rejected on every other type.
        rendition_height:
          type: integer
          minimum: 1
          maximum: 8640
          description: >-
            The rung in play. Optional, and rejected outright from the
            native-hls engine, which cannot know it.
        error_class:
          type: string
          enum: [network, media, manifest, decrypt, timeout, other]
          description: Required on playback.error, and rejected on every other type.
        metadata:
          type: object
          description: >-
            Optional extras, deny-by-default: only a short allowlist of bounded
            enum/number/boolean keys survives, everything else is discarded.
          additionalProperties: true
    QoEPercentiles:
      type: object
      description: >-
        p50/p95/p99 in milliseconds. Each is null — never 0 — when the window
        recorded no measurement of that kind.
      properties:
        p50_ms: { type: [integer, "null"] }
        p95_ms: { type: [integer, "null"] }
        p99_ms: { type: [integer, "null"] }
    QoESourceSummary:
      type: object
      description: One delivery source, merged across the whole window.
      # The handler's struct carries no omitempty, so every key below is always
      # on the wire and a client need not defend against a missing count.
      # engines and error_counts are the exceptions: both are built per source
      # and are not provably non-nil for every path, so they stay optional
      # rather than have the contract assert something the server might not do.
      required:
        - delivery_source
        - event_count
        - start_count
        - rebuffer_count
        - bitrate_switch_count
        - error_count
        - verified_session_count
        - ttff
        - rebuffer
        - rebuffer_total_ms
        - partial_percentiles
      properties:
        delivery_source:
          type: string
          enum: [api-proxy, presigned, cdn, ipfs-gateway, origin-live, other]
        event_count: { type: integer, format: int64 }
        start_count: { type: integer, format: int64 }
        rebuffer_count: { type: integer, format: int64 }
        bitrate_switch_count: { type: integer, format: int64 }
        error_count: { type: integer, format: int64 }
        verified_session_count:
          type: integer
          format: int64
          description: >-
            How many of these events carried a session id the server could
            verify against a signed playback token. Below event_count means the
            remainder are client-asserted.
        ttff: { $ref: "#/components/schemas/QoEPercentiles" }
        rebuffer: { $ref: "#/components/schemas/QoEPercentiles" }
        rebuffer_total_ms: { type: integer, format: int64 }
        error_counts:
          type: object
          description: Counts keyed by the closed error-class vocabulary.
          additionalProperties: { type: integer, format: int64 }
        engines:
          type: array
          items: { type: string, enum: [hls-js, native-hls, progressive, shaka] }
        partial_percentiles:
          type: boolean
          description: >-
            True when at least one row in the window was written by a different
            histogram version and was excluded from the percentile merge. Counts
            still include it.
    QoEBucket:
      type: object
      description: One hour of one (source, engine, packaging format) combination.
      # error_counts is omitted below for the same reason as on QoESourceSummary.
      required:
        - hour_bucket
        - delivery_source
        - engine
        - packaging_format
        - event_count
        - start_count
        - rebuffer_count
        - bitrate_switch_count
        - error_count
        - verified_session_count
        - ttff
        - rebuffer
        - rebuffer_total_ms
        - rendition_reporting_supported
        - computed_at
      properties:
        hour_bucket: { type: string, format: date-time }
        delivery_source:
          type: string
          enum: [api-proxy, presigned, cdn, ipfs-gateway, origin-live, other]
        engine: { type: string, enum: [hls-js, native-hls, progressive, shaka] }
        packaging_format: { type: string, enum: [hls-ts, cmaf, progressive] }
        event_count: { type: integer, format: int64 }
        start_count: { type: integer, format: int64 }
        rebuffer_count: { type: integer, format: int64 }
        bitrate_switch_count: { type: integer, format: int64 }
        error_count: { type: integer, format: int64 }
        verified_session_count: { type: integer, format: int64 }
        ttff: { $ref: "#/components/schemas/QoEPercentiles" }
        rebuffer: { $ref: "#/components/schemas/QoEPercentiles" }
        rebuffer_total_ms: { type: integer, format: int64 }
        error_counts:
          type: object
          additionalProperties: { type: integer, format: int64 }
        rendition_reporting_supported:
          type: boolean
          description: >-
            False for native-hls, permanently: the browser owns variant
            selection through the manifest SCORE attribute and exposes no hook,
            so zero bitrate switches there is a capability gap rather than
            flawless ABR.
        computed_at: { type: string, format: date-time }
    QoEPlaybackHealth:
      type: object
      # sources and buckets are initialized to empty slices in the handler, so
      # they serialize as [] and never null — an instance that has measured
      # nothing yet still returns both keys.
      required:
        - window_start
        - window_end
        - sources
        - buckets
        - buckets_total
        - limit
        - offset
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        sources:
          type: array
          description: >-
            One merged entry per delivery source over the whole window. Never
            paged.
          items: { $ref: "#/components/schemas/QoESourceSummary" }
        buckets:
          type: array
          items: { $ref: "#/components/schemas/QoEBucket" }
        buckets_total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }
