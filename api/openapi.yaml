                $ref: "#/components/schemas/ChannelStatsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/original:
    get:
      operationId: streamVideoOriginal
      summary: Stream a video's original file
      description: >-
        Streams the stored original media bytes for direct playback. Visibility
        mirrors the detail endpoint: public/unlisted to anyone, private only to
        its owner; otherwise 404. A video without a stored original (e.g. a
        draft) is 404. HTTP Range requests are honoured (206 Partial Content)
        for seeking. The response body is the raw media, not JSON.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional byte range, e.g. "bytes=0-1023".
          schema:
            type: string
      responses:
        "200":
          description: The full original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A requested byte range of the original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or private and not yours), or no stored original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/download:
    get:
      operationId: getVideoDownloads
      summary: List a video's downloadable files
      description: >-
        Returns metadata for actual single-file downloads: the stored original,
        an optional progressive VP9/WebM alternate, progressive MP4 remuxes for
        each ready HLS rung (muxed video+audio plus an optional video-only URL),
        an audio-only M4A when the source has audio, and WebVTT subtitles.
        Regular/anonymous callers require the effective downloads_enabled
        setting and ordinary video visibility. Moderators/admins bypass that
        setting and may download any local video for moderation. A visible
        video with no stored files yet returns an empty list.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's downloadable files (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDownloadResponse"
        "401":
          description: A password-protected video requires a valid playback token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Downloads are disabled for this non-privileged caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/download/original:
    get:
      operationId: downloadVideoOriginal
      summary: Download the original video file
      description: >-
        Serves the stored upload with Content-Disposition: attachment and Range
        support. Uses the same download toggle/visibility policy as the download
        metadata endpoint; moderators/admins bypass the toggle and privacy gate.
