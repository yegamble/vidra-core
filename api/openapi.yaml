      description: >-
        Deletes the caller's account banner: the record and the stored object.
        404 when no banner is set.
      tags: [account]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The banner was removed.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No banner set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/avatar:
    get:
      operationId: getUserAvatar
      summary: Get a user's avatar image
      description: >-
        Serves the user's account avatar with the Content-Type derived at
        upload time. Public. 404 when the user is unknown or has no avatar set
        — the /auth/me view's has_avatar flag tells the owner whether one
        exists.
      tags: [account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such user, or no avatar set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/banner:
    get:
      operationId: getUserBanner
      summary: Get a user's banner image
      description: >-
        Serves the user's account (profile) banner with the Content-Type
        derived at upload time. Public. 404 when the user is unknown or has no
        banner set.
      tags: [account]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The banner image.
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No such user, or no banner set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/subscriptions/videos:
    get:
      operationId: listSubscriptionVideos
      summary: List videos from the channels the user follows
      description: >-
        The authenticated user's "subscriptions" feed: public, published videos
        from the LOCAL channels they follow UNIONed with the ingested remote
        videos of their ACCEPTED remote-channel follows (see
        /me/remote-follows), newest first, with discovery-card data. Remote
        entries are remote:true cards carrying the origin domain and
        watch/stream URLs. Videos from accounts the user has muted are hidden;
        remote videos from instances the user has muted (or that the admin has
        blocked) are hidden too. Paginated via limit (1–100, default 20) and
        offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of videos from followed channels (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/videos:
    post:
      operationId: createVideo
      summary: Create a draft video
      description: >-
        Creates a draft video under a channel the caller owns. The video starts
        in the "draft" state; privacy defaults to "private" when omitted.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoRequest"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listChannelVideos
      summary: List a channel's videos
      description: >-
        The channel owner (bearer token) sees all of their videos (any state);
        everyone else sees only public, published ones. Each item carries its
        view count and whether a poster image exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel's videos (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos:
    get:
      operationId: listPublicVideos
      summary: Public video feed
      description: >-
        The cross-channel public video feed. Only public, published videos appear
        (drafts/processing/failed are excluded). Each item carries its view count
        and whether a poster image exists. Auth is optional: an authenticated
        viewer's muted accounts' videos are hidden from the feed (per-viewer);
        an anonymous viewer sees all. Videos of accounts that opted out of
        discovery (User.unlisted) never appear. scope=all additionally mixes in
        federated remote videos (remote:true cards with origin domain and
        watch/stream URLs); remote cards respect the admin instance blocklist
        and an authenticated viewer's instance mutes, and drop out whenever a
        tag/category/language filter is active (remote videos carry no local
        taxonomy). Optional filters narrow the feed: tag (free-form tag,
        matched case-insensitively against the stored lowercased set),
        category and language (taxonomy ids from GET /videos/config — unknown
        values are 422). Ordered by sort and paginated with limit (1–100,
        default 20) and offset (>= 0).
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: sort
          in: query
          required: false
          description: >-
            Ordering: recent (newest first), popular (most all-time views), or
            trending (views decayed by age). Unknown values fall back to recent.
          schema:
            type: string
            enum: [recent, popular, trending]
            default: recent
        - name: scope
          in: query
          required: false
          description: >-
            Feed scope: local (this instance's videos only) or all (adds
            federated remote videos for discovery). Unknown values fall back
            to local.
          schema:
            type: string
            enum: [local, all]
            default: local
        - name: tag
          in: query
          required: false
          description: >-
            Only videos carrying this free-form tag (case-insensitive exact
            match; at most 50 characters).
          schema:
            type: string
            maxLength: 50
        - name: category
          in: query
          required: false
          description: >-
            Only videos with this subject-category id (see GET /videos/config).
            Unknown value -> 422.
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: >-
            Only videos with this content-language code (see GET /videos/config).
            Unknown value -> 422.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of public videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "422":
          description: Unknown category/language, or an over-long tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/config:
    get:
      operationId: getVideoConfig
      summary: Video-metadata taxonomy (categories, licenses, languages, privacies)
      description: >-
        The static, public taxonomy the frontend reads to populate its
        video-metadata dropdowns: subject categories and content licenses (ids
        match PeerTube's for import compatibility), a curated set of content
        languages (ISO 639-1 codes), and the privacy values. No auth; cacheable.
      tags: [videos]
      security:
        - {}
      responses:
        "200":
          description: The selectable video-metadata taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoConfigResponse"
  /api/v1/videos/search:
    get:
      operationId: searchVideos
      summary: Search public videos by title or tag
      description: >-
        Fuzzy (trigram) search over public, published video titles, ranked by
        similarity then recency. A video also matches when one of its free-form
        tags contains the query (case-insensitive); tag-only matches rank after
        title matches. Videos of accounts that opted out of discovery
        (User.unlisted) never appear. Ingested federated remote videos are
        UNIONed in by title match as remote:true cards (origin domain +
        watch/stream URLs); they respect the admin instance blocklist and an
        authenticated viewer's instance mutes. Each result carries its view
        count and whether a poster image exists. Auth is optional: an
        authenticated viewer's muted accounts' videos are hidden from results
        (per-viewer); an anonymous viewer sees all. Requires a non-empty q
        (<= 100 chars); paginated with limit (1–100, default 20) and offset
        (>= 0).
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of matching public videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoSearchResponse"
        "400":
          description: Missing or too-long q.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}:
    get:
      operationId: getVideo
      summary: Get a video by id
      description: >-
        Public and unlisted videos are returned to anyone with the id. A private
        video is returned only to its owner (with a bearer token); to everyone
        else it is reported as 404 so its existence is not revealed. The response
        includes probed technical metadata (duration_seconds, width, height) when
        a media probe has recorded it.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "404":
          description: No video with that id (or it is private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateVideo
      summary: Update a video
      description: >-
        Partial update of a video's metadata (title, description, privacy), owner
        only. A non-owner or unknown id is reported as 404 so a private video's
        existence is not leaked. The handle is immutable.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoRequest"
      responses:
        "200":
          description: The updated video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVideo
      summary: Delete a video
      description: Deletes a video (owner only). Non-owner/unknown → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/stats:
    get:
      operationId: getVideoStats
      summary: Creator statistics for a video (owner only)
      description: >-
        Engagement totals (views, likes, dislikes, comments) plus a 30-day
        daily-views series (zero-filled, oldest first, UTC days) for one video.
        Owner only: a non-owner or unknown id is reported as 404 so the video's
        existence is not leaked.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStatsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/stats:
    get:
      operationId: getChannelStats
      summary: Creator statistics for a channel (owner only)
      description: >-
        Aggregated engagement totals across all the channel's videos (views,
        likes, dislikes, comments), the follower and video counts, and a 30-day
        daily-views series (zero-filled, oldest first, UTC days). Owner only:
        a non-owner or unknown handle is reported as 404.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel's statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelStatsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/original:
    get:
      operationId: streamVideoOriginal
      summary: Stream a video's original file
      description: >-
        Streams the stored original media bytes for direct playback. Visibility
        mirrors the detail endpoint: public/unlisted to anyone, private only to
        its owner; otherwise 404. A video without a stored original (e.g. a
        draft) is 404. HTTP Range requests are honoured (206 Partial Content)
        for seeking. The response body is the raw media, not JSON.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional byte range, e.g. "bytes=0-1023".
          schema:
            type: string
      responses:
        "200":
          description: The full original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A requested byte range of the original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or private and not yours), or no stored original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/download:
    get:
      operationId: getVideoDownloads
      summary: List a video's downloadable files
      description: >-
        Returns download metadata for a video: the stored original (with its
        size, content type and probed dimensions when known) plus any ready HLS
        renditions (variant playlist URLs; segmented, so no single size).
        Visibility mirrors the detail endpoint: public/unlisted to anyone,
        private only to its owner; otherwise 404. A visible video with no
        stored files yet (e.g. a draft) returns an empty list.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's downloadable files (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDownloadResponse"
        "404":
          description: No such video (or private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/hls/master.m3u8:
    get:
      operationId: getVideoHLSMaster
      summary: Get a video's HLS master playlist
      description: >-
        Returns the HLS master playlist for a transcoded video. Variant URIs are
        relative ("720p/playlist.m3u8"), resolving to GET
        /videos/{id}/hls/{rendition}/{file}. Visibility mirrors /original
        (private → owner only, else 404). 404 until the transcode pipeline has
        marked the video's streaming playlist ready — the detail response's
        hls_url field tells clients when it exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The master playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: >-
            No such video (or private and not yours), or its streaming playlist
            is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/hls/{rendition}/{file}:
    get:
      operationId: getVideoHLSFile
      summary: Get an HLS rendition playlist or segment
      description: >-
        Serves one file of a transcoded HLS rendition: its variant playlist
        (file = "playlist.m3u8", served as application/vnd.apple.mpegurl) or one
        MPEG-TS segment (file = "seg_00000.ts", served as video/mp2t). Rendition
        directories are named by rung height ("720p"). Same visibility and
        readiness rules as the master playlist; names outside the transcoder's
        fixed naming are 404.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rendition
          in: path
          required: true
          description: The rendition directory, e.g. "720p".
          schema:
            type: string
            pattern: '^[0-9]{2,4}p$'
        - name: file
          in: path
          required: true
          description: '"playlist.m3u8" or a segment such as "seg_00000.ts".'
          schema:
            type: string
            pattern: '^(playlist\.m3u8|seg_[0-9]+\.ts)$'
      responses:
        "200":
          description: The rendition playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            No such video (or private and not yours), playlist not ready, or no
            such rendition file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      summary: Get a video's poster image
      description: >-
        Returns the generated JPEG poster for the video. Same visibility as the
        detail endpoint (private → owner only, else 404). A video without a
        generated thumbnail is 404 — the detail response's has_thumbnail flag
        tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The poster image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or private and not yours), or no thumbnail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setVideoThumbnail
      summary: Set a video's poster image
      description: >-
        Uploads a creator-supplied poster image (owner only) as a multipart form
        with a single "file" part, replacing any previous or auto-generated
        thumbnail. Accepted types are JPEG/PNG/WebP (by extension; otherwise 415);
        the served Content-Type is derived from the extension. Does not change the
        video's state. A non-owner or unknown id is 404. The upload is bounded by
        the global HTTP body limit.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The poster image (JPEG/PNG/WebP).
      responses:
        "201":
          description: The thumbnail was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFile"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/storyboard.jpg:
    get:
      operationId: getVideoStoryboardImage
      summary: Get a video's storyboard sprite sheet
      description: >-
        Returns the seek-preview storyboard sprite sheet (a JPEG grid of small
        poster tiles) for the video. Paired with the WebVTT map at
        storyboard.vtt, which references this image. Same visibility as the
        detail endpoint (private → owner only, blocked → moderators only, else
        404). A video without a generated storyboard is 404 — the detail
        response's has_storyboard flag tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The storyboard sprite sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or not visible), or no storyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/storyboard.vtt:
    get:
      operationId: getVideoStoryboardVtt
      summary: Get a video's storyboard WebVTT map
      description: >-
        Returns the WebVTT sprite map for the video's storyboard: one cue per
        time range pointing at a #xywh region of the sprite sheet (served at
        storyboard.jpg, referenced relatively). Same visibility as the sprite
        sheet; absent → 404.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The storyboard WebVTT map.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: No such video (or not visible), or no storyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/webm:
    get:
      operationId: getVideoWebM
      summary: Get a video's progressive VP9/WebM alternate
      description: >-
        Streams the progressive VP9/WebM alternate produced when
        TRANSCODING_VP9_ENABLED is on, with HTTP Range/206 support. Same
        visibility as /original; absent (VP9 disabled or not yet produced) → 404.
        It is also listed by the /download endpoint (kind "webm").
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The full VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: A byte range of the VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or not visible), or no VP9/WebM alternate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/view:
    post:
      operationId: recordVideoView
      summary: Record a view of a video
      description: >-
        Records a view for the video, de-duplicated per viewer within a window
        (Redis SETNX over the user id when authenticated, else the client IP,
        hashed). Visibility mirrors the detail endpoint (private → owner only,
        else 404); non-published videos are accepted but not counted. Always
        returns 204 whether or not the view was newly counted. The running total
        is exposed as `views` on the detail endpoint.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The view ping was accepted.
        "404":
          description: No such video, or private and not yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/file:
    post:
      operationId: uploadVideoFile
      summary: Upload a video's original file
      description: >-
        Uploads the original media file for a video (owner only) as a multipart
        form with a single "file" part, stores it via the configured storage
        backend, then finalises the video: it is published (or, if a configured
        media probe rejects it, marked failed). Re-uploading replaces the previous
        original. A non-owner or unknown id is reported as 404 so a private video's
        existence is not leaked. The file extension must be an accepted video
        container (otherwise 415); the body must be within UPLOAD_MAX_SIZE
        (otherwise 413); when a storage quota applies to the caller, a file
        that would not fit is rejected before storing (422 quota_exceeded).
        Real transcoding into multiple renditions happens in a later stage;
        for now the original is the playable source.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The original media file.
      responses:
        "201":
          description: >-
            The file was stored and the video finalised. video.state is
            "published" on success, or "failed" if the media probe rejected it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The uploaded file exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Storing the file would exceed the caller's storage quota (code
            quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/upload-session:
    post:
      operationId: createUploadSession
      summary: Open a resumable (chunked) upload session
      description: >-
        Opens a chunked/resumable upload for a video's original file (owner
        only). The declared size, filename extension, and the caller's storage
        quota are validated UP FRONT: a non-video extension is 415, a size beyond
        UPLOAD_MAX_SIZE is 413, and a size that would exceed the caller's quota is
        422 (code quota_exceeded). Returns the upload id, the fixed chunk size to
        send (every chunk but the last must be exactly this many bytes), the total
        number of chunks, and the 24h session expiry. Upload each chunk with PUT
        /api/v1/uploads/{upload_id}/chunks/{n}, then POST
        /api/v1/uploads/{upload_id}/complete to assemble and finalise the video
        through the same pipeline as a direct upload. Non-owner/unknown video → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: The resumable upload session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The declared size exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The filename extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The body is invalid (size must be > 0, filename required) or the file
            would exceed the caller's storage quota (code quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadSession
      summary: Get a resumable upload's progress (the resume contract)
      description: >-
        Returns which chunk indices have landed and the byte total so far — the
        contract a client reads to know which chunks to (re)send after an
        interruption. Owner only; non-owner/unknown session → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session's received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelUploadSession
      summary: Cancel a resumable upload
      description: >-
        Cancels an in-progress upload and drops its chunk blobs. Owner only;
        non-owner/unknown → 404. Idempotent (cancelling an already-finished
        session still 204s).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was cancelled (or was already finished).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/chunks/{n}:
    put:
      operationId: putUploadChunk
      summary: Upload one chunk of a resumable upload
      description: >-
        Stores one chunk (the raw request body) at index n for a session the
        caller owns. Every chunk but the last must be exactly chunk_size bytes;
        the last is the remainder. Idempotent: re-PUTting an index overwrites it.
        Returns the updated received-chunk status. Non-owner/unknown session →
        404; a session that already completed/cancelled → 409; an out-of-range
        index or wrong-sized chunk → 422; a chunk larger than its slot → 413.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: n
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: The zero-based chunk index.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw chunk bytes.
      responses:
        "200":
          description: The chunk was stored; the updated received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "400":
          description: The chunk index is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The session already completed or was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The chunk is larger than the required size for its index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The chunk index is out of range or its size does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: completeUploadSession
      summary: Complete a resumable upload
      description: >-
        Assembles the session's chunks in order and runs them through the same
        AttachOriginal → Process pipeline as a direct upload (probe/scan/
        quarantine/transcode), then marks the session completed and drops its
        chunk blobs. Returns the finalised video exactly like the direct upload
        (video.state is "published", or "failed" if a configured probe rejected
        it). Owner only; non-owner/unknown → 404; already finished → 409;
        missing/mismatched chunks → 422.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The upload was assembled and the video finalised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The session already completed or was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            One or more chunks are missing or the wrong size, or completing would
            exceed the caller's storage quota (code quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/import:
    post:
      operationId: importVideoFile
      summary: Enqueue a URL import of a video's original file
      description: >-
        Enqueues an ASYNCHRONOUS import of a remote media file by URL (owner
        only) and returns 202 with the queued job — it no longer blocks on the
        fetch. Ownership is checked before any job is created, so a non-owner or
        unknown video is 404 and nothing runs on their behalf. The URL is
        validated up front (http/https only, no literal non-public address); a
        missing/malformed/non-public URL is 422. A background worker then performs
        the SSRF-guarded fetch (loopback, private, link-local, CGNAT, and
        cloud-metadata addresses refused at connection time, so DNS rebinding and
        internal redirects are blocked too), enforces UPLOAD_MAX_SIZE and the
        caller's storage quota, and runs the bytes through the same
        AttachOriginal → Process pipeline as a direct upload
        (probe/scan/quarantine/transcode). Poll GET /api/v1/videos/{id}/import
        for progress. A single import runs per video at a time: while one is in
        flight, re-posting returns the same job.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportVideoRequest"
      responses:
        "202":
          description: The import was enqueued (or the in-flight job was returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The URL is missing, malformed, or not a public http(s) URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getVideoImport
      summary: Get a video's URL-import status
      description: >-
        Returns the most recent URL-import job for a video (owner only). state is
        pending, running, done, or failed; on failure `error` is a safe,
        human-readable reason (never a raw internal error or the source URL).
        Non-owner/unknown video → 404; a video that was never imported → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or not owned by the caller), or no import exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions/auto:
    post:
      operationId: requestAutoCaption
      summary: Request an auto-generated caption track (Whisper)
      description: >-
        Enqueues an ASYNCHRONOUS auto-caption job for a video (owner only) and
        returns 202 with the queued job. A background worker extracts the audio
        (ffmpeg → 16 kHz mono WAV), sends it to the configured Whisper
        transcription service, renders the result to WebVTT, and stores it via
        the same replace-by-language path as a manual caption upload — then
        notifies the owner (a caption_ready notification, honoring preferences).
        `language` is optional (defaults to WHISPER_DEFAULT_LANGUAGE); it is both
        the caption's language tag and the transcription hint. Ownership is
        checked before any job is created, so a non-owner or unknown video is
        404. Auto-captioning disabled on this server → 503; a malformed language
        tag → 422; a job already pending/running for the video → 409. Poll GET
        /api/v1/videos/{id}/captions/auto for progress.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCaptionRequest"
      responses:
        "202":
          description: The auto-caption job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An auto-caption job is already in progress for this video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The language tag is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Auto-captioning is not enabled on this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getAutoCaption
      summary: Get a video's auto-caption job status
      description: >-
        Returns the most recent auto-caption (Whisper) job for a video (owner
        only). state is pending, running, done, or failed; on failure `error` is
        a safe, human-readable reason (never a raw internal error or the Whisper
        endpoint URL). Non-owner/unknown video → 404; a video that never
        requested auto-captioning → 404.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest auto-caption job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or not owned by the caller), or no auto-caption job exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions:
    get:
      operationId: listCaptions
      summary: List a video's caption tracks
      description: >-
        Returns the WebVTT caption tracks for a public, published video (metadata
        only; fetch the file from the per-language endpoint). No auth required. A
        non-public/unpublished or unknown video is 404.
      tags: [captions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's caption tracks (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionListResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadCaption
      summary: Upload a caption track
      description: >-
        Uploads (or replaces) a WebVTT caption track for a video owned by the
        caller. Multipart form with `file` (the .vtt), `language` (a BCP-47-ish
        tag, e.g. en or pt-BR), and optional `label`. Non-owner/unknown video is
        404; a bad language or non-WebVTT file is 422.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, language]
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: The caption track was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Caption"
        "400":
          description: The multipart file field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid language tag or non-WebVTT file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions/{lang}:
    get:
      operationId: downloadCaption
      summary: Download a caption track (WebVTT)
      description: >-
        Serves the WebVTT file for a public, published video's caption in the
        given language. No auth required. An unknown video or language is 404.
      tags: [captions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The WebVTT caption file.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: No such public video or caption.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCaption
      summary: Remove a caption track
      description: >-
        Removes a caption track for a language from a video owned by the caller.
        Non-owner/unknown video is 404. Idempotent.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The caption track is removed (or was already absent).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/comments:
    get:
      operationId: listComments
      summary: List a video's comments
      description: >-
        Returns a public, published video's comments newest-first, each with its
        author's identity. Auth is optional: an authenticated viewer's muted
        accounts are hidden from the list (mutes are per-viewer), while an
        anonymous viewer sees all comments. A non-public/unpublished or unknown
        video is 404. Paginated via limit (1–100, default 20) and offset.
      tags: [comments]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of comments (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createComment
      summary: Post a comment on a video
      description: Adds a comment by the authenticated user to a public, published video.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                  description: The comment text.
                parent_id:
                  type: string
                  format: uuid
                  description: >-
                    Optional. The id of the comment being replied to; it must be a
                    comment on the same video. Omit (or null) for a top-level
                    comment. A malformed or cross-video parent_id is a 422.
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/comments/{id}:
    patch:
      operationId: updateComment
      summary: Edit a comment
      description: >-
        Edits the caller's own comment body. Only the author may edit (moderators
        delete, not edit): another user's comment is 403, an unknown id is 404, and
        a blank or too-long body is 422. Bumps updated_at so `edited` becomes true.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "200":
          description: The edited comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The comment belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: >-
        Deletes a comment. The comment's author may always delete it; a
        moderator/admin may delete anyone's. An unknown id is 404; a non-author
        non-moderator is 403.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The comment is deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The comment belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/rating:
    get:
      operationId: getVideoRating
      summary: Get a video's like/dislike summary
      description: >-
        Returns a public, published video's like and dislike counts, plus the
        caller's own rating (like, dislike, or null) when signed in. A
        non-public/unpublished or unknown video is 404.
      tags: [ratings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setVideoRating
      summary: Set or change your rating for a video
      description: Records the caller's like/dislike for a public, published video.
      tags: [ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [like, dislike]
      responses:
        "200":
          description: The updated rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The rating value is not 'like' or 'dislike'.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearVideoRating
      summary: Clear your rating for a video
      description: Removes the caller's like/dislike (idempotent); returns the updated summary.
      tags: [ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/saved:
    get:
      operationId: listSavedVideos
      summary: List the caller's saved videos
      description: >-
        Returns the caller's saved ("watch later") videos as discovery cards,
        newest-saved first. Only public, published saved videos are returned.
        Paginated via limit (1–100, default 20) and offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of saved videos (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/save:
    post:
      operationId: saveVideo
      summary: Save a video to your library
      description: >-
        Adds a public, published video to the caller's library (idempotent). A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video is saved.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unsaveVideo
      summary: Remove a video from your library
      description: Removes a video from the caller's library (idempotent).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video is no longer saved.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history:
    get:
      operationId: listWatchHistory
      summary: List the caller's watch history
      description: >-
        Returns the caller's watch history as discovery cards, most-recently
        watched first, each carrying the saved resume position (position_seconds)
        and the time last watched (watched_at). Only public, published videos are
        returned. Paginated via limit (1–100, default 20) and offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of watch-history cards (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearWatchHistory
      summary: Clear the caller's entire watch history
      description: Removes all of the caller's watch history (idempotent).
      tags: [videos]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The watch history is cleared.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history/{id}:
    delete:
      operationId: deleteWatchHistoryEntry
      summary: Remove a single video from the caller's watch history
      description: >-
        Removes one video from the caller's watch history (idempotent). No
        public-video check, so a user can always clean up an entry.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The video's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The entry is removed (or was already absent).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/watch-progress:
    get:
      operationId: getWatchProgress
      summary: Get the caller's resume position for a video
      description: >-
        Returns the caller's saved resume position (position_seconds) for a
        public, published video — 0 when none has been recorded. A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The caller's saved resume position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProgress"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: recordWatchProgress
      summary: Record the caller's resume position for a video
      description: >-
        Records (upserts) the caller's playback position for a public, published
        video and moves it to the top of their watch history. A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchProgressRequest"
      responses:
        "204":
          description: The resume position is recorded.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (e.g. a negative position).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications:
    get:
      operationId: listNotifications
      summary: List the caller's notifications
      description: >-
        Returns the caller's notifications, newest first, plus the current unread
        count. Each carries the actor's identity and type-dependent context
        (channel for follows, video for comments). Set unread=true to return only
        unread notifications. Paginated via limit (1–100, default 20) and offset.
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          description: When true, return only unread notifications.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of notifications (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Get the caller's unread notification count
      description: Returns just the caller's unread notification count (for a badge).
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all the caller's notifications read
      description: Marks every unread notification read (idempotent).
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All notifications are marked read.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification read
      description: >-
        Marks one of the caller's notifications read (idempotent). An unknown id,
        or one belonging to another user, is 404.
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The notification is marked read.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such notification for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notification-prefs:
    get:
      operationId: getNotificationPrefs
      summary: Get the caller's notification preferences
      description: >-
        Returns the caller's per-type notification switchboard: every known
        notification type (caption_ready, comment, follow, message,
        report_resolved, video_rejected) mapped to whether it is delivered.
        Types never configured default to enabled.
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNotificationPrefs
      summary: Update the caller's notification preferences
      description: >-
        Applies a partial preference update: only the types present in the body
        are changed. Disabling a type suppresses new notifications of that type
        at creation time (existing notifications are unaffected). An unknown
        type is 422 and nothing is written. Returns the full updated map.
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPrefsRequest"
      responses:
        "200":
          description: The full updated notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Empty update or unknown notification type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists:
