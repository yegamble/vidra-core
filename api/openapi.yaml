    NotificationActor:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
    Notification:
      type: object
      required: [id, type, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [follow, comment, message, new_video, new_report, report_resolved, video_rejected, caption_ready]
          description: What happened. follow = someone followed your channel; comment = someone commented on your video; message = someone sent you a direct message; new_video = a channel you follow published a new public video (actor = the channel owner, channel_handle/channel_display_name = the channel, video_id/video_title = the video; sent only while your bell for that channel is "all"); new_report = a user filed an abuse report (delivered only to admins/moderators; actor = the reporter, report_id/report_status/report_target_type carry the report); report_resolved = a moderator resolved an abuse report you filed; video_rejected = a moderator rejected your quarantined upload (video_id/video_title carry which one; the moderator's identity is never included); caption_ready = an auto-generated caption track finished for your video (video_id/video_title carry which one).
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/NotificationActor"
        channel_handle:
          type: string
          description: Followed channel's handle (follow notifications).
        channel_display_name:
          type: string
          description: Followed channel's display name (follow notifications).
        video_id:
          type: string
          format: uuid
          description: Commented video's id (comment notifications).
        video_title:
          type: string
          description: Commented video's title (comment notifications).
        comment_id:
          type: string
          format: uuid
          description: The comment's id (comment notifications).
        conversation_id:
          type: string
          format: uuid
          description: The conversation's id (message notifications) — link to the thread.
        report_id:
          type: string
          format: uuid
          description: The report's id (new_report and report_resolved notifications). On report_resolved the resolving moderator's identity is never included (actor is absent); on new_report the actor is the reporter.
        report_status:
          type: string
          enum: [open, accepted, rejected]
          description: The report's current status (new_report and report_resolved notifications).
        report_target_type:
          type: string
          enum: [video, comment, account, remote_video, message]
          description: What the report targeted (new_report and report_resolved notifications).
    NotificationListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [notifications, unread_count]
          properties:
            notifications:
              type: array
              items:
                $ref: "#/components/schemas/Notification"
            unread_count:
              type: integer
              format: int64
