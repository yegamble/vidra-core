  /api/v1/videos/{id}/original:
    get:
      operationId: streamVideoOriginal
      summary: Stream a video's original file
      description: >-
        Streams the stored original media bytes for direct playback. Visibility
        mirrors the detail endpoint: public/unlisted to anyone, private only to
        its owner; otherwise 404. A video without a stored original (e.g. a
        draft) is 404. HTTP Range requests are honoured (206 Partial Content)
        for seeking. The response body is the raw media, not JSON.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Range
          in: header
          required: false
          description: Optional byte range, e.g. "bytes=0-1023".
          schema:
            type: string
      responses:
        "200":
          description: The full original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: A requested byte range of the original file.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "307":
          description: >-
            Direct delivery: the instance has delivery_presign_enabled on and the object store can sign URLs, so this public request is redirected to a short-lived signed object URL (one hour) carrying the same Content-Type and Content-Disposition this route would have sent. Never emitted for private/unpublished/password-protected media, nor for a request carrying a playback token or Authorization header; the 200/206 byte path stays authoritative and is always the fallback.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: No such video (or private and not yours), or no stored original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/download:
    get:
      operationId: getVideoDownloads
      summary: List a video's downloadable files
      description: >-
        Returns metadata for actual single-file downloads: the stored original,
        an optional progressive VP9/WebM alternate, progressive MP4 remuxes for
        each ready HLS rung (muxed video+audio plus an optional video-only URL),
        an audio-only M4A when the source has audio, and WebVTT subtitles.
        Regular/anonymous callers require the LAYERED download policy
        (config-parity W9): the instance-wide downloads_enabled setting AND
        the video's own download_enabled flag (instance gate off means no
        downloads regardless of the per-video flag), plus ordinary video
        visibility. The same layered gate guards every /download/* byte
        route. Moderators/admins bypass both gates and may download any local
        video for moderation. A visible video with no stored files yet
        returns an empty list.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's downloadable files (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoDownloadResponse"
        "401":
          description: A password-protected video requires a valid playback token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >-
            Downloads are disabled for this non-privileged caller — by the
            instance downloads_enabled setting or this video's
            download_enabled flag (code "feature_disabled").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
