  /api/v1/me/remote-follows:
    post:
      operationId: createRemoteFollow
      summary: Follow a remote channel
      description: >-
        Follows a federated remote channel as the caller. The target is named
        either by handle ("name@domain", leading @ tolerated) or by full actor
        URL — exactly one of the two. The backend resolves the target
        (WebFinger on the remote domain, then the actor document — both
        SSRF-guarded), caches the actor, records the follow as "pending", and
        queues a signed Follow activity AS THE CALLER'S ACCOUNT ACTOR. The
        follow flips to "accepted" when the remote's Accept arrives; a remote
        Reject removes it. Idempotent: re-following returns the existing
        follow without sending a second Follow. Requires authentication. An
        unresolvable/invalid/local target is 422; when federation is disabled
        on this instance the endpoint is 503 (no outbound fetches are made).
      tags: [federation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemoteFollowRequest"
      responses:
        "201":
          description: The follow row (freshly created, or the existing one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteFollow"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Invalid target (neither handle nor actor_url, or both), a target
            on this instance (follow local channels via
            POST /channels/{handle}/follow), or a handle/actor URL that could
            not be resolved to a remote channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Federation is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listRemoteFollows
      summary: List the caller's remote-channel follows
      description: >-
        Returns the caller's outbound remote-channel follows, newest first,
        each with the followed actor's identity (name@domain handle, actor
        URL, origin domain) and follow state (pending until the remote
        accepts, then accepted). Requires authentication. Paginated via limit
        (1–100, default 20) and offset.
      tags: [federation]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of remote follows (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteFollowListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/remote-follows/{id}:
    delete:
      operationId: deleteRemoteFollow
      summary: Unfollow a remote channel
      description: >-
        Removes the caller's remote-channel follow by its row id (from the
        list/create responses). The row is deleted immediately — local intent
        wins — and a signed Undo{Follow} is queued to the remote inbox.
        Requires authentication. An unknown (or another user's) id is 404.
      tags: [federation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follow is removed and the Undo is queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such remote follow for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/atproto:
    put:
      operationId: linkATProtoAccount
      summary: Link a Bluesky account for cross-posting
      description: >-
        Links (or re-links) the caller's Bluesky account so Vidra can announce
        their newly published PUBLIC videos on Bluesky (ATProto extension,
        P10.2 — outbound cross-posting only). The caller supplies their handle
        and a Bluesky APP PASSWORD (Settings → App Passwords on Bluesky) — never
        their main account password. The backend verifies the credentials by
        creating a session on the PDS (com.atproto.server.createSession, over an
        https, public, SSRF-guarded client), resolves the DID, and stores the
        app password sealed at rest; it is never returned, logged, or exported.
        Re-linking overwrites the previous link. Requires authentication. When
        the extension is disabled on this instance the endpoint is 503.
      tags: [atproto]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ATProtoLinkRequest"
      responses:
        "200":
          description: The linked-account status (never the app password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ATProtoStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Missing/invalid handle or app password, a non-https/private PDS URL,
            or credentials the PDS rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The Bluesky PDS could not be reached; try again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bluesky cross-posting is not enabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getATProtoAccount
      summary: Get the caller's linked Bluesky account
      description: >-
        Returns the caller's linked Bluesky account status — handle, resolved
        DID, PDS, auto-post setting, and last-post timestamp. The app password
        is NEVER included. Requires authentication. 404 when nothing is linked;
        503 when the extension is disabled.
      tags: [atproto]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The linked-account status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ATProtoStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No Bluesky account is linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bluesky cross-posting is not enabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unlinkATProtoAccount
      summary: Unlink the caller's Bluesky account
      description: >-
        Removes the caller's linked Bluesky account (no further auto cross-posts
        are made). Idempotent: unlinking when nothing is linked still succeeds.
        Requires authentication. 503 when the extension is disabled.
      tags: [atproto]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The account is unlinked (or was not linked).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bluesky cross-posting is not enabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/blocks:
    get:
      operationId: listBlockedUsers
      summary: List blocked accounts
      description: >-
        Returns the accounts the caller has blocked, newest block first. Requires
        authentication. Paginated via limit (1–100, default 20) and offset.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of blocked accounts (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUserListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/blocks/{id}:
    post:
      operationId: blockUser
      summary: Block an account
      description: >-
        Blocks another account: direct messaging between the two is cut off in
        both directions, and the blocked account's content is hidden from the
        blocker — their videos leave the blocker's feed, search, and
        subscriptions, and their comments are filtered from comment lists
        (per-viewer, exactly like mutes; other viewers are unaffected).
        Requires authentication. Idempotent. Blocking yourself is 422; an
        unknown target account is 404.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account is blocked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cannot block yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unblockUser
      summary: Unblock an account
      description: >-
        Lifts the caller's block of another account, restoring direct messaging
        and the blocked account's content (videos in feed/search/subscriptions,
        comments). Requires authentication. Idempotent (unblocking a
        not-blocked account still succeeds).
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account is not blocked (it was unblocked, or already was).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/live:
    post:
      operationId: createLiveStream
      summary: Create a live stream
      description: >-
        Creates a live stream for a channel the caller owns and returns it plus
        the stream key (shown ONCE — only its hash is stored) and the RTMP ingest
        URL. Behind auth; a non-owner is 403, an unknown channel 404. RTMP
        ingestion / HLS output is a later integration boundary — the stream starts
        in state "offline".
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveStreamRequest"
      responses:
        "201":
          description: The created live stream, its stream key (once), and RTMP URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLiveStreamResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: You do not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listLiveStreams
      summary: List a channel's live streams
      description: >-
        Lists the caller's live streams for a channel they own, newest first.
        Behind auth; a non-owner is 403, an unknown channel 404. Stream keys are
        never included.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel's live streams (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: You do not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live:
    get:
      operationId: listLivePublicStreams
      summary: Public "Live now" listing
      description: >-
        Lists the currently-live PUBLIC streams across all channels for a home
        "Live now" rail, most-recently-started first. Only streams that are both
        state=live AND privacy=public appear — unlisted/private and
        offline/ended streams are never listed. Each card carries id, title,
        channel identity, started_at (the current session's start), an is_live
        flag (always true here — this is the card contract that can cheaply and
        truthfully carry it; the video feed card intentionally does not, since
        live streams are a table disjoint from videos), and, when a media server
        is configured, the live HLS playlist path. Stream keys are never
        returned. There is deliberately NO viewer/concurrent-viewer count: no
        server-side counter exists yet (a live-completion dependency, wave W4),
        and the field is omitted rather than faked. A thumbnail/preview is
        likewise omitted — live streams have no server-generated poster yet.
        This is a public read and, like GET /live/{id}, is not gated on the live
        feature toggle (that guards creation/ingest). Paginated with limit
        (1–100, default 30) and offset (>= 0).
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The currently-live public streams (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePublicListResponse"
  /api/v1/live/{id}:
    get:
      operationId: getLiveStream
      summary: Get a live stream's metadata
      description: >-
        Returns a live stream's public metadata. A private stream is visible only
        to its channel owner (else 404, so its existence is not leaked). The stream
        key is never returned.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
