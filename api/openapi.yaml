          items:
            type: string
            format: uuid
    CreateReportRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    ResolveReportRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [accepted, rejected]
        note:
          type: string
          maxLength: 2000
          description: Internal moderator note (not shown to the reporter).
    BlockVideoRequest:
      type: object
      description: Optional body for blocking a video; the reason is recorded for the audit trail.
      properties:
        reason:
          type: string
          maxLength: 2000
    QuarantinedVideo:
      type: object
