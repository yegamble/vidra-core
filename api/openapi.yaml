        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/playlists:
    get:
      operationId: listMyPlaylists
      summary: List the caller's playlists
      description: Returns the caller's playlists, newest first, each with its public video count.
      tags: [playlists]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's playlists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}:
