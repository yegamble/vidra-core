  /api/v1/me/remote-follows:
    post:
      operationId: createRemoteFollow
      summary: Follow a remote channel
      description: >-
        Follows a federated remote channel as the caller. The target is named
        either by handle ("name@domain", leading @ tolerated) or by full actor
        URL — exactly one of the two. The backend resolves the target
        (WebFinger on the remote domain, then the actor document — both
        SSRF-guarded), caches the actor, records the follow as "pending", and
        queues a signed Follow activity AS THE CALLER'S ACCOUNT ACTOR. The
        follow flips to "accepted" when the remote's Accept arrives; a remote
        Reject removes it. Idempotent: re-following returns the existing
        follow without sending a second Follow. Requires authentication. An
        unresolvable/invalid/local target is 422; when federation is disabled
        on this instance the endpoint is 503 (no outbound fetches are made).
      tags: [federation]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRemoteFollowRequest"
      responses:
        "201":
          description: The follow row (freshly created, or the existing one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteFollow"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Invalid target (neither handle nor actor_url, or both), a target
            on this instance (follow local channels via
            POST /channels/{handle}/follow), or a handle/actor URL that could
            not be resolved to a remote channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Federation is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listRemoteFollows
      summary: List the caller's remote-channel follows
      description: >-
        Returns the caller's outbound remote-channel follows, newest first,
        each with the followed actor's identity (name@domain handle, actor
        URL, origin domain) and follow state (pending until the remote
        accepts, then accepted). Requires authentication. Paginated via limit
        (1–100, default 20) and offset.
      tags: [federation]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of remote follows (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteFollowListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/remote-follows/{id}:
    delete:
      operationId: deleteRemoteFollow
      summary: Unfollow a remote channel
      description: >-
        Removes the caller's remote-channel follow by its row id (from the
        list/create responses). The row is deleted immediately — local intent
        wins — and a signed Undo{Follow} is queued to the remote inbox.
        Requires authentication. An unknown (or another user's) id is 404.
      tags: [federation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follow is removed and the Undo is queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such remote follow for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
