  /api/v1/ipfs/status:
    get:
      operationId: getIPFSStatus
      summary: IPFS mirror status (admin)
      description: >-
        Reports the hybrid IPFS media mirror's status (fix_plan P19,
        .ralph/specs/ipfs-media.md): whether it is enabled, node reachability, the
        public gateway URL in use, whether an IPFS Cluster is configured, and pin
        counts overall and per media class. IPFS is a MIRROR SIDECAR — local/S3
        stays authoritative — so this never reflects on the readiness of media
        serving. Returns 503 ipfs_disabled when both IPFS_ENABLED=false and
        IPFS_MIRROR_PRIVATE=false. Restricted to admins. (Status aggregation is
        delivered in P19.2; until then an enabled
        instance answers 501 not_implemented.)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The mirror status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPFSStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Enabled, but status aggregation is not implemented yet (P19.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: IPFS mirroring is not enabled on this instance (ipfs_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/ipfs/reconcile:
    post:
      operationId: reconcileIPFS
      summary: Kick an IPFS reconciliation/backfill scan (admin)
      description: >-
        Triggers an immediate reconciliation scan of the IPFS mirror: re-enqueue
        failed pins and upsert pin intents for eligible ALREADY-PUBLIC objects that
        have no ledger row yet (the outage-backfill path). Idempotent — a second
        run enqueues nothing new. Returns 503 ipfs_disabled when both
        IPFS_ENABLED=false and IPFS_MIRROR_PRIVATE=false. Restricted to admins;
        audited. (The real scan is delivered in P19.6; until
        then an enabled instance answers 501 not_implemented.)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: network
          required: false
          schema:
            type: string
            enum: [public, private]
          description: >-
            Optional swarm filter (fix_plan P19.P2): scope the backfill seeding to the
            public or private mirror only. Omit to reconcile both. An object is seeded
            on its own eligible swarm regardless; this only restricts which swarm's
            objects are considered.
      responses:
        "202":
          description: The scan was accepted; counts of what was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPFSReconcileResult"
        "400":
          description: The network filter is neither 'public' nor 'private'.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Enabled, but the reconcile scan is not implemented yet (P19.6).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: IPFS mirroring is not enabled on this instance (ipfs_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/media/gc:
    get:
      operationId: adminMediaGCConfig
      summary: Media garbage collection boot facts (admin)
      description: >-
        Reports whether the daily automatic destructive sweep is enabled
        (MEDIA_GC_ENABLED), its orphan-ratio circuit breaker
        (MEDIA_GC_MAX_ORPHAN_PERCENT), and the current bucket-ownership state.
        Both knobs are deliberately boot-baked — a runtime override would let a
        settings mistake become an irreversible one — but boot-baked must not
        mean invisible: without this, learning whether the sweep is armed meant
        running a manual dry run and reading the side effects.
        bucket_ownership is the service's CURRENT in-memory state (an adoption
        shows on the next read), in the same vocabulary the sweep result uses.
        Read-only; restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The sweep configuration in force.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGCConfig"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Media garbage collection is not wired on this process.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminMediaGC
      summary: Run media garbage collection (admin)
      description: >-
        Sweeps stored media objects under the known prefixes (originals,
        thumbnails, storyboards, captions, the HLS tree, playlist covers) and
        deletes those with no database reference. Never lists or touches an
        unknown prefix. Defaults to a dry run — pass dry_run=false to actually
        delete. Restricted to admins; audited. Returns the scanned count, the
        orphan keys, and the number deleted (0 on a dry run). The daily scheduled
        sweep runs the same collector.


        A requested delete can still delete nothing, and that is a 200 with a
        full orphan list rather than an error: either the bucket-ownership marker
        does not establish that this instance owns the object store
        (forced_dry_run, bucket_ownership), or the orphan share of what was
        scanned exceeded MEDIA_GC_MAX_ORPHAN_PERCENT (breaker_tripped). Deleting
        from a store whose contents cannot be attributed is the failure this
        endpoint is built to refuse; POST
        /api/v1/admin/media/gc/adopt-bucket is the deliberate way out.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaGCRequest"
      responses:
        "200":
          description: The sweep result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGCResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The storage backend does not support listing (GC unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/media/gc/adopt-bucket:
    post:
      operationId: adminMediaGCAdoptBucket
      summary: Adopt the configured object store for this instance (admin)
      description: >-
        Writes this instance's identity into the object store's ownership marker
        (`.vidra/owner`), which re-enables DESTRUCTIVE media garbage collection
        against a bucket the instance could not establish as its own at boot.


        A bucket the api created, or one that was empty when the api started, is
        marked automatically and never needs this. The bucket that does is one
        that already held objects — a store carried over from a previous install,
        a bucket shared with something else, or the destination of a migration in
        progress — and the missing evidence is an operator saying the media is
        theirs. Calling this asserts exactly that: from the next sweep onward,
        every object under the swept prefixes with no database row referencing it
        is deletable.


        Idempotent, and it overwrites a marker belonging to a different install,
        so on a genuinely shared bucket it takes ownership away from the other
        one. Restricted to admins; audited (admin.media.gc.adopt_bucket).


        REFUSED with `409 foreign_media_layout` when this instance references
        media stored under another system's key layout — the signature of a
        reference-mode PeerTube import, which points `STORAGE_*` at the SOURCE
        instance's own bucket. Adopting there arms an irreversible sweep against
        media that instance is still serving. `force: true` overrides it for an
        operator whose source is retired, and the override is named in the audit
        record.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaGCAdoptBucketRequest"
      responses:
        "200":
          description: The marker was written; the instance now owns the store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGCAdoptBucketResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            Either this instance stores media on local disk, so there is no
            bucket to adopt (`conflict`; local storage is exempt from the
            ownership marker by design), or the instance references media under
            another system's key layout and the adoption was refused
            (`foreign_media_layout`) — re-send with `force: true` to override.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The marker could not be written to the object store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The instance has no identity to stamp on the bucket (the migrations
            have not been run against this database).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/storage/migrations:
    post:
      operationId: startStorageMigration
      summary: Start a storage migration (admin)
      description: >-
        Opens a campaign that copies EVERY object in the configured media store
        into the configured migration target (STORAGE_MIGRATION_TARGET_*),
        verifying each copy by reading it back out of the target and re-hashing
        it. Object keys are never rewritten, so the IPFS pin ledger and every
        stored storage_key keep pointing at the right bytes.


        This does NOT change what the instance serves from. Cutover is an
        explicit operator step: swap BOTH environment sets (STORAGE_* to the new
        store, STORAGE_MIGRATION_TARGET_* to the old one) and restart. The api
        detects that swap, starts the grace clock, and only then — after
        STORAGE_MIGRATION_GRACE_HOURS — deletes the old store's copies. See
        vidra-core docs/operations.md, "Moving the media store".


        While any campaign is not done or cancelled, DESTRUCTIVE media garbage
        collection is forced to dry-run (MediaGCResponse.forced_dry_run_reason =
        storage_migration_active). At most one campaign runs at a time.
        Restricted to admins; audited (admin.storage.migration.start).
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "201":
          description: The campaign was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigration"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A storage migration is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            No migration target is configured (STORAGE_MIGRATION_TARGET_* unset),
            the media store cannot enumerate its objects, or a configured backend
            does not report which store it is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listStorageMigrations
      summary: List storage migrations (admin)
      description: >-
        Returns the campaign history, newest first (up to 50), with each
        campaign's counters. Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The campaign history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigrationList"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/storage/migrations/{id}:
    get:
      operationId: getStorageMigration
      summary: Get one storage migration (admin)
      description: >-
        Returns one campaign plus its per-state object breakdown — the numbers
        that say whether it is safe to cut over yet (cut over from `synced`, with
        `objects.pending` and `objects.copying` at zero). Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The campaign and its object breakdown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigration"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such storage migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/storage/migrations/{id}/cancel:
    post:
      operationId: cancelStorageMigration
      summary: Cancel a storage migration (admin)
      description: >-
        Stops a live campaign: no further objects are claimed, and the media
        garbage collector's interlock releases. Objects already copied are LEFT
        IN PLACE in the target — they are byte-identical copies under identical
        keys, so they are inert, and deleting them would be a destructive action
        taken on the way out of a destructive operation.


        Before cutover this is a complete rollback: nothing about what the
        instance serves has changed. After cutover it is not — the instance is
        already serving from the target — so cancelling then simply stops the old
        store's copies from ever being deleted. Restricted to admins; audited
        (admin.storage.migration.cancel).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The campaign after cancellation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageMigration"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such storage migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests:
    get:
      operationId: listRegistrationRequests
      summary: List the registration approval queue
      description: >-
        Returns registration requests, newest first, with the reviewing admin's
        username, plus a `total` counting the requests that match the same status
        filter. Restricted to admins. The stored password hash is never exposed.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: >-
            Lifecycle state to return. `all` (the default, and what an absent
            parameter means) returns every request. An unrecognised value is a
            400 — it previously meant "all", so `?status=approved` silently
            returned the entire queue.
          schema:
            type: string
            enum: [pending, approved, rejected, all]
            default: all
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of registration requests (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequestListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/approve:
    post:
      operationId: approveRegistrationRequest
      summary: Approve a registration request
      description: >-
        Approves a pending request, creating the account from the stored
        credentials (atomically). Admin only. An unknown/already-resolved id is
        404; a username/email taken since the request was filed is 409.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The request was approved and the account created.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username or email is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/reject:
    post:
      operationId: rejectRegistrationRequest
      summary: Reject a registration request
      description: >-
        Rejects a pending request with an optional internal moderator note.
        Admin only. An unknown/already-resolved id is 404.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRegistrationRequest"
      responses:
        "204":
          description: The request was rejected.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests:
    get:
      operationId: listFederationFollowerRequests
      summary: List the federation follower-approval queue
      description: >-
        Returns pending inbound ActivityPub channel Follows awaiting an admin
        decision, newest first, while federation_follower_approval is on
        (config-parity W12). Modeled on the registration-requests queue.
        Restricted to admins. Paginated via limit (1–100, default 20) and
        offset. A vidra deviation from PeerTube recorded in the parity ledger:
        approval applies to CHANNEL followers because vidra has no
        instance-level AP actor. Governs the ActivityPub inbox only — the
        ATProto integration is outbound cross-posting with no inbound path.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of pending follower requests (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederationFollowerRequestListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests/{id}/approve:
    post:
      operationId: approveFederationFollowerRequest
      summary: Approve a pending channel follower
      description: >-
        Approves one pending inbound channel Follow: the follow flips to
        accepted and the Accept activity is queued to the follower's inbox
        (the delivery the remote has been waiting on). When
        federation_auto_follow_back is on, an instance-initiated follow-back of
        the follower is queued too — signed by the FOLLOWED CHANNEL's actor,
        since vidra has no instance-level AP actor. Admin only; audited
        (admin.federation.follower_approve, safe row id only). An
        unknown/already-resolved id is 404. ActivityPub only.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follower was approved and the Accept queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending follower request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/federation/follower-requests/{id}/reject:
    post:
      operationId: rejectFederationFollowerRequest
      summary: Reject a pending channel follower
      description: >-
        Rejects one pending inbound channel Follow: the pending follow is
        removed and a Reject activity is queued to the follower's inbox. Admin
        only; audited (admin.federation.follower_reject, safe row id only). An
        unknown/already-resolved id is 404. ActivityPub only.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The follower was rejected and the Reject queued.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending follower request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List accounts (admin)
      description: >-
        Returns accounts, newest first, optionally filtered by a username/email
        substring (q). Restricted to admins. Paginated via limit (1–200, default
        50) and offset; `total` counts the accounts matching the same q, so a
        client can tell how many pages exist.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Username/email substring filter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Edit a user's role / active flag / storage quota (admin)
      description: >-
        Updates a user's role, active flag, and/or storage quota (partial).
        Restricted to admins. An admin cannot demote or deactivate their own
        account (422). An unknown id is 404. Deactivating revokes the user's
        sessions. storage_quota_bytes is tri-state — omitted: unchanged; null:
        reset to the instance default; a non-negative integer: per-user
        override (0 = unlimited).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or an attempt to self-demote/deactivate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      summary: Permanently delete a user's account (admin, hard delete)
      description: >-
        IRREVERSIBLE admin variant of the account hard delete, with the same
        semantics as DELETE /api/v1/auth/me (owned channels/videos purged with
        federation Delete fan-out and best-effort blob cleanup, comments
        tombstoned, per-user data erased, sessions revoked, account row
        anonymised) but no password confirmation. Self-guarded: an admin
        cannot hard-delete their own account this way (422).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account was permanently deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user (or already deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Attempt to hard-delete the caller's own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    # The page bounds shared by every list endpoint whose ceiling is 100. A few
    # endpoints have their own bounds (the admin user list pages to 200) and keep
    # their parameter inline; everything else points here so "how big is a page"
    # is answered once.
    PageLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size. Any value in [1, 100] is accepted — this is a RANGE, not a
        fixed set of options. Out-of-range and malformed values are clamped, never
        rejected, so an existing client sending limit=500 keeps receiving the
        first 100 rows rather than a 4xx.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      description: Rows to skip. Negative values are clamped to 0.
      schema:
        type: integer
        minimum: 0
        default: 0
  schemas:
    PageMeta:
      type: object
      description: >-
        The pagination envelope every list response carries. It is composed into
        each list schema with allOf rather than re-declared, so the wire shape is
        defined in exactly one place; the fields stay at the TOP LEVEL of the
        response object, not nested.
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: >-
            How many rows match the SAME filters as this page, ignoring limit and
            offset. Without it a client cannot tell "last page" from "there is
            more" and can only render the page length — which is how the admin
            videos view came to report "100" on an instance with far more. A
            filtered request reports the size of its own filtered result set, not
            the instance total.
          example: 4649
        limit:
          type: integer
          minimum: 1
          description: The page size actually applied, after clamping.
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: One of ok, down, not_configured.
          example: ok
        error:
          type: string
          description: Present only when the component is down.
    ReadinessResponse:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          description: ok when all dependencies are reachable, otherwise degraded.
          example: ok
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
    VersionResponse:
      type: object
      required: [name, version, commit, build_date, go]
      properties:
        name:
          type: string
          example: vidra
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: Short git SHA, or "unknown" when not built with ldflags.
          example: a1b2c3d
        build_date:
          type: string
          description: UTC build timestamp (RFC 3339), or "unknown".
          example: 2026-06-19T00:00:00Z
        go:
          type: string
          example: go1.26
    SchemaVersionResponse:
      type: object
      required: [software, schema]
      properties:
        software:
          $ref: "#/components/schemas/VersionResponse"
        schema:
          $ref: "#/components/schemas/SchemaLedgerStatus"
    SchemaLedgerStatus:
      type: object
      required: [version, dirty, applied]
      properties:
        version:
          type: integer
          format: int64
          description: >-
            The highest applied migration, as a number so callers can compare it.
            0 when applied is false.
          example: 104
        dirty:
          type: boolean
          description: >-
            A migration failed halfway and the schema state is unknown. Needs a
            human before anything else is deployed over it.
        applied:
          type: boolean
          description: >-
            False when no migration has ever run against this database (the
            ledger table is absent or empty) — a fresh install, not a fault.
        error:
          type: string
          description: >-
            Present only when the ledger could not be read for some reason other
            than "not migrated yet". The response is still 200.
    ErrorResponse:
      type: object
      description: >-
        The single, consistent error envelope returned by every endpoint for
        non-2xx responses (except the readiness probe, which returns
        ReadinessResponse on 503).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case identifier for the error class.
              example: not_found
            message:
              type: string
              description: Human-readable description; never leaks internal detail on 5xx.
              example: resource not found
            request_id:
              type: string
              description: Correlates the response with server logs. Omitted when unknown.
            fields:
              type: array
              description: >-
                Field-level validation problems. Present only on validation
                failures (422 unprocessable_entity).
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: must be a valid email
    InstanceResponse:
      type: object
      required: [name, description, short_description, software, registration_enabled,
                 registration_requires_approval, registration_disabled_reason,
                 registration_requires_email_verification, registration_minimum_age,
                 owner_claim_pending, oauth_providers, federation_enabled,
                 terms_url, privacy_url, contact_email, default_language, categories,
                 moderator_languages, server_country, is_sensitive,
                 sensitive_content_policy, contact_form_enabled, social_links, features,
                 branding, defaults, broadcast, featured, customization, social, homepage,
                 live, search]
      properties:
        name:
          type: string
          example: Vidra
        description:
          type: string
          description: >-
            Operator-provided long description (raw markdown); may be empty.
        short_description:
          type: string
          description: Operator-provided short plain-text description; may be empty.
        default_language:
          type: string
          description: >-
            The instance's default content language — a taxonomy language id
            from GET /videos/config. Defaults to "en".
          example: en
        categories:
          type: array
          items:
            type: string
          description: >-
            The operator-selected main instance categories (taxonomy category
            ids from GET /videos/config). Empty when unset.
        moderator_languages:
          type: array
          items:
            type: string
          description: >-
            Languages the operator/moderators speak (taxonomy language ids
            from GET /videos/config). Empty when unset.
        server_country:
          type: string
          description: Free-text server country name; may be empty.
        is_sensitive:
          type: boolean
          description: Whether this instance is dedicated to sensitive content.
        sensitive_content_policy:
          type: string
          enum: [hide, warn, blur, display]
          description: >-
            The instance policy for videos flagged sensitive. "hide" is
            enforced server-side (flagged videos are excluded from the public
            feed and search); warn/blur/display are presentation-only hints
            the frontend applies.
        contact_form_enabled:
          type: boolean
          description: >-
            EFFECTIVE contact-form availability: the admin toggle is on AND an
            effective contact email is set AND the deployment has an outbound
            mail path. POST /api/v1/instance/contact answers 409 whenever this
            is false.
        social_links:
          type: object
          required: [website, mastodon, x, bluesky]
          description: Operator social/link row; each value is "" when unset.
          properties:
            website:
              type: string
            mastodon:
              type: string
            x:
              type: string
            bluesky:
              type: string
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        registration_enabled:
          type: boolean
          description: >-
            Whether public account signup is currently accepted — the
            EFFECTIVE value: the runtime toggle AND registration_user_limit
            headroom (false while the instance is at its user limit; see
            registration_disabled_reason).
        registration_requires_approval:
          type: boolean
          description: >-
            Whether signup files a pending request for admin approval instead of
            creating an account immediately (only relevant when registration is
            enabled).
        registration_disabled_reason:
          type: string
          enum: ["", user_limit_reached]
          description: >-
            "" while registration is effectively enabled (or plainly toggled
            off); "user_limit_reached" when the runtime toggle is on but the
            registration_user_limit is exhausted — so the signup page can
            explain the closure honestly.
        registration_requires_email_verification:
          type: boolean
          description: >-
            EFFECTIVE registration email-verification gate: the
            registration_require_email_verification setting AND an outbound
            mail path on the deployment (features.mail). When true, signup
            answers 202 {"status":"verification_pending"} and login stays 403
            email_verification_required until the emailed link is confirmed.
        registration_minimum_age:
          type: integer
          format: int64
          description: >-
            Signup age-attestation threshold: 0 = off; otherwise registration
            requires `age_attestation: true` ("I am at least N years old" —
            PeerTube parity, no birthdate is collected).
        owner_claim_pending:
          type: boolean
          description: >-
            First-run signal: true while the instance awaits its owner (zero
            accounts and an unclaimed boot-minted setup token) — route to the
            claim-owner wizard instead of the signup form. Every signup path
            answers 403 `owner_claim_required` while this is true; it flips to
            false the moment POST /api/v1/setup/claim-owner succeeds.
        oauth_providers:
          type: array
          items:
            type: string
          description: >-
            Configured OIDC login provider names, in display order. Render a
            "continue with <provider>" button per entry, navigating (top-level)
            to GET /api/v1/auth/oauth/{provider}. Empty when OAuth login is off.
          example: [google]
        atproto_login:
          type: boolean
          description: >-
            Whether ATProto identity login (Bluesky / any self-hosted PDS) is
            enabled (ATPROTO_LOGIN_ENABLED). When true, render a "sign in with a
            handle" affordance that POSTs to /api/v1/auth/atproto/start.
            Independent of oauth_providers above.
        federation_enabled:
          type: boolean
          description: >-
            Whether ActivityPub federation is enabled on this instance (gates
            remote-content surfaces such as remote follows and remote videos).
        terms_url:
          type: string
          description: Link to the instance terms of service; may be empty.
        privacy_url:
          type: string
          description: Link to the instance privacy policy; may be empty.
        contact_email:
          type: string
          description: Operator contact email; may be empty.
        features:
          type: object
          required:
            - uploads
            - imports
            - live
            - comments
            - downloads
            - import_http
            - channel_sync
            - storyboards
            - video_card_previews
            - video_card_previews_default_enabled
            - transcription
            - user_import
            - user_export
            - transcoding
            - video_replace
            - upload_additional_extensions
            - mail
          description: >-
            Effective feature toggles (the DB-backed instance-settings overlay
            over static config). The frontend disables the matching affordances
            in lock-step with the backend's enforcement. The config-parity W8
            flags (import_http, channel_sync, storyboards, transcription,
            user_import, user_export) and the W10 transcoding flag report
            EFFECTIVE availability — the runtime admin setting AND, where one
            exists, the deployment's boot capability (yt-dlp resolver, Whisper
            endpoint, ffmpeg/ffprobe). video_card_previews is the global half of
            the hover-preview gate; video_card_previews_default_enabled is the
            preference inherited by users who have never explicitly chosen.
            Signed-in clients must still require both the global gate and the
            effective video_card_previews_enabled player preference. The mail
            flag is pure boot capability (an outbound mail path exists).
          properties:
            uploads:
              type: boolean
              description: Whether new video uploads are accepted.
            imports:
              type: boolean
              description: Whether URL video import is accepted.
            live:
              type: boolean
              description: Whether creating live streams is allowed.
            comments:
              type: boolean
              description: Whether posting comments is allowed.
            downloads:
              type: boolean
              description: >-
                Whether regular users may download video media. Moderators and
                admins retain download access when this operator toggle is off.
            import_http:
              type: boolean
              description: >-
                Whether the yt-dlp platform-URL import path is available
                (imports on, import_http_enabled on, and the yt-dlp resolver
                wired on this deployment).
            channel_sync:
              type: boolean
              description: >-
                Whether channel auto-sync is available (channel_sync_enabled
                on, the platform import path on, and the yt-dlp resolver wired).
            storyboards:
              type: boolean
              description: >-
                Whether seek-preview storyboard generation is enabled
                (storyboards_enabled). Already-stored storyboards keep serving
                when this is off.
            video_card_previews:
              type: boolean
              description: >-
                Instance-level master gate for video-card hover playback
                (video_card_previews_enabled, default false). A client may start
                a preview only for a signed-in user whose player setting
                video_card_previews_enabled is also true.
            video_card_previews_default_enabled:
              type: boolean
              description: >-
                Current instance default inherited by signed-in users who have
                never explicitly enabled or disabled video-card previews
                (video_card_previews_default_enabled, default false). This does
                not bypass the video_card_previews global gate.
            transcription:
              type: boolean
              description: >-
                Whether Whisper auto-captioning is available
                (transcription_enabled on AND a Whisper endpoint configured).
            user_import:
              type: boolean
              description: Whether POST /api/v1/me/import accepts account archives.
            user_export:
              type: boolean
              description: Whether POST /api/v1/me/export accepts export requests.
            transcoding:
              type: boolean
              description: >-
                Whether the HLS transcoding pipeline is effectively available
                (transcoding_enabled on AND ffmpeg/ffprobe wired at boot,
                config-parity W10). Already-produced playlists keep serving
                when this is false; new uploads stay playable via the retained
                original.
            video_replace:
              type: boolean
              description: >-
                Whether video file replacement is effectively available
                (video_replace_enabled on AND uploads on, config-parity W14).
                The studio hides the "Replace video file" affordance in
                lock-step with the 403 feature_disabled gate on
                POST /videos/{id}/replace and /videos/{id}/replace-session.
            upload_additional_extensions:
              type: boolean
              description: >-
                Whether the extended upload container set (.m4v/.mov/.mkv/…)
                is currently accepted (upload_additional_extensions_enabled,
                config-parity W10) so the studio can narrow its file-picker
                accept list in lock-step with the server's extension gate.
            mail:
              type: boolean
              description: >-
                Whether this deployment has an outbound mail path (an SMTP
                relay via MAIL_ENABLED, or the dev capture seam) — a boot
                capability, not a runtime setting. The admin UI renders the
                mail-dependent settings (email_subject_prefix,
                email_body_signature, contact_form_enabled)
                disabled-with-explanation when false, since they are inert
                without a mailer (config-parity W6 email seam).
        branding:
          type: object
          description: >-
            Instance imagery (config-parity W1 shape; W4 populates the
            frontend consumers). Each slot carries its public serving URL
            ("" when unset) and an is_fallback flag telling the client to use
            its built-in default imagery. The response also gains an ETag and
            Cache-Control s-maxage=60.
          required: [avatar, banner, logos, hide_instance_name]
          properties:
            avatar:
              $ref: "#/components/schemas/InstanceAssetRef"
            banner:
              $ref: "#/components/schemas/InstanceAssetRef"
            logos:
              type: object
              required: [favicon, header_wide, header_square, opengraph]
              properties:
                favicon:
                  $ref: "#/components/schemas/InstanceAssetRef"
                header_wide:
                  $ref: "#/components/schemas/InstanceAssetRef"
                header_square:
                  $ref: "#/components/schemas/InstanceAssetRef"
                opengraph:
                  $ref: "#/components/schemas/InstanceAssetRef"
            hide_instance_name:
              type: boolean
              description: >-
                Hide the textual instance name in the header (meaningful once
                a header logo is set).
        defaults:
          type: object
          description: >-
            Operator-tuned client behaviour defaults (W5/W9 consume): what
            anonymous visitors see first and how publish forms are seeded.
          required: [feed_sort, feed_scope, browse_scroll_mode, landing_page, theme,
                     player_autoplay, miniature_prefer_author_display_name, publish]
          properties:
            feed_sort:
              type: string
              enum: [recent, popular, trending]
            feed_scope:
              type: string
              enum: [local, all]
            browse_scroll_mode:
              type: string
              enum: [button, auto]
              # No `default:` here on purpose. This is a RESPONSE property and it
              # is already in `required`, so the field is always present; with
              # openapi-typescript a `default:` additionally makes a property
              # mandatory for typed clients, and that footgun is not worth
              # re-stating a default the description already gives.
              description: >-
                How a browse list advances past its first page: "button" is an
                explicit pager / Load more control (the default, and the shipped
                behaviour), "auto" is infinite scroll. Operator-level because it
                is an accessibility and data-usage decision — infinite scroll
                strands keyboard users and anything below the list.
            landing_page:
              type: string
              enum: [home-recent, trending, local, home]
              description: >-
                "home" is the admin-authored homepage document and only takes
                effect once one is set (homepage.enabled).
            theme:
              type: string
              enum: [system, light, dark]
            player_autoplay:
              type: boolean
              description: >-
                Seeds BOTH start-on-open and autoplay-next for anonymous/unset
                users (documented deviation); never overrides an explicit
                per-user preference.
            miniature_prefer_author_display_name:
              type: boolean
            publish:
              type: object
              required: [privacy, licence, comment_policy, download_enabled]
              properties:
                privacy:
                  type: string
                  enum: [public, unlisted, private]
                licence:
                  type: integer
                  format: int64
                  description: PT-compatible licence id; 0 = no default licence.
                comment_policy:
                  type: string
                  enum: [enabled, disabled]
                download_enabled:
                  type: boolean
        broadcast:
          type: object
          description: Operator broadcast banner (W3 renders it).
          required: [enabled, message, level, dismissable]
          properties:
            enabled:
              type: boolean
            message:
              type: string
              description: Raw markdown.
            level:
              type: string
              enum: [info, warning, error]
            dismissable:
              type: boolean
        featured:
          type: object
          description: >-
            Admin featured-banner slot on the homepage (YouTube-masthead-style).
            The frontend fetches the picked video server-side and renders the
            banner only when enabled AND video_id resolves to a public,
            published video; otherwise the banner is silently absent. This block
            reports the raw admin knobs, not a resolved video.
          required: [enabled, video_id, title, description, cta_label, label]
          properties:
            enabled:
              type: boolean
            video_id:
              type: string
              description: Picked video UUID; "" when no video is selected.
            title:
              type: string
              description: Title override; "" falls back to the video's title.
            description:
              type: string
              description: Description override; "" falls back to the video's description.
            cta_label:
              type: string
              description: CTA button label override; "" uses the frontend default.
            label:
              type: string
              enum: [featured, sponsored]
              description: Chip shown on the banner (editorial pick vs paid placement).
        customization:
          type: object
          description: >-
            Custom CSS/JS references by content hash (never inlined; fetch
            /api/v1/instance/custom.css?v={css_hash}) plus the primary-color
            override.
          required: [css_hash, js_hash, primary_color]
          properties:
            css_hash:
              type: string
              description: sha256 of the custom_css document; "" when unset.
            js_hash:
              type: string
              description: sha256 of the custom_js document; "" when unset.
            primary_color:
              type: string
              description: '"#rrggbb" or "" (no override).'
        social:
          type: object
          description: >-
            Link-card metadata (distinct from social_links.x — twitter:site
            wants a handle, not a profile URL).
          required: [twitter_username]
          properties:
            twitter_username:
              type: string
              example: "@vidra"
        homepage:
          type: object
          description: >-
            Admin-authored homepage document state; the body is fetched from
            GET /api/v1/instance/homepage.
          required: [enabled, hash]
          properties:
            enabled:
              type: boolean
            hash:
              type: string
              description: sha256 of the homepage document; "" when unset.
        live:
          type: object
          description: >-
            Effective live-streaming policy (config-parity W11) so the
            live-create UI can hide the replay toggle, seed its default, and
            explain the caps. features.live stays the master availability
            flag; every limit here uses 0 = unlimited / no limit.
          required: [allow_replay, default_save_replay, max_instance_lives,
                     max_user_lives, max_duration_secs]
          properties:
            allow_replay:
              type: boolean
              description: >-
                Instance master gate for replay-to-VOD: when false, no replay
                is produced regardless of a stream's replay_enabled flag.
            default_save_replay:
              type: boolean
              description: >-
                EFFECTIVE default seeded into a new live stream's
                replay_enabled when the client omits it (the
                live_default_save_replay setting AND allow_replay).
            max_instance_lives:
              type: integer
              format: int64
              description: >-
                Max simultaneous live sessions across the instance, enforced
                at the RTMP publish callback (403 deny). 0 = unlimited.
            max_user_lives:
              type: integer
              format: int64
              description: >-
                Max simultaneous live sessions per user (across all their
                channels), enforced at the same callback. 0 = unlimited.
            max_duration_secs:
              type: integer
              format: int64
              description: >-
                Max live-session duration; a watchdog force-closes over-limit
                sessions (permanent streams return to offline, one-shots end).
                0 = no limit.
        search:
          type: object
          description: >-
            EFFECTIVE remote-URI search gates (config-parity W13): whether a
            URI/handle-shaped search query is resolved to remote content for
            logged-in and anonymous callers. Each flag is the runtime setting
            (search_remote_uri_users / search_remote_uri_anonymous) AND the
            boot capability (federation enabled + wired), so the search UI's
            help text stays in lock-step with the backend gate.
          required: [remote_uri_users, remote_uri_anonymous]
          properties:
            remote_uri_users:
              type: boolean
              description: >-
                Logged-in callers may search by URL/handle (default on).
            remote_uri_anonymous:
              type: boolean
              description: >-
                Anonymous callers may search by URL/handle (default off —
                the SSRF/abuse surface, matching PeerTube).
            service_enabled:
              type: boolean
              description: >-
                Effective smart-search availability (search-service W9): the
                vidra-search service is wired AND the admin routing toggle
                (search_service_enabled) is on. When false, all search surfaces
                use their local backup path.
            mode:
              type: string
              enum: [simple, advanced]
              description: >-
                Effective search ranking family (search-service W4): simple
                heuristics or advanced learned/behavioural signals.
            suggestions_enabled:
              type: boolean
              description: >-
                Whether autocomplete suggestions are available (the search
                service is wired AND the admin routing toggle is on AND the
                suggestions toggle is on).
            personalized_search_enabled:
              type: boolean
              description: >-
                Instance-level personalized-search gate (search-service W4).
            personalized_recommendations_enabled:
              type: boolean
              description: >-
                Instance-level personalized-recommendations gate (search-service
                W4).
            search_history_enabled:
              type: boolean
              description: >-
                Instance-level search-history gate (search-service W4).
    InstanceAssetRef:
      type: object
      description: >-
        One instance branding asset reference: its public serving URL ("" when
        unset) and whether the client should fall back to built-in imagery.
      required: [url, is_fallback]
      properties:
        url:
          type: string
          description: Public serving path, e.g. /api/v1/instance/avatar.
        is_fallback:
          type: boolean
    InstanceAboutResponse:
      type: object
      description: >-
        The operator-authored about-page texts (spec instance-platform-info).
        Every field is RAW markdown, "" when unset.
      required: [description, terms, code_of_conduct, moderation_info,
                 administrator_info, creation_reason, maintenance_lifetime,
                 business_model, hardware_info, support_text]
      properties:
        description:
          type: string
          description: The long instance description (same value as GET /instance).
        terms:
          type: string
          description: Terms markdown body (distinct from the terms_url link).
        code_of_conduct:
          type: string
        moderation_info:
          type: string
        administrator_info:
          type: string
          description: Who is behind the instance?
        creation_reason:
          type: string
          description: Why did you create this instance?
        maintenance_lifetime:
          type: string
          description: How long do you plan to maintain it?
        business_model:
          type: string
          description: How will you finance the server?
        hardware_info:
          type: string
        support_text:
          type: string
    InstanceContactRequest:
      type: object
      required: [from_name, from_email, subject, body]
      properties:
        from_name:
          type: string
          minLength: 1
          maxLength: 120
          description: The visitor's name.
        from_email:
          type: string
          maxLength: 254
          description: >-
            The visitor's reply address (set as Reply-To on the delivered
            mail; never the envelope sender).
        subject:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 10
          maxLength: 5000
    OAuthIdentity:
      type: object
      required: [provider, email, created_at]
      properties:
        provider:
          type: string
          description: Configured provider name the identity belongs to.
          example: google
        email:
          type: string
          description: >-
            Email snapshot captured when the identity was linked (display only;
            the account email is authoritative). May be empty.
        handle:
          type: string
          description: >-
            Human-readable remote handle for the linked identity (the ATProto /
            Bluesky handle, e.g. alice.bsky.social). Present only for providers
            that carry one; omitted otherwise. The provider subject (the DID for
            ATProto) is never exposed.
        created_at:
          type: string
          format: date-time
          description: When the identity was linked.
    OAuthIdentitiesResponse:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/OAuthIdentity"
    NodeInfoResponse:
      type: object
      required: [version, software, instance]
      properties:
        version:
          type: string
          description: NodeInfo schema version.
          example: "2.0"
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        instance:
          type: object
          required: [name]
          properties:
            name:
              type: string
    User:
      type: object
      required: [id, username, email, role, email_verified, display_name, bio, history_enabled, profile_public, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.test
        role:
          type: string
          enum: [user, moderator, admin]
        email_verified:
          type: boolean
        display_name:
          type: string
          description: Human-facing name; may be empty.
          example: Ada L.
        bio:
          type: string
          description: Short free-text description; may be empty.
        unlisted:
          type: boolean
          description: >-
            Account-level discovery opt-out. When true, the account's channels
            and videos are excluded from public discovery surfaces (video feed,
            search) while direct channel/video URLs keep serving. Default false.
        history_enabled:
          type: boolean
          description: >-
            Per-user watch-history preference. While false, watch-progress and
            history writes are skipped (PUT /videos/{id}/watch-progress is a
            no-op 204). Seeded at account creation from the
            new_user_history_enabled instance setting; existing entries are
            kept (clear them via DELETE /me/history).
        profile_public:
          type: boolean
          description: >-
            Whether the account profile is publicly accessible. Private,
            inactive, and unknown profile URLs all return 404.
        show_bluesky:
          type: boolean
          description: >-
            Per-user opt-in to display the linked Bluesky/ATProto sign-in handle
            on the public profile (surfaced as PublicUserProfile.bluesky_handle).
            Default false. Toggle via PATCH /auth/me.
        search_history_enabled:
          type: boolean
          description: >-
            Per-user search-history preference (search-service W4): the user
            half of the two-factor history gate. Default true.
        personalized_search_enabled:
          type: boolean
          description: >-
            Per-user personalized-search preference (search-service W4).
            Default true.
        personalized_recommendations_enabled:
          type: boolean
          description: >-
            Per-user personalized-recommendations preference (search-service
            W4). Default true.
        sensitive_content_policy:
          type: string
          enum: [hide, warn, blur, display]
          description: >-
            Per-user override of the instance sensitive_content_policy. Omitted
            when the account inherits the instance policy (the default). When
            set, "hide" is enforced server-side for this user (flagged videos
            drop out of their feed/search); warn/blur/display are
            presentation-only. Set or clear it via PATCH /auth/me.
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /users/{id}/avatar).
            Present on GET/PATCH /auth/me; omitted elsewhere.
        has_banner:
          type: boolean
          description: >-
            Whether a profile banner is set (served at GET /users/{id}/banner).
            Present on GET/PATCH /auth/me; omitted elsewhere.
    ProfileImage:
      type: object
      description: >-
        A stored avatar/banner's metadata, returned by the upload endpoints.
        The image itself is served by the corresponding public GET route with
        the Content-Type recorded here.
      required: [kind, content_type, size_bytes, created_at, updated_at]
      properties:
        kind:
          type: string
          enum: [avatar, banner]
        content_type:
          type: string
          description: Derived from the upload's file extension.
          example: image/png
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      description: Partial profile update; provide at least one field.
      properties:
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 1000
        unlisted:
          type: boolean
          description: >-
            Toggle the account-level discovery opt-out (see User.unlisted).
        history_enabled:
          type: boolean
          description: >-
            Toggle the per-user watch-history preference (see
            User.history_enabled).
        profile_public:
          type: boolean
          description: Toggle public access to the account profile.
        show_bluesky:
          type: boolean
          description: >-
            Toggle displaying the linked Bluesky/ATProto handle on the public
            profile (see User.show_bluesky).
        search_history_enabled:
          type: boolean
          description: Toggle the per-user search-history preference (search-service W4).
        personalized_search_enabled:
          type: boolean
          description: Toggle the per-user personalized-search preference (search-service W4).
        personalized_recommendations_enabled:
          type: boolean
          description: Toggle the per-user personalized-recommendations preference (search-service W4).
        sensitive_content_policy:
          type: string
          description: >-
            Set the per-user sensitive-content policy override: one of hide,
            warn, blur, display, or an empty string to clear the override
            (inherit the instance policy). Any other value -> 422.
    PublicUserProfile:
      type: object
      required: [id, username, display_name, bio, created_at, has_avatar, has_banner, channels]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
        has_banner:
          type: boolean
        bluesky_handle:
          type: string
          description: >-
            The account's linked Bluesky/ATProto sign-in handle (e.g.
            alice.bsky.social). Present only when the owner opted in
            (User.show_bluesky) AND a handle is on file; omitted otherwise.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    Channel:
      type: object
      required: [id, owner_id, handle, display_name, description, follower_count, created_at, activitypub_enabled, atproto_enabled]
      properties:
        follower_count:
          type: integer
          format: int64
          description: Number of users following this channel.
          example: 0
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        handle:
          type: string
          example: ada_makes
        display_name:
          type: string
          example: Ada Makes
        description:
          type: string
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /channels/{handle}/avatar).
        has_banner:
          type: boolean
          description: >-
            Whether a banner is set (served at GET /channels/{handle}/banner).
        activitypub_enabled:
          type: boolean
          description: >-
            Whether this channel publishes over ActivityPub. When false the
            channel does not federate: inbound Follows are ignored and outbound
            Create/Update/Delete are skipped. Owner-editable via PATCH.
        atproto_enabled:
          type: boolean
          description: >-
            Whether this channel's published videos are cross-posted to
            ATProto/Bluesky (subject to the owner having a linked account and the
            instance ATProto extension being on). Owner-editable via PATCH.
        atproto_active:
          type: boolean
          description: >-
            Effective ATProto distribution status: atproto_enabled AND the
            channel owner has a linked Bluesky account AND the instance ATProto
            extension is on. Computed only where cheap (single-channel GET and
            /me/channels); omitted in bulk listings and when the extension is not
            enabled on the instance.
        role:
          type: string
          enum: [owner, editor]
          description: >-
            The caller's role on this channel, set only on GET /me/channels
            (which spans owned + collaborated channels); omitted on public and
            single-channel views.
        is_following:
          type: boolean
          description: >-
            Whether the AUTHENTICATED caller follows this channel. Present only
            on the single-channel GET and only when the request carries a valid
            token; omitted for anonymous callers and in bulk listings.
        notification_setting:
          type: string
          enum: [all, none]
          description: >-
            The caller's notification bell for this channel — "all" (told about
            every new public video) or "none" (subscription kept, notifications
            muted). Present wherever the caller demonstrably follows the channel:
            the single-channel GET when is_following is true, and every row of
            GET /me/following. Omitted otherwise.
    CreateChannelRequest:
      type: object
      required: [handle, display_name]
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 30
          description: 3–30 chars; letters, digits, or underscore.
          example: ada_makes
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Ada Makes
        description:
          type: string
          maxLength: 1000
    UpdateChannelRequest:
      type: object
      description: Partial update; provide at least one field. Handle is immutable.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 1000
        activitypub_enabled:
          type: boolean
          description: >-
            Toggle ActivityPub federation for this channel (owner only). Absent
            leaves it unchanged.
        atproto_enabled:
          type: boolean
          description: >-
            Toggle ATProto/Bluesky cross-posting for this channel (owner only).
            Absent leaves it unchanged.
    ChannelListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [channels]
          properties:
            channels:
              type: array
              items:
                $ref: "#/components/schemas/Channel"
    ChannelSearchResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [query, channels]
          description: >-
            A page of channel search results. The rows are ordinary Channel
            objects — same shape and keys as every other channel surface,
            including follower_count and the avatar/banner flags a result card
            renders — rather than a search-only projection clients would have to
            model twice. As in every bulk channel listing, atproto_active is
            omitted (it costs a query per row) and so are the caller-relative
            is_following / notification_setting.
          properties:
            query:
              type: string
              example: cooking
            channels:
              type: array
              items:
                $ref: "#/components/schemas/Channel"
    AccountSearchResult:
      type: object
      description: >-
        A public account as a search result card. Its fields are a strict SUBSET
        of PublicUserProfile, with the same keys and types, so a client can
        render a card with the profile type it already has. The two omitted
        parts are the ones that cannot be answered per row without a query each:
        the account's channel list, and the Bluesky handle behind its own
        opt-in.
      required: [id, username, display_name, bio]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        bio:
          type: string
        has_avatar:
          type: boolean
          description: >-
            Whether the account has an avatar, served at
            GET /users/{username}/avatar. Present only when the profile-image
            service is wired; omitted otherwise, exactly as on PublicUserProfile.
    AccountSearchResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [query, accounts]
          properties:
            query:
              type: string
              example: alice
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/AccountSearchResult"
    ChannelMember:
      type: object
      description: A channel collaborator (migration 0097).
      required: [user_id, username, display_name, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
          example: bob
        display_name:
          type: string
          example: Bob
        role:
          type: string
          enum: [editor]
          description: The member's role. Today only "editor".
        created_at:
          type: string
          format: date-time
    ChannelMembersResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/ChannelMember"
    AddChannelMemberRequest:
      type: object
      required: [handle]
      properties:
        handle:
          type: string
          description: The handle (username) of the local user to invite.
          example: bob
        role:
          type: string
          enum: [editor]
          description: The role to grant. Defaults to "editor" when omitted.
    FollowedChannel:
      description: >-
        A channel the caller follows, with the follow timestamp. Each row also
        carries the caller's notification_setting (the bell) from the shared
        Channel schema, so the FOLLOWING list renders bell state without a
        request per row.
      allOf:
        - $ref: "#/components/schemas/Channel"
        - type: object
          required: [followed_at]
          properties:
            followed_at:
              type: string
              format: date-time
              description: When the caller followed this channel.
    SetFollowNotificationsRequest:
      type: object
      required: [notification_setting]
      properties:
        notification_setting:
          type: string
          enum: [all, none]
          description: >-
            The bell mode to store. "all" = notify me about every new public
            video from this channel; "none" = keep the subscription, mute the
            notifications.
    FollowNotificationsResponse:
      type: object
      required: [notification_setting]
      properties:
        notification_setting:
          type: string
          enum: [all, none]
    FollowedChannelsResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [channels]
          properties:
            channels:
              type: array
              items:
                $ref: "#/components/schemas/FollowedChannel"
    DonationAddress:
      type: object
      description: >-
        A public crypto wallet address displayed for NON-CUSTODIAL donations.
        Vidra never holds funds or private keys and there is deliberately no
        balance/amount field. The internal verification nonce/expiry are never
        exposed.
      required: [id, owner_id, network, address, label, verified, created_at]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
          description: >-
            The channel this address is scoped to. Omitted for account-level
            (profile) addresses.
        network:
          type: string
          enum: [bitcoin, ethereum, litecoin, monero]
        address:
          type: string
          example: 0x52908400098527886E0F7030069857D2E4169EE7
        label:
          type: string
          maxLength: 60
          example: Tips
        verified:
          type: boolean
          description: >-
            Whether the owner cryptographically proved control of this address
            via the challenge/verify flow.
        created_at:
          type: string
          format: date-time
    DonationAddressListResponse:
      type: object
      required: [addresses]
      properties:
        addresses:
          type: array
          items:
            $ref: "#/components/schemas/DonationAddress"
    AddDonationAddressRequest:
      type: object
      required: [network, address]
      properties:
        channel_id:
          type: string
          format: uuid
          description: >-
            Optional. When set, scopes the address to a channel the caller
            owns; omit or leave empty for an account-level (profile) address.
        network:
          type: string
          enum: [bitcoin, ethereum, litecoin, monero]
        address:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 60
    DonationChallengeResponse:
      type: object
      required: [message, expires_at]
      properties:
        message:
          type: string
          description: >-
            The exact message to sign with the address's private key. For
            ethereum, sign it as an EIP-191 personal_sign message.
        expires_at:
          type: string
          format: date-time
    VerifyDonationAddressRequest:
      type: object
      required: [signature]
      properties:
        signature:
          type: string
          description: >-
            The signature of the challenge message. For ethereum, the 65-byte
            [r||s||v] personal_sign signature, hex-encoded (0x-prefixed
            accepted).
    Video:
      type: object
      required: [id, remote, title, description, is_sensitive, sensitive_reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: >-
            Whether this card is a federated REMOTE video. Local videos are
            always false. Remote cards (subscriptions feed, search, and the
            public feed with scope=all) omit the local-only fields
            (channel_id, privacy, state) and instead carry domain, watch_url,
            and optionally stream_url; their metadata detail lives at GET
            /remote-videos/{id} and their cached poster at GET
            /remote-videos/{id}/thumbnail.
        channel_id:
          type: string
          format: uuid
          description: >-
            The owning local channel. Present on every local video; omitted on
            remote cards (a remote video has no local channel).
        channel_handle:
          type: string
          description: >-
            The owning channel's handle, present on card/feed views so the client
            can link to /channels/{handle}. Omitted on the detail view. On a
            remote card this is the remote channel's "name@domain" identity
            (not a local route).
        channel_display_name:
          type: string
          description: The owning channel's display name; present alongside channel_handle on card/feed views.
        author_display_name:
          type: string
          description: >-
            The uploader ACCOUNT's display name (config-parity W5/W9), present
            alongside the channel identity on local card/feed views and the
            detail view when the account has set one; omitted when unset and on
            remote cards. Drives miniature_prefer_author_display_name.
        title:
          type: string
          example: My first upload
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private, password]
          description: Present on every local video; omitted on remote cards.
        state:
          type: string
          enum: [draft, processing, scheduled, quarantined, transcoding, published, failed]
          description: >-
            Publish lifecycle. "scheduled" means the upload finished processing
            but publish_at lies in the future; public surfaces (feed, search,
            channel lists) only show "published", while direct links behave
            like any non-published video. "quarantined" means the instance
            holds new uploads for moderator review (QUARANTINE_NEW_UPLOADS):
            only the owner (studio badge) and moderators can see the video
            until it is approved (published) or rejected (failed).
            "transcoding" means the video opted into publish_after_transcode and
            is held off every public surface until its HLS transcode completes;
            like quarantine, only the owner and moderators can see it meanwhile,
            and the release publishes it through the normal publish transition.
            Present on every local video; omitted on remote cards.
        is_sensitive:
          type: boolean
          description: >-
            Whether the owner flagged the video as sensitive content. Always
            present; false on remote cards (no local flag exists for them).
            When the instance sensitive_content_policy is "hide", flagged
            videos are excluded from the public feed and search server-side;
            under warn/blur the frontend applies the matching presentation.
        sensitive_reason:
          type: string
          description: >-
            The creator's optional content-warning text, paired with
            is_sensitive by the frontend. Always present (empty string when
            unset, and on remote cards). At most 280 characters.
        created_at:
          type: string
          format: date-time
          description: >-
            Creation time. On a remote card this is the origin's published
            time (falling back to when the video was fetched).
        domain:
          type: string
          description: >-
            REMOTE cards only: the origin instance's domain.
        watch_url:
          type: string
          description: >-
            REMOTE cards only: the origin's human watch page (always present
            on remote cards; the card links out here).
        stream_url:
          type: string
          description: >-
            REMOTE cards only: best playable URL from the origin (HLS
            preferred, else a direct video file). Omitted when the origin
            advertised none — the card then links out via watch_url.
        publish_at:
          type: string
          format: date-time
          description: >-
            The scheduled publish time. Present on the detail, create/update,
            and owner (studio) channel-list views once a schedule was set;
            omitted otherwise. The server publishes the video (running the
            same side effects as a direct publish) when this time arrives.
        originally_published_at:
          type: string
          format: date-time
          description: >-
            When the video was FIRST published elsewhere (a PeerTube import's
            originallyPublishedAt, or a date the creator set). Present on the
            detail and create/update views when known; omitted for anything
            first published on this instance, where created_at is the only
            date.
        duration_seconds:
          type:
            - integer
            - "null"
          description: >-
            Probed duration in whole seconds, recorded by the media probe. Present
            on the detail endpoint and on card/feed views (feed, search, channel
            lists, subscriptions, saved, history) so a card can show a length badge
            or resume progress bar; omitted when unknown (not yet probed).
        width:
          type:
            - integer
            - "null"
          description: Probed pixel width; omitted when unknown (e.g. audio-only).
        height:
          type:
            - integer
            - "null"
          description: Probed pixel height; omitted when unknown (e.g. audio-only).
        has_thumbnail:
          type: boolean
          description: >-
            Whether a poster image is available at GET /videos/{id}/thumbnail.
            Present on the detail endpoint; omitted on list/feed views.
        has_storyboard:
          type: boolean
          description: >-
            Whether a seek-preview storyboard is available at GET
            /videos/{id}/storyboard.jpg (+ the .vtt map). Present on the detail
            endpoint; omitted on list/feed views.
        has_chapters:
          type: boolean
          description: >-
            Whether the video has seek-bar chapters at GET
            /videos/{id}/chapters. Present on the detail endpoint; omitted on
            list/feed views. Lets the player fetch chapters only when they exist.
        views:
          type: integer
          format: int64
          description: >-
            Recorded view count. Present on the detail endpoint; omitted on
            list/feed views.
        category:
          type: string
          description: >-
            Optional subject-category id from GET /videos/config; omitted when
            unset. Present on the create/update/detail views.
        language:
          type: string
          description: >-
            Optional content language code (ISO 639-1) from GET /videos/config;
            omitted when unset.
        license:
          type: string
          description: >-
            Optional content-license id from GET /videos/config; omitted when
            unset.
        comments_policy:
          type: string
          enum: [enabled, disabled]
          description: >-
            The per-video comment policy (config-parity W9). Present on the
            create/update/detail views; omitted on list/feed views and remote
            cards.
        comments_enabled:
          type: boolean
          description: >-
            EFFECTIVE comment availability on the DETAIL view only: the
            instance-wide comments_enabled setting AND this video's
            comments_policy. Reading existing comments stays open either way;
            this reports whether posting is possible.
        download_enabled:
          type: boolean
          description: >-
            The per-video download policy (config-parity W9). Present on the
            create/update/detail views; omitted on list/feed views. Effective
            availability for regular viewers is this flag AND the instance
            downloads feature (GET /instance features.downloads);
            moderators/admins bypass both.
        publish_after_transcode:
          type: boolean
          description: >-
            The per-video publish-timing opt-in. When true, a processed video is
            held (state "transcoding") off every public surface until its HLS
            transcode completes, instead of publishing while it transcodes
            (default false). Present on the create/update/detail (owner-facing)
            views; omitted on list/feed views and remote cards.
        transcoding:
          type: boolean
          description: >-
            DETAIL view only. True while a transcode job is still live for this
            video — the "still processing" signal shown under the player. It
            becomes false once the last job finishes, at which point hls_url
            appears. Independent of publish_after_transcode: it is true for any
            video with a running transcode. Omitted (absent = false) elsewhere.
        tags:
          type: array
          description: >-
            The video's free-form tags (lowercased, alphabetical; at most 5).
            Present on the create/update/detail views; omitted when empty and
            on list/feed views.
          items:
            type: string
            maxLength: 50
        hls_url:
          type: string
          description: >-
            Versioned path of the HLS master playlist (GET
            /videos/{id}/hls/master.m3u8?v=<generation>).
            Present on the detail endpoint only once the transcoded streaming
            playlist is ready; omitted while transcoding is pending/failed or
            disabled. Progressive playback via /original is always available.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/master.m3u8?v=ctw5ps0e8w00
        renditions:
          type: array
          description: >-
            The available HLS ladder rungs (tallest first), present alongside
            hls_url on the detail endpoint once transcoding completed.
          items:
            $ref: "#/components/schemas/VideoRendition"
        packaging_format:
          type: string
          enum: [hls-ts, cmaf]
          description: >-
            DETAIL view only. How the streaming tree is packaged — HLS over
            MPEG-TS segments, or a single CMAF tree serving both HLS and DASH
            from the same fMP4 segments. Present alongside hls_url once the tree
            is ready. Same value as the playback session's packaging_format; it
            is repeated here because this is the response a client reads first.
          example: cmaf
        dash_url:
          type: string
          description: >-
            DETAIL view only. Origin-relative path of the MPEG-DASH manifest,
            present only when packaging_format is `cmaf`. Unversioned and NOT
            immutable — see PlaybackSession.dash_url.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/cmaf/stream.mpd
        ipfs_pinned:
          type: boolean
          description: >-
            Whether at least one of this video's media objects is currently
            pinned to IPFS (fix_plan P19, .ralph/specs/ipfs-media.md). Drives the
            "IPFS" thumbnail badge on card/feed views. Present (true) only for
            public+published videos whose media the mirror has pinned; omitted
            (treat as false) otherwise, and always absent when IPFS_ENABLED is
            off. IPFS is a MIRROR SIDECAR — local/S3 remains authoritative, so a
            false/absent value never affects playback.
        ipfs:
          allOf:
            - $ref: "#/components/schemas/VideoIPFS"
          description: >-
            IPFS mirror CIDs for this video, present on the DETAIL endpoint only
            when the video is public+published and at least one object is pinned;
            omitted otherwise. CIDs are NEVER emitted for non-public videos
            regardless of caller (privacy invariant). Serving is unchanged —
            these are additive, content-address handles for clients that prefer a
            gateway fetch.
    VideoIPFS:
      type: object
      description: >-
        Pinned IPFS content identifiers for a public+published video (fix_plan
        P19). Each CID is a validated CIDv1; a client resolves an object as
        {gateway_url}/ipfs/{cid}. Fields are omitted when the corresponding
        object is not pinned.
      properties:
        original_cid:
          type: string
          description: >-
            CIDv1 of the pinned video original (web-videos/<id><ext>). Omitted
            until the original is pinned.
          example: bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi
        hls_cid:
          type: string
          description: >-
            CIDv1 (wrap-directory root) of the pinned HLS tree. Populated once
            the HLS directory add lands (P19.4); omitted until then or when the
            video has no transcoded HLS.
        gateway_url:
          type: string
          description: >-
            Public IPFS gateway base (from IPFS_GATEWAY_URL) under which the CIDs
            resolve, e.g. https://ipfs.example.org. Built only from the
            configured gateway and validated CIDs — never a caller-supplied
            value.
          example: https://ipfs.example.org
    VideoRendition:
      type: object
      description: One transcoded HLS rendition (ladder rung) of a video.
      required: [height, width]
      properties:
        height:
          type: integer
          example: 720
        width:
          type: integer
          example: 1280
    VideoChapter:
      type: object
      description: One seek-bar chapter of a video (CORE-15).
      required: [start_seconds, title]
      properties:
        start_seconds:
          type: integer
          minimum: 0
          description: Whole-second offset from the video start where the chapter begins.
          example: 90
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Short chapter title (1–120 characters after trimming).
          example: Introduction
    VideoChapters:
      type: object
      description: >-
        A video's chapters in playback order (ascending start_seconds); the
        array is empty when the video has none.
      required: [chapters]
      properties:
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/VideoChapter"
    SetVideoChaptersRequest:
      type: object
      description: >-
        The whole chapter set to store (replaces any existing set). An empty
        array clears all chapters. start_seconds must be >= 0 and strictly
        increasing; titles are 1–120 characters after trimming; at most 100
        chapters; each start must be less than the probed duration when known.
      required: [chapters]
      properties:
        chapters:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/VideoChapter"
    PlaybackSession:
      type: object
      description: >-
        A brokered playback session for one video or one live stream. Returned by
        POST /videos/{id}/playback-session and POST
        /live/{id}/playback-session — ONE object shape, so a player consumes a
        session the same way whichever it is playing.
      required: [session_id]
      properties:
        session_id:
          type: string
          format: uuid
          description: >-
            Server-minted identifier for this playback session, and the
            correlation key for its quality-of-experience events. It is NOT the
            `X-Vidra-Session` browse id (client-generated per tab) and it is
            never an authorization input on its own — for a password-protected
            video the authority lives in playback_token, which is signed over
            this same id.
          example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301
        video_id:
          type: string
          format: uuid
          description: >-
            The video this session is for. Present on every video session and
            absent on a live one — exactly one of video_id / live_stream_id is
            always present, and which one tells a client what it is playing.
        live_stream_id:
          type: string
          format: uuid
          description: >-
            The live stream this session is for; present only on a live session.
            Separate from video_id rather than a shared polymorphic id because
            videos and live streams are different resources — a live stream's id
            resolves on no video endpoint.
        packaging_format:
          type: string
          enum: [hls-ts, cmaf]
          description: >-
            How the streaming tree is packaged — HLS over MPEG-TS segments, or a
            single CMAF tree serving both HLS and DASH from the same fMP4
            segments. Omitted when no tree is ready. A client cannot infer this
            from hls_url: both formats serve HLS from master.m3u8. A live session
            is always `hls-ts` (the media server muxes MPEG-TS).
          example: cmaf
        hls_url:
          type: string
          description: >-
            Origin-relative, generation-versioned path of the HLS master
            playlist. Omitted until the transcoded tree is ready. Not a presigned
            URL — delivery-source selection (CDN, presigned redirect, IPFS
            gateway) is made per request when the bytes are served, so this URL
            carries no credential and does not expire. On a live session this is
            the live playlist path and carries no version: live segments are
            ephemeral, are never stored, and have no generation to fence.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/master.m3u8?v=ctw5ps0e8w00
        dash_url:
          type: string
          description: >-
            Origin-relative path of the MPEG-DASH manifest. Present only when
            packaging_format is `cmaf` (an MPEG-TS tree has no MPD); both
            manifests describe the SAME segments. Deliberately UNVERSIONED and
            NOT immutable: a DASH player expands the manifest's SegmentTemplate
            patterns itself and fetches the segments without a query string, so a
            version here would fence only the manifest. The MPD is revalidated,
            as its segments are.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/cmaf/stream.mpd
        renditions:
          type: array
          description: >-
            The available ladder rungs (tallest first); omitted when none. Always
            omitted on a live session: the media server passes the publisher's
            single bitrate through, so there is no ladder to advertise.
          items:
            $ref: "#/components/schemas/VideoRendition"
        playback_token:
          type: string
          description: >-
            A subject-scoped, session-scoped credential (a secret — do not log),
            present ONLY for a subject that cannot be played without one: a video
            with privacy `password`, or a `private` live stream. Append it as
            `?pt=<playback_token>` (the header-less path Safari native-HLS needs)
            or send it as `Authorization: Bearer <playback_token>`. ABSENT is the
            normal case and is what keeps CDN/presigned delivery reachable — a
            credentialed media request is never cached and never redirected.


            A token is bound to BOTH its subject and its purpose: a video token
            opens no live stream and a live token opens no video. A live token
            additionally stops granting anything the moment the broadcast ends.
        expires_in:
          type: integer
          description: The token lifetime in seconds (21600 = 6 hours). Present only with playback_token.
          example: 21600
        drm:
          allOf:
            - $ref: "#/components/schemas/PlaybackSessionDRM"
          description: >-
            How this video's media is protected and where a license comes from
            (interfaces.md section 10). ABSENT for clear media — which is every
            video on every install, because the packaging step that would encrypt
            media has not landed — so a player that does not know this field
            behaves exactly as before. Never present on a live session: live
            media is not packaged and has nothing to protect.
    PlaybackSessionDRM:
      type: object
      description: >-
        The content-protection block of a playback session. ONE object rather
        than separate protection and license fields, because a player consumes
        them together: a key id with nowhere to redeem it, or a license URL for
        unencrypted media, is not a state a client can act on.
      required: [scheme, key_id]
      properties:
        scheme:
          type: string
          enum: [cenc]
          description: >-
            The ISO Common Encryption scheme the segments are encrypted with.
            `cenc` is full-sample AES-CTR — what Widevine, PlayReady and EME
            ClearKey are all defined against. FairPlay's `cbcs` pattern scheme is
            deliberately absent until something can produce it.
          example: cenc
        key_id:
          type: string
          format: uuid
          description: >-
            The CENC key id (KID). PUBLIC: it is carried in the media itself, in
            the EME `encrypted` event the browser raises, and in the license
            request the player then makes. It names a key; it is not one.
        key_systems:
          type: array
          description: >-
            The EME key systems this asset can be played under, in the provider's
            order of preference. Omitted when the provider distributes keys some
            other way.
          items:
            $ref: "#/components/schemas/PlaybackSessionKeySystem"
    PlaybackSessionKeySystem:
      type: object
      description: One EME key system and the license service behind it.
      required: [key_system, license_url]
      properties:
        key_system:
          type: string
          description: >-
            The EME key system identifier the player passes to
            `navigator.requestMediaKeySystemAccess`.
          example: org.w3.clearkey
        license_url:
          type: string
          description: >-
            Where the player POSTs its license request. ORIGIN-RELATIVE when this
            instance issues the licenses itself (the same convention hls_url and
            dash_url use), absolute when a third-party license service does.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/license/clearkey
    ClearKeyLicenseRequest:
      type: object
      description: >-
        An EME ClearKey license request, exactly as a browser's CDM produces it
        (W3C Encrypted Media Extensions, "License Request Format").
      required: [kids]
      properties:
        kids:
          type: array
          description: >-
            The key ids the CDM is asking for: base64url WITHOUT padding, over
            the raw 16 bytes of each KID. At least one, at most 16. Only key ids
            belonging to this video are answered — a request naming another
            video's KID is 404, never that key.
          items:
            type: string
          example: ["a6uBEJ2t0dGAtADAT9QwyA"]
        type:
          type: string
          description: >-
            The MediaKeySession type the CDM opened. Accepted and ignored: only
            `temporary` is ever valid, and rejecting a request over an echoed
            field would break players for no gain.
          example: temporary
    ClearKeyLicense:
      type: object
      description: >-
        An EME ClearKey license: a JWK set carrying the content keys for the
        requested key ids (W3C Encrypted Media Extensions, "License Format").
        THE BODY IS KEY MATERIAL — it is served `no-store` and must never be
        cached, logged or persisted by anything that handles it.
      required: [keys, type]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ClearKeyJWK"
        type:
          type: string
          enum: [temporary]
          description: >-
            Session-lifetime license: the CDM does not persist the key and it
            dies with the MediaKeySession. `persistent-license` is for offline
            playback, which Vidra does not offer.
          example: temporary
    ClearKeyJWK:
      type: object
      description: >-
        One symmetric key as a JWK (RFC 7517/7518). Both `kid` and `k` are
        base64url WITHOUT padding over the raw 16 bytes — a padded value is
        rejected by browsers' CDMs and is the most common way a hand-written
        ClearKey endpoint fails while looking correct.
      required: [kty, kid, k]
      properties:
        kty:
          type: string
          enum: [oct]
          description: JWK key type — `oct`, a symmetric octet sequence.
          example: oct
        kid:
          type: string
          description: The key id this key answers, base64url-unpadded.
          example: a6uBEJ2t0dGAtADAT9QwyA
        k:
          type: string
          description: >-
            THE CONTENT KEY, base64url-unpadded. A secret handed to an authorised
            player in the clear, which is precisely why ClearKey is a test key
            system and protects nothing. Never log it.
    UnlockVideoRequest:
      type: object
      description: A password to unlock a password-protected video (CORE-17).
      required: [password]
      properties:
        password:
          type: string
          description: The video's password (write-only; never logged or returned).
    UnlockVideoResponse:
      type: object
      description: >-
        A minted playback token for a password-protected video. The token is
        video-scoped, carries no account identity, and is valid for expires_in
        seconds. Present it as `Authorization: Bearer <playback_token>` or as a
        `?pt=<playback_token>` query parameter on the video's read endpoints.
      required: [playback_token, expires_in]
      properties:
        playback_token:
          type: string
          description: The opaque, video-scoped playback token (a secret — do not log).
        expires_in:
          type: integer
          description: The token lifetime in seconds (21600 = 6 hours).
          example: 21600
    VideoPassword:
      type: object
      description: >-
        One video password's public projection. The plaintext and the bcrypt hash
        are write-only and never appear in any response.
      required: [id, created_at]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    VideoPasswords:
      type: object
      description: A video's passwords (id + created_at only).
      required: [passwords]
      properties:
        passwords:
          type: array
          items:
            $ref: "#/components/schemas/VideoPassword"
    SetVideoPasswordRequest:
      type: object
      description: One password to add to a video (6–100 characters).
      required: [password]
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 100
    ReplaceVideoPasswordsRequest:
      type: object
      description: >-
        The whole password set to store (replaces any existing set). 1–20 entries,
        each 6–100 characters.
      required: [passwords]
      properties:
        passwords:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 6
            maxLength: 100
    EmbedPrivacy:
      type: object
      description: >-
        A video's embed-privacy policy (CORE-17). status is the tier;
        allowed_domains lists the permitted hostnames and is present/required only
        for the "whitelist" tier (bare hostnames — no scheme, port, or path; at
        most 50). Enforcement is at the embed page, not the server.
      required: [status]
      properties:
        status:
          type: string
          enum: [enabled, disabled, whitelist]
        allowed_domains:
          type: array
          maxItems: 50
          items:
            type: string
          description: Allow-listed hostnames; present only for the "whitelist" status.
    DailyViews:
      type: object
      description: One day of a stats series (UTC calendar day).
      required: [day, views]
      properties:
        day:
          type: string
          format: date
          example: "2026-07-03"
        views:
          type: integer
          format: int64
    VideoStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        daily_views:
          type: array
          description: Dense 30-day series, oldest first, zero-filled.
          items:
            $ref: "#/components/schemas/DailyViews"
    ChannelStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, followers, videos, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        followers:
          type: integer
          format: int64
        videos:
          type: integer
          format: int64
          description: Total videos on the channel (any privacy/state).
        daily_views:
          type: array
          description: Dense 30-day series aggregated across the channel's videos.
          items:
            $ref: "#/components/schemas/DailyViews"
    AccountStatsResponse:
      type: object
      description: >-
        Owner-only account-level rollup (GET /me/stats): totals summed across
        all owned channels, the aggregated 30-day daily series, and a per-channel
        breakdown.
      required: [totals, daily_views, channels]
      properties:
        totals:
          type: object
          required: [views, likes, dislikes, comments, followers, videos]
          properties:
            views:
              type: integer
              format: int64
            likes:
              type: integer
              format: int64
            dislikes:
              type: integer
              format: int64
            comments:
              type: integer
              format: int64
            followers:
              type: integer
              format: int64
              description: Sum of follower counts across all owned channels.
            videos:
              type: integer
              format: int64
        daily_views:
          type: array
          description: >-
            Dense 30-day series aggregated across every video of every owned
            channel (zero-filled, oldest first, UTC days).
          items:
            $ref: "#/components/schemas/DailyViews"
        channels:
          type: array
          description: Per-channel breakdown, oldest channel first.
          items:
            $ref: "#/components/schemas/AccountChannelStats"
    AccountChannelStats:
      type: object
      description: One owned channel's row in the account stats breakdown.
      required: [id, handle, display_name, views, followers, videos, views_28d]
      properties:
        id:
          type: string
          format: uuid
        handle:
          type: string
          example: ada_makes
        display_name:
          type: string
          example: Ada Makes
        views:
          type: integer
          format: int64
          description: All-time views across the channel's videos.
        followers:
          type: integer
          format: int64
        videos:
          type: integer
          format: int64
        views_28d:
          type: integer
          format: int64
          description: Views over the trailing 28 days.
    VideoDownloadFile:
      type: object
      description: >-
        One downloadable single-file representation: original, progressive
        VP9/WebM, packaged HLS-quality MP4, audio-only M4A, or WebVTT subtitle.
      required: [kind, url, filename, content_type]
      properties:
        kind:
          type: string
          enum: [original, webm, hls, audio, subtitle]
        url:
          type: string
          description: API path serving this attachment.
        video_only_url:
          type: string
          description: HLS rows only; matching quality without the audio stream.
        filename:
          type: string
          description: Safe suggested filename for the browser download.
        content_type:
          type: string
          example: video/mp4
        size_bytes:
          type: integer
          format: int64
          description: Stored size in bytes, omitted when the backend cannot determine it.
        original_name:
          type: string
          description: The upload's original filename (original entries only).
        height:
          type: integer
          description: Pixel height, when known (probed for the original; the rung height for HLS renditions).
          example: 720
        width:
          type: integer
          description: Pixel width, when known.
          example: 1280
        language:
          type: string
          description: BCP-47-ish language tag for subtitle rows.
          example: en
        label:
          type: string
          description: Human label for subtitle rows.
          example: English
    VideoDownloadResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/VideoDownloadFile"
    CreateVideoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private, password]
          description: >-
            Omitted/empty seeds the instance's default_video_privacy setting
            (registry default "public"). "password" is never seeded (a
            password video needs a password first).
        category:
          type: string
          description: Optional subject-category id (see GET /videos/config). Unknown value -> 422.
        language:
          type: string
          description: Optional content language code (see GET /videos/config). Unknown value -> 422.
        license:
          type: string
          description: >-
            Optional content-license id (see GET /videos/config); unknown
            value -> 422. Omitted/empty seeds the instance's
            default_video_licence setting (0 = no default, left unset).
        tags:
          type: array
          description: >-
            Free-form tags. Lowercased, trimmed, and deduped server-side; at
            most 5 distinct tags of at most 50 characters each -> 422 otherwise.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Schedule the publish: after processing, the video parks in the
            "scheduled" state until this time, then publishes automatically.
            Must lie in the future -> 422 otherwise.
        is_sensitive:
          type: boolean
          description: >-
            Mark the video as sensitive content (defaults to false). See the
            Video schema for how the instance policy treats flagged videos.
        sensitive_reason:
          type: string
          maxLength: 280
          description: >-
            Optional creator content-warning text, trimmed and capped at 280
            characters (-> 422 over the cap). Storable regardless of
            is_sensitive; the frontend pairs them.
        comments_policy:
          type: string
          enum: [enabled, disabled]
          description: >-
            Per-video comment policy (config-parity W9). Omitted/empty seeds
            the instance's default_comment_policy setting. PeerTube's
            requires_approval tier is deliberately not supported -> 422.
        download_enabled:
          type: boolean
          description: >-
            Per-video download policy (config-parity W9), layered on the
            instance-wide downloads_enabled gate (both must be on for regular
            viewers). Omitted (null) seeds the instance's
            default_download_enabled setting.
        publish_after_transcode:
          type: boolean
          description: >-
            Opt into publish-after-transcode (default false). When true, the
            video is held (state "transcoding") off every public surface until
            its HLS transcode completes, then publishes automatically. Ignored
            when transcoding is disabled/unavailable (the video publishes
            immediately) and when publish_at is set (time-gating takes
            precedence).
    UpdateVideoRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private, password]
        category:
          type: string
          description: Set the subject-category id (see GET /videos/config). Unknown/empty value -> 422.
        language:
          type: string
          description: Set the content language code (see GET /videos/config). Unknown/empty value -> 422.
        license:
          type: string
          description: Set the content-license id (see GET /videos/config). Unknown/empty value -> 422.
        tags:
          type: array
          description: >-
            Replaces the video's whole tag set (an empty array clears it; omit
            the field to leave tags unchanged). Same limits as create.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Set (or move) the scheduled publish time. Only accepted while the
            video is not yet published, and must lie in the future -> 422
            otherwise.
        originally_published_at:
          type: string
          format: date-time
          description: >-
            Set when the video was first published elsewhere (omit to leave
            unchanged; it cannot be cleared back to unset). Unlike publish_at
            it schedules nothing, is accepted at any state, and is normally in
            the past.
        is_sensitive:
          type: boolean
          description: Set or clear the sensitive-content flag (omit to leave unchanged).
        sensitive_reason:
          type: string
          maxLength: 280
          description: >-
            Set the creator content-warning text (omit to leave unchanged; an
            empty string clears it). Trimmed and capped at 280 characters ->
            422 over the cap.
        comments_policy:
          type: string
          enum: [enabled, disabled]
          description: >-
            Set the per-video comment policy (omit to leave unchanged).
            "disabled" makes new comments answer 403 feature_disabled while
            reading existing comments stays open.
        download_enabled:
          type: boolean
          description: >-
            Set the per-video download policy (omit to leave unchanged),
            layered on the instance-wide downloads_enabled gate.
        publish_after_transcode:
          type: boolean
          description: >-
            Set the publish-after-transcode opt-in (omit to leave unchanged).
            Setting it true on an already-published video that has never been
            publicly visible and still has a live transcode job holds the video
            (state "transcoding") until that transcode completes; a
            publicly-visible video is never pulled back to hidden.
    Caption:
      type: object
      description: A WebVTT caption track's metadata (the file is fetched separately).
      required: [language, label, created_at]
      properties:
        language:
          type: string
          description: BCP-47-ish language tag (e.g. en, pt-BR).
        label:
          type: string
        created_at:
          type: string
          format: date-time
    CaptionListResponse:
      type: object
      required: [captions]
      properties:
        captions:
          type: array
          items:
            $ref: "#/components/schemas/Caption"
    Comment:
      type: object
      required: [id, video_id, body, parent_id, author_id, author_username, author_display_name, remote, created_at, updated_at, edited, deleted, pinned, hearted]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        body:
          type: string
        parent_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The id of the comment this one replies to, or null for a top-level
            comment. The client uses it to build the thread tree.
        author_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The comment author's account id (so a signed-in viewer can mute
            them) — null for a federated (remote-authored) comment.
        author_username:
          type: string
          description: >-
            The local author's username, or — for a remote comment — the remote
            author-name snapshot captured at ingestion.
        author_display_name:
          type: string
        remote:
          type: boolean
          description: True for a federated comment authored on another instance.
        author_domain:
          type: string
          description: The remote author's origin instance; omitted for local comments.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited:
          type: boolean
          description: True once the comment has been edited (updated_at moved past created_at).
        deleted:
          type: boolean
          description: >-
            True for a tombstoned comment: its author's account was
            permanently deleted, the stored body was erased, and body renders
            as "[deleted]" while the reply thread stays intact.
        pinned:
          type: boolean
          description: >-
            True when this comment is its video's creator-pinned comment.
            At most one top-level comment per video is pinned, and the list
            returns it first.
        hearted:
          type: boolean
          description: >-
            True when the video's creator has hearted this comment (a like
            from the uploader).
    CommentListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [comments]
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000
          description: The new comment text.
    MutedAccount:
      type: object
      description: An account the caller has muted, with its display identity.
      required: [user_id, username, display_name, muted_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedAccountListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [accounts]
          properties:
            accounts:
              type: array
              items:
                $ref: "#/components/schemas/MutedAccount"
    MutedInstance:
      type: object
      required: [domain, muted_at]
      properties:
        domain:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedInstanceListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [instances]
          properties:
            instances:
              type: array
              items:
                $ref: "#/components/schemas/MutedInstance"
    BlockInstanceRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: Bare hostname (optionally host:port) of the instance to block.
        reason:
          type: string
          maxLength: 2000
          description: Recorded on the blocklist and in the audit trail. May be empty.
    BlockedInstance:
      type: object
      required: [domain, reason, blocked_at]
      properties:
        domain:
          type: string
        reason:
          type: string
        blocked_by:
          type: string
          format: uuid
          description: The admin who blocked it. Omitted if that account was deleted.
        blocked_at:
          type: string
          format: date-time
    BlockedInstanceListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [instances]
          properties:
            instances:
              type: array
              items:
                $ref: "#/components/schemas/BlockedInstance"
    RemoteVideo:
      type: object
      required: [id, remote, domain, title, description, object_url, watch_url, has_thumbnail]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: Always true. Distinguishes remote cards from local videos.
        domain:
          type: string
          description: The origin instance's domain.
        title:
          type: string
        description:
          type: string
        object_url:
          type: string
          description: The ActivityPub object id on the origin.
        watch_url:
          type: string
          description: The origin's human watch page.
        stream_url:
          type: string
          description: >-
            Best playable URL from the origin (HLS preferred, else direct
            video file). Omitted when the origin advertised none.
        duration_seconds:
          type: integer
        published_at:
          type: string
          format: date-time
        has_thumbnail:
          type: boolean
          description: Whether a locally cached thumbnail is available.
    ATProtoLinkRequest:
      type: object
      required: [handle, app_password]
      description: >-
        Credentials for linking a Bluesky account. app_password must be a
        Bluesky APP PASSWORD (Settings → App Passwords), never the account's
        main password — the backend never returns it.
      properties:
        handle:
          type: string
          maxLength: 253
          description: The Bluesky handle, e.g. "alice.bsky.social" (leading @ tolerated).
          example: alice.bsky.social
        app_password:
          type: string
          description: A Bluesky app password (write-only; never returned).
          example: xxxx-xxxx-xxxx-xxxx
        pds_url:
          type: string
          maxLength: 2000
          description: >-
            Optional PDS base URL; defaults to https://bsky.social. Must be an
            https, public origin.
          example: https://bsky.social
        auto_post:
          type: boolean
          default: false
          description: >-
            When true, newly published PUBLIC videos owned by the caller are
            announced on Bluesky.
    ATProtoStatus:
      type: object
      required: [handle, did, pds_url, auto_post, created_at]
      description: >-
        The caller's linked Bluesky account. Deliberately excludes the app
        password (sealed or raw) — it is never exposed.
      properties:
        handle:
          type: string
          description: The linked Bluesky handle (as resolved by the PDS).
          example: alice.bsky.social
        did:
          type: string
          description: The resolved decentralized identifier.
          example: did:plc:abc123
        pds_url:
          type: string
          description: The PDS the account is hosted on.
          example: https://bsky.social
        auto_post:
          type: boolean
          description: Whether newly published public videos are auto-announced.
        created_at:
          type: string
          format: date-time
        last_posted_at:
          type: string
          format: date-time
          description: When the last successful auto-post was made (absent if never).
    CreateRemoteFollowRequest:
      type: object
      description: >-
        Names the remote channel to follow — exactly one of handle or
        actor_url.
      properties:
        handle:
          type: string
          maxLength: 2000
          description: The remote channel's WebFinger handle, "name@domain" (leading @ tolerated).
          example: films@videos.example
        actor_url:
          type: string
          maxLength: 2000
          description: The remote channel's ActivityPub actor URL.
          example: https://videos.example/video-channels/films
    RemoteFollow:
      type: object
      required: [id, actor_url, handle, domain, state, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The follow row id (the DELETE /me/remote-follows/{id} key).
        actor_url:
          type: string
          description: The followed remote channel's ActivityPub actor URL.
        handle:
          type: string
          description: The followed channel's "name@domain" identity.
          example: films@videos.example
        domain:
          type: string
          description: The origin instance's domain.
        state:
          type: string
          enum: [pending, accepted]
          description: >-
            pending until the remote instance Accepts the follow, then
            accepted (only accepted follows feed the subscriptions feed and
            the ingestion gate). A remote Reject removes the follow.
        created_at:
          type: string
          format: date-time
    RemoteFollowListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [follows]
          properties:
            follows:
              type: array
              items:
                $ref: "#/components/schemas/RemoteFollow"
    BlockedUser:
      type: object
      required: [user_id, username, display_name, blocked_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        blocked_at:
          type: string
          format: date-time
    BlockedUserListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [users]
          properties:
            users:
              type: array
              items:
                $ref: "#/components/schemas/BlockedUser"
    VideoRating:
      type: object
      required: [like_count, dislike_count, my_rating]
      properties:
        like_count:
          type: integer
          format: int64
        dislike_count:
          type: integer
          format: int64
        my_rating:
          type: [string, "null"]
          enum: [like, dislike, null]
          description: The caller's own rating, or null when anonymous or unrated.
    VideoListResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [videos]
          properties:
            videos:
              type: array
              items:
                $ref: "#/components/schemas/Video"
    VideoConfigOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: >-
            Stable identifier persisted on a video (or used to validate input) —
            not display text. Numeric for categories/licenses, ISO 639-1 for
            languages, the privacy value for privacies.
          example: "1"
        label:
          type: string
          description: Human-readable display label.
          example: Music
    VideoConfigResponse:
      type: object
      required: [categories, licenses, languages, privacies]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        privacies:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
    VideoFeedResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [videos, sort]
          properties:
            videos:
              type: array
              items:
                $ref: "#/components/schemas/Video"
            sort:
              type: string
              enum: [recent, popular, trending]
              description: The ordering actually applied (normalised from the request).
            scope:
              type: string
              enum: [local, all]
              description: >-
                The feed scope actually applied (normalised from the request);
                present on the public feed only. "all" mixes federated remote
                videos (remote:true cards) into the feed.
    VideoSearchResponse:
      allOf:
        - $ref: "#/components/schemas/PageMeta"
        - type: object
          required: [query, videos]
          properties:
            query:
              type: string
              example: go concurrency
            videos:
              type: array
              items:
                $ref: "#/components/schemas/Video"
            remote:
              type: array
              description: >-
                Remote-URI search hits (config-parity W13). Present only on the
                first page (offset 0) when the query was URI/handle-shaped, the
                caller's auth-state gate (search_remote_uri_users /
                search_remote_uri_anonymous) allowed resolution, AND the target
                resolved within the strict deadline; omitted otherwise —
                unresolvable/timeout/rate-limited resolution degrades silently to
                local-only results.
              items:
                $ref: "#/components/schemas/RemoteSearchResult"
            search_total:
              type: integer
              format: int64
              minimum: 0
              description: >-
                The search service's own hit count — the size of the set its
                ranker worked over. NOT the same number as `total`: `total`
                stays core's per-viewer count of matches this caller could
                actually be shown (the index holds static eligibility and knows
                nothing about this viewer's mutes, blocks, or unlisted owners),
                and it is the number to render as "N results".

                ABSENT MEANS UNKNOWN, never zero. It is omitted whenever the
                local SQL backend served the request, and omitted by a deployed
                search service released before it reported the field.
            total_is_lower_bound:
              type: boolean
              description: >-
                True when the search service stopped looking rather than
                reaching the end: its ranker recalls a capped window, so on a
                large corpus search_total is a FLOOR and paging will run out
                before `total` is reached. Render the count as "top N" rather
                than "N" when this is true. Omitted — meaning unknown, not false
                — on the local SQL path and from a search service that predates
                the field.
            has_more:
              type: boolean
              description: >-
                Whether a further page from the search service would return at
                least one result. Exact whenever present, and computed
                independently of the totals, so this is the field to drive
                "fetch another page". Omitted — meaning unknown, not false — on
                the local SQL path and from a search service that predates the
                field; a client seeing it absent should fall back to comparing
                offset + page length against `total`.
    RecommendationsResponse:
      type: object
      required: [items, personalized, source]
      description: >-
        A recommendation rail (search-service W4). items are video cards, each
        with an added `reason`; personalized reflects whether personalization
        was applied; source is "search" (ranked by vidra-search) or "fallback"
        (server-side trending / related heuristic).
      properties:
        items:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Video"
              - type: object
                properties:
                  reason:
                    type: string
                    description: subscribed | trending | co_watch | similar | fresh | popular | related
        personalized:
          type: boolean
        source:
          type: string
          enum: [search, fallback]
    RemoteSearchResult:
      type: object
      required: [type]
      description: >-
        One typed remote hit resolved from a URI/handle-shaped search query
        (config-parity W13): a remote video (same projection as
        GET /api/v1/remote-videos/{id}) or a remote channel/account identity.
        Exactly one of video/actor is present, matching type.
      properties:
        type:
          type: string
          enum: [video, channel, account]
          description: >-
            video = a resolved remote Video object (ingested + cached);
            channel = a Group actor; account = a Person (or other non-Group)
            actor.
        video:
          $ref: "#/components/schemas/RemoteVideo"
        actor:
          $ref: "#/components/schemas/RemoteSearchActor"
    RemoteSearchActor:
      type: object
      required: [actor_url, handle, domain]
      description: >-
        A resolved remote channel/account: the followable identity —
        POST /api/v1/me/remote-follows accepts either the handle or the
        actor URL.
      properties:
        actor_url:
          type: string
          description: The ActivityPub actor URL on the origin.
        handle:
          type: string
          description: The name@domain identity.
          example: movies@tube.example
        domain:
          type: string
          description: The origin instance's domain.
    WatchProgressRequest:
