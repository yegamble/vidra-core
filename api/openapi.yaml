  /api/v1/videos/{id}/hls/master.m3u8:
    get:
      operationId: getVideoHLSMaster
      summary: Get a video's HLS master playlist
      description: >-
        Returns the HLS master playlist for a transcoded video. Variant URIs are
        relative ("720p/playlist.m3u8"), resolving to GET
        /videos/{id}/hls/{rendition}/{file}. Visibility mirrors /original
        (private → owner only, else 404). 404 until the transcode pipeline has
        marked the video's streaming playlist ready — the detail response's
        hls_url field tells clients when it exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The master playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: >-
            No such video (or private and not yours), or its streaming playlist
            is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/hls/{rendition}/{file}:
    get:
      operationId: getVideoHLSFile
      summary: Get an HLS rendition playlist or segment
      description: >-
        Serves one file of a transcoded HLS rendition: its variant playlist
        (file = "playlist.m3u8", served as application/vnd.apple.mpegurl) or one
        MPEG-TS segment (file = "seg_00000.ts", served as video/mp2t). Rendition
        directories are named by rung height ("720p"). Same visibility and
        readiness rules as the master playlist; names outside the transcoder's
        fixed naming are 404.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: rendition
          in: path
          required: true
          description: The rendition directory, e.g. "720p".
          schema:
            type: string
            pattern: '^[0-9]{2,4}p$'
        - name: file
          in: path
          required: true
          description: '"playlist.m3u8" or a segment such as "seg_00000.ts".'
          schema:
            type: string
            pattern: '^(playlist\.m3u8|seg_[0-9]+\.ts)$'
      responses:
        "200":
          description: The rendition playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            No such video (or private and not yours), playlist not ready, or no
            such rendition file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/thumbnail:
    get:
      operationId: getVideoThumbnail
      summary: Get a video's poster image
      description: >-
        Returns the generated JPEG poster for the video. Same visibility as the
        detail endpoint (private → owner only, else 404). A video without a
        generated thumbnail is 404 — the detail response's has_thumbnail flag
        tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The poster image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or private and not yours), or no thumbnail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setVideoThumbnail
      summary: Set a video's poster image
      description: >-
        Sets a video's poster (owner only). Dispatches on Content-Type. With
        multipart/form-data it uploads a creator-supplied image as a single "file"
        part (accepted types JPEG/PNG/WebP by extension; otherwise 415; the served
        Content-Type is derived from the extension). With application/json body
        {at_seconds} it picks the poster from the exact frame at that timestamp of
        the video's processed original, extracted server-side with ffmpeg and stored
        as JPEG (UPLOAD-04 frame-pick). Either variant replaces any previous or
        auto-generated thumbnail and does not change the video's state. A non-owner
        or unknown id is 404. The multipart upload is bounded by the global HTTP
        body limit. Frame-pick specific: 409 while the video has no processed
        original yet, 422 when at_seconds is outside [0, duration), 503 when the
        server has no ffmpeg-backed frame extractor configured.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The poster image (JPEG/PNG/WebP).
          application/json:
            schema:
              type: object
              required: [at_seconds]
              properties:
                at_seconds:
                  type: number
                  format: double
                  minimum: 0
                  description: >-
                    The timestamp (seconds, fractional allowed) of the frame to
                    extract from the processed original. Must be in [0, duration).
      responses:
        "201":
          description: The thumbnail was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFile"
        "400":
          description: The multipart "file" field is missing, or the JSON body is malformed / missing at_seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Frame-pick requested before the video has a processed original.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: at_seconds is outside the video duration [0, duration).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Server-side frame extraction is not available (no ffmpeg-backed extractor).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/storyboard.jpg:
    get:
      operationId: getVideoStoryboardImage
      summary: Get a video's storyboard sprite sheet
      description: >-
        Returns the seek-preview storyboard sprite sheet (a JPEG grid of small
        poster tiles) for the video. Paired with the WebVTT map at
        storyboard.vtt, which references this image. Same visibility as the
        detail endpoint (private → owner only, blocked → moderators only, else
        404). A video without a generated storyboard is 404 — the detail
        response's has_storyboard flag tells clients whether one exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The storyboard sprite sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or not visible), or no storyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/storyboard.vtt:
    get:
      operationId: getVideoStoryboardVtt
      summary: Get a video's storyboard WebVTT map
      description: >-
        Returns the WebVTT sprite map for the video's storyboard: one cue per
        time range pointing at a #xywh region of the sprite sheet (served at
        storyboard.jpg, referenced relatively). Same visibility as the sprite
        sheet; absent → 404.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The storyboard WebVTT map.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: No such video (or not visible), or no storyboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/chapters:
    get:
      operationId: getVideoChapters
      summary: Get a video's chapters
      description: >-
        Returns the video's seek-bar chapters in playback order (ascending
        start_seconds), or an empty array when there are none. Same visibility as
        the detail endpoint (private → owner only, blocked → moderators only,
        else 404). The detail response's has_chapters flag tells clients whether
        any exist before fetching.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's chapters (ascending; empty when none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChapters"
        "404":
          description: No such video, or it is not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setVideoChapters
      summary: Replace a video's chapters
      description: >-
        Replaces the video's whole chapter set atomically (owner only); an empty
        array clears all chapters. There is no per-row endpoint. A non-owner or
        unknown id is 404 so a private video's existence is not leaked. The set is
        validated in full before any write, so a rejected request leaves the
        stored chapters untouched. Validation (400): start_seconds must be >= 0
        and strictly increasing (so unique); each start_seconds must be less than
        the probed duration when one was recorded; each title is 1–120 characters
        after trimming; at most 100 chapters.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVideoChaptersRequest"
      responses:
        "200":
          description: The stored chapters (ascending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChapters"
        "400":
          description: >-
            A malformed body, or a chapters-validation violation (bad ordering,
            an out-of-bounds start, a bad title length, or more than 100 chapters).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/unlock:
    post:
      operationId: unlockVideo
      summary: Unlock a password-protected video
      description: >-
        Verifies a submitted password against a password-protected video's stored
        passwords (CORE-17) and, on success, mints a short-lived, video-scoped
        playback token. The token carries no account identity, is valid for 6
        hours, and unlocks ONLY this video's read endpoints, presented either as
        `Authorization: Bearer <playback_token>` or as a `?pt=<playback_token>`
        query parameter (the header-less path for Safari native-HLS and
        progressive playback). Optional auth. Rate-limited under the same strict
        budget as login. The password and the token are never logged.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockVideoRequest"
      responses:
        "200":
          description: The password was correct; a playback token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockVideoResponse"
        "401":
          description: Incorrect password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or the video is not password protected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many unlock attempts (rate limited).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/passwords:
    get:
      operationId: listVideoPasswords
      summary: List a video's passwords
