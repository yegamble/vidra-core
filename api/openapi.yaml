  /api/v1/ipfs/status:
    get:
      operationId: getIPFSStatus
      summary: IPFS mirror status (admin)
      description: >-
        Reports the hybrid IPFS media mirror's status (fix_plan P19,
        .ralph/specs/ipfs-media.md): whether it is enabled, node reachability, the
        public gateway URL in use, whether an IPFS Cluster is configured, and pin
        counts overall and per media class. IPFS is a MIRROR SIDECAR — local/S3
        stays authoritative — so this never reflects on the readiness of media
        serving. Returns 503 ipfs_disabled when IPFS_ENABLED=false. Restricted to
        admins. (Status aggregation is delivered in P19.2; until then an enabled
        instance answers 501 not_implemented.)
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The mirror status.
          content:
            application/json:
              schema:
