    NotificationPrefsResponse:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Every known notification type mapped to whether it is delivered to
            this user. Types with no stored preference default to true.
          additionalProperties:
            type: boolean
          example: { caption_ready: true, comment: true, follow: false, message: true, new_report: true, new_video: true, report_resolved: true, video_rejected: true }
    UpdateNotificationPrefsRequest:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Partial map of notification type -> enabled. Only the types present
            are changed. Known types: caption_ready, comment, follow, message,
            new_report, new_video, report_resolved, video_rejected. An unknown
            type rejects the whole update (422).
          additionalProperties:
            type: boolean
          minProperties: 1
          example: { follow: false }
    PlayerSettings:
      type: object
      description: >-
        A signed-in user's effective player defaults (PLAY-07). Every field is
        always present. video_card_previews_enabled is resolved from the current
        instance default until the user explicitly chooses true or false.
      required: [autoplay_next, default_speed, default_quality, captions_default,
                 theater_default, video_card_previews_enabled]
      properties:
        autoplay_next:
          type: boolean
          description: Whether the next video autoplays when the current one ends.
          example: true
        default_speed:
          type: number
          description: >-
            Default playback speed. One of the shared playback rates: 0.25, 0.5,
            0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4.
          example: 1
        default_quality:
          type: string
          description: >-
            Default quality: "auto" (adaptive) or a rendition height like "720p"
            (^[0-9]{2,4}p$, same shape as the HLS rendition path segment).
          example: auto
        captions_default:
          type: boolean
          description: Whether captions are on by default when a track exists.
          example: false
        theater_default:
          type: boolean
          description: Whether the player opens in theater mode by default.
          example: false
        video_card_previews_enabled:
          type: boolean
          description: >-
            The signed-in user's effective video-card hover-preview preference.
            Until the user explicitly chooses, it follows GET /instance
            features.video_card_previews_default_enabled; an explicit true or
            false is durable across later admin-default changes. This preference
            only permits playback while features.video_card_previews is true.
          example: false
    UpdatePlayerSettingsRequest:
      type: object
      description: >-
        Merge-update body: every field is optional. An omitted field keeps its
        stored value (or the default, for a user who never saved); a supplied
        field replaces it. At least one field is normally sent, but an empty body
        is accepted as a no-op that returns the current effective settings.
        Omitting video_card_previews_enabled does not turn an inherited value
        into an explicit choice.
      properties:
        autoplay_next:
          type: boolean
          example: false
        default_speed:
          type: number
          description: >-
            One of the shared playback rates (0.25, 0.5, 0.75, 1, 1.25, 1.5,
            1.75, 2, 2.5, 3, 3.5, 4); any other value is 400.
          example: 1.5
        default_quality:
          type: string
          description: '"auto" or a rendition height like "720p"; any other value is 400.'
          example: 1080p
        captions_default:
          type: boolean
          example: true
        theater_default:
          type: boolean
          example: true
        video_card_previews_enabled:
          type: boolean
          description: >-
            Explicitly enable or disable the caller's video-card hover-preview
            preference, overriding the instance default. The preference only
            takes effect while the instance feature gate is enabled.
          example: true
