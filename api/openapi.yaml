  /api/v1/me/blocks/{id}:
    post:
      operationId: blockUser
      summary: Block an account
      description: >-
        Blocks another account: direct messaging between the two is cut off in
        both directions, and the blocked account's content is hidden from the
        blocker — their videos leave the blocker's feed, search, and
        subscriptions, and their comments are filtered from comment lists
        (per-viewer, exactly like mutes; other viewers are unaffected).
        Requires authentication. Idempotent. Blocking yourself is 422; an
        unknown target account is 404.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account is blocked.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Cannot block yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unblockUser
      summary: Unblock an account
      description: >-
        Lifts the caller's block of another account, restoring direct messaging
        and the blocked account's content (videos in feed/search/subscriptions,
        comments). Requires authentication. Idempotent (unblocking a
        not-blocked account still succeeds).
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account is not blocked (it was unblocked, or already was).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/live:
    post:
      operationId: createLiveStream
      summary: Create a live stream
      description: >-
        Creates a live stream for a channel the caller owns and returns it plus
        the stream key (shown ONCE — only its hash is stored) and the RTMP ingest
        URL. Behind auth; a non-owner is 403, an unknown channel 404. RTMP
        ingestion / HLS output is a later integration boundary — the stream starts
        in state "offline".
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLiveStreamRequest"
      responses:
        "201":
          description: The created live stream, its stream key (once), and RTMP URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLiveStreamResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: You do not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listLiveStreams
      summary: List a channel's live streams
      description: >-
        Lists the caller's live streams for a channel they own, newest first.
        Behind auth; a non-owner is 403, an unknown channel 404. Stream keys are
        never included.


        BREAKING (this release): paginated, with a `total`.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: The channel's live streams (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: You do not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live:
    get:
      operationId: listLivePublicStreams
      summary: Public "Live now" listing
      description: >-
        Lists the currently-live PUBLIC streams across all channels for a home
        "Live now" rail, most-recently-started first. Only streams that are both
        state=live AND privacy=public appear — unlisted/private and
        offline/ended streams are never listed. Each card carries id, title,
        channel identity, started_at (the current session's start), an is_live
        flag (always true here — this is the card contract that can cheaply and
        truthfully carry it; the video feed card intentionally does not, since
        live streams are a table disjoint from videos), and, when a media server
        is configured, the live HLS playlist path. Stream keys are never
        returned. There is deliberately NO viewer/concurrent-viewer count: no
        server-side counter exists yet (a live-completion dependency, wave W4),
        and the field is omitted rather than faked. A thumbnail/preview is
        likewise omitted — live streams have no server-generated poster yet.
        This is a public read and, like GET /live/{id}, is not gated on the live
        feature toggle (that guards creation/ingest). Paginated with limit
        (1–100, default 30) and offset (>= 0).
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: The currently-live public streams (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivePublicListResponse"
  /api/v1/live/{id}:
    get:
      operationId: getLiveStream
      summary: Get a live stream's metadata
      description: >-
        Returns a live stream's public metadata. A private stream is visible only
        to its channel owner (else 404, so its existence is not leaked). The stream
        key is never returned.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The live stream metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStream"
        "404":
          description: No such live stream (or private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLiveStream
      summary: Edit a live stream
      description: >-
        Edits a live stream the caller owns (title, description, privacy,
        permanent, replay_enabled). Behind auth; a non-owner or unknown id is 404
        (existence is not leaked). Never rotates the stream key or changes the
        live state.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLiveStreamRequest"
      responses:
        "200":
          description: The updated live stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStream"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (title/privacy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLiveStream
      summary: Delete a live stream
      description: >-
        Deletes a live stream the caller owns. Behind auth; a non-owner or unknown
        id is 404 (existence is not leaked). Idempotent for the owner.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The live stream is deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/key:
    post:
      operationId: regenerateLiveStreamKey
      summary: Regenerate a live stream's key
      description: >-
        Rotates the stream key and returns the new one (shown ONCE). Behind auth; a
        non-owner or unknown id is 404. Use this if a key leaks.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new stream key (once) and RTMP URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamKey"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/playback-session:
    post:
      operationId: createLivePlaybackSession
      summary: Open a playback session for a live stream
      description: >-
        The live half of the playback session model — the one call a player makes
        before it plays a live stream, answering with the SAME session object as
        POST /videos/{id}/playback-session. It carries `live_stream_id` instead of
        `video_id`, `packaging_format` `hls-ts`, the live `hls_url`, and — only
        for a PRIVATE stream — a playback token.


        Authorization is IDENTICAL to the live media routes (GET
        /live/{id}/hls/master.m3u8), because it is the same code: 404 when live
        HLS serving is not configured, when there is no such stream, when the
        stream is private and the caller is neither its owner nor holding a valid
        live token, and when the stream is not currently live. There is no 401
        equivalent of the video password prompt — live has no password tier.


        Unlike the video session, a stream that is not live is 404 rather than 200
        with no URLs: a video with no transcode still plays progressively, whereas
        an offline stream has nothing to play by any route, so a 200 would
        advertise an hls_url that 404s.


        The token is CONDITIONAL BY DESIGN, exactly as it is for videos: it is
        minted only for the `private` tier, which is the only one that cannot be
        watched without a credential. Public and unlisted streams get no token,
        because any request carrying `?pt=` is treated as credentialed and is then
        never cached and never redirected.


        The token is scoped to this stream and to live playback specifically (it
        opens no video), and it is bounded twice: by `expires_in`, and by the
        live-state check every live media request still passes — so ENDING THE
        BROADCAST revokes every token outstanding against it.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "404":
          description: >-
            No such/visible live stream, not currently live, or live HLS serving
            is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/hls/master.m3u8:
    get:
      operationId: getLiveHLSMaster
      summary: Get a live stream's HLS playlist
      description: >-
        Serves a live stream's HLS playlist while it is live. The media server
        writes segments into LIVE_HLS_ROOT keyed by stream ID; the api serves them
        gated by the stream's privacy (private → owner, or the bearer of a live
        playback token from POST /live/{id}/playback-session) and state (only while
        live). 404 when LIVE_HLS_ROOT is not configured, the stream is not live, or
        it is private and you have neither claim — the get response's hls_url tells
        clients when a live playlist exists.


        A `?pt=<playback_token>` on this request is propagated INTO the playlist:
        the relative segment URIs are rewritten to carry it, because a relative URI
        resolves against the playlist URL without inheriting its query string (RFC
        3986 §5.2.2), and Safari's native HLS player — which cannot set an
        Authorization header — has no other way to keep the credential.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The live HLS playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: >-
            No such/visible live stream, not currently live, or live HLS serving
            is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/hls/{file}:
    get:
      operationId: getLiveHLSFile
      summary: Get a live HLS playlist or segment
      description: >-
        Serves one live HLS file: the media playlist ("<id>.m3u8", served as
        application/vnd.apple.mpegurl) or a numbered MPEG-TS segment
        ("<id>-<n>.ts", served as video/mp2t). Names outside that id-scoped shape
        are 404. Same privacy/state gate as the master playlist, and the same
        `?pt=<playback_token>` credential — which is how a player reaches a private
        stream's segments, since the playlist it followed rewrote the token onto
        every segment URI.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: file
          in: path
          required: true
          description: '"<id>.m3u8" or a segment such as "<id>-0.ts".'
          schema:
            type: string
      responses:
        "200":
          description: The live playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            No such/visible live stream, not currently live, no such file, or live
            HLS serving is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/ingest/start:
    post:
      operationId: liveIngestStart
      summary: Live ingest "on-publish" hook (media-server-facing)
      description: >-
        The RTMP ingest boundary calls this when a publisher connects, presenting
        the publisher's stream key; the matching stream is flipped to "live" (allow
        the publish). Authenticated by the X-Ingest-Secret shared secret, NOT a
        user token. Accepts either a JSON {stream_key} body (curl/harness) or the
        nginx-rtmp `name` form field. For the nginx-rtmp form callback the response
        is a 302 redirect whose last path segment is the stream ID, renaming the
        RTMP session so HLS segments and the recording are keyed by the ID and the
        raw key never lands on disk. Returns 404 when LIVE_INGEST_SECRET is not
        configured (disabled), 401 on a bad secret, 404 when no stream matches,
        and 403 when a simultaneous-live cap (live_max_instance_lives /
        live_max_user_lives, config-parity W11) refuses the publish — any
        non-2xx/3xx answer makes nginx-rtmp deny the session.
      tags: [live]
      parameters:
        - name: X-Ingest-Secret
          in: header
          required: true
          description: The LIVE_INGEST_SECRET shared secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestRequest"
      responses:
        "200":
          description: The stream is now live (JSON caller).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    type: string
        "302":
          description: >-
            The stream is now live; nginx-rtmp form callers are redirected to
            rename the session to the stream ID (Location's last path segment).
        "400":
          description: Missing stream_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid ingest secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            A simultaneous-live cap refused the publish (live_max_instance_lives
            or live_max_user_lives reached). nginx-rtmp denies the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ingest not enabled, or no stream matches the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/ingest/stop:
    post:
      operationId: liveIngestStop
      summary: Live ingest "on-publish-done" hook (media-server-facing)
      description: >-
        Called by the RTMP ingest boundary when a publish session ends: the stream
        identified by the key (harness/pre-rename) or by the stream ID (media
        server, post-rename) returns to "offline" (permanent) or "ended"
        (one-shot). Accepts a JSON {stream_key} body or the nginx-rtmp `name` form
        field. When the stream has replay enabled, its recorded session is
        republished as a normal on-demand video best-effort in the background
        (never blocking or failing this hook). Same X-Ingest-Secret auth as start.
      tags: [live]
      parameters:
        - name: X-Ingest-Secret
          in: header
          required: true
          description: The LIVE_INGEST_SECRET shared secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestRequest"
      responses:
        "204":
          description: The stream's live state was updated.
        "400":
          description: Missing stream_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid ingest secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ingest not enabled, or no stream matches the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations:
    post:
      operationId: startConversation
      summary: Start (or get) a direct conversation
      description: >-
        Returns the 1:1 conversation with the recipient, creating it if it does
        not exist (idempotent). Behind auth. Messaging yourself is 422; an unknown
        recipient is 404. Pass {encrypted: true} to start the pair's ENCRYPTED
        conversation instead — a distinct thread whose type is immutable and
        which stores only opaque per-device ciphertext envelopes (see the E2EE
        endpoints; the server holds no keys and cannot decrypt).
      tags: [messaging]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
      responses:
        "201":
          description: The conversation (existing or newly created).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and the recipient (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or an attempt to message yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/conversations:
    get:
      operationId: listConversations
      summary: List my conversations
      description: >-
        Returns the caller's conversations, most-recently-active first, each with
        the other participant and a last-message preview. Behind auth. Paginated
        via limit (1–100, default 20) and offset.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of conversations (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List messages in a conversation
      description: >-
        Returns a conversation's messages, newest first. Behind auth. A
        non-participant (or unknown conversation) is 404 so a conversation's
        existence is not leaked. Paginated via limit (1–100, default 20)/offset,
        or via the before_id keyset cursor for stable upward history paging. On an
        ENCRYPTED conversation the response is an EncryptedMessageListResponse
        instead, containing ONLY the envelopes addressed to the caller's own
        devices (expired disappearing messages filtered); encrypted threads page
        identically, including before_id.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: before_id
          in: query
          description: >-
            Return only messages strictly older than this message (keyset cursor;
            pair with limit for stable history paging that does not shift as new
            messages arrive). Mutually exclusive with offset — providing both is a
            422. An unknown id, or a message outside this conversation, is a 422.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >-
            A page of messages (possibly empty). Plaintext conversations return
            MessageListResponse; encrypted ones EncryptedMessageListResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MessageListResponse"
                  - $ref: "#/components/schemas/EncryptedMessageListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: before_id combined with offset, or a before_id that is unknown or outside this conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendMessage
      summary: Send a message
      description: >-
        Posts a message to a conversation. Behind auth. A non-participant (or
        unknown conversation) is 404. The valid body shape is fixed by the
        conversation's immutable type: plaintext conversations take
        SendMessageRequest ({body}); ENCRYPTED conversations take
        SendEncryptedMessageRequest (per-recipient-device ciphertext envelopes,
        optionally with a disappearing-message timer). The wrong shape for the
        conversation type is 422 in both directions.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SendMessageRequest"
                - $ref: "#/components/schemas/SendEncryptedMessageRequest"
      responses:
        "201":
          description: >-
            The message was sent. Plaintext sends return the Message; encrypted
            sends a SendEncryptedResponse summary (envelopes are not echoed).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/SendEncryptedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and the other participant (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{id}/attachments:
    post:
      operationId: uploadDMAttachment
      summary: Upload a direct-message attachment
      description: >-
        Stores an attachment (multipart field "file") for a plaintext
        conversation the caller participates in and returns an id to reference in
        a subsequent send (send accepts up to 30 own-uploaded attachment_ids).
        Behind auth. Facebook-Messenger-parity platform limits (DM attachments do
        NOT count against the storage quota): allowed kinds image, video, audio,
        pdf, and doc (office documents — application/msword, the OOXML Word/
        PowerPoint/Excel types, application/vnd.ms-powerpoint, and
        application/vnd.ms-excel); capped at 100 MiB (104,857,600 bytes);
        malware-scanned fail-closed when scanning is enabled (load-bearing for the
        macro-carrying office formats — the scan runs before the attachment
        becomes linkable). This route is additionally rate limited per user (the
        no-quota compensating control). Non-participant/unknown conversation →
        404; an ENCRYPTED conversation → 422 (attachment ciphertext is exchanged
        out of band); unsupported type → 415; oversize → 413; failed scan → 422;
        too many uploads → 429. Returns 503 when blob storage is not configured.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: The stored attachment's id and metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAttachmentResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The attachment exceeds the 100 MiB limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: "Unsupported attachment type (allowed: image, video, audio, pdf, doc)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The conversation is encrypted, the attachment failed the malware scan, or a probed image reported dimensions over 20000px on either side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Per-user attachment upload rate limit exceeded (the no-quota compensating control). Carries Retry-After and X-RateLimit-* headers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Attachment storage is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/attachments/{id}:
    get:
      operationId: downloadDMAttachment
      summary: Download a direct-message attachment
      description: >-
        Streams an attachment's bytes, gated on participation in the
        attachment's conversation. Behind auth. Unknown attachment or a caller
        who is not a participant → 404 (no existence leak).
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The attachment bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such attachment for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{id}/read:
    post:
      operationId: markConversationRead
      summary: Mark a conversation read
      description: >-
        Advances the caller's read watermark in a conversation (idempotent,
        advance-only). Behind auth. With a body {message_id} the watermark moves
        to that message (which must belong to the conversation); without a body
        it moves to the newest message. The inbox derives unread counts from the
        watermark and the thread exposes the peer's watermark (subject to their
        read-receipts toggle). Non-participant/unknown conversation → 404.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkConversationReadRequest"
      responses:
        "204":
          description: The watermark was advanced (or already current).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller, or the message is not in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/messages/{id}:
    delete:
      operationId: deleteMessage
      summary: Delete (tombstone) a message
      description: >-
        Sender-only soft delete: the body becomes "[deleted]" and any attachments
        are removed. Behind auth. A non-sender or unknown message → 404 (authorship
        is not leaked); an already-deleted message is an idempotent 204.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The message was tombstoned (or already was).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such message you sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/messages/{id}/report:
    post:
      operationId: reportMessage
      summary: Report a message
      description: >-
        Files an abuse report against a direct-message message. Behind auth.
        Either participant may report; the current body is snapshotted into the
        report so a moderator keeps context even after a sender tombstone.
        Idempotent per (reporter, message). A non-participant or unknown message
        → 404.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "204":
          description: The report was filed (or already existed).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such message for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/messaging-prefs:
    get:
      operationId: getMessagingPrefs
      summary: Get my messaging privacy preferences
      description: >-
        Returns the caller's DM privacy toggles. Behind auth. Currently the
        read-receipts toggle (default enabled): when disabled, the caller's read
        watermark is hidden from peers.
      tags: [messaging]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's messaging preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingPrefs"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMessagingPrefs
      summary: Update my messaging privacy preferences
      description: >-
        Updates the caller's DM privacy toggles (only present fields change).
        Behind auth.
      tags: [messaging]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMessagingPrefsRequest"
      responses:
        "200":
          description: The updated messaging preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingPrefs"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices:
    post:
      operationId: registerE2EEDevice
      summary: Register an E2EE device
      description: >-
        Registers a device in the caller's E2EE key directory: a user-visible
        name plus the device's PUBLIC identity (Curve25519) and signing
        (Ed25519) keys. All cryptography is client-side (Olm); the server never
        sees private keys and treats key material as opaque bounded strings.
        At most 20 devices per user (422 beyond).
      tags: [e2ee]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterE2EEDeviceRequest"
      responses:
        "201":
          description: The registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDevice"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or the device limit is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyE2EEDevices
      summary: List my E2EE devices
      description: >-
        Returns the caller's registered devices, oldest first. Also serves as
        the client's E2EE availability probe.
      tags: [e2ee]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's devices (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDeviceListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}:
    delete:
      operationId: deleteE2EEDevice
      summary: Delete one of my E2EE devices
      description: >-
        Removes one of the caller's devices, cascading its one-time keys and
        its stored envelopes (both directions — envelopes TO a deleted device
        are undecryptable by anyone else, and envelopes FROM it are dropped
        with it). Unknown or not-owned devices are 404 (ownership is not
        leaked).
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The device was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}/one-time-keys:
    post:
      operationId: uploadE2EEOneTimeKeys
      summary: Upload one-time prekeys
      description: >-
        Uploads a batch of PUBLIC one-time prekeys for one of the caller's
        devices (idempotent per key_id). At most 100 per upload and 500
        unclaimed per device (422 beyond). Not-owned devices are 404.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadOneTimeKeysRequest"
      responses:
        "201":
          description: The keys were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadOneTimeKeysResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or a key cap is exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}/one-time-keys/count:
    get:
      operationId: countE2EEOneTimeKeys
      summary: Count unclaimed one-time prekeys
      description: >-
        Returns the unclaimed one-time-key count of one of the caller's devices
        so the client knows when to replenish. Not-owned devices are 404.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The unclaimed count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeKeyCountResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/e2ee/devices:
    get:
      operationId: listUserE2EEDevices
      summary: List a peer's E2EE devices
      description: >-
        Returns the PUBLIC keys of a user's devices. Participant-gated to limit
        enumeration: unless the target is the caller, the two must share at
        least one conversation — otherwise 404 (indistinguishable from an
        unknown user). A block in either direction is 403.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The user's devices (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDeviceListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and this user (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user, or no shared conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/e2ee/claim:
    post:
      operationId: claimE2EEOneTimeKeys
      summary: Claim one-time prekeys
      description: >-
        Atomically claims ONE one-time key per device of the target user (for
        establishing an Olm session per device pair). Each key is single-use;
        concurrent claimers can never receive the same key. Devices with no
        keys left appear with one_time_key null. Participant-gated like the
        device listing; claiming your own devices' keys is allowed. Audited
        with counts only — key material never reaches logs or the audit trail.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One claim result per device of the target user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEClaimResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and this user (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user, or no shared conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/audit-log:
    get:
      operationId: listAuditLog
      summary: List the security audit log
      description: >-
        Returns the durable audit trail of security-sensitive actions (auth,
        moderation, admin, registration), newest first. Restricted to admins.
        Optional action filters by a specific action id. Paginated via limit
        (1–100, default 20) and offset. Rows never contain secrets, raw content,
        email/IP data, URLs, headers, cookies, credentials, or process output.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          description: Filter to a single action id (e.g. auth.login).
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of audit entries (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/stats:
    get:
      operationId: adminStats
      summary: Instance-wide overview counts (admin)
      description: >-
        Returns the instance-wide overview the admin dashboard renders as cards:
        total accounts, public+published videos, total stored media bytes,
        distinct federated peer instances, and total local comments. Every field
        is a live, trivially-real COUNT/SUM over a committed column. There are
        deliberately NO period-over-period deltas — no time-series store exists to
        compute them (a future analytics dependency). Reports only aggregate
        counts — no secrets or PII. Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current instance-wide overview counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/system:
    get:
      operationId: systemStatus
      summary: Operational system status (admin)
      description: >-
        Returns an operational snapshot for the admin dashboard: build info, the
        runtime environment, process uptime, an overall health flag,
        per-dependency component status (postgres, redis, s3, smtp, search,
        ffmpeg, settings_sync), and live PostgreSQL connection-pool counts.
        Restricted to admins.
        settings_sync is the settings-version poller that keeps this replica's
        in-memory instance settings/documents/branding in agreement with the
        fleet: down means the poll is failing and THIS replica may be serving
        stale admin-edited state; not_configured (no poller wired — a
        single-process or worker-role process) never degrades the instance.
        Always 200 (even when degraded) so the admin can see the degraded state,
        unlike /readyz which 503s. Reports only operational metadata.
        The `database` block is sampled at request time and is ABSENT — not
        zeroed — on a process with no pool wired: a pool reported as 0 of 0 is
        indistinguishable from one that is fully checked out.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current operational status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/mail/test:
    post:
      operationId: sendTestMail
      summary: Send an outbound-mail test message (admin)
      description: >-
        Sends one probe message so an admin can find out whether outbound mail
        works BEFORE a user needs a password reset. No request body.
        The recipient is the instance's own effective contact address and the
        caller CANNOT choose it. That is the security design of the endpoint: an
        authenticated send-to-any-address button is an open relay behind an admin
        password — useful for spam, for phishing from the instance's own domain,
        and for burning its sending reputation. With a fixed recipient there is
        nothing to abuse.
        202 means the message was handed to the relay, not that it was delivered:
        SMTP acceptance is a promise to try, and an admin who reads "sent" and
        finds nothing in the inbox has learned something real.
        Restricted to admins, throttled on its own budget (3 per admin per hour
        in production wiring), and audited as admin.mail.test with the OUTCOME
        only — never an address.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "202":
          description: The message was handed to the mail relay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MailTestResult"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            No instance contact email is set, so there is nowhere to send the
            test. Set the contact_email instance setting first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many test messages recently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: >-
            The relay refused the message (code mail_test_failed). The response
            text is deliberately generic — the relay's own answer goes to the
            server log, because a rejection routinely quotes the recipient
            address back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            This deployment has no outbound mail path at all, so there is
            nothing to test (code mail_not_configured). The message names the
            variables to set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/infrastructure:
    get:
      operationId: getInfrastructure
      summary: Deploy-time infrastructure shape (admin)
      description: >-
        Returns what this instance IS, as opposed to whether it is up (that is
        GET /api/v1/admin/system): the server's environment, request deadlines
        and size caps, its connection-pool sizing and shutdown drain delay, the
        media storage backend and its bucket coordinates, the public origin and
        proxy/CORS trust, the backup contract, and a discovery list of every
        optional subsystem with whether it is enabled and whether the deployment
        supplies what it needs. Read-only, always 200, no probes.
        Every field is hand-picked and NO secret is included: no database or
        Redis DSN, no S3 access/secret key, no SMTP username or password, no JWT
        secret, no key-encryption key, no live ingest or search internal secret,
        no IPFS cluster token.
        The values come from BOOT CONFIG, never the runtime instance-settings
        overlay — this page is about the deployment, and it has to be able to
        contradict an admin toggle that claims a feature the host cannot provide.
        The backups block is GUIDANCE, not live state: the api container has no
        view of the deploy directory (mounting the backups into the
        public-facing service is how a compromised api deletes them), so it
        reports the documented cadence, the staleness rule and the artifacts, and
        points at `vidra doctor` on the host for whether a dump actually ran.
        Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The deploy-time infrastructure snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfrastructureStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/jobs:
    get:
      operationId: listJobs
      summary: Durable job-queue status (admin)
      description: >-
        Returns an operations snapshot of every durable background-work queue
        (transcode_jobs, federation_deliveries, import_jobs, caption_jobs,
        account_exports, upload_sessions, storage_migrations): per-queue depth
        counts by state
        (pending/running/done/failed) plus the age of the oldest still-pending
        item (a stuck-worker signal), and a merged recent-failures list. This is
        the backend contract behind the admin jobs page. Failures carry only
        id/error/attempts — never a source URL, inbox URL, storage key, or any
        argument. No separate worker heartbeat store exists: a healthy worker
        keeps pending/oldest_pending_age low, and dead-lettered rows surface in
        failed + recent_failures. Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current durable-queue snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobsOverview"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/jobs/runs:
    get:
      operationId: listJobRuns
      summary: List individual operational job runs (admin)
      description: >-
        Returns the sanitized, paginated execution projection for the durable
        UUID-backed queues integrated in Phase 1. Source queue rows remain the
        execution authority. Metadata is allowlisted and bounded; source/inbox
        URLs, payloads, storage keys, credentials, raw process output, and legacy
        free-form errors are never copied into this projection. event_cursor is
        an opaque decimal string captured before the snapshot and can seed the
        resumable SSE stream without a REST-to-stream race.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/JobRunState"
        - name: type
          in: query
          schema: { type: string, maxLength: 128 }
        - name: queue
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: resource_id
          in: query
          schema: { type: string, maxLength: 255 }
        - name: worker_id
          in: query
          schema: { type: string, maxLength: 255 }
        - name: failure
          in: query
          description: true selects failed/dead-lettered runs; false excludes them.
          schema: { type: boolean }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: A filtered page of individual job runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunsResponse"
        "400":
          description: Invalid filter or timestamp.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/jobs/runs/{id}:
    get:
      operationId: getJobRun
      summary: Get one operational job run and event history (admin)
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: events_limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: events_offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The run and a newest-first page of durable events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRunDetailResponse"
        "400":
          description: Invalid run id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Run not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/jobs/events:
    get:
      operationId: streamJobEvents
      summary: Resumable operational job-event stream (admin)
      description: >-
        Streams durable JobEvent objects oldest-first. The SSE id is the same
        opaque decimal string as JobEvent.cursor. Last-Event-ID takes precedence
        over the after query parameter. Connections are short-lived and capped by
        the access-token expiry so clients reconnect and re-authenticate. The
        server emits heartbeat comments and event name `job-event`; clients must
        retain the cursor verbatim rather than converting it to a JavaScript number.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: after
          in: query
          schema: { type: string, pattern: "^[0-9]+$" }
        - name: job_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/JobRunState" }
        - name: type
          in: query
          schema: { type: string, maxLength: 128 }
        - name: queue
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resource_type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: resource_id
          in: query
          schema: { type: string, maxLength: 255 }
        - name: worker_id
          in: query
          schema: { type: string, maxLength: 255 }
        - name: failure
          in: query
          schema: { type: boolean }
        - name: created_after
          in: query
          schema: { type: string, format: date-time }
        - name: created_before
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A text/event-stream of `job-event` events whose data is JobEvent JSON.
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          description: Invalid filter or event cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/qoe/events:
    post:
      operationId: recordQoEEvents
      summary: Record playback quality-of-experience measurements
      description: >-
        Accepts a batch (<= 20) of playback measurements — time to first frame,
        a rebuffer that has ended, an ABR rung change, or a playback error —
        enriches each with a keyed viewer digest, classifies the reported origin
        into a bounded delivery source, and records them (phase-4 delivery item
        4). Optional auth. Validation is all-or-nothing: one unsupported event
        type, engine, packaging format or error class rejects the whole batch.
        Always 202 on a well-formed batch, whether or not a row landed — the
        write is best-effort and a viewer's playback must never depend on it.
        Also 202, with nothing recorded, when the qoe_collection_enabled
        instance setting is off.


        The client reports `source_url`, the final URL it actually fetched media
        from; the SERVER classifies it against its own configured CDN base, IPFS
        gateway, object store and public origin. An unrecognised origin becomes
        `other` and never a value of its own, which is what keeps the dimension
        bounded. The URL is never stored.


        `session_id` is client-asserted unless the batch also carries the
        matching `playback_token`, which only a password-protected video has;
        the stored row and the admin rollups record which it was.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 20
                  items:
                    $ref: "#/components/schemas/QoEEventInput"
      responses:
        "202":
          description: Batch accepted (or silently dropped because collection is off).
        "400":
          description: Malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: More than 20 events, or an event that failed validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/qoe/playback-health:
    get:
      operationId: getQoEPlaybackHealth
      summary: Playback quality rollups for a time window (admin)
      description: >-
        Returns playback quality for a window, read entirely from the hourly
        rollup table (phase-4 delivery item 4). This is the backend contract
        behind the admin playback-health page and the phase-4 exit criterion:
        with no parameters it answers "TTFF/rebuffer percentiles per source for
        the last 24h".


        Two projections come back. `sources` merges every row in the window into
        one entry per delivery source and is NOT paged — a page of a summary is
        not a summary — and its percentiles are recomputed from the summed
        histograms rather than averaged from the hourly ones, because
        percentiles do not merge. `buckets` is the hourly detail behind it,
        paged with limit/offset.


        Percentiles are null, not zero, when the window recorded no measurement
        of that kind. `rendition_reporting_supported` is false for the
        native-hls engine permanently: the browser owns variant selection there
        and exposes no hook, so zero bitrate switches is a capability gap and
        not a quality result. `verified_session_count` below `event_count` means
        the rest of the events carried a session id the server could not attest.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: since
          in: query
          description: Window start, RFC3339. Snapped down to the hour. Defaults to 24h before `until`.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: Window end (exclusive), RFC3339. Snapped up to the hour. Defaults to now.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Hourly buckets per page.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: The window summary plus one page of hourly buckets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QoEPlaybackHealth"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Unparseable timestamp, or a window wider than 7 days.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Playback telemetry is not wired on this instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /api/v1/admin/instance-settings:
    get:
      operationId: getInstanceSettings
      summary: Get effective instance settings (admin)
      description: >-
        Returns every runtime-mutable instance setting's EFFECTIVE value together
        with its config default and whether the database currently overrides it.
        This is the DB-backed overlay (fix_plan P10) on top of the static config:
        the instance name/description and legal-contact metadata, the PeerTube
        platform-information fields (links, markdown bodies, default language,
        categories, moderator languages, sensitive-content policy), the registration
        gates (registration_enabled, registration_require_approval), the upload
        quarantine gate (quarantine_new_uploads), and the feature toggles
        (uploads_enabled, imports_enabled, live_enabled, comments_enabled,
        downloads_enabled). Downloads default to enabled and are controlled only
        by this runtime setting (there is no env/config counterpart).
        Boot-time-only secrets and infrastructure (database DSN, KEKs, JWT secret,
        storage backend) are NOT represented here — they stay in config.
        Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The effective instance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateInstanceSettings
      summary: Update instance settings (admin)
      description: >-
        Applies a partial, per-key-validated update to the instance-settings
        overlay and returns the full effective document. The body is a flat JSON
        object of setting key → new value: a boolean for the toggle keys
        (registration_enabled, registration_require_approval,
        quarantine_new_uploads, uploads_enabled, imports_enabled, live_enabled,
        comments_enabled, downloads_enabled, contact_form_enabled,
        instance_is_sensitive, the config-parity W8 feature toggles
        import_http_enabled, channel_sync_enabled, storyboards_enabled,
        video_card_previews_enabled, video_card_previews_default_enabled,
        transcription_enabled,
        user_import_enabled, user_export_enabled, and
        the config-parity W10 VOD knobs transcoding_enabled,
        transcoding_original_resolution, upload_additional_extensions_enabled,
        the config-parity W11 live knobs live_allow_replay and
        live_default_save_replay, and the config-parity W12 federation policy
        gates federation_accept_remote_comments (default true; off drops
        inbound remote comments at the ActivityPub inbox after the
        blocked-domain check — never retroactively),
        federation_allow_channel_followers (default true; off answers inbound
        channel Follows with a Reject, existing followers untouched),
        federation_follower_approval (default false; on holds new channel
        Follows PENDING in GET /api/v1/admin/federation/follower-requests — a
        vidra deviation applying PeerTube's instance-follower approval to
        CHANNEL followers, since vidra has no instance-level AP actor), and
        federation_auto_follow_back (default false; on follows an accepted
        follower back FROM THE FOLLOWED CHANNEL'S ACTOR, respecting the domain
        blocklist and never duplicating an existing follow/follow-back edge —
        note the content of followed-back actors then federates in, so
        moderation becomes reactive, as in PeerTube). Every federation_* key
        governs the ActivityPub inbox ONLY: the ATProto integration is
        outbound cross-posting with no inbound path, so these gates are
        explicitly out of scope for it. The config-parity W13 remote-URI
        search gates ride here too: search_remote_uri_users (default true)
        and search_remote_uri_anonymous (default false) let logged-in /
        anonymous callers resolve URL- and handle-shaped search queries to
        remote content through the SSRF-guarded federation fetcher — both
        effective only while federation is enabled — and the config-parity W7
        sign-up keys registration_require_email_verification (default false;
        effective only while the deployment has an outbound mail path, see
        features.mail; holds NEW registrations sessionless until the emailed
        link is confirmed — accounts created while the gate was off are never
        retroactively locked) and new_user_history_enabled (default true;
        seeds the per-user watch-history preference at account creation
        only)), an integer for the int-kind limits
        (including the W8 keys channel_sync_max_per_user,
        user_export_expiration_hours, user_export_max_quota_bytes,
        max_channels_per_user — 0 always means unlimited/never — the W10 keys
        transcoding_max_fps (0 = no cap, else 24..240), transcoding_threads
        (0 = ffmpeg default, else 1..64), and transcoding_concurrency /
        import_jobs_concurrency (1..16, read per worker tick so changes apply
        without a restart), and the W11 live limits live_max_instance_lives /
        live_max_user_lives (0..10000, 0 = unlimited, enforced at the RTMP
        publish callback) and live_max_duration_secs (0 = no limit, else
        60..2592000, enforced by the duration watchdog), and the W7 sign-up
        limits registration_user_limit (0 = unlimited; signup refuses and
        GET /api/v1/instance reports registration_enabled=false with reason
        user_limit_reached once the account count reaches it — the count is
        approximate under concurrent signups), registration_minimum_age
        (0 = off, else 1..150; signup then requires the age_attestation flag —
        no birthdate is collected), and default_user_daily_quota_bytes
        (0 = unlimited; a ROLLING trailing-24h upload window enforced at the
        upload gates with 422 daily_quota_exceeded)), a string
        for the text/markdown/link keys and enum keys such as
        sensitive_content_policy, and an array of strings for list keys
        (instance_categories, moderator_languages, and transcoding_resolutions
        — a non-empty, duplicate-free subset of the canonical ladder rungs
        2160/1440/1080/720/480/360/240/144). A null value
        clears that override (resets the key to its config default). Only the keys
        present are changed. An unknown key, a type mismatch, or a content-invalid
        value (e.g. a malformed URL/email, an empty instance_name, an unknown
        taxonomy id, or an enum value outside its options) is 422 with field
        errors and nothing is written. Restricted to admins; audited
        (admin.instance.update, changed key names only). Changes take effect
        immediately (the overlay cache reloads), so subsequent GET /api/v1/instance,
        GET /api/v1/instance/about, POST /api/v1/instance/contact, public
        sensitive-content filtering, and the upload/import/live/comment/download/
        registration gates reflect them.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceSettingsRequest"
      responses:
        "200":
          description: The updated effective instance settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown key or an invalid value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/instance-settings/validate:
    post:
      operationId: validateInstanceSettings
      summary: Dry-run instance-settings validation (admin)
      description: >-
        Reports the field problems a body would produce, without writing
        anything. The request body is exactly the PATCH's — a flat object of
        setting key → new value — and the response lists those problems, or an
        empty list when the body would be accepted. Nothing is persisted and no
        audit event is emitted.
        It exists so an admin config form can validate a field as the operator
        leaves it, against the SERVER's rules, instead of keeping a hand-copied
        second copy of them client-side (a copy drifts the first time either side
        changes, and the operator finds out as a 422 on save). The PATCH's 422
        stays the authoritative backstop; this is only the early answer.
        It is not a byte-for-byte replay of the write. The PATCH stops after the
        type pass, because nothing may be persisted once a key is wrong; a dry
        run has nothing to protect and carries on to check the CONTENT of every
        key that typed cleanly. On a mixed body it therefore reports MORE
        problems than the PATCH would have, never different ones — each message
        comes from the same rule the write applies, so a finding here cannot turn
        out to be a false alarm at save time.
        Always 200 on a well-formed request: the field problems ARE the result of
        asking a validation question, so they are not themselves an error
        response. A body that is not a JSON object is 400. Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceSettingsRequest"
      responses:
        "200":
          description: >-
            The validation result. An empty fields array means the same body
            would be accepted by the PATCH.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceSettingsValidationResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/instance-documents/{name}:
    get:
      operationId: getInstanceDocument
      summary: Get an instance document (admin)
      description: >-
        Returns one instance document's stored state (config-parity W1): the
        raw body plus its sha256 content hash. A never-set/cleared document
        returns an empty body and hash (a stable shape for the admin editor).
        Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [homepage, custom_css, custom_js]
      responses:
        "200":
          description: The stored document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDocumentResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown document name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: putInstanceDocument
      summary: Set or clear an instance document (admin)
      description: >-
        Stores an instance document body (homepage max 100KB; custom_css and
        custom_js max 200KB) or clears it with an empty body — the public
        delivery routes 404 while a document is unset. Changes take effect
        immediately (the in-memory cache reloads) and the new content hash
        shows in the GET /api/v1/instance customization/homepage blocks for
        cache busting. Restricted to admins; every write is audited
        (admin.instance_document.update with the document name + content hash,
        never the body). Custom JS runs in every visitor's browser — clients
        must gate the editor behind an explicit warning flow.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [homepage, custom_css, custom_js]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceDocumentRequest"
      responses:
        "200":
          description: The stored (or cleared) document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceDocumentResponse"
        "400":
          description: Malformed request body (the body field is required).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown document name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The body exceeds the document's size cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/instance-avatar:
    post:
      operationId: setInstanceAvatar
      summary: Upload the instance avatar (admin)
      description: >-
        Stores the instance's avatar (config-parity W1; multipart form field
        "file", JPEG/PNG/WebP by extension, otherwise 415 — the same gate as
        user/channel avatars), replacing any previous one. Bounded by the
        global HTTP body limit. Restricted to admins; audited
        (admin.instance_asset.update). The GET /api/v1/instance branding block
        reflects the new URL immediately.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The image (JPEG/PNG/WebP).
      responses:
        "201":
          description: The stored image metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImage"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Not an accepted image type (JPEG/PNG/WebP by extension).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteInstanceAvatar
      summary: Remove the instance avatar (admin)
      description: >-
        Removes the instance's avatar (row + stored object); the branding
        block falls back. Restricted to admins; audited. 404 when none is set.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No instance avatar is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/instance-banner:
    post:
      operationId: setInstanceBanner
      summary: Upload the instance banner (admin)
      description: >-
        Stores the instance's banner, replacing any previous one. Same
        multipart/type gate as the avatar. Restricted to admins; audited.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
