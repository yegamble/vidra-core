          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}/thumbnail:
    get:
      operationId: getPlaylistThumbnail
      summary: Get a playlist's cover image
      description: >-
        Returns the playlist's uploaded cover image. Public/unlisted playlists'
        covers are visible to anyone; a private playlist's cover is visible only
        to its owner (else 404). A playlist without a cover is 404 — the playlist
        views' has_thumbnail flag tells clients whether one exists.
      tags: [playlists]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cover image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No such playlist (or not visible), or no cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setPlaylistThumbnail
      summary: Set a playlist's cover image
      description: >-
        Uploads an owner-supplied cover image as a multipart form with a single
        "file" part, replacing any previous cover. Accepted types are
        JPEG/PNG/WebP (by extension; otherwise 415). A non-owner or unknown id is
        404. The upload is bounded by the global HTTP body limit.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The cover image (JPEG/PNG/WebP).
      responses:
        "201":
          description: The cover was stored; returns the updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlaylistThumbnail
      summary: Remove a playlist's cover image
      description: Removes a playlist's cover (owner only, idempotent).
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The playlist has no cover.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
