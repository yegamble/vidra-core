  /api/v1/videos/{id}/webm:
    get:
      operationId: getVideoWebM
      summary: Get a video's progressive VP9/WebM alternate
      description: >-
        Streams the progressive VP9/WebM alternate produced when
        TRANSCODING_VP9_ENABLED is on, with HTTP Range/206 support. Same
        visibility as /original; absent (VP9 disabled or not yet produced) → 404.
        It is also listed by the /download endpoint (kind "webm").
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The full VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: A byte range of the VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "307":
          description: >-
            Direct delivery: the instance has delivery_presign_enabled on and the object store can sign URLs, so this public request is redirected to a short-lived signed object URL (one hour) carrying the same Content-Type and Content-Disposition this route would have sent. Never emitted for private/unpublished/password-protected media, nor for a request carrying a playback token or Authorization header; the 200/206 byte path stays authoritative and is always the fallback.
          headers:
            Location:
              schema:
                type: string
                format: uri
        "404":
          description: No such video (or not visible), or no VP9/WebM alternate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/view:
    post:
      operationId: recordVideoView
      summary: Record a view of a video
      description: >-
        Records a view for the video, de-duplicated per viewer within a window
        (Redis SETNX over the user id when authenticated, else the client IP,
        hashed). Visibility mirrors the detail endpoint (private → owner only,
        else 404); non-published videos are accepted but not counted. Always
        returns 204 whether or not the view was newly counted. The running total
        is exposed as `views` on the detail endpoint.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The view ping was accepted.
        "404":
          description: No such video, or private and not yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/file:
    post:
      operationId: uploadVideoFile
      summary: Upload a video's original file
      description: >-
        Uploads the original media file for a video (owner only) as a multipart
        form with a single "file" part, stores it via the configured storage
        backend, then finalises the video: it is published (or, if a configured
        media probe rejects it, marked failed). Re-uploading replaces the previous
        original. A non-owner or unknown id is reported as 404 so a private video's
        existence is not leaked. The file extension must be an accepted video
        container (otherwise 415); the body must be within UPLOAD_MAX_SIZE
        (otherwise 413); when a storage quota applies to the caller, a file
        that would not fit is rejected before storing (422 quota_exceeded; a
        size beyond the rolling-24h daily upload quota is 422
        daily_quota_exceeded).
        Real transcoding into multiple renditions happens in a later stage;
        for now the original is the playable source.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The original media file.
      responses:
        "201":
          description: >-
            The file was stored and the video finalised. video.state is
            "published" on success, or "failed" if the media probe rejected it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Uploads are switched off on this instance (uploads_enabled).
            Stable code feature_disabled — a deliberate operator state, not a
            transient failure, so a client must not offer a retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The uploaded file exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Storing the file would exceed the caller's storage quota (code
            quota_exceeded; or the rolling-24h daily upload quota, code
            daily_quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/replace:
    post:
      operationId: replaceVideoFile
      summary: Replace a published video's source file (direct multipart)
      description: >-
        Uploads a NEW source for an ALREADY PUBLISHED video (config-parity
        W14; owner, or a moderator/admin managing any local video) as a
        multipart form with a single "file" part. The video's id, URLs and
        metadata (title, policies, thumbnails, captions) are unchanged; the
        new source is malware-scanned and probed BEFORE anything is swapped
        (a rejected file leaves the video fully intact, 422), then the
        original-file record flips to the new version and a re-transcode is
        enqueued through the regular pipeline. Playback keeps working
        mid-swap: the previous HLS renditions keep serving until the new
        generation is promoted atomically on transcode completion (media GC
        collects the superseded files); progressive playback and downloads
        serve the new source immediately. The rolling daily upload quota and
        the storage quota are checked and recorded against the video's OWNER.
        Gated by the video_replace_enabled admin setting (403
        feature_disabled while off, default off). A video that is not
        published, still transcoding, or already being replaced answers 409
        replace_conflict. For large files prefer the resumable shape:
        POST /api/v1/videos/{id}/replace-session.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The replacement media file.
      responses:
        "200":
          description: >-
            The source was replaced; the video stays published. The previous
            renditions keep serving until the re-transcode promotes the new
            generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Video file replacement is disabled on this instance (code
            feature_disabled; video_replace_enabled off, or uploads off).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or the caller may not manage it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The video cannot be replaced right now (code replace_conflict) —
            it is not published, a transcode of its current source is still
            pending/running, or another replacement is already in flight.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The uploaded file exceeds the instance upload size cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Storing the file would exceed the owner's storage quota (code
            quota_exceeded) or the rolling-24h daily upload quota (code
            daily_quota_exceeded), or the replacement source was rejected by
            the malware scan / media probe (the video is untouched).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/uploads:
    get:
      operationId: listMyUploads
      summary: List the caller's active resumable uploads (server-side resume)
      description: >-
        Lists the caller's ACTIVE (unfinished, unexpired) resumable upload
        sessions, each with its received-chunk count — the server-side resume
        contract (UPLOAD-03). A client that lost its localStorage (a refresh, or
        a different device) reconstructs its in-progress uploads from here, then
        continues each with PUT /api/v1/uploads/{upload_id}/chunks/{n}. The
        optional fingerprint query narrows the list to sessions whose
        file_fingerprint matches, so a client can ask "am I already uploading
        this exact file?". Only the caller's own sessions are ever returned.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: fingerprint
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: >-
            Narrow the list to sessions with this exact file_fingerprint (the
            opaque identity supplied at create time). Omit to list all active
            sessions.
      responses:
        "200":
          description: The caller's active resumable uploads (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveUploadsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/upload-session:
    post:
      operationId: createUploadSession
      summary: Open a resumable (chunked) upload session
      description: >-
        Opens a chunked/resumable upload for a video's original file (owner
        only). The declared size, filename extension, and the caller's storage
        quota are validated UP FRONT: a non-video extension is 415, a size beyond
        UPLOAD_MAX_SIZE is 413, and a size that would exceed the caller's quota is
        422 (code quota_exceeded; the rolling-24h daily upload quota answers
        code daily_quota_exceeded). Returns the upload id, the fixed chunk size to
        send (every chunk but the last must be exactly this many bytes), the total
        number of chunks, and the 24h session expiry. Upload each chunk with PUT
        /api/v1/uploads/{upload_id}/chunks/{n}, then POST
        /api/v1/uploads/{upload_id}/complete, which ACCEPTS the completion (202)
        and queues the assembly + the same pipeline a direct upload runs; poll
        GET /api/v1/uploads/{upload_id} until its state is completed or failed.
        Non-owner/unknown video → 404.


        BATCH GUARD (UPLOAD-10): a caller may hold at most
        UPLOAD_MAX_ACTIVE_SESSIONS_PER_USER active (unfinished, unexpired) upload
        sessions at once (instance default 5; 0 disables the limit). Opening one
        past the cap is 429 with the stable code too_many_active_uploads — a
        batch-upload client should queue and retry once an in-flight session
        completes or is cancelled (either frees a slot). This is a fairness guard,
        not a security boundary; batching stays client-orchestrated over these
        per-video session endpoints (there is no /uploads/batch surface).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: The resumable upload session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Uploads are switched off on this instance (uploads_enabled).
            Stable code feature_disabled — a deliberate operator state, not a
            transient failure, so a client must not offer a retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The declared size exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The filename extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The body is invalid (size must be > 0, filename required) or the file
            would exceed the caller's storage quota (code quota_exceeded) or
            the rolling-24h daily upload quota (code daily_quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            The caller already holds UPLOAD_MAX_ACTIVE_SESSIONS_PER_USER active
            upload sessions (code too_many_active_uploads). Queue and retry after
            an in-flight session completes or is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/replace-session:
    post:
      operationId: createReplaceSession
      summary: Open a resumable (chunked) session that replaces a video's source
      description: >-
        Opens a chunked/resumable upload session whose completion REPLACES the
        source of an ALREADY PUBLISHED video (config-parity W14; owner, or a
        moderator/admin). Identical protocol to the plain upload session —
        upload chunks with PUT /api/v1/uploads/{upload_id}/chunks/{n}, then
        POST /api/v1/uploads/{upload_id}/complete, which answers 202 and queues
        the replacement flow instead of the publish pipeline; poll GET
        /api/v1/uploads/{upload_id} for the outcome. The video keeps serving its
        PREVIOUS source until the swap lands. GET/DELETE on the session work
        unchanged. The declared size, filename extension, and the
        video OWNER's storage + rolling-daily quotas are validated up front,
        and re-checked at completion. Gated by the video_replace_enabled admin
        setting (403 feature_disabled while off, default off); a video that is
        not published, still transcoding, or already being replaced answers
        409 replace_conflict. The batch guard (429 too_many_active_uploads)
        applies as for plain sessions.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: The resumable replacement session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Video file replacement is disabled on this instance (code
            feature_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or the caller may not manage it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The video cannot be replaced right now (code replace_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The declared size exceeds the instance upload size cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The filename extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The body is invalid, or the file would exceed the owner's storage
            quota (code quota_exceeded) or rolling-24h daily quota (code
            daily_quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            The caller already holds the maximum number of active upload
            sessions (code too_many_active_uploads).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadSession
      summary: Get a resumable upload's progress and state
      description: >-
        Returns which chunk indices have landed and the byte total so far — the
        contract a client reads to know which chunks to (re)send after an
        interruption — plus the session's lifecycle `state`. After POST
        .../complete answers 202 this is the POLLING endpoint: the client reads
        it (every couple of seconds) until `state` is `completed` — then fetches
        the video for its outcome — or `failed`, where `failure_reason` carries a
        safe explanation. Owner only; non-owner/unknown session → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session's received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelUploadSession
      summary: Cancel a resumable upload
      description: >-
        Cancels an in-progress upload and drops its chunk blobs. Owner only;
        non-owner/unknown → 404. Idempotent for a session that is already over:
        cancelling one that is `cancelled`, `completed` or `failed` still 204s, so
        a client can always clean up.


        A session mid-finalize (`queued` or `processing`) is refused with 409:
        its completion has already been accepted and the pipeline will publish the
        video, so reporting it cancelled would be untrue — and dropping the chunk
        blobs under a running assembly would corrupt it. Cancel before completing,
        or delete the resulting video afterwards.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was cancelled (or was already finished).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The session is being finalised (state `queued` or `processing`) and
            can no longer be cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/chunks/{n}:
    put:
      operationId: putUploadChunk
      summary: Upload one chunk of a resumable upload
      description: >-
        Stores one chunk (the raw request body) at index n for a session the
        caller owns. Every chunk but the last must be exactly chunk_size bytes;
        the last is the remainder. Idempotent: re-PUTting an index overwrites it.
        Returns the updated received-chunk status. Non-owner/unknown session →
        404; a session that already completed/cancelled → 409; an out-of-range
        index or wrong-sized chunk → 422; a chunk larger than its slot → 413.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: n
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: The zero-based chunk index.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw chunk bytes.
      responses:
        "200":
          description: The chunk was stored; the updated received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "400":
          description: The chunk index is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The session already completed or was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The chunk is larger than the required size for its index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The chunk index is out of range or its size does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: completeUploadSession
      summary: Complete a resumable upload (asynchronous)
      description: >-
        ACCEPTS the completion and returns 202 — it does not wait for the file to
        be assembled. The request validates cheaply (ownership, session state,
        every chunk present at its required size, and the caller's storage +
        rolling-daily quotas) and enqueues a finalize job; a background worker
        then assembles the chunks in order and runs them through the same
        AttachOriginal → Process pipeline as a direct upload
        (probe/scan/quarantine/transcode), or — for a replace-purpose session —
        through the source-replacement flow.


        Poll `GET /api/v1/uploads/{upload_id}` until `state` is `completed` (then
        read `GET /api/v1/videos/{video_id}` for the outcome: "published", or
        "failed" if a configured probe rejected it) or `failed` (`failure_reason`
        carries a safe explanation).


        It used to do the work inline and return the finalised video. That could
        not be made reliable: assembling, re-uploading, hashing and probing a real
        video against a remote object store takes minutes, the route carries the
        general 30s request deadline, and a CDN in front of the origin caps how
        long a response may take.


        Idempotent: re-POSTing while the finalize is queued or processing answers
        202 with the current state without queueing a second run, and a session
        that already finished answers 200 with its terminal state. Owner only;
        non-owner/unknown → 404; cancelled → 409; missing/mismatched chunks → 422.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: >-
            The session had already reached a terminal state (completed or
            failed); nothing was re-queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "202":
          description: >-
            The completion was accepted and queued. Poll
            GET /api/v1/uploads/{upload_id} for the outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            A replace-purpose session while video replacement is disabled on this
            instance (code feature_disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            The session was cancelled, or (replace-purpose) the video can no
            longer have its file replaced (code replace_conflict).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            One or more chunks are missing or the wrong size, or completing would
            exceed the caller's storage quota (code quota_exceeded) or the
            rolling-24h daily upload quota (code daily_quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The completion queue is not wired on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/import:
    post:
      operationId: importVideoFile
      summary: Enqueue a URL import of a video's original file
      description: >-
        Enqueues an ASYNCHRONOUS import of a remote media file by URL (owner
        only) and returns 202 with the queued job — it no longer blocks on the
        fetch. Ownership is checked before any job is created, so a non-owner or
        unknown video is 404 and nothing runs on their behalf. The URL is
        validated up front (http/https only, no literal non-public address); a
        missing/malformed/non-public URL is 422. A background worker then performs
        the SSRF-guarded fetch (loopback, private, link-local, CGNAT, and
        cloud-metadata addresses refused at connection time, so DNS rebinding and
        internal redirects are blocked too), enforces UPLOAD_MAX_SIZE and the
        caller's storage quota, and runs the bytes through the same
        AttachOriginal → Process pipeline as a direct upload
        (probe/scan/quarantine/transcode). Poll GET /api/v1/videos/{id}/import
        for progress (resolver + stage). A single import runs per video at a
        time: while one is in flight, re-posting returns the same job.


        The optional `resolver` selects the fetch mechanism (auto|direct|ytdlp).
        The yt-dlp platform extractor is sandboxed and OFF by default
        (YTDLP_IMPORT_ENABLED): an explicit resolver=ytdlp is refused with 503
        when the deployment has not wired it; auto simply never falls back to
        it. When the extractor IS wired but the admin has turned the platform
        path off at runtime (import_http_enabled, config-parity W8), an
        explicit resolver=ytdlp is 403 with the stable code feature_disabled
        instead, and auto never falls back to yt-dlp while it is off.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportVideoRequest"
      responses:
        "202":
          description: The import was enqueued (or the in-flight job was returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            URL imports are disabled on this instance (imports_enabled off), or
            resolver=ytdlp was requested while the platform import path is
            turned off at runtime (import_http_enabled). Stable code
            feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The URL is missing, malformed, not a public http(s) URL, or the
            resolver is not one of auto|direct|ytdlp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The requested resolver is disabled on this instance (e.g.
            resolver=ytdlp while YTDLP_IMPORT_ENABLED is off). Stable code
            service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getVideoImport
      summary: Get a video's URL-import status
      description: >-
        Returns the most recent URL-import job for a video (owner only). state is
        pending, running, done, or failed; on failure `error` is a safe,
        human-readable reason (never a raw internal error or the source URL).
        Non-owner/unknown video → 404; a video that was never imported → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or not owned by the caller), or no import exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs:
    post:
      operationId: createChannelSync
      summary: Create a channel auto-sync
      description: >-
        Binds a LOCAL channel you own to an external platform channel URL so a
        periodic worker mirrors that channel's recent uploads into yours. Each
        not-yet-seen upload becomes a private draft video plus a sandboxed
        `ytdlp` URL import, so downloaded bytes land through the same
        AttachOriginal → Process (scan/probe/transcode) pipeline as any other
        ingest — nothing is servable before the ClamAV scan. Synced videos are
        created PRIVATE for you to review and publish; the instance never
        auto-publishes mirrored content.


        OFF by default: when the runtime admin settings (channel_sync_enabled,
        or the import_http_enabled platform-import path it rides on;
        config-parity W8) turn the feature off this endpoint returns 403 with
        the stable code feature_disabled; when the deployment lacks the yt-dlp
        import resolver (YTDLP_IMPORT_ENABLED) it returns 503. The external URL
        is SSRF-validated (http/https only, no literal non-public address). At
        most channel_sync_max_per_user syncs per user (default
        CHANNEL_SYNC_MAX_PER_USER; 0 = unlimited).
      tags: [channels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelSyncRequest"
      responses:
        "201":
          description: The channel sync was created (due to run on the next tick).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSyncResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Channel auto-sync is turned off at runtime (channel_sync_enabled or
            import_http_enabled). Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An identical (channel, external URL) sync already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The external URL is missing, malformed, or not a public http(s) URL,
            or the caller is at the per-user channel-sync limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The deployment lacks the yt-dlp import resolver
            (YTDLP_IMPORT_ENABLED off), so channel auto-sync cannot run. Stable
            code service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listChannelSyncs
      summary: List your channel auto-syncs
      description: >-
        Returns the authenticated user's channel syncs (newest first), each with
        its state (waiting_first_run, syncing, idle, failed), last_sync_at, and a
        safe last_error.


        BREAKING (this release): paginated, with a `total`.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: The caller's channel syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSyncListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs/{id}:
    delete:
      operationId: deleteChannelSync
      summary: Delete a channel auto-sync
      description: >-
        Removes a channel sync you own (its dedupe ledger cascades away). A
        sync you do not own, or an unknown id, is 404.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The channel sync was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel sync, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs/{id}/sync-now:
    post:
      operationId: syncChannelNow
      summary: Trigger a channel auto-sync now
      description: >-
        Schedules an owned sync to run on the next worker tick (a manual refresh
        between cadence runs). A server-side cooldown (CHANNEL_SYNC_COOLDOWN,
        measured from the last completed run) throttles repeat triggers: a request
        inside the window is rejected 429 with a Retry-After header. 403
        feature_disabled when the runtime admin settings turn the feature off;
        503 when the deployment lacks the yt-dlp resolver; 404 when the sync is
        unknown or not owned.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: The sync was scheduled to run on the next tick.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Channel auto-sync is turned off at runtime (channel_sync_enabled or
            import_http_enabled). Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel sync, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            The sync ran too recently — the server-side cooldown has not elapsed.
            Stable code rate_limited; carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The deployment lacks the yt-dlp import resolver, so channel
            auto-sync cannot run. Stable code service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions/auto:
    post:
      operationId: requestAutoCaption
      summary: Request an auto-generated caption track (Whisper)
      description: >-
        Enqueues an ASYNCHRONOUS auto-caption job for a video (owner, moderator,
        or admin) and
        returns 202 with the queued job. A background worker extracts the audio
        (ffmpeg → 16 kHz mono WAV), sends it to the configured Whisper
        transcription service, renders the result to WebVTT, and stores it via
        the same replace-by-language path as a manual caption upload — then
        notifies the owner (a caption_ready notification, honoring preferences).
        `language` is optional (defaults to WHISPER_DEFAULT_LANGUAGE); it is both
        the caption's language tag and the transcription hint. Authorization is
        checked before any job is created, so an ordinary non-owner or unknown video is
        404. Auto-captioning turned off at runtime (transcription_enabled,
        config-parity W8) → 403 feature_disabled; the Whisper boot capability
        missing (no WHISPER_ENDPOINT) → 503; a malformed language tag → 422; a
        job already pending/running for the video → 409. Poll GET
        /api/v1/videos/{id}/captions/auto for progress.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCaptionRequest"
      responses:
        "202":
          description: The auto-caption job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Auto-captioning is turned off at runtime (transcription_enabled).
            Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An auto-caption job is already in progress for this video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The language tag is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The Whisper boot capability is not configured on this deployment
            (WHISPER_ENDPOINT), so auto-captioning cannot run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getAutoCaption
      summary: Get a video's auto-caption job status
      description: >-
        Returns the most recent auto-caption (Whisper) job for a video's owner,
        a moderator, or an admin. state is pending, running, done, or failed;
        on failure `error` is a safe, human-readable reason (never a raw internal
        error or the Whisper endpoint URL). Ordinary non-owner/unknown video →
        404; a video that never requested auto-captioning → 404.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest auto-caption job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such/authorized video, or no auto-caption job exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions:
    get:
      operationId: listCaptions
