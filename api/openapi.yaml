      description: Returns the caller's playlists, newest first, each with its public video count.
      tags: [playlists]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's playlists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}:
    get:
      operationId: getPlaylist
      summary: Get a playlist and its videos
      description: >-
        Returns a playlist with its ordered public, published video cards.
        Public/unlisted playlists are visible to anyone; a private playlist is
        visible only to its owner (otherwise 404).
      tags: [playlists]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The playlist and its videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistDetailResponse"
        "404":
          description: No such (visible) playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePlaylist
      summary: Update a playlist
      description: Partial update of a playlist owned by the caller; provide at least one field.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistRequest"
      responses:
        "200":
          description: The updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlaylist
      summary: Delete a playlist
      description: Deletes a playlist owned by the caller.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The playlist is deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}/videos:
    post:
      operationId: addPlaylistItem
      summary: Add a video to a playlist
      description: >-
        Appends a public, published video to a playlist owned by the caller
        (idempotent). A non-public/unpublished or unknown video is 404.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPlaylistItemRequest"
      responses:
        "204":
          description: The video is in the playlist.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist (owned by the caller) or video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: reorderPlaylistItems
      summary: Reorder a playlist's videos
      description: >-
        Rewrites the order of a playlist owned by the caller. The body must list
        exactly the playlist's current video ids, each once, in the desired order
        (a drag-reorder UI submits the full order); any missing, extra, or
        duplicated id is 422.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPlaylistItemsRequest"
      responses:
        "204":
          description: The playlist's videos are in the new order.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The video ids are not exactly the playlist's items, or a body validation error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}/videos/{videoId}:
    delete:
      operationId: removePlaylistItem
      summary: Remove a video from a playlist
      description: Removes a video from a playlist owned by the caller (idempotent).
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video is no longer in the playlist.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists/{id}/thumbnail:
    get:
      operationId: getPlaylistThumbnail
      summary: Get a playlist's cover image
      description: >-
        Returns the playlist's uploaded cover image. Public/unlisted playlists'
        covers are visible to anyone; a private playlist's cover is visible only
        to its owner (else 404). A playlist without a cover is 404 — the playlist
        views' has_thumbnail flag tells clients whether one exists.
      tags: [playlists]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The cover image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No such playlist (or not visible), or no cover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: setPlaylistThumbnail
      summary: Set a playlist's cover image
      description: >-
        Uploads an owner-supplied cover image as a multipart form with a single
        "file" part, replacing any previous cover. Accepted types are
        JPEG/PNG/WebP (by extension; otherwise 415). A non-owner or unknown id is
        404. The upload is bounded by the global HTTP body limit.
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The cover image (JPEG/PNG/WebP).
      responses:
        "201":
          description: The cover was stored; returns the updated playlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Playlist"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted image type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePlaylistThumbnail
      summary: Remove a playlist's cover image
      description: Removes a playlist's cover (owner only, idempotent).
      tags: [playlists]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The playlist has no cover.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such playlist owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
