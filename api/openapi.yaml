                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/videos:
    get:
      operationId: listAdminVideos
      summary: List all videos (admin/moderator overview)
      description: >-
        The admin/moderator videos overview: local videos AND federated metadata
        rows (any privacy/state), each with its owning channel, view count, file
        facts and whether it is currently blocked. Restricted to
        moderators/admins.


        `total` reports how many videos match the SAME filters, ignoring
        pagination — the number an "N videos" header should render. Reading the
        page length instead is what made this view report "100" on instances
        with far more.


        Every filter is optional and their effects intersect. An unrecognised
        value for any of them is a 400, never a silently ignored no-op.


        Two PeerTube filters are deliberately absent because vidra has no data
        behind them. `storage`: `object_storage` here is derived from the
        instance-wide storage backend, not per-file truth, so every local video
        reports the same value and filtering on it would be meaningless
        (PeerTube records a per-file storage enum; vidra does not). `isLive`:
        vidra keeps live streams in a separate table that this inventory does not
        include, and a stream recorded to VOD becomes an ordinary video with no
        structural marker, so there is no column to filter on.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive title substring filter.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: >-
            Ordering. Each key is accepted bare (ascending) or `-`-prefixed
            (descending). `published_at` is an ALIAS of `created_at`: videos
            carry no separate published_at column and the federated arm projects
            its own publish time into created_at, so they order the same rows the
            same way. The default reproduces the previous fixed ordering.
          schema:
            type: string
            enum:
              [
                -created_at, created_at, -published_at, published_at,
                -views, views, -duration, duration,
                title, -title, state, -state,
                -likes, likes, -comments, comments,
                -size_bytes, size_bytes,
              ]
            default: -created_at
        - name: state
          in: query
          required: false
          description: >-
            Lifecycle states to include. Repeatable and/or comma-separated
            (`?state=draft&state=failed` and `?state=draft,failed` are
            equivalent). Absent means all states.
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [draft, processing, scheduled, quarantined, transcoding, published, failed]
        - name: privacy
          in: query
          required: false
          description: >-
            Privacy tiers to include. Repeatable and/or comma-separated. Absent
            means all tiers.
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [public, unlisted, private, password]
        - name: scope
          in: query
          required: false
          description: Whether to include locally hosted rows, federated rows, or both.
          schema:
            type: string
            enum: [local, remote, all]
            default: all
        - name: channel
          in: query
          required: false
          description: >-
            Exact channel handle. Federated rows match on their
            `name@domain` handle.
          schema:
            type: string
            maxLength: 255
        - name: published_after
          in: query
          required: false
          description: Only videos published at or after this instant (RFC3339).
          schema:
            type: string
            format: date-time
        - name: published_before
          in: query
          required: false
          description: >-
            Only videos published at or before this instant (RFC3339). An
            inverted window (after > before) is a 400 rather than an empty page
            that looks like "no data".
          schema:
            type: string
            format: date-time
        - name: has_original
          in: query
          required: false
          description: >-
            Whether the video retains its uploaded original. TRI-STATE: absent
            means "all", not "false" — a plain boolean would make "videos with no
            original" unexpressible.
          schema:
            type: boolean
        - name: has_hls
          in: query
          required: false
          description: Whether the video has any HLS renditions. Tri-state; absent means all.
          schema:
            type: boolean
        - name: has_web_files
          in: query
          required: false
          description: >-
            Whether the video has any progressive web files (video_files of kind
            rendition or webm). Tri-state; absent means all.
          schema:
            type: boolean
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of videos (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVideoListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not a moderator or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/videos/{id}/transcoding:
    post:
      operationId: runAdminVideoTranscoding
      summary: Re-run a video's HLS or Web Video transcoding
      description: >-
        Enqueues recovery transcoding for one locally hosted video. Restricted
        to moderators/admins. The server always resolves the retained original
        video file as the source; a client cannot provide a derivative storage
        key. Existing output files for the selected class are replaced and
        stale files removed. Returns 409 when another transcode is active or no
        original exists.
      tags: [moderation, videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [hls, web_video]
      responses:
        "202":
          description: Transcoding was queued.
          content:
            application/json:
              schema:
                type: object
                required: [status, type]
                properties:
                  status:
                    type: string
                    enum: [queued]
                  type:
                    type: string
                    enum: [hls, web_video]
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller lacks permission or transcoding is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The local video does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: No original exists or another transcode is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: ffmpeg/ffprobe transcoding capability is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
