                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setVideoEmbedPrivacy
      summary: Set a video's embed-privacy policy
      description: >-
        Replaces a video's embed-privacy policy (owner only; a non-owner or
        unknown id is 404). 400 on an unknown status, a "whitelist" with an
        empty/invalid domain list (bare hostnames only — no scheme, port, or path;
        at most 50), or allowed_domains supplied with a non-whitelist status.
      tags: [videos]
