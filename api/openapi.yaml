          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of flagged comments (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedWordMatchListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not a moderator or admin.
