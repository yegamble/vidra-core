        "200":
          description: The selectable video-metadata taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoConfigResponse"
  /api/v1/videos/search:
    get:
      operationId: searchVideos
      summary: Search public videos by title or tag
      description: >-
        Fuzzy (trigram) search over public, published video titles, ranked by
        similarity then recency. A video also matches when one of its free-form
        tags contains the query (case-insensitive); tag-only matches rank after
        title matches. Videos of accounts that opted out of discovery
        (User.unlisted) never appear. Ingested federated remote videos are
        UNIONed in by title match as remote:true cards (origin domain +
        watch/stream URLs); they respect the admin instance blocklist and an
        authenticated viewer's instance mutes. Each result carries its view
        count and whether a poster image exists. Auth is optional: an
        authenticated viewer's muted accounts' videos are hidden from results
        (per-viewer); an anonymous viewer sees all. Requires a non-empty q
        (<= 100 chars); paginated with limit (1–100, default 20) and offset
        (>= 0).

        Remote-URI search (config-parity W13): a URI-shaped ("https://…") or
        handle-shaped ("@user@host" / "user@host") first-page query is
        additionally resolved to remote content through the federation
        machinery (WebFinger/actor/object fetch, SSRF-guarded), gated per auth
        state by search_remote_uri_users (default on) /
        search_remote_uri_anonymous (default off) and rate-limited per caller
        (10 resolutions/minute by default). Resolution runs CONCURRENTLY with
        the local search under a strict ~2.5s deadline, so ordinary searches
        are unaffected and a slow origin delays the response by at most that
        deadline. A resolved remote video/channel/account rides the additive
        `remote` array; anything unresolvable (bad target, blocked domain,
        timeout, exhausted budget) silently yields local-only results. The
        100-char q cap applies to shaped queries too — longer URLs are 400,
        as before.

        Backends. This endpoint has two: the search service, and a local SQL
        fallback that must return the same result SET. The service accepts only
        the tag/category/language facets and ranks by its own relevance, so a
        request using `sort` other than `relevance`, or any of duration_min /
        duration_max / published_after / published_before / tags_all_of /
        tags_one_of, is served by local SQL — where the ordering and every
        predicate are real — regardless of whether the search service is
        healthy. Re-sorting or post-filtering a relevance-ranked, truncated id
        list would answer a different question ("the newest of the N most
        relevant") and would drift as the corpus grew, so it is not done.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: sort
          in: query
          required: false
          description: >-
            Result ordering, using the same `-field`/`field` convention as the
            admin video list. `relevance` (the default) is trigram similarity
            then recency — the behaviour this endpoint had before it accepted a
            sort at all, so existing callers are unaffected. `published_at` is
            an alias of created_at: local videos carry no separate published_at
            column, and remote rows project COALESCE(published_at, fetched_at)
            into the same column. An unrecognised value is a 400, never a silent
            fallback to a different order. Anything other than `relevance` is
            served by the local SQL backend (see the description above).
          schema:
            type: string
            enum: [relevance, -published_at, published_at, -views, views]
        - name: tag
          in: query
          required: false
          description: Narrow to a free-form tag (matched case-insensitively). Excludes remote results.
          schema:
            type: string
            maxLength: 50
        - name: category
          in: query
          required: false
          description: Narrow to a taxonomy category id (from GET /videos/config); unknown values are 422. Excludes remote results.
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Narrow to a taxonomy language id (from GET /videos/config); unknown values are 422. Excludes remote results.
          schema:
            type: string
        - name: license
          in: query
          required: false
          description: Narrow to a taxonomy license id (from GET /videos/config); unknown values are 422. Excludes remote results.
          schema:
            type: string
        - name: duration_min
          in: query
          required: false
          description: >-
            Minimum video length in SECONDS, inclusive. A RANGE rather than the
            short/medium/long buckets the UI renders on top of it, because
            ranges compose and buckets do not — "4 to 10 minutes" is
            duration_min=240&duration_max=600, and a caller wanting something
            else is not stuck. Videos whose duration is unknown (no probe has
            run, or a federated actor never advertised one) do NOT match either
            bound: the filter answers "provably within the range". Applies to
            local and remote results alike. duration_min greater than
            duration_max is a 400.
          schema:
            type: integer
            minimum: 0
        - name: duration_max
          in: query
          required: false
          description: Maximum video length in SECONDS, inclusive. See duration_min.
          schema:
            type: integer
            minimum: 0
        - name: published_after
          in: query
          required: false
          description: >-
            Only videos published at or after this RFC3339 timestamp
            (inclusive). Applies to local and remote results alike.
            published_after later than published_before is a 400 rather than an
            empty page that looks like "no data".
          schema:
            type: string
            format: date-time
        - name: published_before
          in: query
          required: false
          description: Only videos published at or before this RFC3339 timestamp (inclusive). See published_after.
          schema:
            type: string
            format: date-time
        - name: tags_all_of
          in: query
          required: false
          description: >-
            Narrow to videos carrying EVERY listed free-form tag. Repeatable
            and/or comma-separated (`?tags_all_of=a&tags_all_of=b` and
            `?tags_all_of=a,b` are equivalent). Matched case-insensitively.
            Excludes remote results, which carry no local tags. The single `tag`
            parameter still works and is unchanged.
          schema:
            type: array
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
        - name: tags_one_of
          in: query
          required: false
          description: Narrow to videos carrying AT LEAST ONE of the listed free-form tags. Same encoding and rules as tags_all_of.
          schema:
            type: array
            items:
              type: string
              maxLength: 50
          style: form
          explode: true
      responses:
        "200":
          description: A page of matching public videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoSearchResponse"
        "400":
          description: >-
            Missing or too-long q, an unrecognised sort, a malformed or negative
            duration bound, a non-RFC3339 timestamp, or an inverted
            duration/publish range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown category or language filter value, or an over-long tag in tags_all_of / tags_one_of.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/search/channels:
    get:
      operationId: searchChannels
      summary: Search channels by handle or display name
      description: >-
        Fuzzy (trigram) search over channel handles and display names, ranked by
        similarity then follower count. Optional auth.

        Backed by core's own Postgres, NOT the search service. The search index
        holds videos; a channel appears there only as denormalised columns on
        the video rows it published, so a channel that has published nothing is
        invisible to it — and "find the channel that was just created" is
        exactly what a channel search is asked. A local trigram query has no
        such blind spot.

        Visibility. A channel is a public publishing identity and has no privacy
        flag of its own, so the gate is on its OWNER: the account must be active
        (a deactivated, suspended, or deleted account takes its channels out of
        discovery with it) and must not have opted out of discovery
        (User.unlisted, §16 — direct /channels/{handle} URLs keep serving, which
        is the point of the flag). The owner's profile_public setting is NOT
        consulted: it governs whether the ACCOUNT page exists, not the channels.

        An authenticated caller's muted and blocked accounts have their channels
        hidden, per-viewer, and the reported total is counted under the same
        predicate — so it never promises pages the caller cannot reach.

        Requires a non-empty q (<= 100 chars); paginated with limit (1–100,
        default 20) and offset (>= 0).
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of matching channels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSearchResponse"
        "400":
          description: Missing or too-long q.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/search/accounts:
    get:
      operationId: searchAccounts
      summary: Search public accounts by username or display name
      description: >-
        Fuzzy (trigram) search over account usernames and display names, ranked
        by similarity then recency. Optional auth. Backed by core's own
        Postgres: the search service does not index accounts at all.

        ONLY PUBLICLY VISIBLE ACCOUNTS ARE RETURNED, under exactly the rule
        GET /users/{username}/profile already enforces — the account must be
        active AND have opted its profile in (User.profile_public). Deactivated,
        suspended, hard-deleted, and private accounts all collapse into that
        gate and none of them appear here, just as none of them resolve there.

        One predicate applies here that does NOT apply to the profile lookup:
        accounts that opted out of discovery (User.unlisted) are excluded. That
        flag means "keep serving my direct URLs, keep me out of discovery" — a
        profile fetched by username is a direct URL, a search result list is
        discovery.

        An authenticated caller's muted and blocked accounts are removed on top
        of that, and the reported total is counted under the identical
        predicate: a total computed over a wider set would leak the existence of
        the accounts the list refuses to return.

        Requires a non-empty q (<= 100 chars); paginated with limit (1–100,
        default 20) and offset (>= 0).
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of matching public accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSearchResponse"
        "400":
          description: Missing or too-long q.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/search/suggestions:
    get:
      operationId: searchSuggestions
      summary: Autocomplete suggestions for a search prefix
      description: >-
        Proxies query/video/channel/tag/history autocomplete to the search
        service (search-service W4) with core-computed personalization and
        history flags (instance setting AND user pref AND signed-in). Optional
        auth. Always 200: a disabled service, a disabled suggestions toggle, an
        empty query, a timeout, or any error degrades to an empty list — a
        suggestion box never errors.
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Suggestions (possibly empty).
          content:
            application/json:
              schema:
                type: object
                required: [query, suggestions]
                properties:
                  query:
                    type: string
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [text, type, is_personal]
                      properties:
                        text:
                          type: string
                        type:
                          type: string
                          description: query | video | channel | tag | history
                        video_id:
                          type: string
                        channel_handle:
                          type: string
                        is_personal:
                          type: boolean
  /api/v1/recommendations/home:
    get:
      operationId: getHomeRecommendations
      summary: Home ("for you" / trending) recommendation rail
      description: >-
        Personalized home recommendations from the search service when the
        instance + user allow it and the caller is signed in; otherwise the
        trending feed. Optional auth. Never errors — any search failure falls
        back to the trending feed (source="fallback").
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: A recommendation rail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
  /api/v1/search/events:
    post:
      operationId: recordSearchEvents
      summary: Record behavioural search/discovery events
      description: >-
        Accepts a batch (<= 20) of behavioural events (suggestions shown /
        selected, search submitted, result clicked, impression, play started,
        completed), enriches each with the caller's user id, session, an
        anonymous aggregation subject and an allow_history flag, and enqueues
        them for the search service (search-service W4). Every one of those
        identity fields is SERVER-derived: a client-supplied value for any of
        them is stripped from the event body and never stored. Optional auth,
        rate-limited. Never blocks on the search service.
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        description: One of the behavioural-event allowlist types.
      responses:
        "202":
          description: Events accepted for asynchronous delivery.
        "422":
          description: More than 20 events, or an unsupported event type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}:
    get:
      operationId: getVideo
      summary: Get a video by id
      description: >-
        Public and unlisted videos are returned to anyone with the id. A private
        or non-public-state local video is returned to its owner and to an
        authenticated moderator/admin, allowing the Manage view to load
        metadata for private, scheduled, quarantined, and blocked videos; to
        ordinary non-owners it is reported as 404 so its existence is not
        revealed. This moderator/admin exception applies only to this metadata
        detail endpoint and does not widen media or playback routes. A
        password-protected video (privacy=password, CORE-17) returns 401 with
        error code "password_required" to a caller who is neither the owner nor
        a moderator/admin and is not presenting a valid playback token (a plain
        unknown id is still 404); the caller then unlocks via POST
        /videos/{id}/unlock and retries with the token (Bearer or ?pt=). The
        response includes probed
        technical metadata (duration_seconds, width, height) when a media probe
        has recorded it.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: >-
            The video is password protected and the caller presented no valid
            credential (owner/moderator/admin token or playback token). Error
            code "password_required".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No video with that id, or it is not visible to this ordinary
            non-owner caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateVideo
      summary: Update a video
      description: >-
        Partial update of a video's metadata (title, description, privacy and
        the other fields in UpdateVideoRequest). The owner may update their own
        video; moderators and admins may manage any local video. An ordinary
        non-owner or unknown id is reported as 404 so a private video's existence
        is not leaked. The handle is immutable.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoRequest"
      responses:
        "200":
          description: The updated video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No such video, or the caller is neither its owner nor a
            moderator/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVideo
      summary: Delete a video
      description: >-
        Deletes a local video. The owner may delete their own video;
        moderators and admins may delete any local video. An ordinary non-owner
        or unknown id is reported as 404. The destructive audit event records
        the authenticated caller as its actor, including for managed deletes.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No such video, or the caller is neither its owner nor a
            moderator/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/stats:
    get:
      operationId: getVideoStats
      summary: Creator statistics for a video (owner only)
      description: >-
        Engagement totals (views, likes, dislikes, comments) plus a 30-day
        daily-views series (zero-filled, oldest first, UTC days) for one video.
        Owner only: a non-owner or unknown id is reported as 404 so the video's
        existence is not leaked.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoStatsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/stats:
    get:
      operationId: getChannelStats
      summary: Creator statistics for a channel (owner only)
      description: >-
        Aggregated engagement totals across all the channel's videos (views,
