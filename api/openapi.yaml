                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/reports/{id}:
    delete:
      operationId: deleteReport
      summary: Hard-delete a report
      description: >-
        Permanently removes a report row (admin purge). Restricted to admins —
        moderators resolve reports but cannot delete them. Idempotent like the
