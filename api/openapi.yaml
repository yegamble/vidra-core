            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/chapters:
    get:
      operationId: getVideoChapters
      summary: Get a video's chapters
      description: >-
        Returns the video's seek-bar chapters in playback order (ascending
        start_seconds), or an empty array when there are none. Same visibility as
        the detail endpoint (private → owner only, blocked → moderators only,
        else 404). The detail response's has_chapters flag tells clients whether
        any exist before fetching.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's chapters (ascending; empty when none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChapters"
        "404":
          description: No such video, or it is not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setVideoChapters
      summary: Replace a video's chapters
      description: >-
        Replaces the video's whole chapter set atomically (owner only); an empty
        array clears all chapters. There is no per-row endpoint. A non-owner or
        unknown id is 404 so a private video's existence is not leaked. The set is
        validated in full before any write, so a rejected request leaves the
        stored chapters untouched. Validation (400): start_seconds must be >= 0
        and strictly increasing (so unique); each start_seconds must be less than
        the probed duration when one was recorded; each title is 1–120 characters
        after trimming; at most 100 chapters.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVideoChaptersRequest"
      responses:
        "200":
          description: The stored chapters (ascending).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChapters"
        "400":
          description: >-
            A malformed body, or a chapters-validation violation (bad ordering,
            an out-of-bounds start, a bad title length, or more than 100 chapters).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/unlock:
    post:
      operationId: unlockVideo
      summary: Unlock a password-protected video
      description: >-
        Verifies a submitted password against a password-protected video's stored
        passwords (CORE-17) and, on success, mints a short-lived, video-scoped
        playback token. The token carries no account identity, is valid for 6
        hours, and unlocks ONLY this video's read endpoints, presented either as
        `Authorization: Bearer <playback_token>` or as a `?pt=<playback_token>`
        query parameter (the header-less path for Safari native-HLS and
        progressive playback). Optional auth. Rate-limited under the same strict
        budget as login. The password and the token are never logged.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockVideoRequest"
      responses:
        "200":
          description: The password was correct; a playback token is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockVideoResponse"
        "401":
          description: Incorrect password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or the video is not password protected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many unlock attempts (rate limited).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/playback-session:
    post:
      operationId: createPlaybackSession
      summary: Open a playback session for a video
      description: >-
        The one call a player makes before it plays. Decides authorization once
        and returns everything needed to run the playback without asking the core
        API again per segment: which manifests exist, the packaging format they
        describe, the available ladder rungs, a session id for quality telemetry,
        and — only for a video that requires one — a playback token.


        Authorization is IDENTICAL to the media routes (GET
        /videos/{id}/hls/master.m3u8): an invisible video is 404 so its existence
        is not leaked, and a password-protected video with no credential is 401
        `password_required`, which is what the watch/embed page renders its
        unlock prompt from. Optional auth; no request body.


        A video whose HLS tree is not ready is 200 with no manifest URLs — the
        caller IS authorized, there is simply nothing transcoded yet, and
        progressive playback via /videos/{id}/original still applies.


        The token is CONDITIONAL BY DESIGN. Any request carrying `?pt=` or an
        Authorization header is treated as credentialed, and a credentialed media
        request is never cached, never presigned and never redirected — so a
        session that minted a token for every viewer would silently make all
        media delivery origin-only. It is minted only for the one tier that
        cannot play without it (privacy `password`), never for public, unlisted,
        private or unpublished videos.


        Later delivery capabilities — CDN steering, signed URLs, DRM license
        configuration, P2P policy — land as additional fields on this same
        response.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "401":
          description: >-
            The video is password protected and the request carried neither
            owner/moderator authority nor a valid playback token (code
            `password_required`). Unlock via POST /videos/{id}/unlock and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or it is not visible to the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/license/clearkey:
    post:
      operationId: issueClearKeyLicense
      summary: Issue an EME ClearKey license for a video
      description: >-
        This instance's own EME ClearKey license service
        (interfaces.md section 10). A player that saw a `drm` block on its
        playback session with key system `org.w3.clearkey` POSTs the key ids its
        CDM asked for and receives the matching content keys as a JWK set.


        NOT USABLE YET, AND 404 ON EVERY INSTALL. The provider seam and its key
        store exist; the packaging step that would encrypt media and mint content
        keys does not. No video has keys, so this endpoint currently answers 404
        for every video — which is also the answer when no DRM provider is
        configured at all, deliberately: distinguishing those states would report
        whether a given video is protected to a caller who has no business
        knowing.


        CLEARKEY PROTECTS NOTHING. It hands the content key to any AUTHORISED
        viewer in the clear over TLS, which is what makes it a test key system.
        It exists so the whole path — session, license request, CDM playback —
        can be proven before a commercial key system is wired in.


        Authorization is IDENTICAL to the media routes and the playback session:
        an invisible video is 404, and a password-protected video with no
        credential is 401 `password_required`. A password video's player presents
        its session `playback_token` as `Authorization: Bearer <token>` — a
        license request is an XHR the player makes itself, so unlike a native-HLS
        segment fetch it can set a header. Optional auth.


        The response body contains key material and is always `no-store`.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearKeyLicenseRequest"
      responses:
        "200":
          description: The license (a JWK set). Never cached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearKeyLicense"
        "401":
          description: >-
            The video is password protected and the request carried neither
            owner/moderator authority nor a valid playback token (code
            `password_required`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No such video, it is not visible to the caller, it has no content
            keys, or no key system that issues licenses here is configured. One
            answer for all of them on purpose.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Validation failed: the body named no key ids, or more than 16. A
            well-formed request for a key id this video does not have is 404, not
            422 — it is a valid request this video cannot answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/passwords:
    get:
      operationId: listVideoPasswords
      summary: List a video's passwords
      description: >-
        Lists a video's passwords (id + created_at only — the plaintext and hash
