  /api/v1/admin/peertube-import:
    post:
      operationId: launchPeerTubeImport
      summary: Launch a PeerTube import run (admin)
      description: >-
        Launches a one-way PeerTube→Vidra migration run and returns it (202) so
        the UI can poll its progress (fix_plan P18). mode is "dry_run" (report
        counts + mapping plan + conflicts, writes NOTHING) or "run" (perform the
        import). conflict_policy (skip|rename|merge|fail, default skip) resolves
        username/handle/email/slug collisions. The import is idempotent and
        resumable — a re-run skips already-imported rows via a durable ledger.
        The SOURCE PeerTube database + storage connection is taken from SERVER
        CONFIG only; the browser NEVER sends a DSN or credential. Only one run may
        be active at a time (409 otherwise). 503 when import is not configured on
        the instance. Restricted to admins; audited (no secrets).

        Preflight refuses a source whose schema version is outside the verified
        range, and the run fails with `error_code: unverified_schema` plus the
        detected `source_version`. An administrator may accept that specific
        version by re-launching with `acknowledged_schema_version` set to it; the
        server never sets that field for itself and has no default for it.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerTubeImportLaunchRequest"
      responses:
        "202":
          description: The launched run (poll it for progress).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerTubeImportRun"
        "400":
          description: >-
            Invalid mode, conflict policy, or a negative
            acknowledged_schema_version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An import run is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: PeerTube import is not configured on this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listPeerTubeImports
      summary: List recent PeerTube import runs (admin)
      description: >-
        Returns recent import runs newest-first, each with its state, detected
        source schema version, and per-entity progress report — the admin import
        history + the active run's live progress. Restricted to admins.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Recent import runs.
          content:
            application/json:
              schema:
