      description: >-
        Returns a video's embed-privacy policy (CORE-17): the status tier and,
        for the "whitelist" tier, the allow-listed hostnames. Same BASE visibility
        as the detail (private → owner only, blocked → moderators, else 404) but
        WITHOUT the password gate, so the embed page can read the policy pre-unlock
        for a password-protected video. Enforcement is at the embed page (referrer
        / ancestor-origin check); the server only stores and serves the policy.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The embed-privacy policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedPrivacy"
        "404":
