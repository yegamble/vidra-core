      responses:
        "200":
          description: The channel's live streams (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: You do not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}:
    get:
      operationId: getLiveStream
      summary: Get a live stream's metadata
      description: >-
        Returns a live stream's public metadata. A private stream is visible only
        to its channel owner (else 404, so its existence is not leaked). The stream
        key is never returned.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The live stream metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStream"
        "404":
          description: No such live stream (or private and not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLiveStream
      summary: Edit a live stream
      description: >-
        Edits a live stream the caller owns (title, description, privacy,
        permanent, replay_enabled). Behind auth; a non-owner or unknown id is 404
        (existence is not leaked). Never rotates the stream key or changes the
        live state.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLiveStreamRequest"
      responses:
        "200":
          description: The updated live stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStream"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (title/privacy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLiveStream
      summary: Delete a live stream
      description: >-
        Deletes a live stream the caller owns. Behind auth; a non-owner or unknown
        id is 404 (existence is not leaked). Idempotent for the owner.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The live stream is deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/key:
    post:
      operationId: regenerateLiveStreamKey
      summary: Regenerate a live stream's key
      description: >-
        Rotates the stream key and returns the new one (shown ONCE). Behind auth; a
        non-owner or unknown id is 404. Use this if a key leaks.
      tags: [live]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The new stream key (once) and RTMP URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveStreamKey"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such live stream, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/hls/master.m3u8:
    get:
      operationId: getLiveHLSMaster
      summary: Get a live stream's HLS playlist
      description: >-
        Serves a live stream's HLS playlist while it is live. The media server
        writes segments into LIVE_HLS_ROOT keyed by stream ID; the api serves them
        gated by the stream's privacy (private → owner only) and state (only while
        live). 404 when LIVE_HLS_ROOT is not configured, the stream is not live, or
        it is private and not yours — the get response's hls_url tells clients when
        a live playlist exists.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The live HLS playlist.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: >-
            No such/visible live stream, not currently live, or live HLS serving
            is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/{id}/hls/{file}:
    get:
      operationId: getLiveHLSFile
      summary: Get a live HLS playlist or segment
      description: >-
        Serves one live HLS file: the media playlist ("<id>.m3u8", served as
        application/vnd.apple.mpegurl) or a numbered MPEG-TS segment
        ("<id>-<n>.ts", served as video/mp2t). Names outside that id-scoped shape
        are 404. Same privacy/state gate as the master playlist.
      tags: [live]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: file
          in: path
          required: true
          description: '"<id>.m3u8" or a segment such as "<id>-0.ts".'
          schema:
            type: string
      responses:
        "200":
          description: The live playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp2t:
              schema:
                type: string
                format: binary
        "404":
          description: >-
            No such/visible live stream, not currently live, no such file, or live
            HLS serving is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/ingest/start:
    post:
      operationId: liveIngestStart
      summary: Live ingest "on-publish" hook (media-server-facing)
      description: >-
        The RTMP ingest boundary calls this when a publisher connects, presenting
        the publisher's stream key; the matching stream is flipped to "live" (allow
        the publish). Authenticated by the X-Ingest-Secret shared secret, NOT a
        user token. Accepts either a JSON {stream_key} body (curl/harness) or the
        nginx-rtmp `name` form field. For the nginx-rtmp form callback the response
        is a 302 redirect whose last path segment is the stream ID, renaming the
        RTMP session so HLS segments and the recording are keyed by the ID and the
        raw key never lands on disk. Returns 404 when LIVE_INGEST_SECRET is not
        configured (disabled), 401 on a bad secret, and 404 when no stream matches.
      tags: [live]
      parameters:
        - name: X-Ingest-Secret
          in: header
          required: true
          description: The LIVE_INGEST_SECRET shared secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestRequest"
      responses:
        "200":
          description: The stream is now live (JSON caller).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    type: string
        "302":
          description: >-
            The stream is now live; nginx-rtmp form callers are redirected to
            rename the session to the stream ID (Location's last path segment).
        "400":
          description: Missing stream_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid ingest secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ingest not enabled, or no stream matches the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/live/ingest/stop:
    post:
      operationId: liveIngestStop
      summary: Live ingest "on-publish-done" hook (media-server-facing)
      description: >-
        Called by the RTMP ingest boundary when a publish session ends: the stream
        identified by the key (harness/pre-rename) or by the stream ID (media
        server, post-rename) returns to "offline" (permanent) or "ended"
        (one-shot). Accepts a JSON {stream_key} body or the nginx-rtmp `name` form
        field. When the stream has replay enabled, its recorded session is
        republished as a normal on-demand video best-effort in the background
        (never blocking or failing this hook). Same X-Ingest-Secret auth as start.
      tags: [live]
      parameters:
        - name: X-Ingest-Secret
          in: header
          required: true
          description: The LIVE_INGEST_SECRET shared secret.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveIngestRequest"
      responses:
        "204":
          description: The stream's live state was updated.
        "400":
          description: Missing stream_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid ingest secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ingest not enabled, or no stream matches the key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations:
    post:
      operationId: startConversation
      summary: Start (or get) a direct conversation
      description: >-
        Returns the 1:1 conversation with the recipient, creating it if it does
        not exist (idempotent). Behind auth. Messaging yourself is 422; an unknown
        recipient is 404. Pass {encrypted: true} to start the pair's ENCRYPTED
        conversation instead — a distinct thread whose type is immutable and
        which stores only opaque per-device ciphertext envelopes (see the E2EE
        endpoints; the server holds no keys and cannot decrypt).
      tags: [messaging]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationRequest"
      responses:
        "201":
          description: The conversation (existing or newly created).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and the recipient (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or an attempt to message yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/conversations:
    get:
      operationId: listConversations
      summary: List my conversations
      description: >-
        Returns the caller's conversations, most-recently-active first, each with
        the other participant and a last-message preview. Behind auth. Paginated
        via limit (1–100, default 20) and offset.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of conversations (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversations/{id}/messages:
    get:
      operationId: listMessages
      summary: List messages in a conversation
      description: >-
        Returns a conversation's messages, newest first. Behind auth. A
        non-participant (or unknown conversation) is 404 so a conversation's
        existence is not leaked. Paginated via limit (1–100, default 20)/offset.
        On an ENCRYPTED conversation the response is an
        EncryptedMessageListResponse instead, containing ONLY the envelopes
        addressed to the caller's own devices (expired disappearing messages
        filtered).
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: >-
            A page of messages (possibly empty). Plaintext conversations return
            MessageListResponse; encrypted ones EncryptedMessageListResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MessageListResponse"
                  - $ref: "#/components/schemas/EncryptedMessageListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendMessage
      summary: Send a message
      description: >-
        Posts a message to a conversation. Behind auth. A non-participant (or
        unknown conversation) is 404. The valid body shape is fixed by the
        conversation's immutable type: plaintext conversations take
        SendMessageRequest ({body}); ENCRYPTED conversations take
        SendEncryptedMessageRequest (per-recipient-device ciphertext envelopes,
        optionally with a disappearing-message timer). The wrong shape for the
        conversation type is 422 in both directions.
      tags: [messaging]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SendMessageRequest"
                - $ref: "#/components/schemas/SendEncryptedMessageRequest"
      responses:
        "201":
          description: >-
            The message was sent. Plaintext sends return the Message; encrypted
            sends a SendEncryptedResponse summary (envelopes are not echoed).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/SendEncryptedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and the other participant (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such conversation for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices:
    post:
      operationId: registerE2EEDevice
      summary: Register an E2EE device
      description: >-
        Registers a device in the caller's E2EE key directory: a user-visible
        name plus the device's PUBLIC identity (Curve25519) and signing
        (Ed25519) keys. All cryptography is client-side (Olm); the server never
        sees private keys and treats key material as opaque bounded strings.
        At most 20 devices per user (422 beyond).
      tags: [e2ee]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterE2EEDeviceRequest"
      responses:
        "201":
          description: The registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDevice"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or the device limit is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listMyE2EEDevices
      summary: List my E2EE devices
      description: >-
        Returns the caller's registered devices, oldest first. Also serves as
        the client's E2EE availability probe.
      tags: [e2ee]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's devices (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDeviceListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}:
    delete:
      operationId: deleteE2EEDevice
      summary: Delete one of my E2EE devices
      description: >-
        Removes one of the caller's devices, cascading its one-time keys and
        its stored envelopes (both directions — envelopes TO a deleted device
        are undecryptable by anyone else, and envelopes FROM it are dropped
        with it). Unknown or not-owned devices are 404 (ownership is not
        leaked).
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The device was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}/one-time-keys:
    post:
      operationId: uploadE2EEOneTimeKeys
      summary: Upload one-time prekeys
      description: >-
        Uploads a batch of PUBLIC one-time prekeys for one of the caller's
        devices (idempotent per key_id). At most 100 per upload and 500
        unclaimed per device (422 beyond). Not-owned devices are 404.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadOneTimeKeysRequest"
      responses:
        "201":
          description: The keys were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadOneTimeKeysResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or a key cap is exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/e2ee/devices/{id}/one-time-keys/count:
    get:
      operationId: countE2EEOneTimeKeys
      summary: Count unclaimed one-time prekeys
      description: >-
        Returns the unclaimed one-time-key count of one of the caller's devices
        so the client knows when to replenish. Not-owned devices are 404.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The unclaimed count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OneTimeKeyCountResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such device for this caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/e2ee/devices:
    get:
      operationId: listUserE2EEDevices
      summary: List a peer's E2EE devices
      description: >-
        Returns the PUBLIC keys of a user's devices. Participant-gated to limit
        enumeration: unless the target is the caller, the two must share at
        least one conversation — otherwise 404 (indistinguishable from an
        unknown user). A block in either direction is 403.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The user's devices (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEDeviceListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and this user (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user, or no shared conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/users/{id}/e2ee/claim:
    post:
      operationId: claimE2EEOneTimeKeys
      summary: Claim one-time prekeys
      description: >-
        Atomically claims ONE one-time key per device of the target user (for
        establishing an Olm session per device pair). Each key is single-use;
        concurrent claimers can never receive the same key. Devices with no
        keys left appear with one_time_key null. Participant-gated like the
        device listing; claiming your own devices' keys is allowed. Audited
        with counts only — key material never reaches logs or the audit trail.
      tags: [e2ee]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One claim result per device of the target user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/E2EEClaimResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: A block exists between you and this user (either direction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown user, or no shared conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/audit-log:
    get:
      operationId: listAuditLog
      summary: List the security audit log
      description: >-
        Returns the durable audit trail of security-sensitive actions (auth,
        moderation, admin, registration), newest first. Restricted to admins.
        Optional action filters by a specific action id. Paginated via limit
        (1–100, default 20) and offset. Rows never contain secrets/PII.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          description: Filter to a single action id (e.g. auth.login).
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of audit entries (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/system:
    get:
      operationId: systemStatus
      summary: Operational system status (admin)
      description: >-
        Returns an operational snapshot for the admin dashboard: build info, the
        runtime environment, process uptime, an overall health flag, and
        per-dependency component status (postgres, redis). Restricted to admins.
        Always 200 (even when degraded) so the admin can see the degraded state,
        unlike /readyz which 503s. Reports only operational metadata.
      tags: [admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The current operational status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/media/gc:
    post:
      operationId: adminMediaGC
      summary: Run media garbage collection (admin)
      description: >-
        Sweeps stored media objects under the known prefixes (originals,
        thumbnails, storyboards, captions, the HLS tree, playlist covers) and
        deletes those with no database reference. Never lists or touches an
        unknown prefix. Defaults to a dry run — pass dry_run=false to actually
        delete. Restricted to admins; audited. Returns the scanned count, the
        orphan keys, and the number deleted (0 on a dry run). The daily scheduled
        sweep runs the same collector.
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaGCRequest"
      responses:
        "200":
          description: The sweep result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGCResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The storage backend does not support listing (GC unavailable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests:
    get:
      operationId: listRegistrationRequests
      summary: List the registration approval queue
      description: >-
        Returns registration requests, newest first, with the reviewing admin's
        username. Restricted to admins. status=pending returns only unresolved
        requests. Paginated via limit (1–100, default 20) and offset. The stored
        password hash is never exposed.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Set to "pending" to return only unresolved requests.
          schema:
            type: string
            enum: [pending]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of registration requests (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationRequestListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/approve:
    post:
      operationId: approveRegistrationRequest
      summary: Approve a registration request
      description: >-
        Approves a pending request, creating the account from the stored
        credentials (atomically). Admin only. An unknown/already-resolved id is
        404; a username/email taken since the request was filed is 409.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The request was approved and the account created.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The username or email is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/registration-requests/{id}/reject:
    post:
      operationId: rejectRegistrationRequest
      summary: Reject a registration request
      description: >-
        Rejects a pending request with an optional internal moderator note.
        Admin only. An unknown/already-resolved id is 404.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRegistrationRequest"
      responses:
        "204":
          description: The request was rejected.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such pending registration request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: List accounts (admin)
      description: >-
        Returns accounts, newest first, optionally filtered by a username/email
        substring (q). Restricted to admins. Paginated via limit (1–100, default
        20) and offset.
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          description: Username/email substring filter.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/users/{id}:
    patch:
      operationId: updateUser
      summary: Edit a user's role / active flag / storage quota (admin)
      description: >-
        Updates a user's role, active flag, and/or storage quota (partial).
        Restricted to admins. An admin cannot demote or deactivate their own
        account (422). An unknown id is 404. Deactivating revokes the user's
        sessions. storage_quota_bytes is tri-state — omitted: unchanged; null:
        reset to the instance default; a non-negative integer: per-user
        override (0 = unlimited).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed, or an attempt to self-demote/deactivate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      summary: Permanently delete a user's account (admin, hard delete)
      description: >-
        IRREVERSIBLE admin variant of the account hard delete, with the same
        semantics as DELETE /api/v1/auth/me (owned channels/videos purged with
        federation Delete fan-out and best-effort blob cleanup, comments
        tombstoned, per-user data erased, sessions revoked, account row
        anonymised) but no password confirmation. Self-guarded: an admin
        cannot hard-delete their own account this way (422).
      tags: [admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The account was permanently deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such user (or already deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Attempt to hard-delete the caller's own account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    ComponentStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: One of ok, down, not_configured.
          example: ok
        error:
          type: string
          description: Present only when the component is down.
    ReadinessResponse:
      type: object
      required: [status, components]
      properties:
        status:
          type: string
          description: ok when all dependencies are reachable, otherwise degraded.
          example: ok
        components:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentStatus"
    VersionResponse:
      type: object
      required: [name, version, commit, build_date, go]
      properties:
        name:
          type: string
          example: vidra
        version:
          type: string
          example: 0.1.0
        commit:
          type: string
          description: Short git SHA, or "unknown" when not built with ldflags.
          example: a1b2c3d
        build_date:
          type: string
          description: UTC build timestamp (RFC 3339), or "unknown".
          example: 2026-06-19T00:00:00Z
        go:
          type: string
          example: go1.26
    ErrorResponse:
      type: object
      description: >-
        The single, consistent error envelope returned by every endpoint for
        non-2xx responses (except the readiness probe, which returns
        ReadinessResponse on 503).
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable snake_case identifier for the error class.
              example: not_found
            message:
              type: string
              description: Human-readable description; never leaks internal detail on 5xx.
              example: resource not found
            request_id:
              type: string
              description: Correlates the response with server logs. Omitted when unknown.
            fields:
              type: array
              description: >-
                Field-level validation problems. Present only on validation
                failures (422 unprocessable_entity).
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: email
                  message:
                    type: string
                    example: must be a valid email
    InstanceResponse:
      type: object
      required: [name, description, software, registration_enabled, registration_requires_approval, oauth_providers, federation_enabled, terms_url, privacy_url, contact_email]
      properties:
        name:
          type: string
          example: Vidra
        description:
          type: string
          description: Operator-provided short description; may be empty.
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        registration_enabled:
          type: boolean
          description: Whether public account signup is currently accepted.
        registration_requires_approval:
          type: boolean
          description: >-
            Whether signup files a pending request for admin approval instead of
            creating an account immediately (only relevant when registration is
            enabled).
        oauth_providers:
          type: array
          items:
            type: string
          description: >-
            Configured OIDC login provider names, in display order. Render a
            "continue with <provider>" button per entry, navigating (top-level)
            to GET /api/v1/auth/oauth/{provider}. Empty when OAuth login is off.
          example: [google]
        federation_enabled:
          type: boolean
          description: >-
            Whether ActivityPub federation is enabled on this instance (gates
            remote-content surfaces such as remote follows and remote videos).
        terms_url:
          type: string
          description: Link to the instance terms of service; may be empty.
        privacy_url:
          type: string
          description: Link to the instance privacy policy; may be empty.
        contact_email:
          type: string
          description: Operator contact email; may be empty.
    OAuthIdentity:
      type: object
      required: [provider, email, created_at]
      properties:
        provider:
          type: string
          description: Configured provider name the identity belongs to.
          example: google
        email:
          type: string
          description: >-
            Email snapshot captured when the identity was linked (display only;
            the account email is authoritative). May be empty.
        created_at:
          type: string
          format: date-time
          description: When the identity was linked.
    OAuthIdentitiesResponse:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/OAuthIdentity"
    NodeInfoResponse:
      type: object
      required: [version, software, instance]
      properties:
        version:
          type: string
          description: NodeInfo schema version.
          example: "2.0"
        software:
          type: object
          required: [name, version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
        instance:
          type: object
          required: [name]
          properties:
            name:
              type: string
    User:
      type: object
      required: [id, username, email, role, email_verified, display_name, bio, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: ada
        email:
          type: string
          example: ada@example.test
        role:
          type: string
          enum: [user, moderator, admin]
        email_verified:
          type: boolean
        display_name:
          type: string
          description: Human-facing name; may be empty.
          example: Ada L.
        bio:
          type: string
          description: Short free-text description; may be empty.
        unlisted:
          type: boolean
          description: >-
            Account-level discovery opt-out. When true, the account's channels
            and videos are excluded from public discovery surfaces (video feed,
            search) while direct channel/video URLs keep serving. Default false.
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /users/{id}/avatar).
            Present on GET/PATCH /auth/me; omitted elsewhere.
        has_banner:
          type: boolean
          description: >-
            Whether a profile banner is set (served at GET /users/{id}/banner).
            Present on GET/PATCH /auth/me; omitted elsewhere.
    ProfileImage:
      type: object
      description: >-
        A stored avatar/banner's metadata, returned by the upload endpoints.
        The image itself is served by the corresponding public GET route with
        the Content-Type recorded here.
      required: [kind, content_type, size_bytes, created_at, updated_at]
      properties:
        kind:
          type: string
          enum: [avatar, banner]
        content_type:
          type: string
          description: Derived from the upload's file extension.
          example: image/png
        size_bytes:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateProfileRequest:
      type: object
      description: Partial profile update; provide at least one field.
      properties:
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 1000
        unlisted:
          type: boolean
          description: >-
            Toggle the account-level discovery opt-out (see User.unlisted).
    Channel:
      type: object
      required: [id, owner_id, handle, display_name, description, follower_count, created_at]
      properties:
        follower_count:
          type: integer
          format: int64
          description: Number of users following this channel.
          example: 0
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        handle:
          type: string
          example: ada_makes
        display_name:
          type: string
          example: Ada Makes
        description:
          type: string
        created_at:
          type: string
          format: date-time
        has_avatar:
          type: boolean
          description: >-
            Whether an avatar is set (served at GET /channels/{handle}/avatar).
        has_banner:
          type: boolean
          description: >-
            Whether a banner is set (served at GET /channels/{handle}/banner).
    CreateChannelRequest:
      type: object
      required: [handle, display_name]
      properties:
        handle:
          type: string
          minLength: 3
          maxLength: 30
          description: 3–30 chars; letters, digits, or underscore.
          example: ada_makes
        display_name:
          type: string
          minLength: 1
          maxLength: 50
          example: Ada Makes
        description:
          type: string
          maxLength: 1000
    UpdateChannelRequest:
      type: object
      description: Partial update; provide at least one field. Handle is immutable.
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 50
        description:
          type: string
          maxLength: 1000
    ChannelListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
    Video:
      type: object
      required: [id, remote, title, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: >-
            Whether this card is a federated REMOTE video. Local videos are
            always false. Remote cards (subscriptions feed, search, and the
            public feed with scope=all) omit the local-only fields
            (channel_id, privacy, state) and instead carry domain, watch_url,
            and optionally stream_url; their metadata detail lives at GET
            /remote-videos/{id} and their cached poster at GET
            /remote-videos/{id}/thumbnail.
        channel_id:
          type: string
          format: uuid
          description: >-
            The owning local channel. Present on every local video; omitted on
            remote cards (a remote video has no local channel).
        channel_handle:
          type: string
          description: >-
            The owning channel's handle, present on card/feed views so the client
            can link to /channels/{handle}. Omitted on the detail view. On a
            remote card this is the remote channel's "name@domain" identity
            (not a local route).
        channel_display_name:
          type: string
          description: The owning channel's display name; present alongside channel_handle on card/feed views.
        title:
          type: string
          example: My first upload
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
          description: Present on every local video; omitted on remote cards.
        state:
          type: string
          enum: [draft, processing, scheduled, quarantined, published, failed]
          description: >-
            Publish lifecycle. "scheduled" means the upload finished processing
            but publish_at lies in the future; public surfaces (feed, search,
            channel lists) only show "published", while direct links behave
            like any non-published video. "quarantined" means the instance
            holds new uploads for moderator review (QUARANTINE_NEW_UPLOADS):
            only the owner (studio badge) and moderators can see the video
            until it is approved (published) or rejected (failed). Present on
            every local video; omitted on remote cards.
        created_at:
          type: string
          format: date-time
          description: >-
            Creation time. On a remote card this is the origin's published
            time (falling back to when the video was fetched).
        domain:
          type: string
          description: >-
            REMOTE cards only: the origin instance's domain.
        watch_url:
          type: string
          description: >-
            REMOTE cards only: the origin's human watch page (always present
            on remote cards; the card links out here).
        stream_url:
          type: string
          description: >-
            REMOTE cards only: best playable URL from the origin (HLS
            preferred, else a direct video file). Omitted when the origin
            advertised none — the card then links out via watch_url.
        publish_at:
          type: string
          format: date-time
          description: >-
            The scheduled publish time. Present on the detail, create/update,
            and owner (studio) channel-list views once a schedule was set;
            omitted otherwise. The server publishes the video (running the
            same side effects as a direct publish) when this time arrives.
        duration_seconds:
          type:
            - integer
            - "null"
          description: >-
            Probed duration in whole seconds, recorded by the media probe. Present
            on the detail endpoint and on card/feed views (feed, search, channel
            lists, subscriptions, saved, history) so a card can show a length badge
            or resume progress bar; omitted when unknown (not yet probed).
        width:
          type:
            - integer
            - "null"
          description: Probed pixel width; omitted when unknown (e.g. audio-only).
        height:
          type:
            - integer
            - "null"
          description: Probed pixel height; omitted when unknown (e.g. audio-only).
        has_thumbnail:
          type: boolean
          description: >-
            Whether a poster image is available at GET /videos/{id}/thumbnail.
            Present on the detail endpoint; omitted on list/feed views.
        has_storyboard:
          type: boolean
          description: >-
            Whether a seek-preview storyboard is available at GET
            /videos/{id}/storyboard.jpg (+ the .vtt map). Present on the detail
            endpoint; omitted on list/feed views.
        views:
          type: integer
          format: int64
          description: >-
            Recorded view count. Present on the detail endpoint; omitted on
            list/feed views.
        category:
          type: string
          description: >-
            Optional subject-category id from GET /videos/config; omitted when
            unset. Present on the create/update/detail views.
        language:
          type: string
          description: >-
            Optional content language code (ISO 639-1) from GET /videos/config;
            omitted when unset.
        license:
          type: string
          description: >-
            Optional content-license id from GET /videos/config; omitted when
            unset.
        tags:
          type: array
          description: >-
            The video's free-form tags (lowercased, alphabetical; at most 5).
            Present on the create/update/detail views; omitted when empty and
            on list/feed views.
          items:
            type: string
            maxLength: 50
        hls_url:
          type: string
          description: >-
            Path of the HLS master playlist (GET /videos/{id}/hls/master.m3u8).
            Present on the detail endpoint only once the transcoded streaming
            playlist is ready; omitted while transcoding is pending/failed or
            disabled. Progressive playback via /original is always available.
          example: /api/v1/videos/6ba7b810-9dad-11d1-80b4-00c04fd430c8/hls/master.m3u8
        renditions:
          type: array
          description: >-
            The available HLS ladder rungs (tallest first), present alongside
            hls_url on the detail endpoint once transcoding completed.
          items:
            $ref: "#/components/schemas/VideoRendition"
    VideoRendition:
      type: object
      description: One transcoded HLS rendition (ladder rung) of a video.
      required: [height, width]
      properties:
        height:
          type: integer
          example: 720
        width:
          type: integer
          example: 1280
    DailyViews:
      type: object
      description: One day of a stats series (UTC calendar day).
      required: [day, views]
      properties:
        day:
          type: string
          format: date
          example: "2026-07-03"
        views:
          type: integer
          format: int64
    VideoStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        daily_views:
          type: array
          description: Dense 30-day series, oldest first, zero-filled.
          items:
            $ref: "#/components/schemas/DailyViews"
    ChannelStatsResponse:
      type: object
      required: [views, likes, dislikes, comments, followers, videos, daily_views]
      properties:
        views:
          type: integer
          format: int64
        likes:
          type: integer
          format: int64
        dislikes:
          type: integer
          format: int64
        comments:
          type: integer
          format: int64
        followers:
          type: integer
          format: int64
        videos:
          type: integer
          format: int64
          description: Total videos on the channel (any privacy/state).
        daily_views:
          type: array
          description: Dense 30-day series aggregated across the channel's videos.
          items:
            $ref: "#/components/schemas/DailyViews"
    VideoDownloadFile:
      type: object
      description: >-
        One downloadable representation of a video: the stored original, a
        progressive VP9/WebM alternate, or an HLS rendition's variant playlist.
      required: [kind, url, content_type]
      properties:
        kind:
          type: string
          enum: [original, webm, hls]
        url:
          type: string
          description: API path serving this file, e.g. "/api/v1/videos/{id}/original", "/api/v1/videos/{id}/webm", or "/api/v1/videos/{id}/hls/720p/playlist.m3u8".
        content_type:
          type: string
          example: video/mp4
        size_bytes:
          type: integer
          format: int64
          description: Stored size in bytes. Omitted when unknown (HLS renditions are segmented, so no single size applies).
        original_name:
          type: string
          description: The upload's original filename (original entries only).
        height:
          type: integer
          description: Pixel height, when known (probed for the original; the rung height for HLS renditions).
          example: 720
        width:
          type: integer
          description: Pixel width, when known.
          example: 1280
    VideoDownloadResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/VideoDownloadFile"
    CreateVideoRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          description: Defaults to "private" when omitted.
        category:
          type: string
          description: Optional subject-category id (see GET /videos/config). Unknown value -> 422.
        language:
          type: string
          description: Optional content language code (see GET /videos/config). Unknown value -> 422.
        license:
          type: string
          description: Optional content-license id (see GET /videos/config). Unknown value -> 422.
        tags:
          type: array
          description: >-
            Free-form tags. Lowercased, trimmed, and deduped server-side; at
            most 5 distinct tags of at most 50 characters each -> 422 otherwise.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Schedule the publish: after processing, the video parks in the
            "scheduled" state until this time, then publishes automatically.
            Must lie in the future -> 422 otherwise.
    UpdateVideoRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
        category:
          type: string
          description: Set the subject-category id (see GET /videos/config). Unknown/empty value -> 422.
        language:
          type: string
          description: Set the content language code (see GET /videos/config). Unknown/empty value -> 422.
        license:
          type: string
          description: Set the content-license id (see GET /videos/config). Unknown/empty value -> 422.
        tags:
          type: array
          description: >-
            Replaces the video's whole tag set (an empty array clears it; omit
            the field to leave tags unchanged). Same limits as create.
          maxItems: 5
          items:
            type: string
            maxLength: 50
        publish_at:
          type: string
          format: date-time
          description: >-
            Set (or move) the scheduled publish time. Only accepted while the
            video is not yet published, and must lie in the future -> 422
            otherwise.
    Caption:
      type: object
      description: A WebVTT caption track's metadata (the file is fetched separately).
      required: [language, label, created_at]
      properties:
        language:
          type: string
          description: BCP-47-ish language tag (e.g. en, pt-BR).
        label:
          type: string
        created_at:
          type: string
          format: date-time
    CaptionListResponse:
      type: object
      required: [captions]
      properties:
        captions:
          type: array
          items:
            $ref: "#/components/schemas/Caption"
    Comment:
      type: object
      required: [id, video_id, body, parent_id, author_id, author_username, author_display_name, remote, created_at, updated_at, edited, deleted]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        body:
          type: string
        parent_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The id of the comment this one replies to, or null for a top-level
            comment. The client uses it to build the thread tree.
        author_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The comment author's account id (so a signed-in viewer can mute
            them) — null for a federated (remote-authored) comment.
        author_username:
          type: string
          description: >-
            The local author's username, or — for a remote comment — the remote
            author-name snapshot captured at ingestion.
        author_display_name:
          type: string
        remote:
          type: boolean
          description: True for a federated comment authored on another instance.
        author_domain:
          type: string
          description: The remote author's origin instance; omitted for local comments.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited:
          type: boolean
          description: True once the comment has been edited (updated_at moved past created_at).
        deleted:
          type: boolean
          description: >-
            True for a tombstoned comment: its author's account was
            permanently deleted, the stored body was erased, and body renders
            as "[deleted]" while the reply thread stays intact.
    CommentListResponse:
      type: object
      required: [comments, limit, offset]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        limit:
          type: integer
        offset:
          type: integer
    UpdateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000
          description: The new comment text.
    MutedAccount:
      type: object
      description: An account the caller has muted, with its display identity.
      required: [user_id, username, display_name, muted_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedAccountListResponse:
      type: object
      required: [accounts, limit, offset]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/MutedAccount"
        limit:
          type: integer
        offset:
          type: integer
    MutedInstance:
      type: object
      required: [domain, muted_at]
      properties:
        domain:
          type: string
        muted_at:
          type: string
          format: date-time
    MutedInstanceListResponse:
      type: object
      required: [instances, limit, offset]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/MutedInstance"
        limit:
          type: integer
        offset:
          type: integer
    BlockInstanceRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          description: Bare hostname (optionally host:port) of the instance to block.
        reason:
          type: string
          maxLength: 2000
          description: Recorded on the blocklist and in the audit trail. May be empty.
    BlockedInstance:
      type: object
      required: [domain, reason, blocked_at]
      properties:
        domain:
          type: string
        reason:
          type: string
        blocked_by:
          type: string
          format: uuid
          description: The admin who blocked it. Omitted if that account was deleted.
        blocked_at:
          type: string
          format: date-time
    BlockedInstanceListResponse:
      type: object
      required: [instances, limit, offset]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/BlockedInstance"
        limit:
          type: integer
        offset:
          type: integer
    RemoteVideo:
      type: object
      required: [id, remote, domain, title, description, object_url, watch_url, has_thumbnail]
      properties:
        id:
          type: string
          format: uuid
        remote:
          type: boolean
          description: Always true. Distinguishes remote cards from local videos.
        domain:
          type: string
          description: The origin instance's domain.
        title:
          type: string
        description:
          type: string
        object_url:
          type: string
          description: The ActivityPub object id on the origin.
        watch_url:
          type: string
          description: The origin's human watch page.
        stream_url:
          type: string
          description: >-
            Best playable URL from the origin (HLS preferred, else direct
            video file). Omitted when the origin advertised none.
        duration_seconds:
          type: integer
        published_at:
          type: string
          format: date-time
        has_thumbnail:
          type: boolean
          description: Whether a locally cached thumbnail is available.
    CreateRemoteFollowRequest:
      type: object
      description: >-
        Names the remote channel to follow — exactly one of handle or
        actor_url.
      properties:
        handle:
          type: string
          maxLength: 2000
          description: The remote channel's WebFinger handle, "name@domain" (leading @ tolerated).
          example: films@videos.example
        actor_url:
          type: string
          maxLength: 2000
          description: The remote channel's ActivityPub actor URL.
          example: https://videos.example/video-channels/films
    RemoteFollow:
      type: object
      required: [id, actor_url, handle, domain, state, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: The follow row id (the DELETE /me/remote-follows/{id} key).
        actor_url:
          type: string
          description: The followed remote channel's ActivityPub actor URL.
        handle:
          type: string
          description: The followed channel's "name@domain" identity.
          example: films@videos.example
        domain:
          type: string
          description: The origin instance's domain.
        state:
          type: string
          enum: [pending, accepted]
          description: >-
            pending until the remote instance Accepts the follow, then
            accepted (only accepted follows feed the subscriptions feed and
            the ingestion gate). A remote Reject removes the follow.
        created_at:
          type: string
          format: date-time
    RemoteFollowListResponse:
      type: object
      required: [follows, limit, offset]
      properties:
        follows:
          type: array
          items:
            $ref: "#/components/schemas/RemoteFollow"
        limit:
          type: integer
        offset:
          type: integer
    BlockedUser:
      type: object
      required: [user_id, username, display_name, blocked_at]
      properties:
        user_id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        blocked_at:
          type: string
          format: date-time
    BlockedUserListResponse:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/BlockedUser"
        limit:
          type: integer
        offset:
          type: integer
    VideoRating:
      type: object
      required: [like_count, dislike_count, my_rating]
      properties:
        like_count:
          type: integer
          format: int64
        dislike_count:
          type: integer
          format: int64
        my_rating:
          type: [string, "null"]
          enum: [like, dislike, null]
          description: The caller's own rating, or null when anonymous or unrated.
    VideoListResponse:
      type: object
      required: [videos]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
    VideoConfigOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
          description: >-
            Stable identifier persisted on a video (or used to validate input) —
            not display text. Numeric for categories/licenses, ISO 639-1 for
            languages, the privacy value for privacies.
          example: "1"
        label:
          type: string
          description: Human-readable display label.
          example: Music
    VideoConfigResponse:
      type: object
      required: [categories, licenses, languages, privacies]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        licenses:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        languages:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
        privacies:
          type: array
          items:
            $ref: "#/components/schemas/VideoConfigOption"
    VideoFeedResponse:
      type: object
      required: [videos, sort, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        sort:
          type: string
          enum: [recent, popular, trending]
          description: The ordering actually applied (normalised from the request).
        scope:
          type: string
          enum: [local, all]
          description: >-
            The feed scope actually applied (normalised from the request);
            present on the public feed only. "all" mixes federated remote
            videos (remote:true cards) into the feed.
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    VideoSearchResponse:
      type: object
      required: [query, videos, limit, offset]
      properties:
        query:
          type: string
          example: go concurrency
        videos:
          type: array
          items:
            $ref: "#/components/schemas/Video"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    WatchProgressRequest:
      type: object
      required: [position_seconds]
      properties:
        position_seconds:
          type: integer
          format: int32
          minimum: 0
          description: Playback position in whole seconds.
          example: 42
    WatchProgress:
      type: object
      required: [video_id, position_seconds]
      properties:
        video_id:
          type: string
          format: uuid
        position_seconds:
          type: integer
          format: int32
          description: The caller's saved resume position in whole seconds (0 when none).
          example: 42
    HistoryItem:
      description: >-
        A watch-history card: a video card plus the caller's saved resume
        position and when they last watched it.
      allOf:
        - $ref: "#/components/schemas/Video"
        - type: object
          required: [position_seconds, watched_at]
          properties:
            position_seconds:
              type: integer
              format: int32
              description: The caller's saved resume position in whole seconds.
              example: 42
            watched_at:
              type: string
              format: date-time
              description: When the caller last watched this video.
    WatchHistoryResponse:
      type: object
      required: [videos, limit, offset]
      properties:
        videos:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    NotificationActor:
      type: object
      required: [username, display_name]
      properties:
        username:
          type: string
        display_name:
          type: string
    Notification:
      type: object
      required: [id, type, read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [follow, comment, message, report_resolved, video_rejected, caption_ready]
          description: What happened. follow = someone followed your channel; comment = someone commented on your video; message = someone sent you a direct message; report_resolved = a moderator resolved an abuse report you filed; video_rejected = a moderator rejected your quarantined upload (video_id/video_title carry which one; the moderator's identity is never included); caption_ready = an auto-generated caption track finished for your video (video_id/video_title carry which one).
        read:
          type: boolean
        created_at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/NotificationActor"
        channel_handle:
          type: string
          description: Followed channel's handle (follow notifications).
        channel_display_name:
          type: string
          description: Followed channel's display name (follow notifications).
        video_id:
          type: string
          format: uuid
          description: Commented video's id (comment notifications).
        video_title:
          type: string
          description: Commented video's title (comment notifications).
        comment_id:
          type: string
          format: uuid
          description: The comment's id (comment notifications).
        conversation_id:
          type: string
          format: uuid
          description: The conversation's id (message notifications) — link to the thread.
        report_id:
          type: string
          format: uuid
          description: The resolved report's id (report_resolved notifications). The resolving moderator's identity is never included (actor is absent for this type).
        report_status:
          type: string
          enum: [open, accepted, rejected]
          description: The report's resolution outcome (report_resolved notifications).
        report_target_type:
          type: string
          enum: [video, comment, account]
          description: What the resolved report targeted (report_resolved notifications).
    NotificationListResponse:
      type: object
      required: [notifications, unread_count, limit, offset]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unread_count:
          type: integer
          format: int64
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    UnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          format: int64
          example: 3
    NotificationPrefsResponse:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Every known notification type mapped to whether it is delivered to
            this user. Types with no stored preference default to true.
          additionalProperties:
            type: boolean
          example: { caption_ready: true, comment: true, follow: false, message: true, report_resolved: true, video_rejected: true }
    UpdateNotificationPrefsRequest:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          description: >-
            Partial map of notification type -> enabled. Only the types present
            are changed. Known types: caption_ready, comment, follow, message,
            report_resolved, video_rejected. An unknown type rejects the whole
            update (422).
          additionalProperties:
            type: boolean
          minProperties: 1
          example: { follow: false }
    Playlist:
      type: object
      required: [id, title, description, visibility, video_count, has_thumbnail, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Watch later picks
        description:
          type: string
        visibility:
          type: string
          enum: [public, unlisted, private]
        video_count:
          type: integer
          format: int64
          description: Number of public, published videos in the playlist.
        has_thumbnail:
          type: boolean
          description: Whether an uploaded cover image is available at GET /playlists/{id}/thumbnail.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlaylistListResponse:
      type: object
      required: [playlists]
      properties:
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/Playlist"
    PlaylistDetailResponse:
      description: A playlist's fields plus its ordered public, published video cards.
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          required: [videos]
          properties:
            videos:
              type: array
              items:
                $ref: "#/components/schemas/Video"
    CreatePlaylistRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [public, unlisted, private]
          description: Defaults to "private" when omitted.
    UpdatePlaylistRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        visibility:
          type: string
          enum: [public, unlisted, private]
    AddPlaylistItemRequest:
      type: object
      required: [video_id]
