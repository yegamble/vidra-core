              $ref: "#/components/schemas/EmbedPrivacy"
      responses:
        "200":
          description: The stored embed-privacy policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedPrivacy"
        "400":
          description: An unknown status, an invalid whitelist, or domains with a non-whitelist status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/webm:
    get:
      operationId: getVideoWebM
      summary: Get a video's progressive VP9/WebM alternate
      description: >-
        Streams the progressive VP9/WebM alternate produced when
        TRANSCODING_VP9_ENABLED is on, with HTTP Range/206 support. Same
        visibility as /original; absent (VP9 disabled or not yet produced) → 404.
        It is also listed by the /download endpoint (kind "webm").
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The full VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: A byte range of the VP9/WebM file.
          content:
            video/webm:
              schema:
                type: string
                format: binary
        "404":
          description: No such video (or not visible), or no VP9/WebM alternate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/view:
    post:
      operationId: recordVideoView
      summary: Record a view of a video
      description: >-
        Records a view for the video, de-duplicated per viewer within a window
        (Redis SETNX over the user id when authenticated, else the client IP,
        hashed). Visibility mirrors the detail endpoint (private → owner only,
        else 404); non-published videos are accepted but not counted. Always
        returns 204 whether or not the view was newly counted. The running total
        is exposed as `views` on the detail endpoint.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The view ping was accepted.
        "404":
          description: No such video, or private and not yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/file:
    post:
      operationId: uploadVideoFile
      summary: Upload a video's original file
      description: >-
        Uploads the original media file for a video (owner only) as a multipart
        form with a single "file" part, stores it via the configured storage
        backend, then finalises the video: it is published (or, if a configured
        media probe rejects it, marked failed). Re-uploading replaces the previous
        original. A non-owner or unknown id is reported as 404 so a private video's
        existence is not leaked. The file extension must be an accepted video
        container (otherwise 415); the body must be within UPLOAD_MAX_SIZE
        (otherwise 413); when a storage quota applies to the caller, a file
        that would not fit is rejected before storing (422 quota_exceeded).
        Real transcoding into multiple renditions happens in a later stage;
        for now the original is the playable source.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The original media file.
      responses:
        "201":
          description: >-
            The file was stored and the video finalised. video.state is
            "published" on success, or "failed" if the media probe rejected it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "400":
          description: The multipart "file" field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The uploaded file exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The file extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            Storing the file would exceed the caller's storage quota (code
            quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/uploads:
    get:
      operationId: listMyUploads
      summary: List the caller's active resumable uploads (server-side resume)
      description: >-
        Lists the caller's ACTIVE (unfinished, unexpired) resumable upload
        sessions, each with its received-chunk count — the server-side resume
        contract (UPLOAD-03). A client that lost its localStorage (a refresh, or
        a different device) reconstructs its in-progress uploads from here, then
        continues each with PUT /api/v1/uploads/{upload_id}/chunks/{n}. The
        optional fingerprint query narrows the list to sessions whose
        file_fingerprint matches, so a client can ask "am I already uploading
        this exact file?". Only the caller's own sessions are ever returned.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: fingerprint
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
          description: >-
            Narrow the list to sessions with this exact file_fingerprint (the
            opaque identity supplied at create time). Omit to list all active
            sessions.
      responses:
        "200":
          description: The caller's active resumable uploads (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveUploadsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/upload-session:
    post:
      operationId: createUploadSession
      summary: Open a resumable (chunked) upload session
      description: >-
        Opens a chunked/resumable upload for a video's original file (owner
        only). The declared size, filename extension, and the caller's storage
        quota are validated UP FRONT: a non-video extension is 415, a size beyond
        UPLOAD_MAX_SIZE is 413, and a size that would exceed the caller's quota is
        422 (code quota_exceeded). Returns the upload id, the fixed chunk size to
        send (every chunk but the last must be exactly this many bytes), the total
        number of chunks, and the 24h session expiry. Upload each chunk with PUT
        /api/v1/uploads/{upload_id}/chunks/{n}, then POST
        /api/v1/uploads/{upload_id}/complete to assemble and finalise the video
        through the same pipeline as a direct upload. Non-owner/unknown video → 404.


        BATCH GUARD (UPLOAD-10): a caller may hold at most
        UPLOAD_MAX_ACTIVE_SESSIONS_PER_USER active (unfinished, unexpired) upload
        sessions at once (instance default 5; 0 disables the limit). Opening one
        past the cap is 429 with the stable code too_many_active_uploads — a
        batch-upload client should queue and retry once an in-flight session
        completes or is cancelled (either frees a slot). This is a fairness guard,
        not a security boundary; batching stays client-orchestrated over these
        per-video session endpoints (there is no /uploads/batch surface).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadSessionRequest"
      responses:
        "201":
          description: The resumable upload session was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSessionResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The declared size exceeds UPLOAD_MAX_SIZE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: The filename extension is not an accepted video container.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The body is invalid (size must be > 0, filename required) or the file
            would exceed the caller's storage quota (code quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            The caller already holds UPLOAD_MAX_ACTIVE_SESSIONS_PER_USER active
            upload sessions (code too_many_active_uploads). Queue and retry after
            an in-flight session completes or is cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getUploadSession
      summary: Get a resumable upload's progress (the resume contract)
      description: >-
        Returns which chunk indices have landed and the byte total so far — the
        contract a client reads to know which chunks to (re)send after an
        interruption. Owner only; non-owner/unknown session → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The session's received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: cancelUploadSession
      summary: Cancel a resumable upload
      description: >-
        Cancels an in-progress upload and drops its chunk blobs. Owner only;
        non-owner/unknown → 404. Idempotent (cancelling an already-finished
        session still 204s).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session was cancelled (or was already finished).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/chunks/{n}:
    put:
      operationId: putUploadChunk
      summary: Upload one chunk of a resumable upload
      description: >-
        Stores one chunk (the raw request body) at index n for a session the
        caller owns. Every chunk but the last must be exactly chunk_size bytes;
        the last is the remainder. Idempotent: re-PUTting an index overwrites it.
        Returns the updated received-chunk status. Non-owner/unknown session →
        404; a session that already completed/cancelled → 409; an out-of-range
        index or wrong-sized chunk → 422; a chunk larger than its slot → 413.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: n
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
          description: The zero-based chunk index.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: The raw chunk bytes.
      responses:
        "200":
          description: The chunk was stored; the updated received-chunk status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadStatusResponse"
        "400":
          description: The chunk index is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The session already completed or was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: The chunk is larger than the required size for its index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The chunk index is out of range or its size does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: completeUploadSession
      summary: Complete a resumable upload
      description: >-
        Assembles the session's chunks in order and runs them through the same
        AttachOriginal → Process pipeline as a direct upload (probe/scan/
        quarantine/transcode), then marks the session completed and drops its
        chunk blobs. Returns the finalised video exactly like the direct upload
        (video.state is "published", or "failed" if a configured probe rejected
        it). Owner only; non-owner/unknown → 404; already finished → 409;
        missing/mismatched chunks → 422.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: upload_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: The upload was assembled and the video finalised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadVideoFileResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such session, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The session already completed or was cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            One or more chunks are missing or the wrong size, or completing would
            exceed the caller's storage quota (code quota_exceeded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/import:
    post:
      operationId: importVideoFile
      summary: Enqueue a URL import of a video's original file
      description: >-
        Enqueues an ASYNCHRONOUS import of a remote media file by URL (owner
        only) and returns 202 with the queued job — it no longer blocks on the
        fetch. Ownership is checked before any job is created, so a non-owner or
        unknown video is 404 and nothing runs on their behalf. The URL is
        validated up front (http/https only, no literal non-public address); a
        missing/malformed/non-public URL is 422. A background worker then performs
        the SSRF-guarded fetch (loopback, private, link-local, CGNAT, and
        cloud-metadata addresses refused at connection time, so DNS rebinding and
        internal redirects are blocked too), enforces UPLOAD_MAX_SIZE and the
        caller's storage quota, and runs the bytes through the same
        AttachOriginal → Process pipeline as a direct upload
        (probe/scan/quarantine/transcode). Poll GET /api/v1/videos/{id}/import
        for progress (resolver + stage). A single import runs per video at a
        time: while one is in flight, re-posting returns the same job.


        The optional `resolver` selects the fetch mechanism (auto|direct|ytdlp).
        The yt-dlp platform extractor is sandboxed and OFF by default
        (YTDLP_IMPORT_ENABLED): an explicit resolver=ytdlp is refused with 503
        when the deployment has not wired it; auto simply never falls back to
        it. When the extractor IS wired but the admin has turned the platform
        path off at runtime (import_http_enabled, config-parity W8), an
        explicit resolver=ytdlp is 403 with the stable code feature_disabled
        instead, and auto never falls back to yt-dlp while it is off.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportVideoRequest"
      responses:
        "202":
          description: The import was enqueued (or the in-flight job was returned).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            URL imports are disabled on this instance (imports_enabled off), or
            resolver=ytdlp was requested while the platform import path is
            turned off at runtime (import_http_enabled). Stable code
            feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The URL is missing, malformed, not a public http(s) URL, or the
            resolver is not one of auto|direct|ytdlp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The requested resolver is disabled on this instance (e.g.
            resolver=ytdlp while YTDLP_IMPORT_ENABLED is off). Stable code
            service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getVideoImport
      summary: Get a video's URL-import status
      description: >-
        Returns the most recent URL-import job for a video (owner only). state is
        pending, running, done, or failed; on failure `error` is a safe,
        human-readable reason (never a raw internal error or the source URL).
        Non-owner/unknown video → 404; a video that was never imported → 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest import job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or not owned by the caller), or no import exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs:
    post:
      operationId: createChannelSync
      summary: Create a channel auto-sync
      description: >-
        Binds a LOCAL channel you own to an external platform channel URL so a
        periodic worker mirrors that channel's recent uploads into yours. Each
        not-yet-seen upload becomes a private draft video plus a sandboxed
        `ytdlp` URL import, so downloaded bytes land through the same
        AttachOriginal → Process (scan/probe/transcode) pipeline as any other
        ingest — nothing is servable before the ClamAV scan. Synced videos are
        created PRIVATE for you to review and publish; the instance never
        auto-publishes mirrored content.


        OFF by default: when the runtime admin settings (channel_sync_enabled,
        or the import_http_enabled platform-import path it rides on;
        config-parity W8) turn the feature off this endpoint returns 403 with
        the stable code feature_disabled; when the deployment lacks the yt-dlp
        import resolver (YTDLP_IMPORT_ENABLED) it returns 503. The external URL
        is SSRF-validated (http/https only, no literal non-public address). At
        most channel_sync_max_per_user syncs per user (default
        CHANNEL_SYNC_MAX_PER_USER; 0 = unlimited).
      tags: [channels]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelSyncRequest"
      responses:
        "201":
          description: The channel sync was created (due to run on the next tick).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSyncResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Channel auto-sync is turned off at runtime (channel_sync_enabled or
            import_http_enabled). Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An identical (channel, external URL) sync already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >-
            The external URL is missing, malformed, or not a public http(s) URL,
            or the caller is at the per-user channel-sync limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The deployment lacks the yt-dlp import resolver
            (YTDLP_IMPORT_ENABLED off), so channel auto-sync cannot run. Stable
            code service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listChannelSyncs
      summary: List your channel auto-syncs
      description: >-
        Returns the authenticated user's channel syncs (newest first), each with
        its state (waiting_first_run, syncing, idle, failed), last_sync_at, and a
        safe last_error.
      tags: [channels]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's channel syncs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelSyncListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs/{id}:
    delete:
      operationId: deleteChannelSync
      summary: Delete a channel auto-sync
      description: >-
        Removes a channel sync you own (its dedupe ledger cascades away). A
        sync you do not own, or an unknown id, is 404.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The channel sync was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel sync, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channel-syncs/{id}/sync-now:
    post:
      operationId: syncChannelNow
      summary: Trigger a channel auto-sync now
      description: >-
        Schedules an owned sync to run on the next worker tick (a manual refresh
        between cadence runs). A server-side cooldown (CHANNEL_SYNC_COOLDOWN,
        measured from the last completed run) throttles repeat triggers: a request
        inside the window is rejected 429 with a Retry-After header. 403
        feature_disabled when the runtime admin settings turn the feature off;
        503 when the deployment lacks the yt-dlp resolver; 404 when the sync is
        unknown or not owned.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: The sync was scheduled to run on the next tick.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Channel auto-sync is turned off at runtime (channel_sync_enabled or
            import_http_enabled). Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel sync, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: >-
            The sync ran too recently — the server-side cooldown has not elapsed.
            Stable code rate_limited; carries a Retry-After header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The deployment lacks the yt-dlp import resolver, so channel
            auto-sync cannot run. Stable code service_unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions/auto:
    post:
      operationId: requestAutoCaption
      summary: Request an auto-generated caption track (Whisper)
      description: >-
        Enqueues an ASYNCHRONOUS auto-caption job for a video (owner only) and
        returns 202 with the queued job. A background worker extracts the audio
        (ffmpeg → 16 kHz mono WAV), sends it to the configured Whisper
        transcription service, renders the result to WebVTT, and stores it via
        the same replace-by-language path as a manual caption upload — then
        notifies the owner (a caption_ready notification, honoring preferences).
        `language` is optional (defaults to WHISPER_DEFAULT_LANGUAGE); it is both
        the caption's language tag and the transcription hint. Ownership is
        checked before any job is created, so a non-owner or unknown video is
        404. Auto-captioning turned off at runtime (transcription_enabled,
        config-parity W8) → 403 feature_disabled; the Whisper boot capability
        missing (no WHISPER_ENDPOINT) → 503; a malformed language tag → 422; a
        job already pending/running for the video → 409. Poll GET
        /api/v1/videos/{id}/captions/auto for progress.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutoCaptionRequest"
      responses:
        "202":
          description: The auto-caption job was enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Auto-captioning is turned off at runtime (transcription_enabled).
            Stable code feature_disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An auto-caption job is already in progress for this video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The language tag is malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            The Whisper boot capability is not configured on this deployment
            (WHISPER_ENDPOINT), so auto-captioning cannot run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getAutoCaption
      summary: Get a video's auto-caption job status
      description: >-
        Returns the most recent auto-caption (Whisper) job for a video (owner
        only). state is pending, running, done, or failed; on failure `error` is
        a safe, human-readable reason (never a raw internal error or the Whisper
        endpoint URL). Non-owner/unknown video → 404; a video that never
        requested auto-captioning → 404.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's latest auto-caption job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionJobResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video (or not owned by the caller), or no auto-caption job exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions:
    get:
      operationId: listCaptions
      summary: List a video's caption tracks
      description: >-
        Returns the WebVTT caption tracks for a public, published video (metadata
        only; fetch the file from the per-language endpoint). No auth required. A
        non-public/unpublished or unknown video is 404.
      tags: [captions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video's caption tracks (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionListResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: uploadCaption
      summary: Upload a caption track
      description: >-
        Uploads (or replaces) a WebVTT caption track for a video owned by the
        caller. Multipart form with `file` (the .vtt), `language` (a BCP-47-ish
        tag, e.g. en or pt-BR), and optional `label`. Non-owner/unknown video is
        404; a bad language or non-WebVTT file is 422.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, language]
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: The caption track was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Caption"
        "400":
          description: The multipart file field is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid language tag or non-WebVTT file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/captions/{lang}:
    get:
      operationId: downloadCaption
      summary: Download a caption track (WebVTT)
      description: >-
        Serves the WebVTT file for a public, published video's caption in the
        given language. No auth required. An unknown video or language is 404.
      tags: [captions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The WebVTT caption file.
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: No such public video or caption.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCaption
      summary: Remove a caption track
      description: >-
        Removes a caption track for a language from a video owned by the caller.
        Non-owner/unknown video is 404. Idempotent.
      tags: [captions]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: lang
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The caption track is removed (or was already absent).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/comments:
    get:
      operationId: listComments
      summary: List a video's comments
      description: >-
        Returns a public, published video's comments newest-first, each with its
        author's identity. Auth is optional: an authenticated viewer's muted
        accounts are hidden from the list (mutes are per-viewer), while an
        anonymous viewer sees all comments. A non-public/unpublished or unknown
        video is 404. Paginated via limit (1–100, default 20) and offset.
      tags: [comments]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of comments (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createComment
      summary: Post a comment on a video
      description: Adds a comment by the authenticated user to a public, published video.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  maxLength: 2000
                  description: The comment text.
                parent_id:
                  type: string
                  format: uuid
                  description: >-
                    Optional. The id of the comment being replied to; it must be a
                    comment on the same video. Omit (or null) for a top-level
                    comment. A malformed or cross-video parent_id is a 422.
      responses:
        "201":
          description: The created comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/comments/{id}:
    patch:
      operationId: updateComment
      summary: Edit a comment
      description: >-
        Edits the caller's own comment body. Only the author may edit (moderators
        delete, not edit): another user's comment is 403, an unknown id is 404, and
        a blank or too-long body is 422. Bumps updated_at so `edited` becomes true.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentRequest"
      responses:
        "200":
          description: The edited comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The comment belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteComment
      summary: Delete a comment
      description: >-
        Deletes a comment. The comment's author may always delete it; a
        moderator/admin may delete anyone's. An unknown id is 404; a non-author
        non-moderator is 403.
      tags: [comments]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The comment is deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The comment belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/rating:
    get:
      operationId: getVideoRating
      summary: Get a video's like/dislike summary
      description: >-
        Returns a public, published video's like and dislike counts, plus the
        caller's own rating (like, dislike, or null) when signed in. A
        non-public/unpublished or unknown video is 404.
      tags: [ratings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setVideoRating
      summary: Set or change your rating for a video
      description: Records the caller's like/dislike for a public, published video.
      tags: [ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [like, dislike]
      responses:
        "200":
          description: The updated rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: The rating value is not 'like' or 'dislike'.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearVideoRating
      summary: Clear your rating for a video
      description: Removes the caller's like/dislike (idempotent); returns the updated summary.
      tags: [ratings]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The updated rating summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoRating"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/saved:
    get:
      operationId: listSavedVideos
      summary: List the caller's saved videos
      description: >-
        Returns the caller's saved ("watch later") videos as discovery cards,
        newest-saved first. Only public, published saved videos are returned.
        Paginated via limit (1–100, default 20) and offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of saved videos (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/save:
    post:
      operationId: saveVideo
      summary: Save a video to your library
      description: >-
        Adds a public, published video to the caller's library (idempotent). A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video is saved.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unsaveVideo
      summary: Remove a video from your library
      description: Removes a video from the caller's library (idempotent).
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video is no longer saved.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history:
    get:
      operationId: listWatchHistory
      summary: List the caller's watch history
      description: >-
        Returns the caller's watch history as discovery cards, most-recently
        watched first, each carrying the saved resume position (position_seconds)
        and the time last watched (watched_at). Only public, published videos are
        returned. Paginated via limit (1–100, default 20) and offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of watch-history cards (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearWatchHistory
      summary: Clear the caller's entire watch history
      description: Removes all of the caller's watch history (idempotent).
      tags: [videos]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The watch history is cleared.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history/{id}:
    delete:
      operationId: deleteWatchHistoryEntry
      summary: Remove a single video from the caller's watch history
      description: >-
        Removes one video from the caller's watch history (idempotent). No
        public-video check, so a user can always clean up an entry.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The video's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The entry is removed (or was already absent).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/watch-progress:
    get:
      operationId: getWatchProgress
      summary: Get the caller's resume position for a video
      description: >-
        Returns the caller's saved resume position (position_seconds) for a
        public, published video — 0 when none has been recorded. A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The caller's saved resume position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchProgress"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: recordWatchProgress
      summary: Record the caller's resume position for a video
      description: >-
        Records (upserts) the caller's playback position for a public, published
        video and moves it to the top of their watch history. A
        non-public/unpublished or unknown video is 404.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchProgressRequest"
      responses:
        "204":
          description: The resume position is recorded.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such public, published video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (e.g. a negative position).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications:
    get:
      operationId: listNotifications
      summary: List the caller's notifications
      description: >-
        Returns the caller's notifications, newest first, plus the current unread
        count. Each carries the actor's identity and type-dependent context
        (channel for follows, video for comments). Set unread=true to return only
        unread notifications. Paginated via limit (1–100, default 20) and offset.
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: unread
          in: query
          required: false
          description: When true, return only unread notifications.
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of notifications (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      summary: Get the caller's unread notification count
      description: Returns just the caller's unread notification count (for a badge).
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The unread count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCountResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all the caller's notifications read
      description: Marks every unread notification read (idempotent).
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: All notifications are marked read.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification read
      description: >-
        Marks one of the caller's notifications read (idempotent). An unknown id,
        or one belonging to another user, is 404.
      tags: [notifications]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The notification is marked read.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such notification for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/notification-prefs:
    get:
      operationId: getNotificationPrefs
      summary: Get the caller's notification preferences
      description: >-
        Returns the caller's per-type notification switchboard: every known
        notification type (caption_ready, comment, follow, message,
        report_resolved, video_rejected) mapped to whether it is delivered.
        Types never configured default to enabled.
      tags: [notifications]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNotificationPrefs
      summary: Update the caller's notification preferences
      description: >-
        Applies a partial preference update: only the types present in the body
        are changed. Disabling a type suppresses new notifications of that type
        at creation time (existing notifications are unaffected). An unknown
        type is 422 and nothing is written. Returns the full updated map.
      tags: [notifications]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPrefsRequest"
      responses:
        "200":
          description: The full updated notification preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefsResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Empty update or unknown notification type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/player-settings:
    get:
      operationId: getPlayerSettings
      summary: Get the caller's player settings
      description: >-
        Returns the signed-in user's effective player defaults (PLAY-07): whether
        the next video autoplays, the default playback speed, the default quality,
        and whether captions / theater mode start on. Always 200 with the full
        object — a user who never saved gets the built-in defaults (no 404). The
        custom player hydrates from this on load, replacing its interim local
        storage.
      tags: [videos]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's effective player settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSettings"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePlayerSettings
      summary: Update the caller's player settings
      description: >-
        Merge-update the signed-in user's player defaults. Every field is
        optional; an omitted field keeps its stored value (or the default, for a
        user who never saved), and a supplied field replaces it. The first update
        creates the row. Returns the full effective object. Validation is 400:
        default_speed must be one of the shared playback rates
        (0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3, 3.5, 4) and
        default_quality must be "auto" or a rendition height like "720p".
      tags: [videos]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerSettingsRequest"
      responses:
        "200":
          description: The full effective player settings after the merge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSettings"
        "400":
          description: >-
            Malformed body, or an invalid default_speed / default_quality.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/playlists:
    post:
      operationId: createPlaylist
      summary: Create a playlist
