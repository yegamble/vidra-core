  /api/v1/admin/reports:
    get:
      operationId: listReports
      summary: List the moderation queue
      description: >-
        Returns abuse reports, newest first, with the reporter and target
        context, plus a `total` counting the reports that match the same status
        filter. Restricted to moderators/admins.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            Which half of the queue to return. `open` is unresolved; `resolved`
            is everything already accepted or rejected; `all` (the default, and
            what an absent parameter means) is both. An unrecognised value is a
            400 — it previously meant "all", so `?status=resolved` silently
            returned the entire queue.
          schema:
            type: string
            enum: [open, resolved, all]
            default: all
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of reports (possibly empty).
          content:
