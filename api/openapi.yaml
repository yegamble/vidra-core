  /api/v1/admin/videos/{id}/approve:
    post:
      operationId: approveQuarantinedVideo
      summary: Approve a quarantined upload
      description: >-
        Releases a quarantined video by publishing it through the real publish
        transition — the federation announce and the HLS transcode enqueue fire
        at approval time, exactly as on a direct publish. Restricted to
        moderators/admins. Only a video currently in the quarantined state can
        be approved (this is not a general-purpose publish button). Audited.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video was approved and is now published.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not a moderator or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The video is not in the quarantined state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/videos/{id}/reject:
    post:
      operationId: rejectQuarantinedVideo
      summary: Reject a quarantined upload
      description: >-
        Fails a quarantined video: it never publishes and no publish side
        effects run. The owner is notified (a video_rejected notification; the
        moderator's identity is not exposed) and the optional reason is
        recorded in the audit trail. Restricted to moderators/admins. Only a
        video currently in the quarantined state can be rejected. Audited.
      tags: [moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectQuarantinedVideoRequest"
      responses:
        "204":
          description: The video was rejected (state failed) and the owner notified.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller is not a moderator or admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The video is not in the quarantined state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed (reason too long).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
