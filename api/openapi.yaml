          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such channel, or not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/stats:
    get:
      operationId: getAccountStats
      summary: Creator statistics across all channels the caller owns
      description: >-
        Account-level analytics rollup for the authenticated user: engagement
        totals summed across every channel they OWN, the aggregated 30-day
        daily-views series (zero-filled, oldest first, UTC days), and a
        per-channel breakdown (each with all-time views, follower count, video
        count, and trailing-28-day views). Owner-scoped by construction — only
        the caller's own channels are included. Powers the studio "All channels"
        analytics scope.
