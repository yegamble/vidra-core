  /api/v1/videos/{id}/recommendations:
    get:
      operationId: getVideoRecommendations
      summary: Related-videos rail for a watch page
      description: >-
        Related recommendations for a video from the search service
        (search-service W4); falls back to a server-side same-channel +
        same-category heuristic when the service is unavailable or returns
        nothing. Optional auth.
      tags: [search]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        "200":
          description: A related-videos rail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsResponse"
  /api/v1/me/search-history:
    get:
      operationId: getMySearchHistory
      summary: Get my search history
      description: >-
        Returns the caller's stored search history from the search service
        (search-service W4). Requires auth. Answers 403 feature_disabled when an
        admin has switched smart search off (search_service_enabled) — a
        deliberate, permanent state — and 503 search_unavailable when the
        service is unwired or unreachable, never a fake empty history.
      tags: [search]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: The caller's search history.
          content:
            application/json:
              schema:
                type: object
                required: [entries, limit, offset]
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        query:
                          type: string
                        normalized_query:
                          type: string
                        last_used_at:
                          type: string
                          format: date-time
                        use_count:
                          type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Smart search is switched off on this instance
            (search_service_enabled). Stable code feature_disabled — a
            deliberate operator state, distinct from the 503 outage below, so
            a client must render it as unavailable rather than offering a
            retry that can never succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The search service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearMySearchHistory
      summary: Clear my entire search history
      description: >-
        Clears the caller's entire search history in the search service
        (search-service W4). Requires auth. Answers 403 feature_disabled when an
        admin has switched smart search off (search_service_enabled), and 503
        search_unavailable when the service is down — the delete must not
        silently fail.
      tags: [search]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: History cleared.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Smart search is switched off on this instance
            (search_service_enabled). Stable code feature_disabled — a
            deliberate operator state, distinct from the 503 outage below, so
            a client must render it as unavailable rather than offering a
            retry that can never succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The search service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/search-history/{query}:
    delete:
      operationId: deleteMySearchHistoryEntry
      summary: Delete a single search-history entry
      description: >-
        Removes one normalized query from the caller's search history
        (search-service W4). Requires auth. Answers 403 feature_disabled when an
        admin has switched smart search off (search_service_enabled), and 503
        search_unavailable when the service is down.
      tags: [search]
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: path
          required: true
          description: The normalized query string to remove (path-escaped).
          schema:
            type: string
      responses:
        "204":
          description: Entry removed.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Smart search is switched off on this instance
            (search_service_enabled). Stable code feature_disabled — a
            deliberate operator state, distinct from the 503 outage below, so
            a client must render it as unavailable rather than offering a
            retry that can never succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The search service is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history:
    get:
      operationId: listWatchHistory
      summary: List the caller's watch history
      description: >-
        Returns the caller's watch history as discovery cards, most-recently
        watched first, each carrying the saved resume position (position_seconds)
        and the time last watched (watched_at). Only public, published videos are
        returned. Paginated via limit (1–100, default 20) and offset. The
        optional progress filter restricts the list to the "Continue watching"
        subset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: progress
          in: query
          required: false
          description: >-
            When set to in_progress, returns only "Continue watching" entries:
            videos the caller has started (position_seconds >= 5) but not
            effectively finished (< 95% of a known duration). Any other value or
            omission returns the full history.
          schema:
            type: string
            enum: [in_progress]
      responses:
        "200":
          description: A page of watch-history cards (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchHistoryResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearWatchHistory
      summary: Clear the caller's entire watch history
      description: Removes all of the caller's watch history (idempotent).
      tags: [videos]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: The watch history is cleared.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/history/{id}:
    delete:
      operationId: deleteWatchHistoryEntry
      summary: Remove a single video from the caller's watch history
      description: >-
        Removes one video from the caller's watch history (idempotent). No
        public-video check, so a user can always clean up an entry.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The video's id.
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The entry is removed (or was already absent).
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/watch-progress:
    get:
      operationId: getWatchProgress
      summary: Get the caller's resume position for a video
      description: >-
        Returns the caller's saved resume position (position_seconds) for a
        public, published video — 0 when none has been recorded. A
