  /api/v1/me/subscriptions:
    get:
      operationId: listFollowedChannels
      summary: List the local channels the caller follows
      description: >-
        The authenticated user's "FOLLOWING" list: the LOCAL channels they
        follow, most recently followed first, each with the channel's total
        follower_count and the followed_at timestamp. Remote-channel follows are
        listed separately at GET /me/remote-follows. Paginated via limit (1–100,
        default 20) and offset.
      tags: [channels]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of followed channels (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowedChannelsResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me/subscriptions/videos:
    get:
      operationId: listSubscriptionVideos
      summary: List videos from the channels the user follows
      description: >-
        The authenticated user's "subscriptions" feed: public, published videos
        from the LOCAL channels they follow UNIONed with the ingested remote
        videos of their ACCEPTED remote-channel follows (see
        /me/remote-follows), newest first, with discovery-card data. Remote
        entries are remote:true cards carrying the origin domain and
        watch/stream URLs. Videos from accounts the user has muted are hidden;
        remote videos from instances the user has muted (or that the admin has
        blocked) are hidden too. Paginated via limit (1–100, default 20) and
        offset.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of videos from followed channels (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/channels/{handle}/videos:
    post:
      operationId: createVideo
      summary: Create a draft video
      description: >-
        Creates a draft video under a channel the caller owns. The video starts
        in the "draft" state; privacy defaults to "private" when omitted.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVideoRequest"
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: The caller does not own this channel.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listChannelVideos
      summary: List a channel's videos
      description: >-
        The channel owner (bearer token) sees all of their videos (any state);
        everyone else sees only public, published ones. Each item carries its
        view count and whether a poster image exists.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The channel's videos (possibly empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoListResponse"
        "404":
          description: No channel with that handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos:
    get:
      operationId: listPublicVideos
      summary: Public video feed
      description: >-
        The cross-channel public video feed. Only public, published videos appear
        (drafts/processing/failed are excluded). Each item carries its view count
        and whether a poster image exists. Auth is optional: an authenticated
        viewer's muted accounts' videos are hidden from the feed (per-viewer);
        an anonymous viewer sees all. Videos of accounts that opted out of
        discovery (User.unlisted) never appear. scope=all additionally mixes in
        federated remote videos (remote:true cards with origin domain and
        watch/stream URLs); remote cards respect the admin instance blocklist
        and an authenticated viewer's instance mutes, and drop out whenever a
        tag/category/language filter is active (remote videos carry no local
        taxonomy). Optional filters narrow the feed: tag (free-form tag,
        matched case-insensitively against the stored lowercased set),
        category and language (taxonomy ids from GET /videos/config — unknown
        values are 422). Ordered by sort and paginated with limit (1–100,
        default 20) and offset (>= 0).
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: sort
          in: query
          required: false
          description: >-
            Ordering: recent (newest first), popular (most all-time views), or
            trending (views decayed by age). Unknown values fall back to recent.
          schema:
            type: string
            enum: [recent, popular, trending]
            default: recent
        - name: scope
          in: query
          required: false
          description: >-
            Feed scope: local (this instance's videos only) or all (adds
            federated remote videos for discovery). Unknown values fall back
            to local.
          schema:
            type: string
            enum: [local, all]
            default: local
        - name: tag
          in: query
          required: false
          description: >-
            Only videos carrying this free-form tag (case-insensitive exact
            match; at most 50 characters).
          schema:
            type: string
            maxLength: 50
        - name: category
          in: query
          required: false
          description: >-
            Only videos with this subject-category id (see GET /videos/config).
            Unknown value -> 422.
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: >-
            Only videos with this content-language code (see GET /videos/config).
            Unknown value -> 422.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of public videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoFeedResponse"
        "422":
          description: Unknown category/language, or an over-long tag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/config:
    get:
      operationId: getVideoConfig
      summary: Video-metadata taxonomy (categories, licenses, languages, privacies)
      description: >-
        The static, public taxonomy the frontend reads to populate its
        video-metadata dropdowns: subject categories and content licenses (ids
        match PeerTube's for import compatibility), a curated set of content
        languages (ISO 639-1 codes), and the privacy values. No auth; cacheable.
      tags: [videos]
      security:
        - {}
      responses:
        "200":
          description: The selectable video-metadata taxonomy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoConfigResponse"
  /api/v1/videos/search:
    get:
      operationId: searchVideos
      summary: Search public videos by title or tag
      description: >-
        Fuzzy (trigram) search over public, published video titles, ranked by
        similarity then recency. A video also matches when one of its free-form
        tags contains the query (case-insensitive); tag-only matches rank after
        title matches. Videos of accounts that opted out of discovery
        (User.unlisted) never appear. Ingested federated remote videos are
        UNIONed in by title match as remote:true cards (origin domain +
        watch/stream URLs); they respect the admin instance blocklist and an
        authenticated viewer's instance mutes. Each result carries its view
        count and whether a poster image exists. Auth is optional: an
        authenticated viewer's muted accounts' videos are hidden from results
        (per-viewer); an anonymous viewer sees all. Requires a non-empty q
        (<= 100 chars); paginated with limit (1–100, default 20) and offset
        (>= 0).

        Remote-URI search (config-parity W13): a URI-shaped ("https://…") or
        handle-shaped ("@user@host" / "user@host") first-page query is
        additionally resolved to remote content through the federation
        machinery (WebFinger/actor/object fetch, SSRF-guarded), gated per auth
        state by search_remote_uri_users (default on) /
        search_remote_uri_anonymous (default off) and rate-limited per caller
        (10 resolutions/minute by default). Resolution runs CONCURRENTLY with
        the local search under a strict ~2.5s deadline, so ordinary searches
        are unaffected and a slow origin delays the response by at most that
        deadline. A resolved remote video/channel/account rides the additive
        `remote` array; anything unresolvable (bad target, blocked domain,
        timeout, exhausted budget) silently yields local-only results. The
        100-char q cap applies to shaped queries too — longer URLs are 400,
        as before.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tag
          in: query
          required: false
          description: Narrow to a free-form tag (matched case-insensitively). Excludes remote results.
          schema:
            type: string
            maxLength: 50
        - name: category
          in: query
          required: false
          description: Narrow to a taxonomy category id (from GET /videos/config); unknown values are 422. Excludes remote results.
          schema:
            type: string
        - name: language
          in: query
          required: false
          description: Narrow to a taxonomy language id (from GET /videos/config); unknown values are 422. Excludes remote results.
          schema:
            type: string
      responses:
        "200":
          description: A page of matching public videos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoSearchResponse"
        "400":
          description: Missing or too-long q.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: An unknown category or language filter value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}:
    get:
      operationId: getVideo
      summary: Get a video by id
      description: >-
        Public and unlisted videos are returned to anyone with the id. A private
        or non-public-state local video is returned to its owner and to an
        authenticated moderator/admin, allowing the Manage view to load
        metadata for private, scheduled, quarantined, and blocked videos; to
        ordinary non-owners it is reported as 404 so its existence is not
        revealed. This moderator/admin exception applies only to this metadata
        detail endpoint and does not widen media or playback routes. A
        password-protected video (privacy=password, CORE-17) returns 401 with
        error code "password_required" to a caller who is neither the owner nor
        a moderator/admin and is not presenting a valid playback token (a plain
        unknown id is still 404); the caller then unlocks via POST
        /videos/{id}/unlock and retries with the token (Bearer or ?pt=). The
        response includes probed
        technical metadata (duration_seconds, width, height) when a media probe
        has recorded it.
      tags: [videos]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: >-
            The video is password protected and the caller presented no valid
            credential (owner/moderator/admin token or playback token). Error
            code "password_required".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No video with that id, or it is not visible to this ordinary
            non-owner caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateVideo
      summary: Update a video
      description: >-
        Partial update of a video's metadata (title, description, privacy and
        the other fields in UpdateVideoRequest). The owner may update their own
        video; moderators and admins may manage any local video. An ordinary
        non-owner or unknown id is reported as 404 so a private video's existence
        is not leaked. The handle is immutable.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVideoRequest"
      responses:
        "200":
          description: The updated video.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Video"
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No such video, or the caller is neither its owner nor a
            moderator/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVideo
      summary: Delete a video
      description: >-
        Deletes a local video. The owner may delete their own video;
        moderators and admins may delete any local video. An ordinary non-owner
        or unknown id is reported as 404. The destructive audit event records
        the authenticated caller as its actor, including for managed deletes.
      tags: [videos]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The video was deleted.
        "401":
          description: Missing, invalid, or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: >-
            No such video, or the caller is neither its owner nor a
            moderator/admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/videos/{id}/stats:
    get:
      operationId: getVideoStats
      summary: Creator statistics for a video (owner only)
      description: >-
        Engagement totals (views, likes, dislikes, comments) plus a 30-day
        daily-views series (zero-filled, oldest first, UTC days) for one video.
        Owner only: a non-owner or unknown id is reported as 404 so the video's
