      operationId: deleteReport
      summary: Hard-delete a report
      description: >-
        Permanently removes a report row (admin purge). Restricted to admins —
        moderators resolve reports but cannot delete them. Idempotent like the
        other admin deletes: deleting an unknown or already-deleted report still
        returns 204. Notifications referencing the report are removed with it.
        Audited as moderation.report.delete.
      tags: [moderation]
      security:
        - bearerAuth: []
