          format: uuid
        video_id:
          type: string
          format: uuid
        video_title:
          type: string
        body:
          type: string
        author_username:
          type: string
        author_display_name:
          type: string
        remote:
          type: boolean
          description: True for a federated comment authored on another instance.
        author_domain:
          type: string
          description: The remote author's origin instance; omitted for local comments.
        created_at:
          type: string
          format: date-time
        deleted:
          type: boolean
          description: >-
            True for a tombstoned comment (its author's account was permanently
            deleted); body renders as "[deleted]".
    AdminCommentListResponse:
      type: object
      required: [comments, limit, offset]
      properties:
        comments:
          type: array
          items:
            $ref: "#/components/schemas/AdminComment"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    WatchedWord:
      type: object
      description: A term on the instance-wide watched-words list.
      required: [id, word, created_at]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
        created_by_username:
          type: string
          description: Username of the moderator who added it; omitted on the create response or if that account was deleted.
        created_at:
          type: string
          format: date-time
    WatchedWordListResponse:
      type: object
      required: [words, limit, offset]
      properties:
        words:
          type: array
          items:
            $ref: "#/components/schemas/WatchedWord"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    WatchedWordMatch:
      type: object
      description: >-
        Content flagged by the watched-words list, for moderator review: a
        comment (type "comment"; comment_id/comment_body present, video_id is
        the video it is on) or a video (type "video"; comment fields absent,
        video_id/video_title are the flagged video). author_username is the
        comment's author or the video's owner respectively.
      required: [id, word, type, video_id, video_title, author_username, created_at]
      properties:
        id:
          type: string
          format: uuid
        word:
          type: string
          description: The watched term that matched.
        type:
          type: string
          enum: [comment, video]
          description: What was flagged.
        comment_id:
          type: string
          format: uuid
          description: The flagged comment (comment matches only).
        comment_body:
          type: string
          description: The flagged comment's body (comment matches only).
        video_id:
          type: string
          format: uuid
          description: The flagged video, or the video the flagged comment is on.
        video_title:
          type: string
          description: The video's title (a link target for the review queue).
        author_username:
          type: string
        created_at:
          type: string
          format: date-time
    WatchedWordMatchListResponse:
      type: object
      required: [matches, limit, offset]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/WatchedWordMatch"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    CreateWatchedWordRequest:
      type: object
      required: [word]
      properties:
        word:
          type: string
          maxLength: 100
    AdminUser:
      type: object
      description: Admin projection of an account (never includes the password hash).
      required: [id, username, email, role, is_active, email_verified, bypass_quarantine, display_name, storage_quota_bytes, storage_used_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
        bypass_quarantine:
          type: boolean
          description: >-
            Whether this account is exempt from the QUARANTINE_NEW_UPLOADS
            gate — its uploads publish directly like a moderator's.
        display_name:
          type: string
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          description: >-
            Per-user storage quota override in bytes. null = the instance
            default (INSTANCE_DEFAULT_QUOTA_BYTES) applies; 0 = unlimited for
            this account.
        storage_used_bytes:
          type: integer
          format: int64
          description: >-
            The account's current storage usage: total stored bytes of its
            video files (originals, renditions, thumbnails) across the videos
            owned via its channels.
        created_at:
          type: string
          format: date-time
    AdminUserListResponse:
      type: object
      required: [users, limit, offset]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    QuotaStatus:
      type: object
      description: >-
        The caller's storage picture: bytes currently stored and the effective
        quota (per-user override, else the instance default). quota_bytes is
        null when the caller is unlimited.
      required: [used_bytes, quota_bytes]
      properties:
        used_bytes:
          type: integer
          format: int64
          description: >-
            Total stored bytes of the caller's video files (originals,
            renditions, thumbnails) across the videos owned via their channels.
        quota_bytes:
          type: [integer, "null"]
          format: int64
          description: Effective storage quota in bytes; null = unlimited.
    DeleteAccountRequest:
      type: object
      description: >-
        Password confirmation for the irreversible account hard delete (a
        stolen access token alone must not be able to destroy the account).
      required: [password]
      properties:
        password:
          type: string
          format: password
    AccountExportStatus:
      type: object
      description: The status of the caller's most recent account export job.
      required: [id, state, download_ready, requested_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
          description: >-
            pending/running while the archive is being assembled; done once
            downloadable; failed after the job exhausted its retries.
        download_ready:
          type: boolean
          description: >-
            True when GET /api/v1/me/export/download will serve the archive
            (state done and not yet expired).
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
          description: >-
            When the finished archive stops being downloadable (7 days after
            completion); null while the export has not finished.
    AccountArchive:
      type: object
      description: >-
        A vidra account export archive (format version 1): the user's own data
        as one JSON document. Contains NO password hash and NO tokens. Media
        files are not bundled — each video entry carries
        original_download_url, the (owner-gated) API URL of its original file,
        valid while the account and video exist. This same shape is what
        POST /api/v1/me/import accepts.
      required: [vidra_export, profile]
      properties:
        vidra_export:
          type: object
          description: Format marker.
          required: [version, generated_at]
          properties:
            version:
              type: integer
              description: Archive format version (currently 1).
            generated_at:
              type: string
              format: date-time
            instance:
              type: string
              description: Public origin of the exporting instance.
        profile:
          type: object
          required: [username, email, display_name, bio, unlisted, email_verified, created_at]
          properties:
            username:
              type: string
            email:
              type: string
            display_name:
              type: string
            bio:
              type: string
            unlisted:
              type: boolean
            email_verified:
              type: boolean
            created_at:
              type: string
              format: date-time
        notification_prefs:
          type: array
          items:
            type: object
            required: [type, enabled]
            properties:
              type:
                type: string
              enabled:
                type: boolean
        channels:
          type: array
          description: Owned channels (metadata only; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              handle:
                type: string
              display_name:
                type: string
              description:
                type: string
              created_at:
                type: string
                format: date-time
        videos:
          type: array
          description: >-
            Owned videos' metadata including taxonomy and tags (media not
            bundled; not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              channel_handle:
                type: string
              title:
                type: string
              description:
                type: string
              privacy:
                type: string
              state:
                type: string
              category:
                type: [string, "null"]
              language:
                type: [string, "null"]
              license:
                type: [string, "null"]
              tags:
                type: array
                items:
                  type: string
              publish_at:
                type: [string, "null"]
                format: date-time
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
              original_download_url:
                type: string
                description: >-
                  Where the video's original file can be downloaded (media is
                  not bundled in the archive).
        playlists:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              description:
                type: string
              visibility:
                type: string
              video_ids:
                type: array
                items:
                  type: string
              created_at:
                type: string
                format: date-time
        comments:
          type: array
          description: The account's own comments (not re-created by import).
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              video_id:
                type: string
                format: uuid
              body:
                type: string
              created_at:
                type: string
                format: date-time
              updated_at:
                type: string
                format: date-time
        follows:
          type: array
          items:
            type: object
            properties:
              channel_id:
                type: string
                format: uuid
              channel_handle:
                type: string
              followed_at:
                type: string
                format: date-time
        saved_videos:
          type: array
          description: Watch-later entries (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              saved_at:
                type: string
                format: date-time
        watch_history:
          type: array
          description: Watch history with resume positions (not re-created by import).
          items:
            type: object
            properties:
              video_id:
                type: string
                format: uuid
              position_seconds:
                type: integer
              watched_at:
                type: string
                format: date-time
    AccountImportSummary:
      type: object
      description: >-
        What POST /api/v1/me/import re-created (safe subsets only) and what it
        skipped.
      required:
        - profile_applied
        - playlists_created
        - playlist_items_added
        - playlist_items_skipped
        - follows_created
        - follows_skipped
        - notification_prefs_applied
        - notification_prefs_skipped
        - skipped_sections
      properties:
        profile_applied:
          type: boolean
          description: True when display_name/bio were applied from the archive.
        playlists_created:
          type: integer
        playlist_items_added:
          type: integer
        playlist_items_skipped:
          type: integer
          description: Items whose video does not exist on this instance.
        follows_created:
          type: integer
        follows_skipped:
          type: integer
          description: Follows of channels not present locally.
        notification_prefs_applied:
          type: integer
        notification_prefs_skipped:
          type: integer
          description: Preferences for notification types this build does not know.
        skipped_sections:
          type: object
          description: >-
            Counts of archive entries that are not importable in v1, keyed by
            section (channels, videos, comments, saved_videos, watch_history,
            playlists).
          additionalProperties:
            type: integer
    LiveStream:
      type: object
      required: [id, channel_id, title, description, privacy, state, permanent, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        privacy:
          type: string
          enum: [public, unlisted, private]
        state:
          type: string
          enum: [offline, live, ended]
          description: RTMP ingestion (a later boundary) flips this; starts offline.
        permanent:
          type: boolean
          description: A permanent/recurring live keeps its key across sessions.
        replay_enabled:
          type: boolean
          description: >-
            When true, the media server records each session and the api
            republishes the recording as a normal on-demand video on ingest-stop
            (privacy inherited). Default false.
        started_at:
          type: string
          format: date-time
          description: >-
            When the current live session began (stamped on the transition into
            "live", cleared when it ends). Present only while the stream is live.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        channel_handle:
          type: string
          description: Owning channel handle (on the single-stream get).
        channel_display_name:
          type: string
        hls_url:
          type: string
          description: >-
            Live HLS playlist path, present only while the stream is live and a
            media server (LIVE_HLS_ROOT) is configured to serve it.
    CreateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          description: >-
            Record sessions and republish them as VODs (see
            LiveStream.replay_enabled). When OMITTED, the instance default
            (live_default_save_replay, exposed as the /instance live block's
            default_save_replay) is seeded; an explicit value always wins.
            While the instance disallows replay (live.allow_replay=false) the
            seed is always false and any stored flag produces no replay.
    UpdateLiveStreamRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        description:
          type: string
          maxLength: 5000
        privacy:
          type: string
          enum: [public, unlisted, private]
          default: public
        permanent:
          type: boolean
          default: false
        replay_enabled:
          type: boolean
          default: false
    CreateLiveStreamResponse:
      type: object
      required: [live_stream, stream_key]
      properties:
        live_stream:
          $ref: "#/components/schemas/LiveStream"
        stream_key:
          type: string
          description: The private stream key, shown ONCE. Put it in your encoder (OBS).
        rtmp_url:
          type: string
          description: RTMP ingest base URL (omitted when no ingest is configured).
    LiveStreamListResponse:
      type: object
      required: [live_streams]
      properties:
        live_streams:
          type: array
          items:
            $ref: "#/components/schemas/LiveStream"
    LiveStreamCard:
      type: object
      description: >-
        One entry of the public "Live now" listing — the minimal, truthful
        projection of a currently-live PUBLIC stream. Omits fields a discovery
        rail cannot honestly use: no privacy/state (every entry is public+live),
        no stream key, no viewer/concurrent count (no server-side counter yet —
        W4 dependency), no thumbnail (live streams have no server-generated
        poster yet).
      required: [id, title, channel_handle, channel_display_name, is_live]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        channel_handle:
          type: string
        channel_display_name:
          type: string
        started_at:
          type: string
          format: date-time
          description: When the current live session began (omitted only for pre-tracking streams).
        is_live:
          type: boolean
          description: Always true for a listing entry (discriminator for a shared card renderer).
        hls_url:
          type: string
          description: >-
            Live HLS playlist path, present only when a media server
            (LIVE_HLS_ROOT) is configured to serve it.
    LivePublicListResponse:
      type: object
      required: [live_streams, limit, offset]
      properties:
        live_streams:
          type: array
          items:
            $ref: "#/components/schemas/LiveStreamCard"
        limit:
          type: integer
        offset:
          type: integer
    LiveStreamKey:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The new stream key, shown ONCE.
        rtmp_url:
          type: string
    LiveIngestRequest:
      type: object
      required: [stream_key]
      properties:
        stream_key:
          type: string
          description: The publisher's raw stream key, as presented to the RTMP ingest.
    StartConversationRequest:
      type: object
      description: >-
        Names the other participant by EXACTLY ONE of recipient_id or
        recipient_username — providing both, or neither, is a 422 field error.
        recipient_username is resolved server-side (case-insensitive, active
        accounts only); an unknown or deactivated username is a 404, exactly
        like an unknown recipient_id, so existence is not leaked differently.
        Resolving to yourself is a 422 (cannot message yourself).
      properties:
        recipient_id:
          type: string
          format: uuid
          description: The recipient's user id. Provide this OR recipient_username, not both.
        recipient_username:
          type: string
          description: >-
            The recipient's username, resolved server-side (case-insensitive,
            active accounts only). An alternative to recipient_id — provide
            exactly one.
        encrypted:
          type: boolean
          default: false
          description: >-
            Choose the conversation type AT CREATION, immutably. An encrypted
            conversation stores only opaque per-device ciphertext envelopes
            (the server holds no keys and cannot decrypt); a plaintext one only
            {body} messages. A pair of users can have one of each — the two
            types are distinct conversations.
    Conversation:
      type: object
      required: [id, other_user_id, encrypted, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        other_user_id:
          type: string
          format: uuid
          description: The other participant's user id from the authenticated caller's perspective.
        encrypted:
          type: boolean
          description: Immutable conversation type, chosen at creation.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ConversationSummary:
      type: object
      description: "A conversation in the inbox: the other participant + last message preview (always empty for encrypted conversations — envelopes are opaque)."
      required: [id, updated_at, encrypted, other_user_id, other_username, other_display_name, last_message_body, last_message_at]
      properties:
        id:
          type: string
          format: uuid
        updated_at:
          type: string
          format: date-time
        encrypted:
          type: boolean
        other_user_id:
          type: string
          format: uuid
        other_username:
          type: string
        other_display_name:
          type: string
        other_has_avatar:
          type: boolean
          description: Whether the other participant has an avatar set (served at GET /users/{id}/avatar). Lets clients skip a guaranteed-404 avatar probe for avatar-less users.
        last_message_body:
          type: string
          description: Empty when the conversation has no messages yet, and always empty for encrypted conversations.
        last_message_at:
          type: string
          format: date-time
        unread_count:
          type: integer
          format: int64
          description: The caller's unread messages (peer messages past their read watermark).
    ConversationListResponse:
      type: object
      required: [conversations, limit, offset]
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    SendMessageRequest:
      type: object
      description: >-
        The PLAINTEXT send shape — valid only on a plaintext conversation
        (sending it to an encrypted conversation is 422, and vice versa). A
        message needs a body OR at least one attachment.
      properties:
        body:
          type: string
          maxLength: 5000
        attachment_ids:
          type: array
          maxItems: 30
          description: >-
            Ids from POST /conversations/{id}/attachments — own-uploaded, in this
            conversation, not yet sent. Up to 30 per message (Facebook-Messenger
            parity); the 31st and beyond are a 422 field error.
          items:
            type: string
            format: uuid
    EncryptedEnvelope:
      type: object
      description: >-
        One per-recipient-device ciphertext blob. The CLIENT encrypts once per
        device pair (Olm session) and fans out; the server stores each blob
        opaquely and returns it byte-identical.
      required: [recipient_device_id, message_type, ciphertext]
      properties:
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
          description: "Olm message type: 0 = prekey message, 1 = normal message."
        ciphertext:
          type: string
          maxLength: 65536
          description: Opaque ciphertext, at most 64 KiB. Never inspected or logged by the server.
    SendEncryptedMessageRequest:
      type: object
      description: >-
        The ENCRYPTED send shape — valid only on an encrypted conversation.
        One envelope per recipient device (including the sender's other
        devices); every recipient device must belong to a participant of the
        conversation, and the sender device to the caller.
      required: [sender_device_id, envelopes]
      properties:
        sender_device_id:
          type: string
          format: uuid
          description: One of the caller's registered E2EE devices.
        envelopes:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/EncryptedEnvelope"
        expires_in_seconds:
          type: integer
          format: int64
          minimum: 30
          maximum: 7776000
          description: >-
            Optional disappearing-message timer (30 seconds to 90 days). Stamps
            expires_at on every envelope; expired envelopes vanish from reads
            immediately and are hard-deleted by a background sweeper.
    SendEncryptedResponse:
      type: object
      description: Summary of an accepted encrypted send (the envelopes are not echoed back).
      required: [conversation_id, envelope_count, created_at]
      properties:
        conversation_id:
          type: string
          format: uuid
        envelope_count:
          type: integer
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present when a disappearing-message timer was set.
    EncryptedMessage:
      type: object
      description: >-
        A stored envelope, returned only to the owner of its recipient device.
        The ciphertext is byte-identical to what the sender posted — the server
        cannot decrypt it.
      required: [id, conversation_id, sender_user_id, sender_device_id, recipient_device_id, message_type, ciphertext, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_user_id:
          type: string
          format: uuid
        sender_device_id:
          type: string
          format: uuid
        recipient_device_id:
          type: string
          format: uuid
        message_type:
          type: integer
          enum: [0, 1]
        ciphertext:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Present on disappearing messages.
    EncryptedMessageListResponse:
      type: object
      description: A page of the CALLER's devices' envelopes, newest first (expired ones filtered).
      required: [envelopes, limit, offset]
      properties:
        envelopes:
          type: array
          items:
            $ref: "#/components/schemas/EncryptedMessage"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RegisterE2EEDeviceRequest:
      type: object
      required: [device_name, identity_key, signing_key]
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: User-visible label ("Ada's laptop").
        identity_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Curve25519 identity key (base64). Private keys never leave the device.
        signing_key:
          type: string
          maxLength: 512
          description: The device's PUBLIC Ed25519 signing key (base64).
    E2EEDevice:
      type: object
      description: A registered E2EE device. Carries PUBLIC key material only.
      required: [id, user_id, device_name, identity_key, signing_key, created_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_name:
          type: string
        identity_key:
          type: string
        signing_key:
          type: string
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
    E2EEDeviceListResponse:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/E2EEDevice"
    E2EEOneTimeKey:
      type: object
      description: One public one-time prekey (client-assigned key_id).
      required: [key_id, key]
      properties:
        key_id:
          type: string
          maxLength: 64
        key:
          type: string
          maxLength: 512
    UploadOneTimeKeysRequest:
      type: object
      required: [one_time_keys]
      properties:
        one_time_keys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/E2EEOneTimeKey"
    UploadOneTimeKeysResponse:
      type: object
      required: [unclaimed]
      properties:
        unclaimed:
          type: integer
          format: int64
          description: The device's unclaimed one-time-key count after the upload.
    OneTimeKeyCountResponse:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64
    E2EEClaim:
      type: object
      description: >-
        One device's claim result: its public identity plus one ATOMICALLY
        claimed (single-use) one-time key — null when the device has none left.
      required: [device_id, identity_key, signing_key, one_time_key]
      properties:
        device_id:
          type: string
          format: uuid
        identity_key:
          type: string
        signing_key:
          type: string
        one_time_key:
          description: A claimed one-time prekey, or null when the device has none left.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/E2EEOneTimeKey"
    E2EEClaimResponse:
      type: object
      required: [user_id, claims]
      properties:
        user_id:
          type: string
          format: uuid
        claims:
          type: array
          items:
            $ref: "#/components/schemas/E2EEClaim"
    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        sender_username:
          type: string
        sender_display_name:
          type: string
        sender_has_avatar:
          type: boolean
          description: Whether the sender has an avatar set (served at GET /users/{id}/avatar). Lets clients skip a guaranteed-404 avatar probe for avatar-less senders.
        body:
          type: string
          description: The message text, or "[deleted]" for a tombstoned message.
        deleted:
          type: boolean
          description: True when the sender has deleted (tombstoned) the message.
        created_at:
          type: string
          format: date-time
        attachments:
          type: array
          description: DM attachments linked to this message (metadata only; fetch the bytes at GET /api/v1/attachments/{id}).
          items:
            $ref: "#/components/schemas/DMAttachment"
        preview:
          description: OpenGraph link preview of the first URL in the body; omitted until the async fetch has resolved (optional).
          allOf:
            - $ref: "#/components/schemas/LinkPreview"
    DMAttachment:
      type: object
      required: [id, kind, content_type, filename, size_bytes]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, pdf, doc]
          description: >-
            Coarse attachment kind. "doc" covers office documents
            (DOC/DOCX/PPT/PPTX/XLS/XLSX); PDFs keep their own "pdf" kind.
        content_type:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          description: Intrinsic pixel width, present only for kind=image when probed successfully.
        height:
          type: integer
          description: Intrinsic pixel height, present only for kind=image when probed successfully.
    LinkPreview:
      type: object
      required: [url]
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
    UploadAttachmentResponse:
      type: object
      required: [attachment_id, kind, content_type, filename, size_bytes]
      properties:
        attachment_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [image, video, audio, pdf, doc]
          description: >-
            Coarse attachment kind. "doc" covers office documents
            (DOC/DOCX/PPT/PPTX/XLS/XLSX); PDFs keep their own "pdf" kind.
        content_type:
          type: string
        filename:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          description: Intrinsic pixel width, present only for kind=image when probed successfully.
        height:
          type: integer
          description: Intrinsic pixel height, present only for kind=image when probed successfully.
    MarkConversationReadRequest:
      type: object
      description: Optionally pins the read watermark to a specific message; when absent the newest message is used.
      properties:
        message_id:
          type: string
          format: uuid
    MessagingPrefs:
      type: object
      required: [read_receipts]
      properties:
        read_receipts:
          type: boolean
          description: When false, the caller's read watermark is hidden from peers.
    UpdateMessagingPrefsRequest:
      type: object
      properties:
        read_receipts:
          type: boolean
    MessageListResponse:
      type: object
      required: [messages, limit, offset]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        peer_last_read_message_id:
          type: string
          format: uuid
          description: The other participant's read watermark, for a "seen" indicator. Omitted when they have read nothing or disabled read receipts.
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    AuditLogEntry:
      type: object
      description: >-
        A durable, low-volume security-audit envelope. Metadata and changes are
        allowlisted and bounded; raw payloads, content, email/IP data, signed URLs,
        headers, cookies, credentials, and process output are forbidden. Routine
        high-volume content activity and job execution events use separate streams.
      required: [id, schema_version, domain, action, result, actor_kind, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        schema_version:
          type: integer
          minimum: 1
          description: Audit-envelope schema version (2 for newly written typed events).
        domain:
          type: string
          maxLength: 64
          description: Stable action domain, such as auth, moderation, admin, or content.
        action:
          type: string
          maxLength: 160
          description: Stable dot-namespaced action id (e.g. auth.login).
          example: auth.login
        result:
          type: string
          enum: [success, failure]
          description: The outcome of the attempted action.
        actor_id:
          type: string
          format: uuid
          description: The acting account's id; omitted for unauthenticated events.
        actor_kind:
          type: string
          enum: [anonymous, user, system, service]
          description: Safe actor snapshot kind at event time.
        actor_role:
          type: string
          enum: [user, moderator, admin]
          description: Safe authorization-role snapshot; present only for a known user actor.
        actor_username:
          type: string
          description: Current username resolved best-effort at read time; not part of the durable actor snapshot.
        reason:
          type: string
          maxLength: 512
          description: Safe, bounded classification (e.g. invalid_credentials), never moderator/user prose.
        request_id:
          type: string
          maxLength: 128
        correlation_id:
          type: string
          maxLength: 128
        trace_id:
          type: string
          pattern: '^[0-9a-fA-F]{32}$'
        pipeline_run_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        resource_type:
          type: string
          maxLength: 64
        resource_id:
          type: string
          maxLength: 512
          description: Bounded opaque identifier; URLs are forbidden.
        metadata:
          type: object
          description: Allowlisted bounded scalar classifications only.
          additionalProperties:
            type: string
            maxLength: 256
        changes:
          type: array
          maxItems: 32
          description: Allowlisted safe before/after scalar differences; content fields are forbidden.
          items:
            $ref: "#/components/schemas/AuditLogChange"
        occurred_at:
          type: string
          format: date-time
    AuditLogChange:
      type: object
      required: [field]
      properties:
        field:
          type: string
          description: Allowlisted low-sensitivity state/config field.
        before:
          type: string
          maxLength: 256
        after:
          type: string
          maxLength: 256
    AuditLogListResponse:
      type: object
      required: [entries, limit, offset]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    MediaGCRequest:
      type: object
      description: Media garbage-collection request. dry_run defaults to true.
      properties:
        dry_run:
          type: boolean
          default: true
          description: >-
            When true (default), report the would-delete orphan set without
            deleting anything. Pass false to actually delete the orphans.
    MediaGCResponse:
      type: object
      required: [dry_run, scanned, orphans, deleted]
      properties:
        dry_run:
          type: boolean
        scanned:
          type: integer
          description: Total stored objects listed across the known prefixes.
        orphans:
          type: array
          items:
            type: string
          description: Orphan object keys — the would-delete set on a dry run, the deleted set otherwise.
        deleted:
          type: integer
          description: Number of orphans actually deleted (0 on a dry run).
    AdminStats:
      type: object
      description: >-
        Instance-wide overview counts for the admin dashboard cards. Every field
        is a live COUNT/SUM; no deltas, no secrets/PII.
      required: [users, published_videos, media_stored_bytes, federated_peers, comments]
      properties:
        users:
          type: integer
          format: int64
          description: Total number of accounts (active or not).
        published_videos:
          type: integer
          format: int64
          description: Public, published videos (the local-posts total NodeInfo advertises).
        media_stored_bytes:
          type: integer
          format: int64
          description: Total stored bytes of every video file across all accounts.
        federated_peers:
          type: integer
          format: int64
          description: Distinct remote instances we have cached actors from.
        comments:
          type: integer
          format: int64
          description: Total number of local comments.
    SystemStatus:
      type: object
      description: Operational snapshot for the admin dashboard. No secrets/PII.
      required: [status, software, environment, uptime_seconds, components, rate_limits]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        software:
          type: object
          required: [name, version, commit, build_date, go_version]
          properties:
            name:
              type: string
              example: vidra
            version:
              type: string
              example: 0.1.0
            commit:
              type: string
            build_date:
              type: string
            go_version:
              type: string
        environment:
          type: string
          enum: [development, test, production]
        uptime_seconds:
          type: integer
          format: int64
        components:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status:
                type: string
                description: ok | down | not_configured
              error:
                type: string
        rate_limits:
          type: object
          description: >-
            The effective, non-secret rate-limit configuration in force. Rate
            limits are a deploy-time capacity decision (RATE_LIMIT_* /
            AUTH_RATE_LIMIT_* env), surfaced here read-only so an operator can
            confirm what is applied — there is no runtime mutation endpoint (see
            product-decisions §3).
          required: [enabled, requests, auth_requests, window_seconds]
          properties:
            enabled:
              type: boolean
            requests:
              type: integer
              description: General per-IP request budget over the window.
            auth_requests:
              type: integer
              description: Stricter per-IP budget for sensitive auth endpoints.
            window_seconds:
              type: integer
              format: int64
              description: The shared fixed-window length in seconds.
    JobRunState:
      type: string
      description: Stable state vocabulary for the unified operational projection.
      enum:
        - queued
        - claimed
        - running
        - retry_scheduled
        - succeeded
        - failed
        - dead_lettered
        - cancel_requested
        - cancelled
    JobMetadata:
      type: object
      description: >-
        Bounded, allowlisted operational metadata. Values are short scalar
        booleans/numbers/enum-like tokens only; URLs, credentials, emails, nested
        payloads, process output, and arbitrary source data are rejected.
      additionalProperties: false
      properties:
        mode: { type: string, maxLength: 128 }
        resolver: { type: string, maxLength: 128 }
        language: { type: string, maxLength: 128 }
        media_class: { type: string, maxLength: 128 }
        network: { type: string, maxLength: 128 }
        dry_run: { type: boolean }
        conflict_policy: { type: string, maxLength: 128 }
        source_version: { type: number, minimum: 0 }
        planned: { type: number, minimum: 0 }
        imported: { type: number, minimum: 0 }
        skipped: { type: number, minimum: 0 }
        failed: { type: number, minimum: 0 }
        unsupported: { type: number, minimum: 0 }
        width: { type: number, minimum: 0 }
        height: { type: number, minimum: 0 }
        duration_seconds: { type: number, minimum: 0 }
        bytes: { type: number, minimum: 0 }
        items: { type: number, minimum: 0 }
        reason_code: { type: string, maxLength: 128 }
    JobRun:
      type: object
      description: >-
        One sanitized execution projection. Source queue identifiers, lease
        tokens, idempotency keys, raw inputs, and unrestricted errors are not exposed.
      required:
        - id
        - type
        - queue
        - state
        - priority
        - attempt
        - input_metadata
        - output_metadata
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        pipeline_run_id: { type: string, format: uuid }
        parent_job_id: { type: string, format: uuid }
        type: { type: string, maxLength: 128 }
        queue: { type: string, maxLength: 128 }
        state: { $ref: "#/components/schemas/JobRunState" }
        stage: { type: string, maxLength: 128 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        priority: { type: integer, format: int32 }
        attempt: { type: integer, format: int32, minimum: 0 }
        max_attempts: { type: integer, format: int32, minimum: 1 }
        actor_id: { type: string, format: uuid }
        resource_type: { type: string, maxLength: 64 }
        resource_id: { type: string, maxLength: 255 }
        request_id: { type: string, maxLength: 128 }
        correlation_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 32 }
        worker_id: { type: string, maxLength: 255 }
        lease_expires_at: { type: string, format: date-time }
        heartbeat_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        claimed_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        input_metadata: { $ref: "#/components/schemas/JobMetadata" }
        output_metadata: { $ref: "#/components/schemas/JobMetadata" }
        error_class: { type: string, maxLength: 64 }
        error_code: { type: string, maxLength: 128 }
        error_detail:
          type: string
          maxLength: 2048
          description: Bounded redacted detail; never raw subprocess/network output.
        error_retryable: { type: boolean }
    JobEvent:
      type: object
      description: One durable sanitized execution transition.
      required: [id, cursor, job_id, kind, state, attempt, metadata, occurred_at]
      properties:
        id: { type: string, format: uuid }
        cursor:
          type: string
          pattern: "^[0-9]+$"
          description: Opaque BIGINT replay cursor serialized as a decimal string.
        job_id: { type: string, format: uuid }
        pipeline_run_id: { type: string, format: uuid }
        kind: { type: string, maxLength: 128 }
        state: { $ref: "#/components/schemas/JobRunState" }
        stage: { type: string, maxLength: 128 }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        attempt: { type: integer, format: int32, minimum: 0 }
        worker_id: { type: string, maxLength: 255 }
        message: { type: string, maxLength: 1024 }
        metadata: { $ref: "#/components/schemas/JobMetadata" }
        request_id: { type: string, maxLength: 128 }
        correlation_id: { type: string, maxLength: 128 }
        trace_id: { type: string, maxLength: 32 }
        occurred_at: { type: string, format: date-time }
    JobRunsResponse:
      type: object
      required: [runs, total, limit, offset, event_cursor]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/JobRun" }
        total: { type: integer, format: int64, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }
        event_cursor:
          type: string
          pattern: "^[0-9]+$"
    JobRunDetailResponse:
      type: object
      required: [run, events, events_total, events_limit, events_offset, event_cursor]
      properties:
        run: { $ref: "#/components/schemas/JobRun" }
        events:
          type: array
          description: Newest-first event page through event_cursor.
          items: { $ref: "#/components/schemas/JobEvent" }
        events_total: { type: integer, format: int64, minimum: 0 }
        events_limit: { type: integer, minimum: 1, maximum: 100 }
        events_offset: { type: integer, minimum: 0 }
        event_cursor:
          type: string
          pattern: "^[0-9]+$"
    JobsOverview:
      type: object
      description: >-
        Durable job-queue operations snapshot (admin jobs page). No secrets/PII.
      required: [queues, recent_failures]
      properties:
        queues:
          type: array
          items:
            $ref: "#/components/schemas/QueueStatus"
        recent_failures:
          type: array
          description: Newest-first, merged across queues, capped.
          items:
            $ref: "#/components/schemas/JobFailure"
    QueueStatus:
      type: object
      description: >-
        One queue's normalised depth. For upload_sessions (no retry model),
        pending=active, done=completed, failed=cancelled, running=0.
      required: [queue, pending, running, done, failed, oldest_pending_age_seconds]
      properties:
        queue:
          type: string
          example: transcode_jobs
        pending:
          type: integer
          format: int64
        running:
          type: integer
          format: int64
        done:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        oldest_pending_age_seconds:
          type: integer
          format: int64
          description: Age of the oldest still-pending item, or 0 when none pending.
    JobFailure:
      type: object
      description: One dead-lettered job, safe to show an operator (no secrets/URLs).
      required: [queue, id, error, attempts, failed_at]
      properties:
        queue:
          type: string
        id:
          type: string
          format: uuid
        error:
          type: string
        attempts:
          type: integer
        failed_at:
          type: string
          format: date-time
    InstanceSetting:
      type: object
      description: >-
        One runtime-mutable instance setting's effective state: its type, the
        effective value (a string for text/enum keys, a boolean for toggle
        keys, an integer for limit keys, an array of strings for list keys),
        the default, and whether the database currently overrides it. Enum-typed
        settings also list their allowed options. Every setting carries its
        admin-IA placement (page + section, config-parity W1) so the
        metadata-driven admin UI auto-places keys into the right page.
      required: [key, type, value, default, overridden, page, section]
      properties:
        key:
          type: string
          description: The stable setting key.
          example: uploads_enabled
        type:
          type: string
          enum: [string, bool, enum, list, int]
        value:
          description: The effective value (string, boolean, integer, or string array per type).
          oneOf:
            - type: string
            - type: boolean
            - type: integer
              format: int64
            - type: array
              items:
                type: string
        default:
          description: The default (string, boolean, integer, or string array per type).
          oneOf:
            - type: string
            - type: boolean
            - type: integer
              format: int64
            - type: array
              items:
                type: string
        overridden:
          type: boolean
          description: Whether a database override is currently set for this key.
        options:
          type: array
          items:
            type: string
          description: >-
            For type=enum only: the allowed values, in display order. Absent
            for other types.
        page:
          type: string
          enum: [general, vod, live, federation, customization, homepage, advanced]
          description: The admin-config page this key renders on.
        section:
          type: string
          description: The in-page section (stable snake_case label), e.g. "broadcast".
    PeerTubeImportLaunchRequest:
      type: object
      description: >-
        Launch parameters for a PeerTube import run. The source connection is
        NOT here — it comes from server config only.
      required: [mode]
      properties:
        mode:
          type: string
          enum: [dry_run, run]
          description: dry_run reports the plan and writes nothing; run performs the import.
        conflict_policy:
          type: string
          enum: [skip, rename, merge, fail]
          description: >-
            How username/handle/email/slug collisions with existing Vidra rows
            are resolved. Defaults to skip (safest, non-destructive).
    PeerTubeImportCounts:
      type: object
      description: Per-entity outcome tally.
      required: [planned, imported, skipped, failed, unsupported]
      properties:
        planned:
          type: integer
        imported:
          type: integer
        skipped:
          type: integer
        failed:
          type: integer
        unsupported:
          type: integer
    PeerTubeImportReport:
      type: object
      description: >-
        Machine-readable summary of a plan (dry-run) or run. Carries only counts,
        the detected source version, and safe conflict notes — never secrets/PII.
      required: [dry_run, conflict_policy, entities]
      properties:
        source_version:
          type: integer
          description: Detected PeerTube schema version (application.migrationVersion).
        dry_run:
          type: boolean
        conflict_policy:
          type: string
        entities:
          type: object
          description: Per-entity-kind counts, keyed by entity kind (user, channel, video, …).
          additionalProperties:
            $ref: "#/components/schemas/PeerTubeImportCounts"
        deferred:
          type: array
          description: Entity families intentionally not migrated (regenerate/reconcile by hand).
          items:
            type: string
        conflicts:
          type: array
          description: Safe, human-readable notes about resolved collisions.
          items:
            type: string
    PeerTubeImportRun:
      type: object
      description: Status view of one PeerTube import run.
      required: [id, mode, state, conflict_policy, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [dry_run, run]
        state:
          type: string
          enum: [pending, running, done, failed]
        conflict_policy:
          type: string
          enum: [skip, rename, merge, fail]
        source_version:
          type: [integer, "null"]
        report:
          $ref: "#/components/schemas/PeerTubeImportReport"
        error:
          type: string
          description: Safe, client-visible failure reason (never a DSN/credential).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    PeerTubeImportRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/PeerTubeImportRun"
    IPFSStatus:
      type: object
      description: >-
        Status of the hybrid IPFS media mirror (fix_plan P19). IPFS is a mirror
        sidecar; these fields are informational and never gate media serving.
      required: [enabled, node_reachable, gateway_url, cluster_enabled, cluster_reachable, pins, by_class, networks]
      properties:
        enabled:
          type: boolean
          description: Whether IPFS_ENABLED is set on this instance.
        node_reachable:
          type: boolean
          description: Whether the Kubo node answered the /api/v0/version health probe.
        gateway_url:
          type: string
          description: The public gateway base URL emitted in media responses.
        cluster_enabled:
          type: boolean
          description: Whether an IPFS Cluster REST API is configured for replication.
        cluster_reachable:
          type: boolean
          description: >-
            Whether the configured IPFS Cluster REST API answered its /id health
            probe. Always false when cluster_enabled is false.
        pins:
          $ref: "#/components/schemas/IPFSPinCounts"
        by_class:
          type: array
          description: Pin counts broken down per media class.
          items:
            $ref: "#/components/schemas/IPFSClassPinCounts"
        networks:
          allOf:
            - $ref: "#/components/schemas/IPFSNetworks"
          description: >-
            Per-swarm split of the mirror status (fix_plan P19.P2): the public mirror
            and the separate private replication swarm each with their own enabled
            flag, node reachability, and pin counts. The top-level pins/by_class/
            node_reachable fold across both for back-compat. Additive — private-tier
            fields are inert (enabled=false, zero counts) unless IPFS_MIRROR_PRIVATE is
            configured. Never carries a CID or gateway URL for the private swarm (it is
            replication, not distribution).
    IPFSNetworks:
      type: object
      description: The public + private swarm status blocks (fix_plan P19.P2).
      required: [public, private]
      properties:
        public:
          $ref: "#/components/schemas/IPFSNetworkStatus"
        private:
          $ref: "#/components/schemas/IPFSNetworkStatus"
    IPFSNetworkStatus:
      type: object
      description: >-
        One swarm's mirror status: whether that tier is enabled on this instance, its
        node's reachability, its optional replication-cluster health, and its pin counts
        overall and per media class. Carries no gateway URL and no CIDs.
      required: [enabled, node_reachable, cluster_enabled, cluster_reachable, pins, by_class]
      properties:
        enabled:
          type: boolean
          description: Whether this swarm's tier is configured (public = IPFS_ENABLED, private = IPFS_MIRROR_PRIVATE).
        node_reachable:
          type: boolean
          description: Whether this swarm's Kubo node answered its health probe.
        cluster_enabled:
          type: boolean
          description: >-
            Whether an IPFS Cluster REST API is configured for THIS swarm's replication
            (public = IPFS_CLUSTER_API_URL, private = IPFS_PRIVATE_CLUSTER_API_URL). The
            private cluster is a fully separate cluster on the private swarm (fix_plan P19.P3).
        cluster_reachable:
          type: boolean
          description: >-
            Whether this swarm's IPFS Cluster REST API answered its /id health probe.
            Always false when cluster_enabled is false.
        pins:
          $ref: "#/components/schemas/IPFSPinCounts"
        by_class:
          type: array
          description: This swarm's pin counts broken down per media class.
          items:
            $ref: "#/components/schemas/IPFSClassPinCounts"
    IPFSPinCounts:
      type: object
      description: Pin counts by ledger state.
      required: [pinned, pending, failed, unpinned]
      properties:
        pinned:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        unpinned:
          type: integer
          format: int64
    IPFSClassPinCounts:
      type: object
      description: Pin counts for one media class.
      required: [media_class, pinned, pending, failed, unpinned]
      properties:
        media_class:
          type: string
          description: e.g. video_original, hls, thumbnail, user_avatar.
        pinned:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        unpinned:
          type: integer
          format: int64
    IPFSReconcileResult:
      type: object
      description: >-
        Result of an IPFS reconciliation scan: how many pin intents were enqueued,
        overall and per media class. Idempotent — a second run enqueues zero.
      required: [enqueued, by_class]
      properties:
        enqueued:
          type: integer
          format: int64
          description: Total pin intents enqueued by this scan.
        by_class:
          type: object
          description: Enqueued counts keyed by media class.
          additionalProperties:
            type: integer
            format: int64
    InstanceSettingsResponse:
      type: object
      required: [settings]
      properties:
        settings:
          type: array
          items:
            $ref: "#/components/schemas/InstanceSetting"
    InstanceHomepageResponse:
      type: object
      description: >-
        The admin-authored homepage document (config-parity W1): RAW markdown
        plus its sha256 content hash.
      required: [body, hash]
      properties:
        body:
          type: string
          description: Raw markdown; the client renders/sanitises.
        hash:
          type: string
          description: Lowercase-hex sha256 of the body.
    InstanceDocumentResponse:
      type: object
      description: >-
        One instance document's stored state (admin editor shape). A never-set
        or cleared document has an empty body and hash.
      required: [name, body, hash]
      properties:
        name:
          type: string
          enum: [homepage, custom_css, custom_js]
        body:
          type: string
        hash:
          type: string
          description: Lowercase-hex sha256 of the body ("" when unset).
    UpdateInstanceDocumentRequest:
      type: object
      description: >-
        The new document body. An empty string clears the document (public
        delivery 404s while unset). Caps: homepage 100KB; custom_css/custom_js
        200KB.
      required: [body]
      properties:
        body:
          type: string
    UpdateInstanceSettingsRequest:
      type: object
      description: >-
        A flat object of setting key → new value. Toggle keys take a boolean;
        text/markdown/link and enum keys take a string; limit keys (quota, upload
        size/sessions, import resolution) take an integer; list keys take an array
        of strings. A null value clears the override (reset to the config default).
        Only the keys present are changed. At least one key is required. Limit
        changes take effect on the next request/job (no restart).
      additionalProperties:
        description: >-
          The new value: a string for text/markdown/link/enum keys, a boolean for
          toggle keys, an integer for limit keys, an array of strings for list
          keys, or null to clear the override (reset to the config default).
        oneOf:
          - type: string
          - type: boolean
          - type: integer
            format: int64
          - type: array
            items:
              type: string
          - type: "null"
      example:
        instance_name: My Vidra
        uploads_enabled: false
        downloads_enabled: false
        sensitive_content_policy: blur
        instance_categories: ["1", "7"]
        upload_max_size_bytes: 2147483648
        terms_url: null
    UpdateUserRequest:
      type: object
      description: Partial update; provide at least one field.
      properties:
        role:
          type: string
          enum: [user, moderator, admin]
        is_active:
          type: boolean
        email_verified:
          type: boolean
          description: >-
            Admin-set email verification state: true marks the address
            confirmed without the token round-trip; false revokes the
            confirmation. Omit to leave unchanged.
        bypass_quarantine:
          type: boolean
          description: >-
            Exempts the account from the QUARANTINE_NEW_UPLOADS gate (its
            uploads publish directly); false re-subjects it. Omit to leave
            unchanged.
        storage_quota_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: >-
            Per-user storage quota in bytes. Omit to leave unchanged; null
            resets the account to the instance default; 0 makes the account
            unlimited. Negative or non-integer values are 422.
    VideoFile:
      type: object
      description: >-
        A stored file backing a video. The storage key is internal and not
        exposed.
      required: [id, kind, content_type, original_name, size_bytes, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [original, rendition]
        content_type:
          type: string
          description: The client-declared MIME type (untrusted, for display only).
          example: video/mp4
        original_name:
          type: string
          description: The client-declared filename (untrusted, for display only).
          example: Clip.MP4
        size_bytes:
          type: integer
          format: int64
          description: Number of bytes actually stored.
          example: 10485760
        created_at:
          type: string
          format: date-time
    UploadVideoFileResponse:
      type: object
      required: [video, file]
      properties:
        video:
          $ref: "#/components/schemas/Video"
        file:
          $ref: "#/components/schemas/VideoFile"
    ImportVideoRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: >-
            Public http/https URL of the media file (direct) or platform watch
            page (ytdlp) to import. The server refuses non-http schemes and
            non-public addresses (SSRF-guarded) before any fetch.
          example: https://example.com/clip.mp4
        resolver:
          type: string
          enum: [auto, direct, ytdlp]
          default: auto
          description: >-
            How to fetch the source. `auto` (default) tries a direct media fetch
            (by extension/Content-Type) and falls back to the sandboxed yt-dlp
            platform extractor when it is enabled. `direct` forces a plain
            HTTP(S) media fetch. `ytdlp` forces the platform extractor and is
            refused with 503 when YTDLP_IMPORT_ENABLED is off on this instance.
    ImportJob:
      type: object
      description: An asynchronous URL-import job for a video's original file.
      required: [id, video_id, state, resolver, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, running, done, failed]
        resolver:
          type: string
          enum: [auto, direct, ytdlp]
          description: >-
            The mechanism the worker used. `auto` is the transient requested
            value until the worker resolves it, then it is rewritten to the
            concrete `direct` or `ytdlp` that actually ran.
        stage:
          type: string
          enum: [resolving, downloading, processing]
          description: >-
            Coarse progress while state is running (omitted otherwise): resolving
            (picking the concrete resolver for an auto request), downloading
            (fetching the bytes), processing (scan/probe/transcode). Never
            carries a secret.
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            source URL.
        attempts:
          type: integer
          description: How many times the import has been attempted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ImportJobResponse:
      type: object
      required: [import_job]
      properties:
        import_job:
          $ref: "#/components/schemas/ImportJob"
    CreateChannelSyncRequest:
      type: object
      required: [channel_id, external_channel_url]
      properties:
        channel_id:
          type: string
          format: uuid
          description: The LOCAL channel (owned by the caller) to mirror uploads into.
        external_channel_url:
          type: string
          description: >-
            Public http/https URL of the external platform channel to mirror.
            SSRF-validated before use; a non-public address is refused.
          example: https://www.youtube.com/@example
    ChannelSync:
      type: object
      description: A binding that mirrors an external channel's uploads into a local channel.
      required: [id, channel_id, external_channel_url, state, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        external_channel_url:
          type: string
        state:
          type: string
          enum: [waiting_first_run, syncing, idle, failed]
          description: >-
            waiting_first_run (never synced), syncing (a run is in progress),
            idle (last run succeeded), failed (last run errored; see last_error).
        last_sync_at:
          type: string
          format: date-time
          description: When the last successful run completed (omitted until the first run).
        last_error:
          type: string
          description: >-
            A safe, human-readable reason for the last failed run (omitted when
            empty). Never a raw internal error or credentials.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelSyncResponse:
      type: object
      required: [channel_sync]
      properties:
        channel_sync:
          $ref: "#/components/schemas/ChannelSync"
    ChannelSyncListResponse:
      type: object
      required: [channel_syncs]
      properties:
        channel_syncs:
          type: array
          items:
            $ref: "#/components/schemas/ChannelSync"
    AutoCaptionRequest:
      type: object
      description: >-
        Optional body for an auto-caption request. When language is omitted the
        server uses WHISPER_DEFAULT_LANGUAGE.
      properties:
        language:
          type: string
          description: >-
            BCP-47-ish caption language tag (e.g. en, pt-BR). It is both the tag
            the generated track is stored under and the transcription hint.
          example: en
    CaptionJob:
      type: object
      description: An asynchronous auto-caption (Whisper) job for a video.
      required: [id, video_id, language, state, attempts, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        language:
          type: string
          description: The caption language tag the generated track is stored under.
        state:
          type: string
          enum: [pending, running, done, failed]
        error:
          type: string
          description: >-
            A safe, human-readable failure reason (present only when state is
            failed or a retry is pending). Never a raw internal error or the
            Whisper endpoint URL.
        attempts:
          type: integer
          description: How many times the auto-caption has been attempted.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CaptionJobResponse:
      type: object
      required: [caption_job]
      properties:
        caption_job:
          $ref: "#/components/schemas/CaptionJob"
    CreateUploadSessionRequest:
      type: object
      required: [size, filename]
      properties:
        size:
          type: integer
          format: int64
          minimum: 1
          description: The total size of the file to upload, in bytes.
          example: 104857600
        filename:
          type: string
          description: >-
            The client filename; its extension must be an accepted video
            container (validated up front).
          example: clip.mp4
        file_fingerprint:
          type: string
          maxLength: 128
          description: >-
            Optional OPAQUE client identity for the file, used for cross-refresh
            / cross-device resume (see GET /api/v1/me/uploads). Recommended
            recipe: a SHA-256 hex digest over the file size concatenated with its
            first and last 1 MiB. Stored verbatim (<=128 chars) and never parsed
            by the server — only compared. Omit or leave empty to supply none.
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
    UploadSessionResponse:
      type: object
      description: The opened resumable upload session.
      required: [upload_id, chunk_size, total_chunks, size, expires_at]
      properties:
        upload_id:
          type: string
          format: uuid
        chunk_size:
          type: integer
          description: >-
            The fixed chunk size in bytes (8 MiB). Every chunk but the last must
            be exactly this many bytes.
        total_chunks:
          type: integer
          description: How many chunks to upload (indices 0 … total_chunks-1).
        size:
          type: integer
          format: int64
          description: The declared total size, echoed back.
        expires_at:
          type: string
          format: date-time
          description: When the session (and its uploaded chunks) expire (24h).
    UploadStatusResponse:
      type: object
      description: A resumable upload's received-chunk status (the resume contract).
      required:
        - upload_id
        - video_id
        - state
        - size
        - chunk_size
        - total_chunks
        - received_chunks
        - bytes_received
        - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [active, completed, cancelled]
        size:
          type: integer
          format: int64
        chunk_size:
          type: integer
        total_chunks:
          type: integer
        received_chunks:
          type: array
          items:
            type: integer
          description: The chunk indices that have landed, ascending.
        bytes_received:
          type: integer
          format: int64
          description: The total bytes received across all landed chunks.
        expires_at:
          type: string
          format: date-time
    ActiveUploadsResponse:
      type: object
      description: The caller's active resumable upload sessions (UPLOAD-03).
      required: [uploads]
      properties:
        uploads:
          type: array
          items:
            $ref: "#/components/schemas/ActiveUpload"
    ActiveUpload:
      type: object
      description: >-
        One of the caller's ACTIVE resumable upload sessions, with enough to
        reconstruct/continue it after a refresh or on another device.
      required:
        - upload_id
        - video_id
        - filename
        - size
        - chunk_size
        - total_chunks
        - received_chunks
        - file_fingerprint
        - expires_at
      properties:
        upload_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        filename:
          type: string
        size:
          type: integer
          format: int64
          description: The declared total file size, in bytes.
        chunk_size:
          type: integer
          description: The fixed chunk size in bytes (every chunk but the last).
        total_chunks:
          type: integer
          description: How many chunks the file is split into.
        received_chunks:
          type: integer
          description: How many chunk indices have landed so far.
        file_fingerprint:
          type: string
          description: >-
            The opaque file identity supplied at create time (empty when none was
            provided).
        expires_at:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: ada
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        note:
          type: string
          maxLength: 2000
          description: >-
            Optional message to moderators, used only when the instance requires
            registration approval; ignored otherwise.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RegistrationPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
          description: The signup is queued for admin approval; no account exists yet.
    RegistrationRequest:
      type: object
      required: [id, username, email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        note:
          type: string
          description: Optional applicant message.
        status:
          type: string
          enum: [pending, approved, rejected]
        moderator_note:
          type: string
          description: Internal note recorded when the request was rejected.
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        reviewer_username:
          type: string
          description: Username of the admin who reviewed it; omitted while pending.
    RegistrationRequestListResponse:
      type: object
      required: [requests, limit, offset]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/RegistrationRequest"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    RejectRegistrationRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: Optional internal moderator note (not shown to the applicant).
    FederationFollowerRequest:
      type: object
      required: [id, channel_id, channel_handle, actor_url, created_at]
      description: >-
        One pending inbound ActivityPub channel Follow awaiting an admin
        decision (federation_follower_approval, config-parity W12).
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        channel_handle:
          type: string
          description: Handle of the local channel being followed.
        actor_url:
          type: string
          description: The remote follower's ActivityPub actor URL.
        handle:
          type: string
          description: >-
            The follower's cached fediverse identity
            (preferred_username@domain); omitted when the remote-actor cache
            row is gone.
        domain:
          type: string
          description: The follower's home domain; omitted when uncached.
        created_at:
          type: string
          format: date-time
    FederationFollowerRequestListResponse:
      type: object
      required: [requests, limit, offset]
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/FederationFollowerRequest"
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ada@example.test
        password:
          type: string
          format: password
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients): the rotating
            refresh token is set as an httpOnly `vidra_refresh` cookie
            (Path=/api/v1/auth, SameSite=Lax, Secure on https instances,
            Max-Age = the refresh TTL) and omitted from the response body.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: >-
            The opaque refresh token returned by register/login/refresh. May be
            omitted when the request carries the `vidra_refresh` cookie (cookie
            mode) — the cookie value is used instead. An explicit body token
            takes precedence over the cookie. 422 when neither is present.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the rotated session into cookie mode even when the token was
            sent in the body. A cookie-supplied token implies cookie mode.
    AuthResponse:
      type: object
      required: [token, token_type, expires_in, user]
      properties:
        token:
          type: string
          description: Signed HS256 JWT access token.
        refresh_token:
          type: string
          description: >-
            Opaque rotating refresh token; store securely, send to /auth/refresh.
            Omitted in cookie mode, where the httpOnly `vidra_refresh` cookie is
            the sole carrier of the refresh token.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
          example: 900
        user:
          $ref: "#/components/schemas/User"
    MFARequiredResponse:
      type: object
      required: [mfa_required, mfa_token]
      description: >-
        Login outcome for an account with two-factor authentication enabled:
        the credentials were valid but no session is issued yet. Present the
        mfa_token with a TOTP or recovery code at POST /api/v1/auth/mfa/challenge.
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
          description: >-
            Short-lived (5 min) single-purpose token. Not an access token — it
            is only accepted by the MFA challenge endpoint.
    MFAStatusResponse:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled:
          type: boolean
          description: Whether TOTP two-factor authentication is enabled.
        recovery_codes_remaining:
          type: integer
          description: Unused single-use recovery codes left (0 when disabled).
          example: 10
    TOTPEnrollmentResponse:
      type: object
      required: [secret, otpauth_uri]
      description: >-
        Returned exactly once when enrollment starts; neither field can be
        retrieved again.
      properties:
        secret:
          type: string
          description: Base32 TOTP shared secret, for manual authenticator entry.
        otpauth_uri:
          type: string
          description: >-
            otpauth:// provisioning URI (QR-code payload) carrying the secret,
            the account label, and the instance's issuer name.
    RecoveryCodesResponse:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          description: >-
            The 10 single-use recovery codes, shown exactly once (stored
            hashed). Each replaces a TOTP code at the MFA challenge and is
            consumed on use.
          items:
            type: string
            example: a1b2c-3d4e5
    MFAChallengeRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token:
          type: string
          description: The mfa_token from the login response (valid 5 minutes).
        code:
          type: string
          description: >-
            The current 6-digit authenticator code (±1 period of clock skew is
            tolerated) or one unused recovery code.
        cookie_mode:
          type: boolean
          default: false
          description: >-
            Opt the new session into cookie mode (browser clients), exactly
            like login: the rotating refresh token is set as an httpOnly
            `vidra_refresh` cookie and omitted from the response body.
