# Vidra core local development stack.
#
# Profiles let you run subsets of the stack:
#   core    -> postgres, redis, migrate, api  (default for `docker compose up`)
#   storage -> minio (S3-compatible object storage for STORAGE_BACKEND=s3)
#   scan    -> clamav (virus scanning for MALWARE_SCAN_ENABLED=true)
#   media   -> rtmp (nginx-rtmp live ingest + HLS + session recording; P12).
#              Run with LIVE_INGEST_SECRET set and LIVE_HLS_ROOT=/live-hls, e.g.
#              LIVE_INGEST_SECRET=$(openssl rand -hex 24) LIVE_HLS_ROOT=/live-hls \
#                docker compose --profile core --profile media up --build
#   otel    -> otel-collector + jaeger all-in-one (local tracing backend; P17.3).
#              Optional; NOT required by any test. Point the api at the collector
#              and turn tracing on, e.g.
#                OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317 \
#                  docker compose --profile core --profile otel up --build
#              then open the Jaeger UI at http://localhost:16686.
#
# Usage:
#   cp .env.example .env
#   docker compose --profile core up --build
#
# To run the api against MinIO instead of the local-disk backend, start the
# storage profile too and point the api at the compose-network endpoint:
#
#   STORAGE_BACKEND=s3 \
#   STORAGE_S3_ENDPOINT=minio:9000 \
#   STORAGE_S3_BUCKET=vidra-media \
#   STORAGE_S3_ACCESS_KEY=vidra \
#   STORAGE_S3_SECRET_KEY=vidra-dev-secret \
#   STORAGE_S3_USE_SSL=false \
#   STORAGE_S3_FORCE_PATH_STYLE=true \
#   docker compose --profile core --profile storage up --build
#
# (The api creates the bucket at boot if it is missing.) From the HOST (e.g.
# `make run` or the -tags=integration storage tests) use
# STORAGE_S3_ENDPOINT=localhost:9000 / S3_TEST_ENDPOINT=localhost:9000 instead.
#
# A federation profile will be added as that subsystem's local deps land.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidra}
      POSTGRES_DB: ${POSTGRES_DB:-vidra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidra} -d ${POSTGRES_DB:-vidra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local dev/tests (STORAGE_BACKEND=s3).
  # S3 API on :9000. The dev credentials below are compose-local ONLY — real
  # deployments set strong values and never commit them.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["storage"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vidra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vidra-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ClamAV virus scanner (scan profile). When enabled, run with the "scan"
  # profile and point the api at it: MALWARE_SCAN_ENABLED=true CLAMAV_ADDR=clamav:3310.
  # The clamav/clamav image bundles clamd; the first boot downloads signature
  # databases (freshclam) which can take a minute — the healthcheck waits for the
  # daemon to accept connections.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # Whisper transcription server (captions profile). When enabled, run with the
  # "captions" profile and point the api at it:
  #   WHISPER_ENABLED=true WHISPER_ENDPOINT=http://whisper:8080 \
  #     docker compose --profile core --profile captions up
  # This uses the whisper.cpp server image, which exposes the /inference endpoint
  # the WhisperClient POSTs audio to. It needs a GGML model file: on first run,
  # download one into the whisper_models volume, e.g.
  #   docker compose run --rm --entrypoint sh whisper -c \
  #     "wget -O /models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
  # then start the profile. The command below serves that ggml-base model on :8080.
  # The profile is OPTIONAL and not required by any default test.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ["captions"]
    ports:
      - "${WHISPER_PORT:-8090}:8080"
    volumes:
      - whisper_models:/models
    command:
      - "whisper-server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/ggml-base.bin"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Waits for minio only when the storage profile is active (required: false
      # skips the dependency when the service is not enabled).
      minio:
        condition: service_healthy
        required: false
      # Waits for clamav only when the scan profile is active.
      clamav:
        condition: service_healthy
        required: false
      # Waits for whisper only when the captions profile is active.
      whisper:
        condition: service_healthy
        required: false
    environment:
      VIDRA_ENV: ${VIDRA_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INSTANCE_NAME: ${INSTANCE_NAME:-Vidra (dev)}
      # Default per-user storage quota in bytes (0/unset = unlimited). Admins can
      # override per account via PATCH /api/v1/admin/users/{id}.
      INSTANCE_DEFAULT_QUOTA_BYTES: ${INSTANCE_DEFAULT_QUOTA_BYTES:-0}
      # Rate limiting is on by default. End-to-end / backend-backed test runs set
      # RATE_LIMIT_ENABLED=false so the auth limiter (10/min per IP) doesn't throttle
      # a suite that makes many register/login calls from one host. Rate limiting
      # has dedicated unit tests, so the e2e suite need not exercise it.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # When true, signups file a pending registration request an admin must
      # approve (the registration approval queue). Overridable so approval-mode
      # backed e2e runs can flip it without editing the file. Default off.
      REGISTRATION_REQUIRE_APPROVAL: ${REGISTRATION_REQUIRE_APPROVAL:-false}
      # OAuth/OIDC login providers (comma list; disabled when empty). Compose has
      # no wildcard passthrough, so each named provider's OAUTH_<NAME>_ISSUER /
      # _CLIENT_ID / _CLIENT_SECRET (+ optional _SCOPES) must also be added here
      # for your provider names. PUBLIC_BASE_URL is required when any provider
      # is set. The client secret is a secret: never commit a real value.
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      # Real outbound email over SMTP (password reset / email verification).
      # SMTP_HOST + SMTP_FROM are required when enabled; SMTP_PASSWORD is a
      # secret (never commit/log it). DEV_MAIL_CAPTURE_ENABLED wins when both
      # are on. Default off.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # DEV-ONLY: when true, account-security tokens (reset / verify) are captured
      # in memory and retrievable via GET /api/v1/dev/email-token so end-to-end
      # tests can complete the token flows. NEVER enable in production. Default off.
      DEV_MAIL_CAPTURE_ENABLED: ${DEV_MAIL_CAPTURE_ENABLED:-false}
      # DEV/TEST-ONLY: when true, the URL-import SSRF guard permits private/loopback
      # addresses so backed e2e can import from a loopback/compose-network origin (a
      # public origin isn't reachable in CI). NEVER enable in production. Default off.
      HTTP_IMPORT_ALLOW_PRIVATE_URLS: ${HTTP_IMPORT_ALLOW_PRIVATE_URLS:-false}
      # Malware scanning: when MALWARE_SCAN_ENABLED=true, uploaded originals are
      # streamed to the clamd at CLAMAV_ADDR before publish. Run the bundled clamd
      # with the "scan" profile (CLAMAV_ADDR=clamav:3310) or point at your own.
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-}
      # MALWARE_SCAN_MODE: fallback policy on a scan ERROR — fail-closed (default;
      # unscannable media is not published), fail-open (publish anyway, logged
      # loudly), or quarantine (park for moderator review). Infected media always
      # fails, in every mode.
      MALWARE_SCAN_MODE: ${MALWARE_SCAN_MODE:-fail-closed}
      # HLS transcoding: when TRANSCODING_ENABLED=true, published videos are
      # transcoded to an H.264/AAC HLS ladder by an in-process worker (ffmpeg is
      # in the image) and served at /api/v1/videos/{id}/hls/*, which powers the
      # player's quality selector. On by default so `make dev` uploads produce
      # the full ladder; set TRANSCODING_ENABLED=false to serve originals only.
      TRANSCODING_ENABLED: ${TRANSCODING_ENABLED:-true}
      # TRANSCODING_VP9_ENABLED additionally emits a progressive VP9/WebM alternate
      # per video (surfaced via /download). AV1 is deferred and rejected if enabled.
      TRANSCODING_VP9_ENABLED: ${TRANSCODING_VP9_ENABLED:-false}
      # Auto-caption (Whisper): when WHISPER_ENABLED=true, video owners can request
      # an auto-generated WebVTT caption track; an in-process worker extracts the
      # audio (ffmpeg) and POSTs it to WHISPER_ENDPOINT (whisper.cpp /inference-
      # compatible). Run the bundled whisper.cpp server with the "captions" profile
      # (WHISPER_ENDPOINT=http://whisper:8080) or point at your own. Off by default.
      WHISPER_ENABLED: ${WHISPER_ENABLED:-false}
      WHISPER_ENDPOINT: ${WHISPER_ENDPOINT:-}
      # Caption language used when a request omits one (also the transcription hint).
      WHISPER_DEFAULT_LANGUAGE: ${WHISPER_DEFAULT_LANGUAGE:-en}
      # LIVE_RTMP_URL is the base RTMP ingest URL returned to a streamer alongside a
      # freshly minted stream key (informational; empty by default).
      LIVE_RTMP_URL: ${LIVE_RTMP_URL:-}
      # LIVE_INGEST_SECRET is the shared secret the media server (RTMP ingest) presents
      # on the media-server-facing /live/ingest hooks. When empty (default) the hooks
      # are disabled (404). Set it to enable them (dev/test harnesses; a real deploy
      # sets a strong value). NEVER commit a real secret here.
      LIVE_INGEST_SECRET: ${LIVE_INGEST_SECRET:-}
      # LIVE_HLS_ROOT is the directory the RTMP media server (the `media` profile)
      # writes live HLS + session recordings into, shared with the api. When set,
      # the api serves live HLS by stream ID at /api/v1/live/{id}/hls/* and
      # republishes replay-enabled sessions as VODs. For the media profile use
      # /live-hls (the shared live_hls volume mount below). Empty (default) leaves
      # live HLS serving + replay off.
      LIVE_HLS_ROOT: ${LIVE_HLS_ROOT:-}
      # ActivityPub federation. Off by default; when FEDERATION_ENABLED=true, set
      # PUBLIC_BASE_URL to this instance's canonical origin. See .ralph/specs/federation.md.
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Base64 32-byte KEK for actor private-key envelope encryption (required in
      # production when federation is on). NEVER commit a real value.
      FEDERATION_KEY_KEK: ${FEDERATION_KEY_KEK:-}
      # Media storage backend: local (default) or s3. For s3 against the compose
      # minio service (`--profile storage`), see the header of this file. The S3
      # credentials are secrets — never log or commit real values.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-true}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
    # Make the host reachable as host.docker.internal on Linux too (Docker Desktop
    # provides it already). Lets a backed e2e point URL import at a media origin
    # served on the host (paired with HTTP_IMPORT_ALLOW_PRIVATE_URLS=true). No
    # effect on normal operation.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # Shared with the `media` profile's rtmp server: it writes live HLS +
    # recordings here, the api serves/reads them. Harmless (empty) without the
    # media profile. Point LIVE_HLS_ROOT at /live-hls to enable live serving.
    volumes:
      - live_hls:/live-hls

  # Live RTMP media server (media profile): ingests RTMP, packages HLS, records
  # sessions, and drives the api's live lifecycle via the ingest hooks. Uses
  # Arut's nginx-rtmp module. Run with the media profile AND a shared secret +
  # HLS root, e.g.:
  #   LIVE_INGEST_SECRET=$(openssl rand -hex 24) LIVE_HLS_ROOT=/live-hls \
  #   docker compose --profile core --profile media up --build
  # Then publish to rtmp://localhost:1935/live/<stream-key> (the key from
  # POST /api/v1/channels/{handle}/live). Viewers watch via the api's
  # GET /api/v1/live/{id}/hls/master.m3u8 while the stream is live.
  rtmp:
    image: alfg/nginx-rtmp:latest
    profiles: ["media"]
    depends_on:
      api:
        condition: service_started
    environment:
      # In-container secret used to render the config's X-Ingest-Secret shim.
      # $$ escapes compose substitution so the CONTAINER env is read at runtime.
      LIVE_INGEST_SECRET: ${LIVE_INGEST_SECRET:-}
    command:
      - /bin/sh
      - -c
      - |
        sed "s|__LIVE_INGEST_SECRET__|$$LIVE_INGEST_SECRET|g" \
          /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./deploy/media/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - live_hls:/data/hls
    ports:
      - "${RTMP_PORT:-1935}:1935"

  # Local OpenTelemetry tracing backend (profile "otel", P17.3). Opt-in and never
  # required by tests. otel-collector receives OTLP from the api and forwards to
  # jaeger; browse traces at http://localhost:16686.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC (api → collector)
      - "${OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # Jaeger UI

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  live_hls:
  whisper_models:
