# Vidra core local development stack.
#
# Profiles let you run subsets of the stack:
#   core    -> postgres, redis, migrate, api  (default for `docker compose up`)
#   storage -> minio (S3-compatible object storage for STORAGE_BACKEND=s3)
#   scan    -> clamav (virus scanning for MALWARE_SCAN_ENABLED=true)
#   media   -> rtmp (nginx-rtmp live ingest + HLS + session recording; P12).
#              Run with LIVE_INGEST_SECRET set and LIVE_HLS_ROOT=/live-hls, e.g.
#              LIVE_INGEST_SECRET=$(openssl rand -hex 24) LIVE_HLS_ROOT=/live-hls \
#                docker compose --profile core --profile media up --build
#   otel    -> otel-collector + jaeger all-in-one (local tracing backend; P17.3).
#              Optional; NOT required by any test. Point the api at the collector
#              and turn tracing on, e.g.
#                OTEL_ENABLED=true OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317 \
#                  docker compose --profile core --profile otel up --build
#              then open the Jaeger UI at http://localhost:16686.
#
# Usage:
#   cp .env.example .env
#   docker compose --profile core up --build
#
# To run the api against MinIO instead of the local-disk backend, start the
# storage profile too and point the api at the compose-network endpoint:
#
#   STORAGE_BACKEND=s3 \
#   STORAGE_S3_ENDPOINT=minio:9000 \
#   STORAGE_S3_BUCKET=vidra-media \
#   STORAGE_S3_ACCESS_KEY=vidra \
#   STORAGE_S3_SECRET_KEY=vidra-dev-secret \
#   STORAGE_S3_USE_SSL=false \
#   STORAGE_S3_FORCE_PATH_STYLE=true \
#   docker compose --profile core --profile storage up --build
#
# (The api creates the bucket at boot if it is missing.) From the HOST (e.g.
# `make run` or the -tags=integration storage tests) use
# STORAGE_S3_ENDPOINT=localhost:9000 / S3_TEST_ENDPOINT=localhost:9000 instead.
#
# A federation profile will be added as that subsystem's local deps land.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidra}
      POSTGRES_DB: ${POSTGRES_DB:-vidra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidra} -d ${POSTGRES_DB:-vidra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local dev/tests (STORAGE_BACKEND=s3).
  # S3 API on :9000. The dev credentials below are compose-local ONLY — real
  # deployments set strong values and never commit them.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["storage"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vidra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vidra-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ClamAV virus scanner (scan profile). When enabled, run with the "scan"
  # profile and point the api at it: MALWARE_SCAN_ENABLED=true CLAMAV_ADDR=clamav:3310.
  # The clamav/clamav image bundles clamd; the first boot downloads signature
  # databases (freshclam) which can take a minute — the healthcheck waits for the
  # daemon to accept connections.
  # MEMORY FOOTPRINT CAVEAT: clamd loads the full signature database into RAM and
  # holds it resident — budget ~1.5-2 GiB for this one container (it will OOM-kill
  # on a 512 MiB host). This is why scanning is opt-in (the "scan" profile) rather
  # than part of the default core stack; a small dev machine can run everything
  # else without paying clamd's memory cost.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["scan"]
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  # yt-dlp egress proxy (OPTIONAL, production hardening for W2.C1 platform import).
  # yt-dlp performs its own outbound fetches that the api's dial-time SSRF guard
  # cannot pin (spec §5 residual risk). In production, route the extractor through
  # a forward proxy that DENIES internal ranges and point the api at it:
  #   YTDLP_IMPORT_ENABLED=true YTDLP_PROXY=http://ytdlp-egress:3128
  # A minimal Squid ACL sketch (uncomment + supply squid.conf denying
  # to_localnet / RFC1918 / loopback / link-local, allowing only public egress):
  #
  #   ytdlp-egress:
  #     image: ubuntu/squid:latest
  #     profiles: ["ytdlp"]
  #     volumes:
  #       - ./deploy/ytdlp-egress/squid.conf:/etc/squid/squid.conf:ro
  #     # No published ports: reachable only on the internal compose network by the
  #     # api/worker, so the proxy itself is not a new external surface.
  #
  # This pairing is DOCUMENTED and RECOMMENDED, not enforced (self-hosting the
  # proxy has an operational cost); the honest residual-risk statement stands.

  # Whisper transcription server (captions profile). When enabled, run with the
  # "captions" profile and point the api at it:
  #   WHISPER_ENABLED=true WHISPER_ENDPOINT=http://whisper:8080 \
  #     docker compose --profile core --profile captions up
  # This uses the whisper.cpp server image, which exposes the /inference endpoint
  # the WhisperClient POSTs audio to. It needs a GGML model file: on first run,
  # download one into the whisper_models volume, e.g.
  #   docker compose run --rm --entrypoint sh whisper -c \
  #     "wget -O /models/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin"
  # then start the profile. The command below serves that ggml-base model on :8080.
  # The profile is OPTIONAL and not required by any default test.
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    profiles: ["captions"]
    ports:
      - "${WHISPER_PORT:-8090}:8080"
    volumes:
      - whisper_models:/models
    command:
      - "whisper-server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/ggml-base.bin"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Waits for minio only when the storage profile is active (required: false
      # skips the dependency when the service is not enabled).
      minio:
        condition: service_healthy
        required: false
      # Waits for clamav only when the scan profile is active.
      clamav:
        condition: service_healthy
        required: false
      # Waits for whisper only when the captions profile is active.
      whisper:
        condition: service_healthy
        required: false
      # Waits for the kubo node only when the ipfs profile is active.
      ipfs:
        condition: service_healthy
        required: false
      # Waits for the private-swarm kubo node only when the ipfs-private profile is active.
      kubo-private:
        condition: service_healthy
        required: false
    environment:
      VIDRA_ENV: ${VIDRA_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INSTANCE_NAME: ${INSTANCE_NAME:-Vidra (dev)}
      # Default per-user storage quota in bytes (0/unset = unlimited). Admins can
      # override per account via PATCH /api/v1/admin/users/{id}.
      INSTANCE_DEFAULT_QUOTA_BYTES: ${INSTANCE_DEFAULT_QUOTA_BYTES:-0}
      # Rate limiting is on by default. End-to-end / backend-backed test runs set
      # RATE_LIMIT_ENABLED=false so the auth limiter (10/min per IP) doesn't throttle
      # a suite that makes many register/login calls from one host. Rate limiting
      # has dedicated unit tests, so the e2e suite need not exercise it.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # When true, signups file a pending registration request an admin must
      # approve (the registration approval queue). Overridable so approval-mode
      # backed e2e runs can flip it without editing the file. Default off.
      REGISTRATION_REQUIRE_APPROVAL: ${REGISTRATION_REQUIRE_APPROVAL:-false}
      # OAuth/OIDC login providers (comma list; disabled when empty). Compose has
      # no wildcard passthrough, so each named provider's OAUTH_<NAME>_ISSUER /
      # _CLIENT_ID / _CLIENT_SECRET (+ optional _SCOPES) must also be added here
      # for your provider names. PUBLIC_BASE_URL is required when any provider
      # is set. The client secret is a secret: never commit a real value.
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      # Real outbound email over SMTP (password reset / email verification).
      # SMTP_HOST + SMTP_FROM are required when enabled; SMTP_PASSWORD is a
      # secret (never commit/log it). DEV_MAIL_CAPTURE_ENABLED wins when both
      # are on. Default off.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # DEV-ONLY: when true, account-security tokens (reset / verify) are captured
      # in memory and retrievable via GET /api/v1/dev/email-token so end-to-end
      # tests can complete the token flows. NEVER enable in production. Default off.
      DEV_MAIL_CAPTURE_ENABLED: ${DEV_MAIL_CAPTURE_ENABLED:-false}
      # DEV/TEST-ONLY: when true, the URL-import SSRF guard permits private/loopback
      # addresses so backed e2e can import from a loopback/compose-network origin (a
      # public origin isn't reachable in CI). NEVER enable in production. Default off.
      HTTP_IMPORT_ALLOW_PRIVATE_URLS: ${HTTP_IMPORT_ALLOW_PRIVATE_URLS:-false}
      # Malware scanning: when MALWARE_SCAN_ENABLED=true, uploaded originals are
      # streamed to the clamd at CLAMAV_ADDR before publish. Run the bundled clamd
      # with the "scan" profile (CLAMAV_ADDR=clamav:3310) or point at your own.
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-}
      # CLAMAV_TIMEOUT bounds a single scan (dial + stream + verdict); a slow/wedged
      # clamd surfaces as a scan error (resolved by MALWARE_SCAN_MODE) not a hang.
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-60s}
      # MALWARE_SCAN_MODE: fallback policy on a scan ERROR — fail-closed (default;
      # unscannable media is not published), fail-open (publish anyway, logged
      # loudly), or quarantine (park for moderator review). Infected media always
      # fails, in every mode.
      MALWARE_SCAN_MODE: ${MALWARE_SCAN_MODE:-fail-closed}
      # HLS transcoding: when TRANSCODING_ENABLED=true, published videos are
      # transcoded to an H.264/AAC HLS ladder by an in-process worker (ffmpeg is
      # in the image) and served at /api/v1/videos/{id}/hls/*, which powers the
      # player's quality selector. On by default so `make dev` uploads produce
      # the full ladder; set TRANSCODING_ENABLED=false to serve originals only.
      TRANSCODING_ENABLED: ${TRANSCODING_ENABLED:-true}
      # TRANSCODING_VP9_ENABLED additionally emits a progressive VP9/WebM alternate
      # per video (surfaced via /download). AV1 is deferred and rejected if enabled.
      TRANSCODING_VP9_ENABLED: ${TRANSCODING_VP9_ENABLED:-false}
      # Auto-caption (Whisper): when WHISPER_ENABLED=true, video owners can request
      # an auto-generated WebVTT caption track; an in-process worker extracts the
      # audio (ffmpeg) and POSTs it to WHISPER_ENDPOINT (whisper.cpp /inference-
      # compatible). Run the bundled whisper.cpp server with the "captions" profile
      # (WHISPER_ENDPOINT=http://whisper:8080) or point at your own. Off by default.
      WHISPER_ENABLED: ${WHISPER_ENABLED:-false}
      WHISPER_ENDPOINT: ${WHISPER_ENDPOINT:-}
      # Caption language used when a request omits one (also the transcription hint).
      WHISPER_DEFAULT_LANGUAGE: ${WHISPER_DEFAULT_LANGUAGE:-en}
      # yt-dlp platform-URL import (W2.C1, UPLOAD-09). OFF by default — admin/config
      # opt-in. When YTDLP_IMPORT_ENABLED=true, a URL import may resolve through the
      # HARD-SANDBOXED yt-dlp extractor (fixed argv, --ignore-config, no shell, no
      # --exec, no runtime self-update, private tmp workdir, hard timeout,
      # --max-filesize). Bytes still land ONLY via AttachOriginal → Process, so the
      # ClamAV scan hook fires before anything is servable.
      #
      # SECURITY — RESIDUAL RISK + EGRESS PROXY (spec §5): yt-dlp makes its OWN
      # outbound HTTP fetches, which the dial-time SSRF guard cannot pin, so a
      # hostile page could try to redirect it to internal addresses. Mitigations, in
      # order: (1) it is OFF by default; (2) set YTDLP_PROXY to a forward proxy that
      # DENIES RFC1918/loopback/link-local (see the commented `ytdlp-egress` sketch
      # below); (3) run the api/worker on a network with no route to internal
      # services. The yt-dlp binary must be PINNED in the image — never self-updated
      # at runtime.
      YTDLP_IMPORT_ENABLED: ${YTDLP_IMPORT_ENABLED:-false}
      YTDLP_PATH: ${YTDLP_PATH:-yt-dlp}
      YTDLP_TIMEOUT: ${YTDLP_TIMEOUT:-15m}
      YTDLP_MAX_HEIGHT: ${YTDLP_MAX_HEIGHT:-1080}
      # Recommended in production: route the extractor through an egress proxy that
      # blocks internal ranges (e.g. YTDLP_PROXY=http://ytdlp-egress:3128). Empty by
      # default (documented, not enforced — self-hosting the proxy has a cost).
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      # LIVE_RTMP_URL is the base RTMP ingest URL returned to a streamer alongside a
      # freshly minted stream key (informational; empty by default).
      LIVE_RTMP_URL: ${LIVE_RTMP_URL:-}
      # LIVE_INGEST_SECRET is the shared secret the media server (RTMP ingest) presents
      # on the media-server-facing /live/ingest hooks. When empty (default) the hooks
      # are disabled (404). Set it to enable them (dev/test harnesses; a real deploy
      # sets a strong value). NEVER commit a real secret here.
      LIVE_INGEST_SECRET: ${LIVE_INGEST_SECRET:-}
      # LIVE_HLS_ROOT is the directory the RTMP media server (the `media` profile)
      # writes live HLS + session recordings into, shared with the api. When set,
      # the api serves live HLS by stream ID at /api/v1/live/{id}/hls/* and
      # republishes replay-enabled sessions as VODs. For the media profile use
      # /live-hls (the shared live_hls volume mount below). Empty (default) leaves
      # live HLS serving + replay off.
      LIVE_HLS_ROOT: ${LIVE_HLS_ROOT:-}
      # ActivityPub federation. Off by default; when FEDERATION_ENABLED=true, set
      # PUBLIC_BASE_URL to this instance's canonical origin. See .ralph/specs/federation.md.
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Base64 32-byte KEK for actor private-key envelope encryption (required in
      # production when federation is on). NEVER commit a real value.
      FEDERATION_KEY_KEK: ${FEDERATION_KEY_KEK:-}
      # Media storage backend: local (default) or s3. For s3 against the compose
      # minio service (`--profile storage`), see the header of this file. The S3
      # credentials are secrets — never log or commit real values.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-true}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
      # Hybrid IPFS media mirror (fix_plan P19, .ralph/specs/ipfs-media.md). OFF by
      # default. To mirror already-PUBLIC media to the compose kubo node, run the
      # `ipfs` profile (docker compose --profile core --profile ipfs up) and set
      # IPFS_ENABLED=true — IPFS_API_URL/IPFS_GATEWAY_URL already default to that
      # service. IPFS is a SIDECAR: local/S3 stays authoritative and an IPFS outage
      # never blocks uploads or playback. PRIVACY INVARIANT: nothing non-public is
      # ever pinned (private/unlisted/quarantined videos, DM attachments, exports,
      # upload chunks, the live edge, and remote thumbnails are all excluded).
      IPFS_ENABLED: ${IPFS_ENABLED:-false}
      IPFS_API_URL: ${IPFS_API_URL:-http://ipfs:5001}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-http://localhost:9090}
      IPFS_ADD_TIMEOUT: ${IPFS_ADD_TIMEOUT:-60s}
      IPFS_PIN_CONCURRENCY: ${IPFS_PIN_CONCURRENCY:-2}
      IPFS_RECONCILE_INTERVAL: ${IPFS_RECONCILE_INTERVAL:-5m}
      # Optional IPFS Cluster replication of the PUBLIC tier (STOR-05). IPFS_CLUSTER_TOKEN
      # is a SECRET (Bearer) — never commit a real value.
      IPFS_CLUSTER_API_URL: ${IPFS_CLUSTER_API_URL:-}
      IPFS_CLUSTER_TOKEN: ${IPFS_CLUSTER_TOKEN:-}
      # PRIVATE mirroring tier (fix_plan P19.P, .ralph/specs/ipfs-media-private.md). OFF by
      # default. When true it mirrors non-public media (private/unlisted videos + their
      # derivatives, unlisted-owner avatars/banners, non-public playlist covers) to a
      # DEDICATED, swarm.key'd private kubo — NEVER the public node (dual-homing is a hard
      # config error). Private CIDs never appear in any API response and there is
      # deliberately NO IPFS_PRIVATE_GATEWAY_URL knob (replication, not distribution).
      # NOTE: this supersedes the older "IPFS_MIRROR_PRIVATE requires IPFS_CLUSTER_API_URL"
      # guard — the real requirement is now a dedicated IPFS_PRIVATE_API_URL.
      # To try it locally: `docker compose --profile core --profile ipfs-private up` then set
      # IPFS_MIRROR_PRIVATE=true (IPFS_PRIVATE_API_URL already defaults to the kubo-private
      # service). Private-media mirroring may run standalone (IPFS_ENABLED=false).
      IPFS_MIRROR_PRIVATE: ${IPFS_MIRROR_PRIVATE:-false}
      IPFS_PRIVATE_API_URL: ${IPFS_PRIVATE_API_URL:-http://kubo-private:5001}
      # Optional IPFS Cluster on the PRIVATE swarm (P19.P3; a fully separate cluster from
      # the public one). IPFS_PRIVATE_CLUSTER_TOKEN is a SECRET — never commit a real value.
      IPFS_PRIVATE_CLUSTER_API_URL: ${IPFS_PRIVATE_CLUSTER_API_URL:-}
      IPFS_PRIVATE_CLUSTER_TOKEN: ${IPFS_PRIVATE_CLUSTER_TOKEN:-}
      # Private-worker tuning; inherit the public IPFS_ADD_TIMEOUT / IPFS_PIN_CONCURRENCY
      # when blank.
      IPFS_PRIVATE_ADD_TIMEOUT: ${IPFS_PRIVATE_ADD_TIMEOUT:-}
      IPFS_PRIVATE_PIN_CONCURRENCY: ${IPFS_PRIVATE_PIN_CONCURRENCY:-}
    # Make the host reachable as host.docker.internal on Linux too (Docker Desktop
    # provides it already). Lets a backed e2e point URL import at a media origin
    # served on the host (paired with HTTP_IMPORT_ALLOW_PRIVATE_URLS=true). No
    # effect on normal operation.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    # Shared with the `media` profile's rtmp server: it writes live HLS +
    # recordings here, the api serves/reads them. Harmless (empty) without the
    # media profile. Point LIVE_HLS_ROOT at /live-hls to enable live serving.
    volumes:
      - live_hls:/live-hls

  # Live RTMP media server (media profile): ingests RTMP, packages HLS, records
  # sessions, and drives the api's live lifecycle via the ingest hooks. Uses
  # Arut's nginx-rtmp module. Run with the media profile AND a shared secret +
  # HLS root, e.g.:
  #   LIVE_INGEST_SECRET=$(openssl rand -hex 24) LIVE_HLS_ROOT=/live-hls \
  #   docker compose --profile core --profile media up --build
  # Then publish to rtmp://localhost:1935/live/<stream-key> (the key from
  # POST /api/v1/channels/{handle}/live). Viewers watch via the api's
  # GET /api/v1/live/{id}/hls/master.m3u8 while the stream is live.
  rtmp:
    image: alfg/nginx-rtmp:latest
    profiles: ["media"]
    depends_on:
      api:
        condition: service_started
    environment:
      # In-container secret used to render the config's X-Ingest-Secret shim.
      # $$ escapes compose substitution so the CONTAINER env is read at runtime.
      LIVE_INGEST_SECRET: ${LIVE_INGEST_SECRET:-}
    command:
      - /bin/sh
      - -c
      - |
        sed "s|__LIVE_INGEST_SECRET__|$$LIVE_INGEST_SECRET|g" \
          /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./deploy/media/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - live_hls:/data/hls
    ports:
      - "${RTMP_PORT:-1935}:1935"

  # Local OpenTelemetry tracing backend (profile "otel", P17.3). Opt-in and never
  # required by tests. otel-collector receives OTLP from the api and forwards to
  # jaeger; browse traces at http://localhost:16686.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317" # OTLP gRPC (api → collector)
      - "${OTEL_HTTP_PORT:-4318}:4318" # OTLP HTTP

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["otel"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # Jaeger UI

  # Hybrid IPFS media mirror node (profile "ipfs", fix_plan P19.5). A local Kubo
  # node the mirror add+pins already-PUBLIC media to when IPFS_ENABLED=true. Run:
  #   docker compose --profile core --profile ipfs up --build
  # then set IPFS_ENABLED=true (IPFS_API_URL=http://ipfs:5001 and the dev gateway
  # IPFS_GATEWAY_URL=http://localhost:9090 already default to this service).
  #
  # The ipfs/kubo image binds the RPC API + gateway to 0.0.0.0 inside the container
  # on first init, so `ipfs:5001` is reachable from the api service and the gateway
  # is exposed on host :9090 (mapped to the in-container 8080 to avoid the api's
  # :8080). The named volume persists the repo across restarts.
  #
  # PRIVACY: the node is kept LOCAL for dev. This does NOT enable public-network
  # distribution — AutoRelay, DHT-server mode and hole-punching are an explicit
  # operator OPT-IN, not a default, because pinning to the public IPFS network is a
  # permanent public-disclosure decision (see .ralph/specs/ipfs-media.md §7,§12).
  # To go public deliberately, run `ipfs config Routing.Type dhtserver` and enable
  # the relay/holepunch swarm options in a custom /container-init.d script.
  ipfs:
    image: ipfs/kubo:v0.32.1
    profiles: ["ipfs", "full"]
    environment:
      # "server" disables local-network (mDNS) peer discovery — appropriate for a
      # datacenter/dev node. It does NOT turn on public AutoRelay/hole-punching.
      IPFS_PROFILE: server
    ports:
      - "${IPFS_SWARM_PORT:-4001}:4001"     # libp2p swarm (TCP)
      - "${IPFS_SWARM_PORT:-4001}:4001/udp" # libp2p swarm (QUIC)
      - "${IPFS_API_PORT:-5001}:5001"       # Kubo RPC API
      - "${IPFS_GATEWAY_PORT:-9090}:8080"   # HTTP gateway (9090 avoids the api's :8080)
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      # `ipfs id` against the local RPC API only answers once the daemon is up.
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 id >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------------------------
  # PRIVATE IPFS mirror swarm (profile "ipfs-private", fix_plan P19.P3,
  # .ralph/specs/ipfs-media-private.md). A SECOND, fully separate swarm.key'd Kubo node
  # for non-public media — it is NEVER the same node/swarm as the public `ipfs` service
  # above (dual-homing is a hard config error). Run:
  #   docker compose --profile core --profile ipfs-private up
  # then set IPFS_MIRROR_PRIVATE=true (IPFS_PRIVATE_API_URL already defaults to
  # http://kubo-private:5001). The api reaches it on the compose network; host tools /
  # the ipfs_private_integration tests reach the RPC on host :5002.
  #
  # Fail-CLOSED by construction: LIBP2P_FORCE_PNET=1 makes the daemon REFUSE TO BOOT
  # without a swarm.key, so a config regression yields "private content unreachable",
  # never "private content public". The init script clears the default bootstrap, sets
  # Routing.Type=none (explicit peering only), Reprovider.Interval=0, Gateway.NoFetch=true,
  # and the gateway is NOT host-published — private CIDs are replication, not distribution.
  #
  # ⚠️ The swarm.key here is DEV-ONLY (auto-generated into the ipfs_private_key volume).
  # In production you generate it once, distribute the SAME key to every node, mount it
  # read-only, and NEVER commit it (see README / .env.example, "Private IPFS tier").
  kubo-private:
    image: ipfs/kubo:v0.32.1
    profiles: ["ipfs-private", "ipfs-private-cluster"]
    # Root prelude that makes the root-owned `ipfs_private_key` volume writable by the
    # unprivileged `ipfs` user BEFORE kubo drops privileges — without it the dev-key
    # init hook can't write /private-key/swarm.key and the daemon aborts (the
    # ipfs-private-integration CI-never-green fix). Then execs the stock kubo entrypoint.
    entrypoint: ["/bin/sh", "/usr/local/bin/private-key-perms.sh"]
    # Overriding entrypoint CLEARS the image's default CMD (compose semantics), so restore
    # kubo's default daemon invocation — the prelude passes it through to start_ipfs.
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker"]
    environment:
      IPFS_PROFILE: server
      # Fail-closed: refuse to start unless a private network (swarm.key) is configured.
      LIBP2P_FORCE_PNET: "1"
      PRIVATE_SELF_NAME: kubo-private
    volumes:
      - ipfs_private_data:/data/ipfs
      # Shared swarm.key + peer-id exchange volume (dev key generation lives here).
      - ipfs_private_key:/private-key
      # Root entrypoint prelude (chowns /private-key so the ipfs user can write the key).
      - ./deploy/ipfs-private/000-private-key-perms.sh:/usr/local/bin/private-key-perms.sh:ro
      # The init hook runs before the daemon (generates the dev key + isolation config).
      - ./deploy/ipfs-private/001-init-private-swarm.sh:/container-init.d/001-init-private-swarm.sh:ro
    ports:
      # RPC only. NO gateway host port — the private gateway is never exposed.
      - "${IPFS_PRIVATE_API_PORT:-5002}:5001"
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 id >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Second private-swarm node for REPLICATION testing (profile "ipfs-private-cluster").
  # Shares the swarm.key (same ipfs_private_key volume) and is explicitly peered to
  # kubo-private (Routing=none ⇒ peers are pinned, not discovered). No host ports — it is
  # reachable only inside the compose network / via the cluster peer.
  kubo-private-2:
    image: ipfs/kubo:v0.32.1
    profiles: ["ipfs-private-cluster"]
    # Same root prelude as kubo-private (writable /private-key before the privilege drop).
    entrypoint: ["/bin/sh", "/usr/local/bin/private-key-perms.sh"]
    command: ["daemon", "--migrate=true", "--agent-version-suffix=docker"]
    depends_on:
      # Start after node-1 is healthy so the shared swarm.key + node-1's peer id exist.
      kubo-private:
        condition: service_healthy
    environment:
      IPFS_PROFILE: server
      LIBP2P_FORCE_PNET: "1"
      PRIVATE_SELF_NAME: kubo-private-2
      PRIVATE_PEER_HOST: kubo-private
    volumes:
      - ipfs_private_data_2:/data/ipfs
      - ipfs_private_key:/private-key
      - ./deploy/ipfs-private/000-private-key-perms.sh:/usr/local/bin/private-key-perms.sh:ro
      - ./deploy/ipfs-private/001-init-private-swarm.sh:/container-init.d/001-init-private-swarm.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ipfs --api=/ip4/127.0.0.1/tcp/5001 id >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional IPFS Cluster peer on the PRIVATE swarm (profile "ipfs-private-cluster").
  # Pairs with kubo-private and exposes the Cluster REST API on :9094 — point
  # IPFS_PRIVATE_CLUSTER_API_URL=http://ipfs-cluster-private:9094 at it. CLUSTER_SECRET is
  # a SECRET (32-byte hex, shared by every cluster peer) — generate one and pass it via
  # IPFS_PRIVATE_CLUSTER_SECRET; NEVER commit a real value. A full "PINNED on both peers"
  # mesh adds a second cluster peer bound to kubo-private-2 — see README (documented
  # extension). The cluster proxy/swarm ports stay internal to the compose network.
  ipfs-cluster-private:
    image: ipfs/ipfs-cluster:v1.1.1
    profiles: ["ipfs-private-cluster"]
    depends_on:
      kubo-private:
        condition: service_healthy
    environment:
      CLUSTER_PEERNAME: ipfs-cluster-private
      # Points the cluster at node-1's RPC (the node it replicates through).
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/kubo-private/tcp/5001
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      # Shared cluster membership secret (empty = an open dev cluster; set a 32-byte hex
      # value in production). NEVER commit a real secret.
      CLUSTER_SECRET: ${IPFS_PRIVATE_CLUSTER_SECRET:-}
    ports:
      - "${IPFS_PRIVATE_CLUSTER_API_PORT:-9094}:9094" # Cluster REST API (host tools / tests)
    volumes:
      - ipfs_private_cluster_data:/data/ipfs-cluster

volumes:
  postgres_data:
  minio_data:
  clamav_data:
  live_hls:
  whisper_models:
  ipfs_data:
  ipfs_private_data:
  ipfs_private_data_2:
  ipfs_private_key:
  ipfs_private_cluster_data:
