# Vidra core local development stack.
#
# Profiles let you run subsets of the stack:
#   core    -> postgres, redis, migrate, api  (default for `docker compose up`)
#   storage -> minio (S3-compatible object storage for STORAGE_BACKEND=s3)
#
# Usage:
#   cp .env.example .env
#   docker compose --profile core up --build
#
# To run the api against MinIO instead of the local-disk backend, start the
# storage profile too and point the api at the compose-network endpoint:
#
#   STORAGE_BACKEND=s3 \
#   STORAGE_S3_ENDPOINT=minio:9000 \
#   STORAGE_S3_BUCKET=vidra-media \
#   STORAGE_S3_ACCESS_KEY=vidra \
#   STORAGE_S3_SECRET_KEY=vidra-dev-secret \
#   STORAGE_S3_USE_SSL=false \
#   STORAGE_S3_FORCE_PATH_STYLE=true \
#   docker compose --profile core --profile storage up --build
#
# (The api creates the bucket at boot if it is missing.) From the HOST (e.g.
# `make run` or the -tags=integration storage tests) use
# STORAGE_S3_ENDPOINT=localhost:9000 / S3_TEST_ENDPOINT=localhost:9000 instead.
#
# Additional profiles (media, federation) will be added as those subsystems land.

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidra}
      POSTGRES_DB: ${POSTGRES_DB:-vidra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidra} -d ${POSTGRES_DB:-vidra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local dev/tests (STORAGE_BACKEND=s3).
  # S3 API on :9000. The dev credentials below are compose-local ONLY — real
  # deployments set strong values and never commit them.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["storage"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vidra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vidra-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Waits for minio only when the storage profile is active (required: false
      # skips the dependency when the service is not enabled).
      minio:
        condition: service_healthy
        required: false
    environment:
      VIDRA_ENV: ${VIDRA_ENV:-development}
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-vidra}:${POSTGRES_PASSWORD:-vidra}@postgres:5432/${POSTGRES_DB:-vidra}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      INSTANCE_NAME: ${INSTANCE_NAME:-Vidra (dev)}
      # Default per-user storage quota in bytes (0/unset = unlimited). Admins can
      # override per account via PATCH /api/v1/admin/users/{id}.
      INSTANCE_DEFAULT_QUOTA_BYTES: ${INSTANCE_DEFAULT_QUOTA_BYTES:-0}
      # Rate limiting is on by default. End-to-end / backend-backed test runs set
      # RATE_LIMIT_ENABLED=false so the auth limiter (10/min per IP) doesn't throttle
      # a suite that makes many register/login calls from one host. Rate limiting
      # has dedicated unit tests, so the e2e suite need not exercise it.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # When true, signups file a pending registration request an admin must
      # approve (the registration approval queue). Overridable so approval-mode
      # backed e2e runs can flip it without editing the file. Default off.
      REGISTRATION_REQUIRE_APPROVAL: ${REGISTRATION_REQUIRE_APPROVAL:-false}
      # OAuth/OIDC login providers (comma list; disabled when empty). Compose has
      # no wildcard passthrough, so each named provider's OAUTH_<NAME>_ISSUER /
      # _CLIENT_ID / _CLIENT_SECRET (+ optional _SCOPES) must also be added here
      # for your provider names. PUBLIC_BASE_URL is required when any provider
      # is set. The client secret is a secret: never commit a real value.
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      # Real outbound email over SMTP (password reset / email verification).
      # SMTP_HOST + SMTP_FROM are required when enabled; SMTP_PASSWORD is a
      # secret (never commit/log it). DEV_MAIL_CAPTURE_ENABLED wins when both
      # are on. Default off.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # DEV-ONLY: when true, account-security tokens (reset / verify) are captured
      # in memory and retrievable via GET /api/v1/dev/email-token so end-to-end
      # tests can complete the token flows. NEVER enable in production. Default off.
      DEV_MAIL_CAPTURE_ENABLED: ${DEV_MAIL_CAPTURE_ENABLED:-false}
      # DEV/TEST-ONLY: when true, the URL-import SSRF guard permits private/loopback
      # addresses so backed e2e can import from a loopback/compose-network origin (a
      # public origin isn't reachable in CI). NEVER enable in production. Default off.
      HTTP_IMPORT_ALLOW_PRIVATE_URLS: ${HTTP_IMPORT_ALLOW_PRIVATE_URLS:-false}
      # Malware scanning: when MALWARE_SCAN_ENABLED=true, uploaded originals are
      # streamed to the clamd at CLAMAV_ADDR before publish (fail-closed). Provide a
      # clamd yourself (an operator-run service); off by default.
      MALWARE_SCAN_ENABLED: ${MALWARE_SCAN_ENABLED:-false}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-}
      # HLS transcoding: when TRANSCODING_ENABLED=true, published videos are
      # transcoded to an H.264/AAC HLS ladder by an in-process worker (ffmpeg is
      # in the image) and served at /api/v1/videos/{id}/hls/*. Off by default.
      TRANSCODING_ENABLED: ${TRANSCODING_ENABLED:-false}
      # LIVE_RTMP_URL is the base RTMP ingest URL returned to a streamer alongside a
      # freshly minted stream key (informational; empty by default).
      LIVE_RTMP_URL: ${LIVE_RTMP_URL:-}
      # LIVE_INGEST_SECRET is the shared secret the media server (RTMP ingest) presents
      # on the media-server-facing /live/ingest hooks. When empty (default) the hooks
      # are disabled (404). Set it to enable them (dev/test harnesses; a real deploy
      # sets a strong value). NEVER commit a real secret here.
      LIVE_INGEST_SECRET: ${LIVE_INGEST_SECRET:-}
      # ActivityPub federation. Off by default; when FEDERATION_ENABLED=true, set
      # PUBLIC_BASE_URL to this instance's canonical origin. See .ralph/specs/federation.md.
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Base64 32-byte KEK for actor private-key envelope encryption (required in
      # production when federation is on). NEVER commit a real value.
      FEDERATION_KEY_KEK: ${FEDERATION_KEY_KEK:-}
      # Media storage backend: local (default) or s3. For s3 against the compose
      # minio service (`--profile storage`), see the header of this file. The S3
      # credentials are secrets — never log or commit real values.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_USE_SSL: ${STORAGE_S3_USE_SSL:-true}
      STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-false}
    # Make the host reachable as host.docker.internal on Linux too (Docker Desktop
    # provides it already). Lets a backed e2e point URL import at a media origin
    # served on the host (paired with HTTP_IMPORT_ALLOW_PRIVATE_URLS=true). No
    # effect on normal operation.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  postgres_data:
  minio_data:
